name: SR Steam watch

# Polls Steam build ids for StarRupture (1631270) and the dedicated server
# (3809400). The recorded ids live in state/steam.json on main. On a change:
# pushes a game-update/* branch with the new ids, opens (or updates) a pull
# request with the per-component checklist and runs the compile check
# (sr-build-all.yml), which comments its result on the PR. When a client
# branch changed, it also runs the offline client check (sr-client-check.yml)
# per changed branch, which comments its own result. When the dedicated server's public branch changed,
# the offline server check (sr-server-check.yml) reads the new server build's identity and field layout
# and keeps them in an artifact; it needs no Steam login and no secret, and nothing waits on it.
# Merging the PR means "handled" and advances the baseline on main.
#
# Only writes: the first baseline commit to main, and game-update/* branches,
# and, with state/autopilot.json enabled and every gate passed, the signed feed on the
# vmap-feed release (the publish job of sr-client-check.yml), plus the alert issue the client check (or the alert job, for the rest of the
# chain) opens when a run fails or holds, and the
# same issue for a game-update PR that stays open six hours without passing the chain.
# After the chain (and on every poll) it also starts the planner data extract (sr-data-extract.yml) for a
# build that has none (ci/planner-extract.mjs). When a build change starts the chain it first cancels any
# extract that is queued or going, so the extract never holds the chain.
# No tags, no releases.
#
# Rehearsal (the rehearsal input, a hand-started run): the same chain on the public build Steam lists now,
# even though it is already handled, ending in the same publish job (same environment, same release key)
# but uploading only to the vmap-feed-rehearsal prerelease. A rehearsal writes no state on main, opens no
# game-update PR, raises no alert issue, starts no planner extract and counts toward no release limit; the
# already-released checks (once per CL, and the version identity checks) are the only gates it skips
# (ci/MAP-MODE.md, "Rehearsal").
#
# Supersede (the supersede input, a hand dispatch only): a second release of a CL when our own release was bad.
# It names the seq of the release being replaced. It lifts the already-released checks for that CL and nothing
# else: the new version object map must still change what is served, and every other gate stands. It is never set
# by the schedule, and it is not `force`: force is the routine retry of a check, and a retry must never be able to
# release a CL twice (ci/MAP-MODE.md, "Supersede").
#
# Retry (the retry_cl input, a hand dispatch only): one CL number whose count of rejected auto-fix attempts starts again
# from zero, after the owner has looked at why they were rejected. It resets that one CL and nothing else, lifts no other
# check, and is recorded in the history and in the alert issue. It is never set by the schedule. Agents dispatch it only
# on the owner's OK (.github/sr-pipeline/README.md).

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh the open update PR and run the build check even if no build id changed'
        type: boolean
        default: false
      rehearsal:
        description: 'Rehearsal: run the whole chain on the public build Steam lists now (already handled), signing included, and publish only to the vmap-feed-rehearsal prerelease; nothing live, no state, PR, alert or extract'
        type: boolean
        default: false
      supersede:
        description: 'Supersede: the seq of our own release that was bad, for a second release of the same CL (runs the check on the public build as a forced run). Empty for every ordinary run'
        type: string
        default: ''
      retry_cl:
        description: 'Retry: one CL number whose count of rejected auto-fix attempts starts again from zero (runs the check on the public build as a forced run). Only on the owner''s OK. Empty for every ordinary run'
        type: string
        default: ''

concurrency:
  group: sr-watch
  cancel-in-progress: false

permissions: {}

jobs:
  poll:
    name: poll
    runs-on: ubuntu-latest
    timeout-minutes: 17
    permissions:
      contents: write        # baseline commit to main, game-update/* branches
      pull-requests: write   # open and update the update PR, create its label
      issues: write          # the stale-PR alert issue and its label
      actions: write         # cancel the planner data extract runs (the last step)
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
      client_matrix: ${{ steps.poll.outputs.client_matrix }}
      server_matrix: ${{ steps.poll.outputs.server_matrix }}
      pr: ${{ steps.pr.outputs.number }}
      skip: ${{ steps.pr.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      # A supersede is a hand dispatch with a seq, and never with a rehearsal; anything else stops here, before the poll.
      # The dispatching actor must hold admin or write permission on this repository (read again from the API, never
      # taken from the input), and a permission that cannot be read refuses it. Dispatching a workflow needs write
      # anyway, so this cannot tell an agent from the owner; the policy carries that: Agents dispatch supersede (or retry) only on the owner's OK: write access cannot tell an agent from the owner, so this policy carries it.
      - name: Refuse a malformed supersede
        if: ${{ inputs.supersede != '' }}
        env:
          SUPERSEDE: ${{ inputs.supersede }}
          REHEARSAL: ${{ inputs.rehearsal }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          [ "$EVENT" = workflow_dispatch ] && [ "$REHEARSAL" != true ] && [[ "$SUPERSEDE" =~ ^[1-9][0-9]{0,15}$ ]] \
            || { echo "::error::supersede is the seq of the release being replaced (digits), from a hand dispatch, and never with a rehearsal"; exit 2; }
          perm="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission)" \
            || { echo "::error::cannot read the permission of $ACTOR on $GH_REPO, so the supersede is refused"; exit 2; }
          case "$perm" in
            admin|write) echo "supersede: $ACTOR has $perm permission on $GH_REPO" ;;
            *) echo "::error::a supersede needs admin or write permission on $GH_REPO; $ACTOR has '$perm'"; exit 2 ;;
          esac

      # A retry is a hand dispatch with one CL number, and never with a rehearsal; anything else stops here, before the poll.
      # Same actor rule as a supersede: admin or write permission, read again from the API, and a permission that cannot be read refuses it.
      # It resets the count of rejected attempts for that one CL, and lifts no other check.
      - name: Refuse a malformed retry
        if: ${{ inputs.retry_cl != '' }}
        env:
          RETRY_CL: ${{ inputs.retry_cl }}
          REHEARSAL: ${{ inputs.rehearsal }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          [ "$EVENT" = workflow_dispatch ] && [ "$REHEARSAL" != true ] && [[ "$RETRY_CL" =~ ^[1-9][0-9]{0,8}$ ]] \
            || { echo "::error::retry_cl is one CL number (digits), from a hand dispatch, and never with a rehearsal"; exit 2; }
          perm="$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission)" \
            || { echo "::error::cannot read the permission of $ACTOR on $GH_REPO, so the retry is refused"; exit 2; }
          case "$perm" in
            admin|write) echo "retry: $ACTOR has $perm permission on $GH_REPO" ;;
            *) echo "::error::a retry needs admin or write permission on $GH_REPO; $ACTOR has '$perm'"; exit 2 ;;
          esac

      - name: Poll Steam
        id: poll
        env:
          # A supersede or a retry runs the check on the public build Steam lists now, as a forced run does.
          FORCE: ${{ inputs.force == true || inputs.supersede != '' || inputs.retry_cl != '' }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          flags=()
          if [ "$FORCE" = "true" ]; then flags+=(--force); fi
          if [ "$REHEARSAL" = "true" ]; then flags+=(--rehearsal); fi
          node .github/sr-pipeline/poll-steam.mjs \
            --state state/steam.json --out-dir "$RUNNER_TEMP/sr" "${flags[@]}"

      - name: Seed the baseline on main
        if: steps.poll.outputs.changed != 'true' && steps.poll.outputs.dirty == 'true' && inputs.rehearsal != true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/steam.json
          git commit -m "Record Steam build ids"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open or update the game-update PR
        id: pr
        if: steps.poll.outputs.changed == 'true' && inputs.rehearsal != true
        env:
          FORCE: ${{ inputs.force == true || inputs.supersede != '' || inputs.retry_cl != '' }}
        run: |
          gh label create game-update --color D93F0B \
            --description 'Steam reported a new StarRupture build' --force
          sr="$RUNNER_TEMP/sr"
          title="$(cat "$sr/pr-title.txt")"
          want="$(cat "$sr/pr-branch.txt")"
          existing="$(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("game-update/"))][0] // empty')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          number=""
          branch="$want"
          if [ -n "$existing" ]; then
            number="$(jq -r .number <<<"$existing")"
            branch="$(jq -r .headRefName <<<"$existing")"
          fi
          if [ -z "$branch" ]; then
            # Forced run with nothing to propose: no PR, the build still runs.
            exit 0
          fi
          # The recorded ids on main only move when a PR is merged, so while an update PR is open every
          # poll reports the same change. The PR covers it when its head's state/steam.json holds every
          # build id this poll found (ci/pr-covers.mjs), whatever its branch is called: the name comes
          # from the first change only and goes stale as soon as Steam lists the branches differently.
          if [ -n "$number" ] && [ "$FORCE" != "true" ]; then
            git show HEAD:state/steam.json > "$sr/baseline-steam.json"
            if git fetch --depth 1 origin "$branch" \
              && git show FETCH_HEAD:state/steam.json > "$sr/pr-head-steam.json" \
              && node ci/pr-covers.mjs --baseline "$sr/baseline-steam.json" --polled state/steam.json --pr-head "$sr/pr-head-steam.json"; then
              # Same build already proposed: do not re-alert or rebuild. A failed
              # check is run again by a dispatch with force (see the README).
              echo "Update PR #$number already covers this build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ -n "$want" ]; then
            git checkout -B "$branch"
            git add state/steam.json
            git commit -m "Game build update"
            # The bot owns game-update/* branches; they are rebuilt from main.
            git push origin "+HEAD:refs/heads/$branch"
          fi
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head "$branch" --title "$title" \
              --body-file "$sr/pr-body.md" --label game-update)"
            number="${url##*/}"
          else
            gh pr edit "$number" --title "$title" --body-file "$sr/pr-body.md"
            # A refreshed PR is checked again: the earlier chain-passed labels no longer stand.
            for l in $(gh pr view "$number" --json labels --jq '.labels[].name | select(startswith("chain-passed-"))'); do
              gh pr edit "$number" --remove-label "$l"
            done
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The build was skipped because its game-update PR is open. If that PR's head
      # has been the same build for longer than STALE_HOURS (its last commit: the PR
      # step makes a new one at every refresh) and the client chain has not passed
      # for every changed client branch (the alert job of sr-client-check.yml labels
      # the PR chain-passed-<branch> after a run with no alert line), the branch's
      # alert issue ("SR map mode: <branch> needs attention", the one that job uses)
      # gets a comment, or is opened, once per PR and build. A marker line (the PR
      # number and the branch's build id) in the body or a comment of any issue with
      # that title, open or closed, says it was raised, and it is not raised again.
      # If the issues cannot be read, nothing is posted. The issue is labelled
      # pipeline-alert and assigned to the owner, so GitHub notifies him. A PR with
      # no client branch has no chain to pass and is not stale. NOW_EPOCH is for
      # tests; unset here.
      - name: Alert on a stale game-update PR
        if: steps.pr.outputs.skip == 'true'
        env:
          MATRIX: ${{ steps.poll.outputs.client_matrix }}
          STALE_HOURS: '6'
          OWNER: msantoro12
        run: |
          set -euo pipefail
          now="${NOW_EPOCH:-$(date -u +%s)}"
          pr="$(gh pr list --state open --limit 100 --json number,headRefName,title,createdAt,commits,labels \
            --jq '[.[] | select(.headRefName | startswith("game-update/"))][0] // empty')"
          [ -n "$pr" ] || exit 0
          stale="$(PR="$pr" NOW="$now" node -e '
            const e = process.env;
            const pr = JSON.parse(e.PR);
            // The PR step pushes one fresh commit per refresh, so the last commit is when this build arrived.
            const since = Date.parse((pr.commits || []).slice(-1)[0]?.committedDate) || Date.parse(pr.createdAt);
            const hours = (Number(e.NOW) * 1000 - since) / 3600000;
            let branches = [];
            try { branches = JSON.parse(e.MATRIX).map((x) => x.branch); } catch {}
            const have = new Set(pr.labels.map((l) => l.name));
            const missing = branches.filter((b) => /^[A-Za-z0-9_.]+$/.test(b) && !have.has("chain-passed-" + b));
            let ids = {};
            try { ids = Object.fromEntries(JSON.parse(e.MATRIX).map((x) => [x.branch, x.buildid])); } catch {}
            const pairs = missing.map((b) => b + "=" + (/^[0-9]+$/.test(String(ids[b])) ? ids[b] : "unknown"));
            if (hours >= Number(e.STALE_HOURS) && missing.length) console.log(pr.number + " " + Math.floor(hours) + " " + pairs.join(","));
          ')"
          [ -n "$stale" ] || { echo "No stale update PR."; exit 0; }
          read -r number hours missing <<< "$stale"   # missing: branch=buildid,...
          title="$(gh pr view "$number" --json title --jq .title)"
          gh label create pipeline-alert --color B60205 --description 'A pipeline run or a game-update PR needs the owner' --force
          for pair in ${missing//,/ }; do
            b="${pair%%=*}"
            export MARKER="<!-- sr-stale-pr:$number:${pair#*=} -->"
            export TITLE="SR map mode: $b needs attention"
            # Every issue with this title counts, closed ones too: closing the alert must not
            # bring the same alert back at the next poll. The comment goes to the open one.
            if ! found="$(gh issue list --state all --limit 100 --search "$TITLE in:title" --json number,title,state \
              --jq '.[] | select(.title == env.TITLE) | "\(.number) \(.state)"')"; then
              echo "::warning::Could not list the '$TITLE' issues; nothing posted for PR #$number."
              exit 0
            fi
            issue=""
            seen=""
            while read -r n state; do
              [ -n "$n" ] || continue
              if [ "$state" = OPEN ] && [ -z "$issue" ]; then issue="$n"; fi
              if ! text="$(gh api "repos/$GH_REPO/issues/$n" --jq '.body // ""' \
                && gh api "repos/$GH_REPO/issues/$n/comments" --paginate --jq '.[].body')"; then
                echo "::warning::Could not read issue #$n; nothing posted for PR #$number."
                exit 0
              fi
              if grep -qF -- "$MARKER" <<< "$text"; then seen=1; fi
            done <<< "$found"
            if [ -n "$seen" ]; then
              echo "Already raised for $b (PR #$number, build ${pair#*=}); not again."
              continue
            fi
            cat > "$RUNNER_TEMP/stale.md" <<EOF
          $MARKER
          @$OWNER game-update PR #$number ($title) has held its current build for $hours hours and the client chain has not passed for \`$b\`: the PR has no \`chain-passed-$b\` label. The chain last ran when the PR was opened, refreshed by a new build, or forced, so the cause is in the earlier alerts on this issue, the PR's "Client build check" comment, or the latest runs: $GITHUB_SERVER_URL/$GH_REPO/actions/workflows/sr-watch.yml
          PR: $GITHUB_SERVER_URL/$GH_REPO/pull/$number
          Once the cause is fixed: \`gh workflow run sr-watch.yml --ref main -f force=true\`. This is raised once for this PR and build; a new build on the PR raises it again.
          EOF
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body-file "$RUNNER_TEMP/stale.md"
              gh issue edit "$issue" --add-label pipeline-alert --add-assignee "$OWNER"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/stale.md" --label pipeline-alert --assignee "$OWNER"
            fi
          done

      # A planner data extract that is queued or going holds the Steam session and the sr-client-rig
      # group, which the client check below needs: its test-machine jobs would wait behind the extract
      # and its check job could log in while the extract holds the one session. So when this poll starts
      # the client chain (the same condition as the client-check job below), every extract run that is
      # queued or going is cancelled, and the chain starts once they have ended or after four minutes.
      # Nothing here can stop the chain: the step ignores its own failure and the script only warns.
      # A cancelled extract is not a failure; the next reconcile starts that build again.
      # Known and accepted: a client check started by hand (a direct dispatch of sr-client-check.yml)
      # does not pass through this poll, so it cancels nothing and waits behind a running extract.
      # (actions: write sits on this whole job because a separate cancel job would need `needs` on the
      # chain jobs; "Re-run failed jobs" does not re-run the poll, so use a forced run to start a chain.)
      - name: Cancel planner data extract runs
        if: steps.poll.outputs.changed == 'true' && steps.pr.outputs.skip != 'true' && startsWith(steps.poll.outputs.client_matrix, '[{')
        continue-on-error: true
        timeout-minutes: 6
        run: node ci/planner-extract.mjs cancel --repo "$GH_REPO" --wait-seconds 240

  build:
    name: build-all
    needs: poll
    if: needs.poll.outputs.changed == 'true' && needs.poll.outputs.skip != 'true' && inputs.rehearsal != true
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: ./.github/workflows/sr-build-all.yml
    with:
      pr: ${{ needs.poll.outputs.pr }}

  client-check:
    name: client-check (${{ matrix.branch }})
    needs: poll
    if: needs.poll.outputs.changed == 'true' && needs.poll.outputs.skip != 'true' && startsWith(needs.poll.outputs.client_matrix, '[{')
    strategy:
      fail-fast: false
      max-parallel: 1    # one Steam login on the CI account at a time
      matrix:
        include: ${{ fromJSON(needs.poll.outputs.client_matrix) }}
    # The Steam login is an environment secret of steam-client. A called job
    # sees it only when it is passed here by name (this job cannot set an
    # environment; the called check job reads the value from steam-client).
    # Unpassed, it would read as empty and the check could not log in. The
    # TEST key signs the map-mode chain's dry-run feed. The loader fork's
    # deploy key is passed too (the push-loader job pushes auto/update-<CL>
    # with it, in environment fork-push), and so are the nine plugin forks' keys
    # (the auto-apply job pushes the verified fixes with them, also in fork-push).
    # The release key is passed too: it is an environment secret of vmap-sign, which only
    # the called publish job reads (main only), and unpassed it would read as empty there. That job
    # publishes the feed from here by itself (this call sets publish: true), and only with the
    # autopilot on and every gate passed (ci/MAP-MODE.md, "The publish path").
    # These permissions are a ceiling, not a grant: GitHub checks every called
    # job against them when it parses the call, before any if. Each called job
    # sets its own, and only publish (vmap-sign environment, main only) and layout-store (main only, no environment) ask for contents: write. actions: read is the client rig's
    # (sr-client-check calls sr-client-rig, which reads the candidate run's
    # artifacts); without it here the nested call would not parse. actions: write is the
    # feed-loader-cleanup job's, which deletes the feed-path loader artifact once the rig has ended.
    permissions:
      contents: write
      pull-requests: write
      issues: write    # the alert job of the called workflow
      actions: write   # feed-loader-cleanup; the client rig, called by the called workflow, reads (actions: read)
      checks: read     # the alert job reads the failed jobs' annotations
    uses: ./.github/workflows/sr-client-check.yml
    with:
      branch: ${{ matrix.branch }}
      buildid: ${{ matrix.buildid }}
      other_buildid: ${{ matrix.other_buildid }}
      pr: ${{ needs.poll.outputs.pr }}
      map_mode: true
      publish: true
      rehearsal: ${{ inputs.rehearsal == true }}
      # Only a hand dispatch can name a release to supersede, and only the public leg publishes; the schedule
      # (and anything else) passes it empty.
      supersede: ${{ github.event_name == 'workflow_dispatch' && matrix.branch == 'public' && inputs.supersede || '' }}
      # The same for a retry: only a hand dispatch can name the CL, and only the public leg publishes.
      retry_cl: ${{ github.event_name == 'workflow_dispatch' && matrix.branch == 'public' && inputs.retry_cl || '' }}
    secrets:
      STEAM_CI_USERNAME: ${{ secrets.STEAM_CI_USERNAME }}
      STEAM_CI_LOGIN_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
      VMAP_SIGN_KEY_TEST: ${{ secrets.VMAP_SIGN_KEY_TEST }}
      VMAP_SIGN_KEY: ${{ secrets.VMAP_SIGN_KEY }}
      SR_DEPLOYKEY_MODLOADER: ${{ secrets.SR_DEPLOYKEY_MODLOADER }}
      SR_DEPLOYKEY_BETTERCHEATS: ${{ secrets.SR_DEPLOYKEY_BETTERCHEATS }}
      SR_DEPLOYKEY_BETTERDRONE: ${{ secrets.SR_DEPLOYKEY_BETTERDRONE }}
      SR_DEPLOYKEY_WAILA: ${{ secrets.SR_DEPLOYKEY_WAILA }}
      SR_DEPLOYKEY_CODEX: ${{ secrets.SR_DEPLOYKEY_CODEX }}
      SR_DEPLOYKEY_COMPASS: ${{ secrets.SR_DEPLOYKEY_COMPASS }}
      SR_DEPLOYKEY_PRODUCTIONVIEWER: ${{ secrets.SR_DEPLOYKEY_PRODUCTIONVIEWER }}
      SR_DEPLOYKEY_RUPTURETIMER: ${{ secrets.SR_DEPLOYKEY_RUPTURETIMER }}
      SR_DEPLOYKEY_WAVEOPTIMISER: ${{ secrets.SR_DEPLOYKEY_WAVEOPTIMISER }}
      SR_DEPLOYKEY_CAMERACONTROLS: ${{ secrets.SR_DEPLOYKEY_CAMERACONTROLS }}

  # ---- Offline check of the dedicated server build ----
  # sr-server-check.yml downloads the server anonymously (public branch only), reads its identity and the
  # field layout of ci/server-keys.txt from its PDB, and keeps the result in the server-check-<build id>
  # artifact. No Steam login, no secret and no environment: none is passed, and the called workflow
  # asks for contents: read only. Its own concurrency group (sr-server-check), not the client rig's.
  # Nothing needs this job, so it cannot hold the client chain or the planner extract; a failure of
  # it reaches the alert job below.
  server-check:
    name: server-check (${{ matrix.branch }})
    needs: poll
    if: needs.poll.outputs.changed == 'true' && needs.poll.outputs.skip != 'true' && startsWith(needs.poll.outputs.server_matrix, '[{')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.poll.outputs.server_matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/sr-server-check.yml
    with:
      buildid: ${{ matrix.buildid }}
      rehearsal: ${{ inputs.rehearsal == true }}

  # ---- Alert: a failed job of this chain outside the client check ----
  # The client check alerts on its own jobs. This covers the rest of the chain: the
  # poll, the compile check (sr-build-all.yml, called as build-all) and the server
  # check (sr-server-check.yml, called as server-check). The cause
  # lines and the issue come from the same script as the client check's alert
  # (ci/pipeline-alert.mjs), so the failure reaches each changed client branch's
  # issue ("SR map mode: <branch> needs attention", label pipeline-alert, assigned
  # to the owner), or one chain issue when no client branch changed.
  alert:
    name: alert
    needs: [poll, build, server-check]
    if: ${{ always() && inputs.rehearsal != true && (needs.poll.result == 'failure' || needs.build.result == 'failure' || needs.server-check.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read    # the failed steps and logs of this run's jobs
      checks: read     # their failure annotations (the first error line)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: msantoro12
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MATRIX: ${{ needs.poll.outputs.client_matrix }}
    steps:
      - name: Check out the alert script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: ci
          persist-credentials: false

      - name: Open or update the issue
        run: |
          set -euo pipefail
          node ci/pipeline-alert.mjs causes --repo "$GH_REPO" --run "$RUN_ID" --out failed-jobs.jsonl || true
          node ci/pipeline-alert.mjs outside --causes failed-jobs.jsonl --owner "$OWNER" --run-url "$RUN_URL" --out alert.md
          [ -s alert.md ] || exit 0
          branches="$(node -e 'let b = []; try { b = JSON.parse(process.env.MATRIX).map((x) => x.branch); } catch {} console.log(b.filter((x) => /^[A-Za-z0-9_.]+$/.test(x)).join(" "))')"
          if [ -z "$branches" ]; then
            node ci/pipeline-alert.mjs raise --title "SR watch: the update chain needs attention" --body-file alert.md --owner "$OWNER"
          fi
          for b in $branches; do
            node ci/pipeline-alert.mjs raise --title "SR map mode: $b needs attention" --body-file alert.md --owner "$OWNER"
          done

  # ---- Planner data extract: start it for a build that has none ----
  # One job for both the start after the chain and the reconcile on every poll (the same call,
  # ci/planner-extract.mjs). It needs the client check, so it starts only after every client-check job,
  # the publish included, has ended and the Steam session is free. No job needs it, so it can never hold
  # or fail the chain, and continue-on-error keeps its own failure from reddening this run.
  # It dispatches sr-data-extract.yml (a run of its own) and holds no secret: that run reads the
  # Steam login. The extractor commit is pinned in ci/data/extractor-ref.txt.
  planner-extract:
    name: planner data extract
    needs: [poll, client-check]
    if: ${{ !cancelled() && needs.poll.result == 'success' && inputs.rehearsal != true }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read     # the checkout
      actions: write     # read the runs list, dispatch sr-data-extract.yml
      issues: write      # the alert issue and its label
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: msantoro12
      BRANCHES: public,public_test_branch
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          sparse-checkout: |
            ci
            .github/sr-pipeline
          persist-credentials: false

      - name: Start the extract for a build that has none
        run: node ci/planner-extract.mjs --repo "$GH_REPO" --branches "$BRANCHES" --owner "$OWNER"
