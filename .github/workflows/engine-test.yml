name: Engine load test

# Experiment: can a GitHub-hosted Windows runner start the free StarRupture
# Dedicated Server with our loader and plugins installed, and show that they
# load into the engine?
#
#   mode=build    only compile (loader Server Release, sr-aobscan, WAILA)
#   mode=vanilla  only download the server and boot it with no loader
#                 (baseline: disk, download, boot time, log layout)
#   mode=full     build, then download, install, scan, boot and judge
#   mode=rows     as full, for a server boot with candidate rows: the loader is built with the
#                 define that makes it trust the TEST key, the signed server version object map
#                 file at rows_url is seeded byte for byte as the loader's cache before the boot,
#                 and the verdict adds the "rows served" checks (ci/verdict.ps1 -ExpectRows).
#                 Nothing is published, and the seeded file is not uploaded.
#
# The server is Steam app 3809400 (anonymous download, to be confirmed by the first run). Its files live only on
# the runner: they are never cached, uploaded or committed. Artifacts hold our
# own build outputs and trimmed logs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build | vanilla | full | rows'
        type: choice
        options: [build, vanilla, full, rows]
        default: full
      rows_url:
        description: 'rows mode only: https URL of the signed server version object map file (version-map-server.v1.txt) to seed, for example an asset of a prerelease'
        type: string
        default: ''
      rows_expect:
        description: 'rows mode only: least number of log lines that say the loader served a row for the build'
        type: string
        default: '1'
      rows_keys:
        description: 'rows mode only: optional, comma-separated keys the file holds rows for; a "reflected (no row ...)" line for one of them fails the run (empty: any such line fails)'
        type: string
        default: ''
      loader_repo:
        description: 'Loader repository (owner/name)'
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      loader_ref:
        description: 'Loader branch or tag'
        type: string
        default: 'ci/aobscan-engine-test'
      ready_regex:
        description: 'Regex on the engine log or ModLoader.log meaning "the world is up"'
        type: string
        default: 'LogLoad: Took [\d.]+ seconds to LoadMap\(/Game/Chimera/Maps/ChimeraMain/ChimeraMain\)'
      settle_sec:
        description: 'Seconds to keep the server running after the ready line'
        type: string
        default: '60'

permissions:
  contents: read

env:
  OWNER: AlienXAXS
  BUILD_TAG: v0.0.0-cilab.${{ github.run_number }}

jobs:
  build:
    name: build
    if: ${{ inputs.mode != 'vanilla' }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      required_cl: ${{ steps.cl.outputs.required_cl }}
    steps:
      - name: Check out the loader (with its pinned Game SDK)
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader
          submodules: recursive
          persist-credentials: false

      - name: Check out the Plugin SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OWNER }}/StarRupture-Plugin-SDK
          path: plugin-sdk
          persist-credentials: false

      - name: Check out the Game SDK
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OWNER }}/StarRupture-Game-SDK
          path: game-sdk
          persist-credentials: false

      - name: Check out WAILA
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.OWNER }}/StarRupture-Plugin-WAILA
          path: waila
          persist-credentials: false

      - name: Read the CL the loader requires
        id: cl
        shell: pwsh
        run: |
          # The server runs on one build: the loader's required CL, or, for a
          # loader with a version map, the build it was written for (kBuiltCL).
          $f = 'loader\StarRupture-ModLoader-Core\core\version_check.cpp'
          $m = Select-String -Path $f -Pattern 'kRequiredVersionSuffix\[\]\s*=\s*L"([^"]+)"'
          $map = 'loader\StarRupture-ModLoader-Core\hooks\game\version_map.generated.h'
          $b = if (-not $m -and (Test-Path $map)) { Select-String -Path $map -Pattern 'kBuiltCL\s*=\s*(\d+)\s*;' }
          $cl = if ($m) { $m.Matches[0].Groups[1].Value } elseif ($b) { "CL-$($b.Matches[0].Groups[1].Value)" } else { '' }
          if (-not $cl) { throw 'required CL not found in version_check.cpp or kBuiltCL in version_map.generated.h' }
          "required_cl=$cl" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build loader Server Release
        shell: pwsh
        working-directory: loader
        env:
          # Rows mode only: the one define that makes the loader trust the TEST key k1 (the client
          # test rig's candidate loader sets it the same way). cl.exe reads it from CL and prepends
          # it to every compile, so the loader source is unchanged. /Bt+ makes each compile print
          # its timing, which the next step uses to prove cl.exe read this variable. Empty in the
          # other modes.
          CL: ${{ inputs.mode == 'rows' && '/DVMAP_TRUST_TEST_KEY /Bt+' || '' }}
          ROWS_MODE: ${{ inputs.mode == 'rows' }}
        run: |
          # Arguments as in the loader's release.yml "Build Server Release".
          $log = @()
          if ($env:ROWS_MODE -eq 'true') { $log = @("/flp:LogFile=$($env:GITHUB_WORKSPACE)\msbuild-loader.log;Verbosity=normal") }
          msbuild "StarRupture-ModLoader.sln" `
            /p:Configuration="Server Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="$env:BUILD_TAG" `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal `
            @log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the TEST key define reached the compiler
        if: ${{ inputs.mode == 'rows' }}
        shell: pwsh
        run: |
          $f = Join-Path $env:GITHUB_WORKSPACE 'msbuild-loader.log'
          if (-not (Test-Path -LiteralPath $f)) { throw 'the build wrote no MSBuild log, so the define cannot be checked' }
          $log = Get-Content -LiteralPath $f
          # The file that reads the define was compiled, and cl.exe printed the timing the same variable asked for.
          $timed = @($log | Where-Object { $_ -match 'time\(.*c1xx\.dll\)=' })
          $feedUnit = @($log | Where-Object { $_ -match 'version_feed\.cpp' })
          if ($feedUnit.Count -eq 0) { throw 'the build log never names version_feed.cpp: the file that reads VMAP_TRUST_TEST_KEY was not compiled in this build' }
          if ($timed.Count -eq 0) { throw 'the build log has no /Bt+ timing line: cl.exe did not read the CL environment variable, so VMAP_TRUST_TEST_KEY was not defined' }
          "cl.exe read the CL environment variable: $($timed.Count) timed compile line(s), version_feed.cpp compiled."

      - name: Build sr-aobscan (Server Release)
        shell: pwsh
        working-directory: loader
        run: |
          # The solution lists the tool but does not build it by default.
          msbuild "tools\AobScan\AobScan.vcxproj" `
            /p:Configuration="Server Release" `
            /p:Platform=x64 `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mark WAILA as a server plugin (test only)
        shell: pwsh
        working-directory: waila
        run: |
          # WAILA declares PLUGIN_TARGET_CLIENT, so the server loader refuses it. The engine
          # test only needs a plugin that loads on the server, so flip the target in this
          # throwaway checkout. Nothing is committed or released.
          $f = 'Waila\plugin.cpp'
          $t = (Get-Content $f -Raw) -replace 'PLUGIN_TARGET_CLIENT(\s*\r?\n\};)', 'PLUGIN_TARGET_SERVER$1'
          if ($t -notmatch 'PLUGIN_TARGET_SERVER') { throw 'target marker not found in plugin.cpp' }
          Set-Content $f $t -NoNewline

      - name: Build WAILA Server Release
        shell: pwsh
        working-directory: waila
        run: |
          # Arguments as in the plugin's release.yml, Server Release instead of Client.
          msbuild "StarRupture-Plugin-Waila.sln" `
            /p:Configuration="Server Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="$env:BUILD_TAG" `
            /p:GameSDKRoot="${{ github.workspace }}\game-sdk" `
            /p:PluginSDKInclude="${{ github.workspace }}\plugin-sdk\include" `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage our build outputs
        shell: pwsh
        run: |
          $s = Join-Path $env:GITHUB_WORKSPACE 'stage'
          New-Item -ItemType Directory -Force "$s\ModLoader", "$s\Plugins", "$s\tools" | Out-Null
          $lb = "loader\build\Server Release"
          Copy-Item "$lb\dwmapi.dll" "$s\dwmapi.dll"
          if (Test-Path "$lb\ModLoader") { Copy-Item "$lb\ModLoader\*.dll" "$s\ModLoader" }
          Copy-Item "waila\build\Server Release\Plugins\Waila.dll" "$s\Plugins\Waila.dll"
          Copy-Item "loader\build\tools\sr-aobscan-server.exe" "$s\tools\sr-aobscan-server.exe"
          Get-ChildItem $s -Recurse -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($s.Length + 1) }

      - name: Upload our build outputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: engine-test-build
          path: stage
          if-no-files-found: error
          retention-days: 1

  engine:
    name: engine
    needs: build
    outputs:
      server_product_version: ${{ steps.g3.outputs.server_product_version }}
    # Runs in vanilla mode (build skipped) and in full mode (build succeeded);
    # never after a failed build, never in build mode.
    if: ${{ !cancelled() && inputs.mode != 'build' && (needs.build.result == 'success' || (inputs.mode == 'vanilla' && needs.build.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the test scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Runner before
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } | ForEach-Object { '{0} free {1:N1} GB used {2:N1} GB' -f $_.Root, ($_.Free/1GB), ($_.Used/1GB) }
          $os = Get-CimInstance Win32_OperatingSystem
          'RAM total {0:N1} GB free {1:N1} GB; CPUs {2}' -f ($os.TotalVisibleMemorySize/1MB), ($os.FreePhysicalMemory/1MB), (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          $os.Caption + ' ' + $os.Version

      - name: Download the dedicated server
        id: dl
        shell: pwsh
        run: ./ci/download-server.ps1

      - name: Download our build outputs
        if: ${{ inputs.mode == 'full' || inputs.mode == 'rows' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: engine-test-build
          path: stage

      - name: Install the loader and WAILA
        if: ${{ inputs.mode == 'full' || inputs.mode == 'rows' }}
        shell: pwsh
        env:
          SERVER_ROOT: ${{ steps.dl.outputs.install_dir }}
        run: |
          $exe = Get-ChildItem -Path $env:SERVER_ROOT -Recurse -Filter 'StarRuptureServerEOS-Win64-Shipping.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Shipping exe not found' }
          $dir = $exe.DirectoryName
          # Loader README: dwmapi.dll next to the Shipping exe, core and plugins under ModLoader.
          Copy-Item stage\dwmapi.dll $dir
          New-Item -ItemType Directory -Force "$dir\ModLoader\Plugins\config" | Out-Null
          Copy-Item stage\ModLoader\*.dll "$dir\ModLoader"
          Copy-Item stage\Plugins\Waila.dll "$dir\ModLoader\Plugins"
          # The test judges the build under test: no self-update, no plugin swaps.
          Set-Content "$dir\ModLoader\modloader.ini" "[AutoUpdate]`r`nEnabled=0`r`n" -Encoding ascii
          Set-Content "$dir\ModLoader\Plugins\config\Waila.ini" "[General]`r`nEnabled=true`r`n" -Encoding ascii
          Get-ChildItem $dir -Filter dwmapi.dll | ForEach-Object { '{0:N0}  {1}' -f $_.Length, $_.FullName }
          Get-ChildItem "$dir\ModLoader" -Recurse -File | ForEach-Object { '{0:N0}  {1}' -f $_.Length, $_.FullName.Substring($dir.Length) }

      - name: Seed the signed server rows as the loader's cache
        id: rows
        if: ${{ inputs.mode == 'rows' }}
        shell: pwsh
        env:
          SERVER_ROOT: ${{ steps.dl.outputs.install_dir }}
          ROWS_URL: ${{ inputs.rows_url }}
        run: |
          # The loader has no setting that changes where it fetches from, so the test seeds its cache
          # (the way the client test rig does): the file, byte for byte, at
          # <server dir>\ModLoader\version-map-server.v1.cache. At start the loader verifies it and
          # merges it onto its built-in table with no network. The file is kept only in the runner's
          # temp folder: it is not uploaded, and nothing is written to any release.
          if ($env:ROWS_URL -notmatch '^https://[^\s]+$') { throw 'rows_url must be an https URL of the signed server file' }
          $exe = Get-ChildItem -Path $env:SERVER_ROOT -Recurse -Filter 'StarRuptureServerEOS-Win64-Shipping.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Shipping exe not found' }
          $dir = $exe.DirectoryName
          $tmp = Join-Path $env:RUNNER_TEMP 'version-map-server.staged.txt'
          Invoke-WebRequest -Uri $env:ROWS_URL -OutFile $tmp -UseBasicParsing -MaximumRedirection 5
          $bytes = [IO.File]::ReadAllBytes($tmp)
          if ($bytes.Length -eq 0 -or $bytes.Length -gt 1MB) { throw "the file is $($bytes.Length) bytes: the loader reads at most 1 MiB" }
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          if (-not $text.EndsWith("`n")) { throw 'the file does not end with a line feed' }
          $lines = $text.TrimEnd("`n") -split "`n"
          if ($lines[0] -cne "format`t1") { throw 'line 1 is not "format<TAB>1"' }
          if ($lines[1] -cnotmatch '^seq\t([1-9][0-9]{0,12})$') { throw 'line 2 is not "seq<TAB><n>"' }
          $seq = $Matches[1]
          if ($lines[-1] -cnotmatch '^sig\t(k[12])\t') { throw 'the last line is not a "sig<TAB>k1 or k2<TAB>..." line' }
          $key = $Matches[1]
          $builds = @($lines | Where-Object { $_ -cmatch '^build\t(\d+)\t' } | ForEach-Object { ($_ -split "`t")[1] })
          $pv = $exe.VersionInfo.ProductVersion
          if ($pv -cnotmatch 'CL-(\d+)$') { throw "the server exe's ProductVersion '$pv' does not end in CL-<n>" }
          $cl = $Matches[1]
          if ($builds -notcontains $cl) { throw "the file has no build line for the server exe's CL-$cl (it has: $($builds -join ', '))" }
          New-Item -ItemType Directory -Force "$dir\ModLoader" | Out-Null
          $cache = "$dir\ModLoader\version-map-server.v1.cache"
          Copy-Item -LiteralPath $tmp -Destination $cache -Force
          $sha = (Get-FileHash -LiteralPath $tmp -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $cache -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'the seeded cache is not byte for byte the file that was fetched' }
          New-Item -ItemType Directory -Force out | Out-Null
          [ordered]@{ url = $env:ROWS_URL; sha256 = $sha; bytes = $bytes.Length; seq = $seq; key = $key; cl = $cl; product_version = $pv; build_cls = $builds } | ConvertTo-Json | Set-Content out\rows.json -Encoding utf8
          "rows_seq=$seq" >> $env:GITHUB_OUTPUT
          "rows_key=$key" >> $env:GITHUB_OUTPUT
          "rows_cl=$cl" >> $env:GITHUB_OUTPUT
          "Seeded $cache : seq $seq, key $key, CL-$cl, $($bytes.Length) bytes, sha256 $sha"

      - name: Offline pattern scan of the server exe
        if: ${{ inputs.mode == 'full' || inputs.mode == 'rows' }}
        shell: pwsh
        env:
          SERVER_ROOT: ${{ steps.dl.outputs.install_dir }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem -Path $env:SERVER_ROOT -Recurse -Filter 'StarRuptureServerEOS-Win64-Shipping.exe' -File | Select-Object -First 1
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & stage\tools\sr-aobscan-server.exe $exe.FullName --verbose *> out\scanner.txt
          $code = $LASTEXITCODE
          Set-Content out\scanner.exit "$code" -Encoding ascii
          # Gate G4 verdict as JSON (OK / MISSING / AMBIGUOUS per pattern), uploaded with the logs.
          & stage\tools\sr-aobscan-server.exe $exe.FullName --json > out\scanner.json
          $j = Get-Content out\scanner.json -Raw | ConvertFrom-Json
          "G4 counts: OK=$($j.summary.ok) MISSING=$($j.summary.missing) AMBIGUOUS=$($j.summary.ambiguous) of $($j.summary.total)"
          Get-Content out\scanner.txt | Select-Object -Last 40
          "sr-aobscan exit code $code in $([int]$sw.Elapsed.TotalSeconds) s"
          # The verdict step judges scanner.exit. Do not let the scanner's code fail this
          # step: the boot data is still wanted when a pattern no longer matches.
          exit 0

      - name: Gate G3, server exe ProductVersion against the loader's required CL
        id: g3
        if: ${{ inputs.mode == 'full' }}
        shell: pwsh
        env:
          SERVER_ROOT: ${{ steps.dl.outputs.install_dir }}
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
        run: |
          $exe = Get-ChildItem -Path $env:SERVER_ROOT -Recurse -Filter 'StarRuptureServerEOS-Win64-Shipping.exe' -File | Select-Object -First 1
          $pv = $exe.VersionInfo.ProductVersion
          $ok = $pv -and $pv.EndsWith($env:REQUIRED_CL)
          "server_product_version=$pv" >> $env:GITHUB_OUTPUT
          "G3 server ProductVersion=$pv required=$($env:REQUIRED_CL) match=$ok"
          New-Item -ItemType Directory -Force out | Out-Null
          Set-Content out\g3.txt "ProductVersion=$pv`nRequired=$($env:REQUIRED_CL)`nMatch=$ok" -Encoding ascii
          if (-not $ok) { Write-Host "::error::G3 failed: ProductVersion does not end in the required CL" ; exit 1 }

      - name: Boot the server headless
        id: boot
        shell: pwsh
        env:
          SERVER_ROOT: ${{ steps.dl.outputs.install_dir }}
          MODE: ${{ inputs.mode }}
          READY_REGEX: ${{ inputs.ready_regex }}
          SETTLE_SEC: ${{ inputs.settle_sec }}
        run: |
          ./ci/boot-server.ps1 -ServerRoot $env:SERVER_ROOT -OutDir out `
            -Label $env:MODE -ReadyRegex $env:READY_REGEX `
            -SettleSec ([int]$env:SETTLE_SEC) -TimeoutSec 900

      - name: Verdict
        if: ${{ (inputs.mode == 'full' || inputs.mode == 'rows') && !cancelled() }}
        shell: pwsh
        env:
          EXPECT_TAG: ${{ env.BUILD_TAG }}
          READY_REGEX: ${{ inputs.ready_regex }}
          MODE: ${{ inputs.mode }}
          ROWS_EXPECT: ${{ inputs.rows_expect }}
          ROWS_KEYS: ${{ inputs.rows_keys }}
          ROWS_SEQ: ${{ steps.rows.outputs.rows_seq }}
          ROWS_KEY: ${{ steps.rows.outputs.rows_key }}
          ROWS_CL: ${{ steps.rows.outputs.rows_cl }}
        run: |
          # Rows mode adds the "rows served" checks; every other mode runs the verdict as before.
          $rows = @{}
          if ($env:MODE -eq 'rows') {
            $rows = @{ ExpectRows = [int]$env:ROWS_EXPECT; ExpectedCl = $env:ROWS_CL; ExpectSeq = $env:ROWS_SEQ; ExpectKey = $env:ROWS_KEY }
            $keys = @($env:ROWS_KEYS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($keys.Count -gt 0) { $rows.ExpectKeys = $keys }
          }
          ./ci/verdict.ps1 -OutDir out -ExpectTag $env:EXPECT_TAG -ExpectPlugins Waila -ReadyRegex $env:READY_REGEX @rows

      - name: Runner after
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Where-Object { $null -ne $_.Used } | ForEach-Object { '{0} free {1:N1} GB used {2:N1} GB' -f $_.Root, ($_.Free/1GB), ($_.Used/1GB) }

      - name: Upload the trimmed logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: engine-test-logs-${{ inputs.mode }}
          path: out
          if-no-files-found: warn
          retention-days: 3
