name: SR client check

# Offline check of a new StarRupture client build (Steam app 1631270): logs in
# to Steam with the saved CI login, downloads the build, and checks it without
# running it:
#   - the exe's ProductVersion ends with the CL the loader requires
#   - sr-aobscan runs every PreflightRegistry pattern (with the four Game-SDK
#     globals) against the exe and resolves their RVAs
#   - the resolved SDK globals are compared with the Game SDK's Offsets::
#   - each plugin's own OnPluginLoadHooks resolves its patterns against the
#     exe (sr-aobscan --plugin); a plugin in `plugins` is built from source
#     (owner/repo@ref) or is the released DLL players get
#     (owner/repo@latest-release)
#   - auto-apply: a plugin's failing patterns are patched with the proposals
#     at or above apply_confidence (high unless a replay says otherwise), the
#     plugin is rebuilt and scanned again on this build and the public one,
#     and a verified fix of one of the owner's forks is pushed to that fork as
#     auto/update-<CL> (ci/apply-proposals.mjs)
# The result is a JSON artifact and a comment on the game-update PR.
#
# Bases: the released line, which is what players run and what reads the feed.
# The loader, the Plugin SDK, the Game SDK and the nine plugins are AlienX's
# `main` (inputs loader_repo/loader_ref, plugin_sdk_*, game_sdk_*, plugins). Only
# tools/AobScan comes from elsewhere (scanner_repo@scanner_ref, the fork's
# ci/aobscan), laid over the loader. The fork is where results go, never where a
# base is read from: push-loader and auto-apply cut `auto/update-<CL>` from the
# exact AlienX commit this run scanned and push it to the owner's fork.
#
# Trust: the scanner and plugin code run in the job that held the Steam
# login, after the login cache is deleted from disk. Deleting it does not
# clear it from the runner's memory, so that code only ever comes from the
# owners the inputs allow (msantoro12 and AlienXAXS; for a latest release also
# LetMeInside, MiniMap's author), the same trust as scanner_ref. The fork
# deploy keys are only in the auto-apply job (environment fork-push), which
# runs no plugin code and no action but actions/checkout, and checks every
# field of its work list: the commit must be the one plugin-plan resolved
# from the inputs, before any plugin code ran. Each key can write only
# auto/** branches on its fork, and no tags.
#
# Validation only for another author's plugin (anything not owned by
# msantoro12): nothing here publishes, tags, releases or uploads it. The
# check job fetches or builds it itself, after the login cache is deleted;
# it never goes through the plugins job's artifact, and the files die with
# the runner. For another author's plugin this workflow has no release, tag,
# Nexus or upload-to-the-world step, the fork keys exist only for the owner's
# own forks (the auto-apply job checks the repository), and the result artifact
# holds reports, never a plugin binary. What it does write is the loader's own
# version map feed: the signed feed on the vmap-feed release (publish), described at its job.
#
# Login: a separate Steam account that owns the game, never the owner's main
# account. Its steamcmd login cache (config.vdf) is the secret
# STEAM_CI_LOGIN_CACHE in the environment `steam-client` (deployment branch:
# main only), made by steam-ci-login.ps1 on the owner's PC. No password ever
# reaches CI. A caller must pass STEAM_CI_USERNAME and STEAM_CI_LOGIN_CACHE by
# name: a reusable workflow sees an environment secret only when its caller
# passes it, and an unpassed one reads as empty. Without the login the check
# job fails with the cause; it never skips green.
#
# Game files only live on the runner: never cached, never uploaded.
# No pull_request trigger: the login secret is never reachable from a PR.

on:
  workflow_call:
    inputs:
      branch:
        description: 'Client branch: public or public_test_branch'
        type: string
        required: true
      buildid:
        description: 'Build id the watcher saw (compared with what Steam installs)'
        type: string
        default: ''
      other_buildid:
        description: 'Build id of the other client branch (public or public_test_branch); its CL decides which refusals the rig of that branch expects. Empty: read live from Steam'
        type: string
        default: ''
      pr:
        description: 'Pull request number to post the result on'
        type: string
        default: ''
      loader_repo:
        type: string
        default: 'AlienXAXS/StarRupture-ModLoader'
      loader_ref:
        type: string
        default: 'main'
      scanner_repo:
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      scanner_ref:
        type: string
        default: 'ci/aobscan'
      plugins:
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-BetterCheats@main AlienXAXS/StarRupture-Plugin-BetterDrone@main AlienXAXS/StarRupture-Plugin-WAILA@main AlienXAXS/StarRupture-Plugin-Codex@main AlienXAXS/StarRupture-Plugin-Compass@main AlienXAXS/StarRupture-Plugin-ProductionViewer@main AlienXAXS/StarRupture-Plugin-RuptureTimer@main AlienXAXS/StarRupture-Plugin-WaveOptimiser@main AlienXAXS/StarRupture-Plugin-CameraControls@main LetMeInside/StarRupture-Plugin-MiniMap@latest-release'
      plugin_sdk_repo:
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-SDK'
      plugin_sdk_ref:
        type: string
        default: 'main'
      game_sdk_repo:
        type: string
        default: 'AlienXAXS/StarRupture-Game-SDK'
      game_sdk_ref:
        type: string
        default: 'main'
      plugin_exclude:
        type: string
        default: ''
      key_sources:
        description: 'Key sources (map mode): fork builds scanned for the map keys they request, space-separated msantoro12/StarRupture-Plugin-<Name>@<branch>[:<40-digit commit>]. A ref with no commit pin is allowed only for the nine plugins on gss/plugin-work. They never enter the candidate, the rig or the feed (ci/MAP-MODE.md, Key sources)'
        type: string
        default: 'msantoro12/StarRupture-Plugin-BetterCheats@gss/plugin-work msantoro12/StarRupture-Plugin-BetterDrone@gss/plugin-work msantoro12/StarRupture-Plugin-WAILA@gss/plugin-work msantoro12/StarRupture-Plugin-Codex@gss/plugin-work msantoro12/StarRupture-Plugin-Compass@gss/plugin-work msantoro12/StarRupture-Plugin-ProductionViewer@gss/plugin-work msantoro12/StarRupture-Plugin-RuptureTimer@gss/plugin-work msantoro12/StarRupture-Plugin-WaveOptimiser@gss/plugin-work msantoro12/StarRupture-Plugin-CameraControls@gss/plugin-work msantoro12/StarRupture-Plugin-MiniMap@feat/full-version-map:52fa40a0793bc91edce7044303327c6bc588d7c0'
      apply_confidence:
        description: 'Lowest proposal confidence that is auto-applied: high, or medium for a replay'
        type: string
        default: 'high'
      map_mode:
        description: 'Write the update into the loader version map (ci/map-mode.mjs) and upload the header'
        type: boolean
        default: false
      publish:
        description: 'Sign the feed with the release key and publish it when promote says so (only sr-watch passes true; the autopilot must be on and every gate must pass)'
        type: boolean
        default: false
    # A called job sees an environment secret only when the caller passes it
    # by name (the calling job cannot set an environment; the value comes from
    # the environment of the called job that reads it). Unpassed, it reads as
    # empty, with no error. The Steam login is required, so a caller that leaves
    # it out fails at the call instead of checking nothing. The release key
    # (environment vmap-sign, main only) is declared too, and only the publish job
    # reads it; a caller that leaves it out gets a publish job that stops at the
    # empty key. The deploy keys of the loader fork and of the nine plugin forks
    # (environment fork-push) are declared but not required, so a missing one fails
    # the push-loader or auto-apply job with its cause, not the call.
    secrets:
      STEAM_CI_USERNAME:
        description: 'Steam CI account name (environment steam-client); pass it by name'
        required: true
      STEAM_CI_LOGIN_CACHE:
        description: 'Saved steamcmd login cache (environment steam-client); pass it by name'
        required: true
      VMAP_SIGN_KEY_TEST:
        description: 'TEST signing key (k1) for the map-mode dry run'
        required: false
      VMAP_SIGN_KEY:
        description: 'Release signing key (k2, environment vmap-sign); pass it by name. Only the publish job reads it'
        required: false
      SR_DEPLOYKEY_MODLOADER:
        description: 'Write deploy key of the loader fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_BETTERCHEATS:
        description: 'Write deploy key of the BetterCheats fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_BETTERDRONE:
        description: 'Write deploy key of the BetterDrone fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_WAILA:
        description: 'Write deploy key of the WAILA fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_CODEX:
        description: 'Write deploy key of the Codex fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_COMPASS:
        description: 'Write deploy key of the Compass fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_PRODUCTIONVIEWER:
        description: 'Write deploy key of the ProductionViewer fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_RUPTURETIMER:
        description: 'Write deploy key of the RuptureTimer fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_WAVEOPTIMISER:
        description: 'Write deploy key of the WaveOptimiser fork (environment fork-push); pass it by name'
        required: false
      SR_DEPLOYKEY_CAMERACONTROLS:
        description: 'Write deploy key of the CameraControls fork (environment fork-push); pass it by name'
        required: false
  workflow_dispatch:
    inputs:
      branch:
        description: 'Client branch (expiry-only: just check the saved login age)'
        type: choice
        options: [public, public_test_branch, expiry-only]
        default: public
      buildid:
        description: 'Build id the watcher saw (blank: what Steam installs); map mode names the build row with it'
        type: string
        default: ''
      other_buildid:
        description: 'Build id of the other client branch (blank: read live from Steam); its CL decides which refusals the rig of that branch expects, and a build the candidate map has no row for must be declined cleanly'
        type: string
        default: ''
      pr:
        description: 'Pull request number to post the result on (blank: no comment)'
        type: string
        default: ''
      loader_repo:
        description: 'Loader repository the patterns and the header come from (the released line: AlienXAXS main)'
        type: string
        default: 'AlienXAXS/StarRupture-ModLoader'
      loader_ref:
        description: 'Loader branch the patterns and the header come from'
        type: string
        default: 'main'
      scanner_repo:
        description: 'Repository holding the scanner branch (only tools/AobScan is taken from it)'
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      scanner_ref:
        description: 'Branch of the scanner repository holding tools/AobScan'
        type: string
        default: 'ci/aobscan'
      plugins:
        description: 'Plugins whose patterns are checked too: owner/repo@ref, space-separated'
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-BetterCheats@main AlienXAXS/StarRupture-Plugin-BetterDrone@main AlienXAXS/StarRupture-Plugin-WAILA@main AlienXAXS/StarRupture-Plugin-Codex@main AlienXAXS/StarRupture-Plugin-Compass@main AlienXAXS/StarRupture-Plugin-ProductionViewer@main AlienXAXS/StarRupture-Plugin-RuptureTimer@main AlienXAXS/StarRupture-Plugin-WaveOptimiser@main AlienXAXS/StarRupture-Plugin-CameraControls@main LetMeInside/StarRupture-Plugin-MiniMap@latest-release'
      plugin_sdk_repo:
        description: 'Plugin SDK repository the plugins build against (msantoro12 or AlienXAXS)'
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-SDK'
      plugin_sdk_ref:
        description: 'Plugin SDK ref the plugins build against'
        type: string
        default: 'main'
      game_sdk_repo:
        description: 'Game SDK repository the plugins build against (msantoro12 or AlienXAXS)'
        type: string
        default: 'AlienXAXS/StarRupture-Game-SDK'
      game_sdk_ref:
        description: 'Game SDK ref the plugins build against'
        type: string
        default: 'main'
      plugin_exclude:
        description: 'Plugin names left out of this run (from plugins), space-separated, e.g. MiniMap'
        type: string
        default: ''
      key_sources:
        description: 'Key sources (map mode): fork builds scanned for the map keys they request, space-separated msantoro12/StarRupture-Plugin-<Name>@<branch>[:<40-digit commit>]. A ref with no commit pin is allowed only for the nine plugins on gss/plugin-work. They never enter the candidate, the rig or the feed (ci/MAP-MODE.md, Key sources)'
        type: string
        default: 'msantoro12/StarRupture-Plugin-BetterCheats@gss/plugin-work msantoro12/StarRupture-Plugin-BetterDrone@gss/plugin-work msantoro12/StarRupture-Plugin-WAILA@gss/plugin-work msantoro12/StarRupture-Plugin-Codex@gss/plugin-work msantoro12/StarRupture-Plugin-Compass@gss/plugin-work msantoro12/StarRupture-Plugin-ProductionViewer@gss/plugin-work msantoro12/StarRupture-Plugin-RuptureTimer@gss/plugin-work msantoro12/StarRupture-Plugin-WaveOptimiser@gss/plugin-work msantoro12/StarRupture-Plugin-CameraControls@gss/plugin-work msantoro12/StarRupture-Plugin-MiniMap@feat/full-version-map:52fa40a0793bc91edce7044303327c6bc588d7c0'
      apply_confidence:
        description: 'Lowest proposal confidence that is auto-applied (medium only for a replay)'
        type: choice
        options: [high, medium]
        default: high
      map_mode:
        description: 'Write the update into the loader version map (ci/map-mode.mjs) and upload the header'
        type: boolean
        default: false
      publish:
        description: 'Sign the feed with the release key and publish it when promote says so (off: dry run; also refused with feed_loader_ref)'
        type: boolean
        default: false
      # Dispatch only: sr-watch calls this workflow and cannot pass it. With
      # state/autopilot.json disabled, decide reports what it would
      # choose and, when that is M, the chain runs on (export, TEST-key sign,
      # promote plan) with nothing publishable. Refused with publish on.
      test_autopilot:
        description: 'Test run: carry on past a disabled autopilot as far as the promote plan; never publishes (needs map_mode, publish off)'
        type: boolean
        default: false
      # Dispatch only, for a proof run of the feed-path rig: sr-watch cannot pass it (the call
      # does not declare it), and it is refused with publish on. The feed-path rig then builds
      # this branch of msantoro12/StarRupture-ModLoader instead of the Latest release, for
      # example a branch without public's rows, so the feed is the only source of them.
      feed_loader_ref:
        description: 'Proof run: a branch of msantoro12/StarRupture-ModLoader the feed-path rig builds instead of the Latest release (refused unless publish is off; blank: the Latest release)'
        type: string
        default: ''
      # Dispatch only, the owner's proof of the full public chain on a CL the loader already maps
      # (sr-watch cannot pass it: the call does not declare it). Map mode refuses it on another
      # branch, with publish on or with test_autopilot. It pushes the candidate to auto/update-<CL>-<run>-<attempt> only, and never publishes.
      proof_run:
        description: 'Proof run: carry public''s already-mapped CL through the candidate, both rigs and the feed-path rig; never publishes (needs public, map_mode, publish off)'
        type: boolean
        default: false
      # Dispatch only, the first publish of the feed (sr-watch cannot pass it: the call does not declare it).
      # For one publish: branch public, map_mode and publish on, proof_run and test_autopilot off. It skips
      # decide's "not newer" hold (G3) and the autopilot requirement for this run alone: state/autopilot.json
      # is not read for it and never changed. Refused when this repository's vmap-feed release already carries
      # a feed. loader_repo and loader_ref name the base the candidate is built on: msantoro12/StarRupture-ModLoader
      # and a branch auto/update-<CL>-<run>-<attempt> of it, which holds the rows of the other Steam
      # branch's build; the run adds or verifies public's rows on top, so one header holds both CLs.
      first_publish:
        description: 'First publish of the feed, once: skips the not-newer hold and the autopilot for this run, refused when a feed is already published (needs public, map_mode, publish, loader_repo msantoro12/StarRupture-ModLoader and loader_ref auto/update-<CL>-<run>-<attempt>)'
        type: boolean
        default: false
      # Dispatch only (sr-watch cannot pass it: the call does not declare it): the proof of the stored reference
      # layout. The field rows then take the stored public layout as their base instead of the live public scan,
      # so the field-rows.json of this run can be compared with a normal run's on the same build. Refused on
      # public, with publish on, without test_autopilot, with proof_run, and from sr-watch.
      stored_reference:
        description: 'Proof run: field rows take the stored public layout as their base, not the live public scan (needs another branch than public, map_mode and test_autopilot on, publish off)'
        type: boolean
        default: false
  schedule:
    # Weekly: warn ahead of the saved Steam login expiring.
    - cron: '17 6 * * 1'

permissions: {}

# A first publish holds one group for its whole run, so a second first_publish dispatch waits for the
# first to end and then refuses in plugin-plan (a feed exists by then), before any Steam work. Every
# other run has a group of its own (the run, its attempt and its branch: sr-watch calls this workflow
# once per branch in one run), so nothing else waits or is cancelled by this.
concurrency:
  group: ${{ inputs.first_publish == true && 'sr-first-publish' || format('sr-run-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.branch) }}
  cancel-in-progress: false

env:
  APP_ID: '1631270'
  # Steam does not publish the refresh-token lifetime; about 200 days is the
  # commonly observed value. Warn this many days ahead.
  LOGIN_DAYS: '200'
  WARN_DAYS: '30'
  # The Plugin SDK every key source builds against, and the one place that names it: the owner's fork
  # branch gss/sdk-dev at the commit sr-update builds the installed plugins against (the plugin work
  # branches use headers, plugin_presets.h among them, that only that branch has). Move it with
  # sr-update's pin, never alone.
  KEY_SDK_REPO: msantoro12/StarRupture-Plugin-SDK
  KEY_SDK_REF: 52b48fcc1632f0b713695919c7ba7978111dc428

jobs:
  # ---- sr-aobscan, built from the loader's live patterns (no secrets) ------
  build:
    name: build-scanner
    if: inputs.branch && inputs.branch != 'expiry-only'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      required_cl: ${{ steps.read.outputs.required_cl }}
      sdk_offsets: ${{ steps.read.outputs.sdk_offsets }}
      # The loader commit the scanner was built from: map-mode reads the header at this one.
      loader_sha: ${{ steps.read.outputs.loader_sha }}
      scanner_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check the loader repository
        shell: pwsh
        env:
          LOADER_REPO: ${{ inputs.loader_repo }}
          SCANNER_REPO: ${{ inputs.scanner_repo }}
        run: |
          # The scanner built here runs in the job that holds the Steam login,
          # so it only ever comes from the owner's fork or the upstream repo.
          if ($env:LOADER_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-ModLoader$') {
            throw "loader_repo '$($env:LOADER_REPO)' is not allowed"
          }
          if ($env:SCANNER_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-ModLoader$') {
            throw "scanner_repo '$($env:SCANNER_REPO)' is not allowed"
          }

      - name: Check out the loader (with its pinned Game SDK)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader
          submodules: recursive
          persist-credentials: false

      - name: Check out tools/AobScan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.scanner_repo }}
          ref: ${{ inputs.scanner_ref }}
          path: scanner-src
          sparse-checkout: tools/AobScan
          persist-credentials: false

      - name: Read the required CL and the SDK offsets
        id: read
        shell: pwsh
        env:
          LOADER_REPO: ${{ inputs.loader_repo }}
          LOADER_REF: ${{ inputs.loader_ref }}
        run: |
          # The scanner source comes from its own branch; the patterns, the
          # scan code and the SDK are the loader branch's, so the scan always
          # checks what that branch would ship.
          Copy-Item -Recurse -Force scanner-src\tools\AobScan loader\tools\

          # A loader with one required CL names it here. A loader that runs on
          # every build in its version map has no such line; the scanner then
          # reports that loader's own gate verdict (exe.supported).
          $f = 'loader\StarRupture-ModLoader-Core\core\version_check.cpp'
          $m = Select-String -Path $f -Pattern 'kRequiredVersionSuffix\[\]\s*=\s*L"([^"]+)"'
          $cl = if ($m) { $m.Matches[0].Groups[1].Value } else { '' }

          $basic = 'loader\StarRupture SDK\Client\SDK\Basic.hpp'
          $offsets = [ordered]@{}
          foreach ($k in 'GObjects', 'AppendString', 'GNames', 'GWorld') {
            $o = Select-String -Path $basic -Pattern "constexpr\s+int32\s+$k\s*=\s*(0x[0-9A-Fa-f]+)"
            $offsets[$k] = if ($o) { $o.Matches[0].Groups[1].Value } else { '' }
          }
          $json = $offsets | ConvertTo-Json -Compress
          $loaderSha = git -C loader rev-parse HEAD
          if ($loaderSha -notmatch '^[0-9a-f]{40}$') { throw "no loader commit ('$loaderSha')" }
          "Loader: $($env:LOADER_REPO)@$($env:LOADER_REF) = $loaderSha"
          "Required CL: $(if ($cl) { $cl } else { 'none (the loader''s version map decides)' })"
          "SDK Offsets: $json"
          "loader_sha=$loaderSha" >> $env:GITHUB_OUTPUT
          "required_cl=$cl" >> $env:GITHUB_OUTPUT
          "sdk_offsets=$json" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build sr-aobscan (Client Release)
        shell: pwsh
        working-directory: loader
        run: |
          msbuild "tools\AobScan\AobScan.vcxproj" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The scanner's own tests (the locator it reports for a registry row,
      # against the loader's VersionMap::ResolveLoaderEntry). A manual test
      # project of the scanner branch: built from its project file in the loader
      # checkout above, which supplies the version map code and the test doubles.
      # Its exit code is its verdict, so a failure fails this job and with it the check.
      - name: Build and run the scanner's tests (ObservedTests)
        shell: pwsh
        working-directory: loader
        run: |
          msbuild "tools\AobScan\ObservedTests\ObservedTests.vcxproj" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "ObservedTests did not build (exit $LASTEXITCODE)" }
          & "build\tests\observed_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "ObservedTests failed (exit $LASTEXITCODE)" }

      - name: Hash the scanner
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash loader\build\tools\sr-aobscan-client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sr-aobscan-client.exe SHA-256 $h"
          "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Upload the scanner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-aobscan-client-${{ inputs.branch }}
          path: loader/build/tools/sr-aobscan-client.exe
          if-no-files-found: error
          retention-days: 1

  # ---- The plugins whose patterns are checked too -------------------------
  # Each plugin's own OnPluginLoadHooks is run by sr-aobscan --plugin against
  # the downloaded exe, so the patterns checked are the ones that DLL
  # registers. A plugin entered as owner/repo@ref is built from source;
  # owner/repo@latest-release is the repository's latest GitHub release,
  # checked as players get it (its DLL asset; built from the tag's source when
  # the release has no single DLL asset). A plugin that fails fails only
  # itself: the loader's verdict stays what the loader's patterns say.
  plugin-plan:
    name: plugin-plan
    if: inputs.branch && inputs.branch != 'expiry-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      hosted: ${{ steps.plan.outputs.hosted }}
      any: ${{ steps.plan.outputs.any }}
      anyHosted: ${{ steps.plan.outputs.anyHosted }}
      # <Plugin>=<tag> for each plugin of another author whose newest release is not the reviewed one: the alert's "waiting for review" line.
      review: ${{ steps.plan.outputs.review }}
    steps:
      # The proof input of the feed-path rig (feed_loader_ref) is judged first, so a refused
      # run costs nothing: it is for a run that publishes nothing, and it names a branch of
      # the owner's loader fork, nothing else. The feed-plan job checks it again before it
      # reads it.
      - name: Check the feed-path loader ref
        if: ${{ inputs.feed_loader_ref != '' }}
        env:
          FEED_LOADER_REF: ${{ contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') && inputs.feed_loader_ref || '' }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          set -euo pipefail
          [ "$PUBLISH" = false ] || { echo "::error::feed_loader_ref is for a proof run and is refused with publish on"; exit 2; }
          printf '%s' "$FEED_LOADER_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$' && ! printf '%s' "$FEED_LOADER_REF" | grep -Eq '\.\.|//|/$|\.lock$|\.$' \
            || { echo "::error::feed_loader_ref is not a plain branch name of msantoro12/StarRupture-ModLoader"; exit 2; }
          echo "The feed-path rig will build the branch $FEED_LOADER_REF of msantoro12/StarRupture-ModLoader."

      # stored_reference is judged here too, before any Steam work (the check job waits for this job to pass): it is a
      # test run of a branch other than public. map-mode judges the same facts again before it reads the store.
      - name: Check the stored reference
        if: ${{ inputs.stored_reference == true }}
        env:
          BRANCH: ${{ inputs.branch }}
          MAP_MODE: ${{ inputs.map_mode == true }}
          PUBLISH: ${{ inputs.publish == true }}
          PROOF: ${{ inputs.proof_run == true }}
          TEST_RUN: ${{ inputs.test_autopilot == true }}
          DISPATCHED: ${{ contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
        run: |
          [ "$DISPATCHED" = true ] && [ "$BRANCH" != public ] && [ "$MAP_MODE" = true ] && [ "$PUBLISH" = false ] && [ "$TEST_RUN" = true ] && [ "$PROOF" = false ] \
            || { echo "::error::stored_reference needs a dispatch with a branch other than public, map_mode and test_autopilot on, publish and proof_run off"; exit 2; }

      # The tools the first-publish proof below reads (ci, the poll's code), and the one list of the reviewed
      # releases of other authors' plugins (Pin in ci/plugin-names.json), which the rig reads too.
      - name: Check out the plan tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: |
            ci
            .github/sr-pipeline
          persist-credentials: false

      # A first publish (first_publish) is judged first, before any Steam work, so a run that cannot be one costs
      # nothing (the check job waits for this job to pass): the inputs it needs, a base that is a branch of the
      # fork, a vmap-feed release without a feed, and a base whose rows include the build the other Steam
      # branch runs now. map-mode, push-loader and the publish job judge the same facts again before they act on it.
      - name: Check a first publish
        if: ${{ inputs.first_publish == true }}
        env:
          BRANCH: ${{ inputs.branch }}
          MAP_MODE: ${{ inputs.map_mode == true }}
          PUBLISH: ${{ inputs.publish == true }}
          PROOF: ${{ inputs.proof_run == true }}
          TEST_RUN: ${{ inputs.test_autopilot == true }}
          LOADER_REPO: ${{ inputs.loader_repo }}
          LOADER_REF: ${{ inputs.loader_ref }}
          BUILDID: ${{ inputs.buildid }}
          OTHER_BUILDID: ${{ inputs.other_buildid }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$BRANCH" = public ] && [ "$MAP_MODE" = true ] && [ "$PUBLISH" = true ] && [ "$PROOF" = false ] && [ "$TEST_RUN" = false ] \
            || { echo "::error::first_publish needs branch public, map_mode and publish on, proof_run and test_autopilot off"; exit 2; }
          [ "$LOADER_REPO" = msantoro12/StarRupture-ModLoader ] \
            || { echo "::error::first_publish builds on a branch of msantoro12/StarRupture-ModLoader, not $LOADER_REPO"; exit 2; }
          # The whole string: a newline in the value must not give a second line past the pattern.
          [[ "$LOADER_REF" =~ ^auto/update-[0-9]+-[0-9]+-[0-9]+$ ]] \
            || { echo "::error::first_publish needs loader_ref to be a branch auto/update-<CL>-<run>-<attempt>"; exit 2; }
          if gh api "repos/$GH_REPO/releases/tags/vmap-feed" > first-release.json 2> first-release.err; then
            has="$(node -p "String((JSON.parse(require('fs').readFileSync('first-release.json','utf8')).assets ?? []).some((a) => a.name === 'version-map-client.v1.txt'))")"
            [ "$has" = false ] || { echo "::error::first_publish is refused: the vmap-feed release already carries a feed"; exit 2; }
          elif grep -q 'HTTP 404' first-release.err; then
            echo "no vmap-feed release yet"
          else
            cat first-release.err; echo "::error::cannot read the vmap-feed release"; exit 2
          fi
          # The base must hold the rows of the build the other Steam branch runs now (its live build id, or the
          # dispatch's other_buildid), and that build must not be public's: the feed of a first publish carries
          # both. A base that lacks them is refused here, before the Steam login.
          gh api -H "Accept: application/vnd.github.raw+json" "repos/$LOADER_REPO/contents/StarRupture-ModLoader-Core/hooks/game/version_map.generated.h?ref=$LOADER_REF" > base.h \
            || { echo "::error::cannot read the version map header of $LOADER_REF"; exit 2; }
          other_buildid="$OTHER_BUILDID"
          if [ -z "$other_buildid" ]; then
            other_buildid="$(node tool/.github/sr-pipeline/poll-steam.mjs --live-buildid public_test_branch)" \
              || { echo "::error::cannot read the live build id of the other Steam branch"; exit 2; }
          fi
          public_buildid="$BUILDID"
          if [ -z "$public_buildid" ]; then
            public_buildid="$(node tool/.github/sr-pipeline/poll-steam.mjs --live-buildid public)" \
              || { echo "::error::cannot read the live build id of public"; exit 2; }
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse, clOfBuild, holdsCl } from "./tool/ci/version-map.mjs";
            const [other, pub] = process.argv.slice(1);
            const map = parse(readFileSync("base.h", "utf8"), "the base header");
            const fail = (m) => { console.log("::error::first_publish is refused: " + m); process.exit(2); };
            const ocl = clOfBuild(map, other);
            if (ocl === null) fail("the base branch has no build row for build " + other + ", the build the other Steam branch runs now, so its feed would carry no rows for it");
            const h = holdsCl(map, ocl);
            if (!h.build || h.rows === 0) fail("the base branch holds no function rows for CL-" + ocl + " (build row: " + h.build + ", function rows: " + h.rows + ")");
            if (pub === other || clOfBuild(map, pub) === ocl) fail("public and the other Steam branch run the same build (" + other + "), so the feed would not carry two builds");
            console.log("The base holds " + h.rows + " function rows for CL-" + ocl + ", the build the other branch runs now.");
          ' "$other_buildid" "$public_buildid"
          echo "First publish: the base is $LOADER_REF of $LOADER_REPO and no feed is published yet."

      - name: Check the plugin list
        id: plan
        shell: pwsh
        env:
          PLUGINS: ${{ inputs.plugins }}
          # Authenticates the read-only releases lookup (unauthenticated calls share the runner address's limit); the job has no permissions.
          GH_TOKEN: ${{ github.token }}
          PLUGIN_SDK_REPO: ${{ inputs.plugin_sdk_repo }}
          GAME_SDK_REPO: ${{ inputs.game_sdk_repo }}
          EXCLUDE: ${{ inputs.plugin_exclude }}
          TEST_AUTOPILOT: ${{ inputs.test_autopilot == true && contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
          PUBLISH: ${{ inputs.publish }}
          MAP_MODE: ${{ inputs.map_mode }}
        run: |
          # Plugin code runs in the job that downloaded the client (after the
          # login cache is removed), so it only comes from known owners. The
          # Plugin SDK and the Game SDK are compiled into every plugin, so they
          # do too.
          if ($env:PLUGIN_SDK_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Plugin-SDK$') { throw "plugin_sdk_repo '$($env:PLUGIN_SDK_REPO)' is not allowed" }
          if ($env:GAME_SDK_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Game-SDK$') { throw "game_sdk_repo '$($env:GAME_SDK_REPO)' is not allowed" }
          if ($env:TEST_AUTOPILOT -eq 'true' -and ($env:PUBLISH -eq 'true' -or $env:MAP_MODE -ne 'true')) { throw 'test_autopilot needs map_mode on and publish off: a test run never publishes' }
          # owner/repo@latest-release is resolved here, through GitHub's
          # releases/latest (never a draft or a pre-release), to its tag and
          # that tag's commit. A release with exactly one DLL asset is checked
          # as that DLL (source 'release'); otherwise the tag's source is
          # built (source 'build'). A plugin that is not hosted (not
          # msantoro12's, or a release DLL) is fetched or built by the check
          # job itself and never becomes an artifact. A latest release that
          # cannot be resolved costs only that plugin (FETCH-FAILED), never
          # the plan.
          # A plugin whose owner is neither msantoro12 nor AlienXAXS (MiniMap) is not taken at its
          # latest release: it is the reviewed release in its Pin in ci/plugin-names.json (tag, and the
          # sha256 of its client DLL), the one release the rig runs too. A newer release is only
          # reported for review (the `review` output) and changes nothing that is scanned or predicted.
          # Such a plugin is never built from source here.
          $names = @(Get-Content -LiteralPath 'tool/ci/plugin-names.json' -Raw | ConvertFrom-Json | ForEach-Object { $_ })
          $trusted = @('msantoro12', 'AlienXAXS')
          $review = [Collections.Generic.List[string]]::new()
          $list = [Collections.Generic.List[object]]::new()
          $api = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          foreach ($p in ("$env:PLUGINS" -split '\s+' | Where-Object { $_ })) {
            if ($p -notmatch '^(msantoro12|AlienXAXS|LetMeInside)/(StarRupture-Plugin-[A-Za-z0-9_-]+)@([A-Za-z0-9._/-]+)$') { throw "plugin '$p' is not owner/repo@ref from an allowed owner" }
            $owner = $Matches[1]; $short = $Matches[2]; $repo = "$($Matches[1])/$short"; $ref = $Matches[3]
            $e = [ordered]@{ name = ($short -replace '^StarRupture-Plugin-', ''); source = 'build'; repo = $repo; ref = $ref; sha = ''
                             release = ''; dll = ''; asset = ''; assetSha256 = ''; error = ''; hosted = ($owner -eq 'msantoro12') }
            if ($ref -eq 'latest-release') { try {
              $e.source = 'release'; $e.hosted = $false
              $pin = $null; $entry = $null; $relPath = 'latest'
              if ($owner -cnotin $trusted) {
                $entry = @($names | Where-Object { $_.Repo -ceq $short -and $_.PSObject.Properties['Owner'] -and $_.Owner -ceq $owner }) | Select-Object -First 1
                $pin = if ($entry -and $entry.PSObject.Properties['Pin']) { $entry.Pin } else { $null }
                if (-not $pin) { throw "$repo is another author's plugin and runs only at a reviewed release: add a Pin (Tag and Digest) for it to ci/plugin-names.json" }
                $pinTag = if ($pin.PSObject.Properties['Tag']) { [string]$pin.Tag } else { '' }
                $pinDigest = if ($pin.PSObject.Properties['Digest']) { [string]$pin.Digest } else { '' }
                if ($pinTag -cnotmatch '^[A-Za-z0-9][A-Za-z0-9._+-]*$') { throw "${repo}: the Pin tag '$pinTag' is not a release tag" }
                if ($pinDigest -cnotmatch '^sha256:[0-9a-f]{64}$') { throw "${repo}: the Pin digest '$pinDigest' is not sha256:<64 lower-case hex digits>" }
                $relPath = "tags/$pinTag"
              }
              try { $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$relPath" -Headers $api -TimeoutSec 60 }
              catch { throw "$repo has no $(if ($pin) { "release $pinTag" } else { 'latest release' }) ($($_.Exception.Message))" }
              $tag = [string]$rel.tag_name
              if ($tag -notmatch '^[A-Za-z0-9._-]+$') { throw "$repo's latest release tag '$tag' is not a plain tag name" }
              if ($pin -and $tag -cne $pinTag) { throw "$repo's release for the Pin is tagged '$tag', not '$pinTag'" }
              $tagRefs = @(git ls-remote "https://github.com/$repo" "refs/tags/$tag" "refs/tags/$tag^{}")
              if ($LASTEXITCODE -ne 0) { throw "git ls-remote $repo failed (exit $LASTEXITCODE)" }
              # An annotated tag's commit is on its peeled line.
              $line = @(@($tagRefs | Where-Object { ($_ -split '\s+')[1] -eq "refs/tags/$tag^{}" }) + @($tagRefs | Where-Object { ($_ -split '\s+')[1] -eq "refs/tags/$tag" })) | Select-Object -First 1
              if (-not $line) { throw "$repo has no tag '$tag'" }
              $e.ref = $tag; $e.release = $tag; $e.sha = ($line -split '\s+')[0]
              # The Pin's release: the rig's own pick, <Asset>-Client.dll (else the one -Client.dll), and its digest is the reviewed one.
              $dlls = if ($pin) {
                $named = @($rel.assets | Where-Object { $_.name -ieq "$($entry.Asset)-Client.dll" -and $_.state -eq 'uploaded' })
                if ($named.Count) { $named } else { @($rel.assets | Where-Object { $_.name -match '-Client\.dll$' -and $_.state -eq 'uploaded' }) }
              } else { @($rel.assets | Where-Object { $_.name -match '\.dll$' -and $_.state -eq 'uploaded' }) }
              $dlls = @($dlls)
              if ($pin) {
                if ($dlls.Count -ne 1) { throw "$repo $tag has $($dlls.Count) client DLL assets (exactly one is needed); a reviewed release is never built from source" }
                $got = if ($dlls[0].PSObject.Properties['digest']) { "$($dlls[0].digest)" } else { '' }
                if ($got -cne $pinDigest) { throw "$repo ${tag}: the release's $($dlls[0].name) has the digest '$got', not the reviewed $pinDigest; the asset changed after review, so it is not checked" }
              }
              if ($dlls.Count -eq 1 -and $dlls[0].browser_download_url -match ('^https://github\.com/' + [regex]::Escape($repo) + '/releases/download/' + [regex]::Escape($tag) + '/[A-Za-z0-9._-]+\.dll$')) {
                # The URL pattern above is what later steps rely on for the asset name.
                $e.dll = [string]$dlls[0].name; $e.asset = [string]$dlls[0].browser_download_url
                # GitHub records each asset's SHA-256 at upload; the fetch checks the download against it.
                if ($dlls[0].PSObject.Properties['digest'] -and "$($dlls[0].digest)" -match '^sha256:([0-9a-f]{64})$') { $e.assetSha256 = $Matches[1] }
                else { Write-Host "::notice title=Plugin $($e.name)::GitHub recorded no SHA-256 for $($e.dll), so the download is not compared with one" }
                Write-Host "::notice title=Plugin $($e.name)::latest release $tag, checking its DLL $($e.dll)"
              } else {
                if ($pin) { throw "$repo ${tag}: the client DLL's download URL is not the release's own asset" }
                $e.source = 'build'; $e.hosted = ($owner -eq 'msantoro12')
                Write-Host "::notice title=Plugin $($e.name)::latest release $tag has $($dlls.Count) usable DLL assets (exactly one is needed), so its source at the tag is built"
              }
              if ($pin) {
                # A newer release is reported for review and never scanned. Failing to ask is not a failure of the plan.
                try { $latestTag = [string](Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers $api -TimeoutSec 60).tag_name }
                catch { $latestTag = ''; Write-Host "::warning title=Latest release not read::$($e.name): $($_.Exception.Message)" }
                if ($latestTag -and $latestTag -cne $pinTag) {
                  $shown = if ($latestTag -cmatch '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$') { $latestTag } else { 'unreadable-tag' }
                  $review.Add("$($e.name)=$shown")
                  Write-Host "::warning title=New release waiting for review::new $($e.name) release $shown waiting for review; the check scans the reviewed $pinTag"
                }
              }
            } catch {
              $e.error = $_.Exception.Message
              Write-Host "::warning title=Plugin $($e.name)::$($e.error)"
            } } elseif ($owner -cnotin $trusted) { throw "plugin '$p': $owner is allowed only as owner/repo@latest-release, which is its reviewed release" }
            $list.Add($e)
          }
          # Each ref is resolved to its commit here, before any plugin code
          # runs: the plugins job builds exactly that commit, and auto-apply
          # pushes only on top of it.
          foreach ($e in @($list | Where-Object { $_.source -eq 'build' -and -not $_.sha })) {
            if ($e.ref -match '^[0-9a-f]{40}$') { $e.sha = $e.ref; continue }
            $refs = @(git ls-remote "https://github.com/$($e.repo)" "refs/heads/$($e.ref)" "refs/tags/$($e.ref)" "refs/tags/$($e.ref)^{}")
            if ($LASTEXITCODE -ne 0) { throw "git ls-remote $($e.repo) failed (exit $LASTEXITCODE)" }
            $hit = foreach ($want in "refs/heads/$($e.ref)", "refs/tags/$($e.ref)^{}", "refs/tags/$($e.ref)") {
              $line = $refs | Where-Object { ($_ -split '\s+')[1] -eq $want } | Select-Object -First 1
              if ($line) { ($line -split '\s+')[0]; break }
            }
            if ("$hit" -notmatch '^[0-9a-f]{40}$') { throw "$($e.repo) has no branch or tag '$($e.ref)'" }
            $e.sha = "$hit"
          }
          # A plugin is left out of a run by name.
          $exclude = @("$env:EXCLUDE" -split '\s+' | Where-Object { $_ })
          foreach ($x in $exclude) {
            if ($x -notmatch '^[A-Za-z0-9_-]+$') { throw "plugin_exclude '$x' is not a plugin name" }
            if (-not @($list | Where-Object { $_.name -eq $x }).Count) { throw "plugin_exclude names '$x', which is not in plugins" }
          }
          $list = [Collections.Generic.List[object]]@($list | Where-Object { $_.name -notin $exclude })
          if ($exclude.Count) { "left out: $($exclude -join ', ')" }
          $twice = @($list | Group-Object { $_.name } | Where-Object Count -gt 1 | ForEach-Object Name)
          if ($twice.Count) { throw "listed more than once: $($twice -join ', ')" }
          $hosted = @($list | Where-Object { $_.hosted })
          $json = ConvertTo-Json -InputObject @($list) -Compress
          "matrix=$json" >> $env:GITHUB_OUTPUT
          "hosted=$(ConvertTo-Json -InputObject @($hosted) -Compress)" >> $env:GITHUB_OUTPUT
          "any=$(if ($list.Count) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "anyHosted=$(if ($hosted.Count) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "review=$($review -join ' ')" >> $env:GITHUB_OUTPUT
          $json

  plugins:
    name: plugin ${{ matrix.name }}
    needs: plugin-plan
    # Only msantoro12's plugins: another author's never go through this job or an artifact.
    if: needs.plugin-plan.outputs.anyHosted == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugin-plan.outputs.hosted) }}
    # One plugin's failure (a checkout or the build) never fails this job: the
    # failing steps below are continue-on-error, so the other legs and the jobs that
    # need this one go on. A plugin with no plugin.json gets no artifact, and the
    # check job grades it BUILD-FAILED or FETCH-FAILED, which holds that plugin alone.
    steps:
      - name: Check out the plugin
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: plugin
          persist-credentials: false

      - name: Check out the Plugin SDK
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.plugin_sdk_repo }}
          ref: ${{ inputs.plugin_sdk_ref }}
          path: plugin-sdk
          persist-credentials: false

      - name: Check out the Game SDK
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.game_sdk_repo }}
          ref: ${{ inputs.game_sdk_ref }}
          path: game-sdk
          persist-credentials: false

      - name: Check out the loader's plugin interface
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader-interface
          sparse-checkout: StarRupture-ModLoader-Core/plugins/plugin_interface.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build the plugin (Client Release)
        continue-on-error: true
        shell: pwsh
        working-directory: plugin
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
          LOADER_REPO: ${{ inputs.loader_repo }}
          PLUGIN_SDK_REPO: ${{ inputs.plugin_sdk_repo }}
          GAME_SDK_REPO: ${{ inputs.game_sdk_repo }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Built against the interface of the loader being checked, as it is in game.
          Copy-Item ..\loader-interface\StarRupture-ModLoader-Core\plugins\plugin_interface.h ..\plugin-sdk\include\plugin_interface.h -Force
          $sln = @(Get-ChildItem -File -Filter *.sln)
          if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
          $tag = if (Test-Path version) { (Get-Content version -Raw).Trim() } else { 'dev' }
          msbuild $sln[0].Name `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:Rule3Check=false `
            /p:ModLoaderBuildTag="$tag" `
            /p:GameSDKRoot="$env:GITHUB_WORKSPACE\game-sdk" `
            /p:PluginSDKInclude="$env:GITHUB_WORKSPACE\plugin-sdk\include" `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem 'build\Client Release\Plugins' -File -Filter *.dll)
          if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item $dll[0].FullName ..\out\
          # What it was built from, so the check job can rebuild it with a fix
          # applied from exactly the same sources.
          [ordered]@{ name = $env:NAME; repo = $env:REPO; ref = $env:REF; sha = (git rev-parse HEAD); dll = $dll[0].Name; tag = $tag
                      pluginSdkRepo = $env:PLUGIN_SDK_REPO; pluginSdk = (git -C ..\plugin-sdk rev-parse HEAD); gameSdkRepo = $env:GAME_SDK_REPO; gameSdk = (git -C ..\game-sdk rev-parse HEAD)
                      loaderRepo = $env:LOADER_REPO; loaderInterface = (git -C ..\loader-interface rev-parse HEAD)
                      sha256 = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content ..\out\plugin.json -Encoding utf8
          Get-Content ..\out\plugin.json

      # Rule 3, this plugin only: no direct reads of game-class members. The build ran with
      # Rule3Check=false so a finding cannot fail it; the result is out/rule3.json, and the check
      # job holds this plugin alone when it declares PLUGIN_MAP_MIGRATED and still reads
      # members directly. continue-on-error: it never fails the job, and the jobs of the other
      # plugins are separate matrix legs.
      - name: Check rule 3 (direct reads of game members)
        if: hashFiles('out/plugin.json') != ''
        continue-on-error: true
        shell: pwsh
        env:
          NAME: ${{ matrix.name }}
        run: |
          $tool = 'plugin-sdk\tools\rule3-check.mjs'
          if (-not (Test-Path $tool)) { Write-Host "::notice title=Plugin $($env:NAME)::the Plugin SDK at this ref has no rule 3 check"; exit 0 }
          New-Item -ItemType Directory -Force out | Out-Null
          node $tool --plugin $env:NAME --sdk game-sdk\Client\SDK --source plugin --mode auto --json out\rule3.json
          exit $LASTEXITCODE

      - name: Note a plugin that did not build
        if: hashFiles('out/plugin.json') == ''
        shell: pwsh
        env:
          NAME: ${{ matrix.name }}
        run: |
          Write-Host "::error title=Plugin $($env:NAME)::it did not build; the check job holds it alone on its last release and the other plugins go on"

      - name: Upload the plugin
        if: hashFiles('out/plugin.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ inputs.branch }}-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # ---- Key sources: fork builds scanned for map keys only -------------------
  # Map mode learns the function keys a plugin requests only by scanning its DLL
  # (sr-aobscan --plugin), and the field and size keys only from the source of a
  # built plugin. The plugins above are the released line, so a key that only the
  # owner's fork builds request never got a row. A key source is such a build,
  # built and scanned for its keys alone (input key_sources, msantoro12 repositories
  # only, ref pinned to a commit except the nine plugins' gss/plugin-work).
  # It is a source of observations for map mode and nothing else: it is not in
  # `plugins` (so never in plugins.json and decide's verdicts, expect_refused, the
  # rig's set, rule 3, auto-apply, staging or the feed), its artifact is
  # keysrc-<branch>-<name> (not plugin-<branch>-*, which the check job reads as the
  # plugin builds), and it is never released or published: the artifact only hands the
  # DLL to the check job, which scans it on the downloaded exe. Nothing here holds a
  # secret. A key source that fails to build or to scan does not fail map mode: the keys only it
  # requests get no rows, and the map-mode job names it in the run summary and as an alert line
  # of the pipeline-alert issue (the "Settle the key sources" step).
  key-sources-plan:
    name: key-sources-plan
    if: ${{ inputs.map_mode == true && inputs.branch && inputs.branch != 'expiry-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      any: ${{ steps.resolve.outputs.any }}
    steps:
      - name: Check the key source list
        env:
          KEY_SOURCES: ${{ inputs.key_sources }}
          GAME_SDK_REPO: ${{ inputs.game_sdk_repo }}
          LOADER_REPO: ${{ inputs.loader_repo }}
        run: |
          # Key source code is built here and run by the check job after the Steam login cache is
          # removed, so it only comes from the owner's own repositories and branches.
          node -e '
            // The list is the only input that names code to run; each entry is checked before any of it is fetched.
            const fs = require("fs");
            const NINE = ["BetterCheats", "BetterDrone", "WAILA", "Codex", "Compass", "ProductionViewer", "RuptureTimer", "WaveOptimiser", "CameraControls"];
            const WORK = "gss/plugin-work";
            // A repository that is not built the way the nine are: MiniMap needs Unreal Engine headers for its
            // readback adapter, so its key-scan build (MiniMapKeyScanOnly, no engine) is used, on the Plugin SDK
            // commit it was written against. Every other key source builds on KEY_SDK_REPO at KEY_SDK_REF (the workflow env).
            const RECIPES = {
              MiniMap: { recipe: "keyscan" },
            };
            const fail = (why) => { console.log("::error title=Key sources::" + why); process.exit(1); };
            const env = process.env;
            if (!/^(msantoro12|AlienXAXS)\/StarRupture-Game-SDK$/.test(env.GAME_SDK_REPO || "")) fail(`game_sdk_repo "${env.GAME_SDK_REPO}" is not allowed`);
            if (!/^(msantoro12|AlienXAXS)\/StarRupture-ModLoader$/.test(env.LOADER_REPO || "")) fail(`loader_repo "${env.LOADER_REPO}" is not allowed`);
            const part = "[A-Za-z0-9][A-Za-z0-9._-]*";
            const re = new RegExp("^msantoro12/StarRupture-Plugin-([A-Za-z0-9_-]+)@(" + part + "(?:/" + part + ")*)(?::([0-9a-f]{40}))?$");
            const seen = new Set();
            const entries = [];
            for (const item of (env.KEY_SOURCES || "").split(/\s+/).filter(Boolean)) {
              const m = re.exec(item);
              if (!m) fail(`key source "${item}" is not msantoro12/StarRupture-Plugin-<Name>@<branch>[:<40-digit commit>]`);
              const [, name, branch, pin] = m;
              // A branch name only: a pull request ref, a tag or a commit is never a key source.
              if (/^(refs|pull)\//.test(branch) || branch.includes("..") || /(\.lock|\.)$/.test(branch)) fail(`key source "${item}": "${branch}" is not a branch name`);
              if (!pin && !(NINE.includes(name) && branch === WORK)) fail(`key source "${item}" has no commit pin; a ref without one is allowed only for the nine plugins on ${WORK}`);
              if (seen.has(name)) fail(`key source ${name} is listed more than once`);
              seen.add(name);
              const repo = "msantoro12/StarRupture-Plugin-" + name;
              const r = RECIPES[name];
              entries.push({ name, repo, branch, pin: pin || "", tag: repo + "@" + branch, component: name + "@" + branch,
                recipe: r ? r.recipe : "standard", pluginSdkRepo: env.KEY_SDK_REPO, pluginSdkRef: env.KEY_SDK_REF });
            }
            fs.writeFileSync("key-sources-unresolved.json", JSON.stringify(entries));
            console.log(entries.length + " key source(s) accepted");
          '

      # Each branch is resolved to its commit here, before any key source code runs: the
      # key-sources job builds exactly that commit and the check job scans exactly that build.
      - name: Resolve the branches to commits
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            // Branch to commit, and the pin must lie in the branch.
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const run = (cmd, args) => execFileSync(cmd, args, { encoding: "utf8", windowsHide: true, stdio: ["ignore", "pipe", "pipe"] }).trim();
            const fail = (why) => { console.log("::error title=Key sources::" + why); process.exit(1); };
            const entries = JSON.parse(fs.readFileSync("key-sources-unresolved.json", "utf8"));
            for (const e of entries) {
              let line = "";
              try { line = run("git", ["ls-remote", "https://github.com/" + e.repo, "refs/heads/" + e.branch]); } catch (x) { fail(`git ls-remote ${e.repo} failed: ${x.message}`); }
              const [head, ref] = line.split(/\s+/);
              if (line.includes("\n") || ref !== "refs/heads/" + e.branch || !/^[0-9a-f]{40}$/.test(head)) fail(`${e.repo} has no branch ${e.branch}`);
              if (e.pin) {
                // The pin must be the branch itself or in its history: a commit that only some other ref (a pull request) carries is refused.
                if (e.pin !== head) {
                  let status = "";
                  try { status = run("gh", ["api", `repos/${e.repo}/compare/${e.pin}...${head}`, "--jq", ".status"]); } catch (x) { fail(`${e.tag}: cannot compare the pin ${e.pin} with the branch: ${x.message}`); }
                  if (status !== "ahead" && status !== "identical") fail(`${e.tag}: the pin ${e.pin} is not in the history of the branch (compare says ${status})`);
                }
                e.sha = e.pin;
              } else e.sha = head;
              delete e.pin;
              console.log(`::notice title=Key source ${e.name}::${e.tag} = ${e.sha}${e.sha !== head ? " (pinned; the branch is at " + head + ")" : ""}`);
            }
            const json = JSON.stringify(entries);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + json + "\nany=" + (entries.length ? "true" : "false") + "\n");
            console.log(json);
          '

  key-sources:
    name: key source ${{ matrix.name }}
    needs: key-sources-plan
    if: ${{ needs.key-sources-plan.outputs.any == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.key-sources-plan.outputs.matrix) }}
    # A step that fails fails this leg, and no other: the leg is continue-on-error, so the jobs after it still
    # run, and the map-mode job reads which key sources have a scan and alerts on the ones that have none.
    continue-on-error: true
    steps:
      - name: Check out the key source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: plugin
          persist-credentials: false

      - name: Check out the Plugin SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.pluginSdkRepo }}
          ref: ${{ matrix.pluginSdkRef }}
          path: plugin-sdk
          # The key-scan build reads the Game SDK that the Plugin SDK pins.
          submodules: ${{ matrix.recipe == 'keyscan' && 'recursive' || 'false' }}
          persist-credentials: false

      - name: Check out the Game SDK
        if: matrix.recipe == 'standard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.game_sdk_repo }}
          ref: ${{ inputs.game_sdk_ref }}
          path: game-sdk
          persist-credentials: false

      - name: Check out the loader's plugin interface
        if: matrix.recipe == 'standard'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader-interface
          sparse-checkout: StarRupture-ModLoader-Core/plugins/plugin_interface.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # The way the plugins job builds one (Rule3Check off: this build is only scanned for keys).
      # SR_KEY_SOURCE_BUILD is defined here and in the key-scan build below, and in no other build: it makes
      # the SDK's PLUGIN_MAP_PATTERN(p) give p, where every other build gets nullptr. CL reaches every cl.exe
      # of the step. The version tag is "keysource", so a stray key-source DLL stands out in ModLoader.log.
      - name: Build the key source (Client Release)
        if: matrix.recipe == 'standard'
        shell: pwsh
        working-directory: plugin
        env:
          CL: /DSR_KEY_SOURCE_BUILD
        run: |
          $ErrorActionPreference = 'Stop'
          # Built against the interface of the loader being checked, as it is in game.
          Copy-Item ..\loader-interface\StarRupture-ModLoader-Core\plugins\plugin_interface.h ..\plugin-sdk\include\plugin_interface.h -Force
          $sln = @(Get-ChildItem -File -Filter *.sln)
          if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
          msbuild $sln[0].Name `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:Rule3Check=false `
            /p:ModLoaderBuildTag=keysource `
            /p:GameSDKRoot="$env:GITHUB_WORKSPACE\game-sdk" `
            /p:PluginSDKInclude="$env:GITHUB_WORKSPACE\plugin-sdk\include" `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem 'build\Client Release\Plugins' -File -Filter *.dll)
          if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item $dll[0].FullName ..\out\

      # MiniMap cannot build on a hosted runner (its readback adapter needs the Unreal Engine headers).
      # MiniMapKeyScanOnly leaves the adapter out for a stub: the DLL reports <version>-keyscan and refuses
      # at PluginInit, but its key requests all run, which is what the scan reads. It is never installed,
      # never a candidate and never in the rig's set.
      - name: Build the key-scan build (Client Release)
        if: matrix.recipe == 'keyscan'
        shell: pwsh
        working-directory: plugin
        env:
          CL: /DSR_KEY_SOURCE_BUILD
        run: |
          $ErrorActionPreference = 'Stop'
          # The game build the Game SDK was generated from, when it says (the SDK commit pinned by the Plugin SDK).
          $clFile = Join-Path $env:GITHUB_WORKSPACE 'plugin-sdk\StarRupture SDK\Client\build_cl.txt'
          $cl = if (Test-Path $clFile) { (Get-Content $clFile -Raw).Trim() } else { '' }
          $clArgs = if ($cl -match '^\d+$') { @("/p:PluginGameBuiltCL=$cl") } else { Write-Host '::notice::the Game SDK names no build; the project default CL is used'; @() }
          msbuild MiniMap.sln `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:MiniMapKeyScanOnly=true `
            /p:StarRupturePluginSDKRoot="$env:GITHUB_WORKSPACE\plugin-sdk\" `
            @clArgs `
            /m /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem 'bin\x64\Client Release\plugins' -File -Filter *.dll)
          if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
          # The plugin's own version string (in its PluginInfo, not the file's version resource) ends -keyscan.
          $text = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($dll[0].FullName))
          if ($text -notmatch '\d+\.\d+\.\d+-keyscan') { throw "$($dll[0].Name) does not carry a -keyscan version: it would not refuse in game, so it is not taken" }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item $dll[0].FullName ..\out\

      - name: Record the key source
        shell: pwsh
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SHA: ${{ matrix.sha }}
          TAG: ${{ matrix.tag }}
          RECIPE: ${{ matrix.recipe }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = @(Get-ChildItem out -File -Filter *.dll)
          if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
          $head = git -C plugin rev-parse HEAD
          if ($head -cne $env:SHA) { throw "checked out $head, not the planned commit $($env:SHA)" }
          [ordered]@{ name = $env:NAME; repo = $env:REPO; branch = $env:BRANCH; sha = $head; tag = $env:TAG; recipe = $env:RECIPE; dll = $dll[0].Name
                      pluginSdk = (git -C plugin-sdk rev-parse HEAD)
                      sha256 = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content out\key-source.json -Encoding utf8
          Get-Content out\key-source.json

      - name: Upload the key source (for the scan in the check job only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keysrc-${{ inputs.branch }}-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 1

      - name: Name the failed key source
        if: failure()
        shell: pwsh
        env:
          TAG: ${{ matrix.tag }}
        run: |
          Write-Host "::error title=Key source $($env:TAG)::it did not build; map mode goes on without the keys only it requests, and says so in the summary and the alert"

  # ---- Job A: Steam login, download, offline checks ------------------------
  # The only job that can read the login secret: environment steam-client,
  # contents: read. The login cache is deleted from the runner before the
  # scanner runs; the only checkout is this repository's apply tool, after it.
  check:
    name: check
    needs: [build, plugin-plan, plugins, key-sources-plan, key-sources]
    # A plugin that does not build fails only itself, not the client check.
    # A first publish or a stored-reference run that plugin-plan refused never reaches the Steam login.
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.first_publish != true || needs.plugin-plan.result == 'success') && (inputs.stored_reference != true || needs.plugin-plan.result == 'success') && inputs.branch && inputs.branch != 'expiry-only' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: steam-client
    permissions:
      contents: read
    concurrency:
      group: sr-client-check-${{ inputs.branch }}
      cancel-in-progress: false
    outputs:
      autofix: ${{ steps.fix.outputs.autofix }}
    env:
      BRANCH: ${{ inputs.branch }}
      EXPECTED_BUILDID: ${{ inputs.buildid }}
    steps:
      # Without the login there is nothing to check: fail with the cause, never skip green.
      - name: Check the Steam login secrets are set
        id: gate
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.STEAM_CI_LOGIN_CACHE != '' && secrets.STEAM_CI_USERNAME != '' }}
          CALLED: ${{ !contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if ($env:HAS_LOGIN -eq 'true') {
            "has_login=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "has_login=false" >> $env:GITHUB_OUTPUT
          $reason = if ($env:CALLED -eq 'true') {
            'the Steam login secrets reached the called check empty: the calling job must pass STEAM_CI_USERNAME and STEAM_CI_LOGIN_CACHE by name under secrets:, and environment steam-client must hold them'
          } else {
            'environment steam-client has no STEAM_CI_USERNAME or STEAM_CI_LOGIN_CACHE: run steam-ci-login.ps1 once to set it up'
          }
          Write-Host "::error title=No Steam login::The client build was not checked: $reason."
          [ordered]@{ schema = 1; status = 'no-login'; branch = $env:BRANCH; expectedBuildid = $env:EXPECTED_BUILDID; reason = $reason } |
            ConvertTo-Json | Set-Content out\result.json -Encoding utf8
          exit 1

      - name: Download the client build
        id: dl
        if: steps.gate.outputs.has_login == 'true'
        timeout-minutes: 70
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $dl = [ordered]@{ login = 'not tried'; step0 = ''; installed = $false; reason = ''; detail = ''; installDir = '';
                            buildid = ''; betaKey = ''; attempts = 0; seconds = 0; sizeOnDisk = ''; cacheRewritten = $null }
          $failed = $false
          $root = 'C:\steamcmd'
          try {
            if ($env:BRANCH -notmatch '^[A-Za-z0-9_]+$') { throw "bad branch name '$env:BRANCH'" }
            $user = "$env:STEAM_USER".Trim()
            if ($user -notmatch '^[A-Za-z0-9_]{3,64}$') { throw 'STEAM_CI_USERNAME is not a valid Steam account name' }
            Write-Host "::add-mask::$user"
            # Cut from every steamcmd line, so it cannot reach result.json or the PR.
            $userRx = '(?i)' + [regex]::Escape($user)

            # Valve's steamcmd, checked to be Valve-signed before and after
            # its self-update.
            New-Item -ItemType Directory -Force $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
            Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath $root -Force
            $steamcmd = Join-Path $root 'steamcmd.exe'
            function Assert-ValveSigned {
              $sig = Get-AuthenticodeSignature $steamcmd
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -cnotmatch '^CN=Valve(?: Corp\.)?, (?:OU=[^,"]+, )?O=Valve(?: Corp\.)?, (?:L=Bellevue, )?S=Washington, C=US$') {
                throw "steamcmd.exe is not Valve-signed (status $($sig.Status))"
              }
            }
            Assert-ValveSigned
            Write-Host '::group::steamcmd self-update'
            & $steamcmd +quit | ForEach-Object { Write-Host $_ }
            Write-Host "self-update exit code: $LASTEXITCODE"
            Write-Host '::endgroup::'
            Assert-ValveSigned

            # Restore the saved login cache. GitHub masks the secret as
            # stored (base64); the decoded token values are masked here.
            try { $bytes = [Convert]::FromBase64String("$env:STEAM_CACHE".Trim()) }
            catch { $dl.reason = 'cache-unreadable'; throw 'STEAM_CI_LOGIN_CACHE is not base64' }
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            foreach ($m in [regex]::Matches($text, '"[^"\r\n]*"[ \t]+"([^"\r\n]{16,})"')) { Write-Host "::add-mask::$($m.Groups[1].Value)" }
            if ($text -notmatch '"ConnectCache"') {
              $dl.reason = 'cache-unreadable'
              throw 'STEAM_CI_LOGIN_CACHE is not a steamcmd config.vdf with a ConnectCache entry'
            }
            $cfgDir = Join-Path $root 'config'
            New-Item -ItemType Directory -Force $cfgDir | Out-Null
            $cfg = Join-Path $cfgDir 'config.vdf'
            [IO.File]::WriteAllBytes($cfg, $bytes)
            $text = $null; $bytes = $null
            $hashBefore = (Get-FileHash $cfg).Hash

            $vol = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free } | Sort-Object Free -Descending | Select-Object -First 1
            $install = Join-Path $vol.Root 'sr-client'
            New-Item -ItemType Directory -Force $install | Out-Null
            $dl.installDir = $install
            Write-Host ("Installing to {0} ({1:N1} GB free)" -f $install, ($vol.Free / 1GB))

            # The branch is always named, public included: steamcmd otherwise
            # installs the branch it last used for the app.
            $cmd = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                     '+force_install_dir', $install, '+login', $user, '+app_update', $env:APP_ID, '-beta', $env:BRANCH, '+quit')
            # What an install really is, from its manifest: the branch Steam
            # mounted (MountedConfig BetaKey) and the build id.
            function Read-Manifest([string]$path) {
              $acf = Get-Content $path -Raw
              $mounted = if ($acf -match '"MountedConfig"\s*\{([^{}]*)\}') { $Matches[1] } else { '' }
              [ordered]@{
                betaKey = if ($mounted -match '"BetaKey"\s+"([^"]*)"') { $Matches[1] } else { '' }
                buildid = if ($acf -match '"buildid"\s+"(\d+)"') { $Matches[1] } else { '' }
                size    = if ($acf -match '"SizeOnDisk"\s+"(\d+)"') { $Matches[1] } else { '0' }
              }
            }

            $manifest = Join-Path $install "steamapps\appmanifest_$($env:APP_ID).acf"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $installed = $false
            for ($i = 1; $i -le 3 -and -not $installed; $i++) {
              $dl.attempts = $i
              Write-Host "::group::steamcmd attempt $i of 3"
              $lines = [Collections.Generic.List[string]]::new()
              $lastBucket = -1
              & $steamcmd @cmd 2>&1 | ForEach-Object {
                # Account ids out of the log (the account name is masked).
                $line = "$_" -replace '\[U:1:\d+\]', '[U:1:***]' -replace '7656119\d{10}', '***' -replace $userRx, '***'
                $lines.Add($line)
                if ($line -match 'progress:\s+([\d.]+)') {
                  $bucket = [int]([double]$Matches[1] / 10)
                  if ($bucket -ne $lastBucket) { $lastBucket = $bucket; Write-Host ("[{0:N0}s] {1}" -f $sw.Elapsed.TotalSeconds, $line) }
                } else { Write-Host $line }
              }
              $code = $LASTEXITCODE
              Write-Host "steamcmd exit code: $code after $([int]$sw.Elapsed.TotalSeconds) s"
              Write-Host '::endgroup::'
              $all = $lines -join "`n"
              $loginOk = $all -match 'to Steam Public\.\.\.OK|Waiting for user info\.\.\.OK'
              $installed = ($code -eq 0) -and (Test-Path $manifest) -and ((Get-Content $manifest -Raw) -match '"StateFlags"\s+"4"')
              if ($loginOk -or $installed) { $dl.login = 'ok' }
              if ($installed) { $dl.installed = $true; $dl.reason = ''; $dl.detail = ''; break }
              $errLine = ($lines | Where-Object { $_ -match 'FAILED|ERROR|Invalid Password|Logon Denied|Guard|Rate Limit|No subscription|license' } | Select-Object -First 1)
              $dl.detail = "$errLine".Trim() -replace '\|', '/'
              if ($dl.login -ne 'ok') {
                # Login failures are never retried: a retry cannot fix the
                # token and repeated attempts get the account rate-limited.
                $dl.login = 'failed'
                $dl.reason = if ($all -match 'Rate Limit') { 'rate-limited' } else { 'login-rejected' }
                break
              }
              if ($all -match 'No subscription|missing license|No license') { $dl.reason = 'no-license'; break }
              $dl.reason = 'download-failed'
            }
            $sw.Stop()
            $dl.seconds = [int]$sw.Elapsed.TotalSeconds
            $dl.cacheRewritten = ((Get-FileHash $cfg).Hash -ne $hashBefore)

            switch ($dl.login) {
              'ok' { $dl.step0 = 'PASS'; Write-Host 'STEP0 PASS: the restored login cache was accepted on a fresh runner (no password, no Steam Guard code).' }
              default {
                if ($dl.reason -eq 'rate-limited') {
                  $dl.step0 = 'UNDECIDED'; Write-Host 'STEP0 UNDECIDED: Steam rate-limited the login before it could use the cache; re-run later.'
                } else {
                  $dl.step0 = 'FAIL'; Write-Host "STEP0 FAIL: the restored login cache was NOT accepted on a fresh runner ($($dl.detail))."
                }
              }
            }
            Write-Host ("Login cache after the login: {0}" -f $(if ($dl.cacheRewritten) { 'rewritten by steamcmd (the saved secret is unchanged)' } else { 'unchanged' }))

            if (-not $installed) {
              $failed = $true
              switch ($dl.reason) {
                'login-rejected' { Write-Host "::error title=Steam login::login expired, run steam-ci-login.ps1 -Renew (Steam rejected the saved CI login: $($dl.detail))" }
                'rate-limited'   { Write-Host "::error title=Steam login::Steam rate-limited the CI login. Not a token problem: re-run this check later." }
                'no-license'     { Write-Host "::error title=Steam license::The CI Steam account logged in but does not own StarRupture (app $($env:APP_ID))." }
                default          { Write-Host "::error title=Steam download::Logged in, but the download failed after $($dl.attempts) attempts ($($dl.detail))." }
              }
            } else {
              $mf = Read-Manifest $manifest
              $dl.buildid = $mf.buildid
              $dl.sizeOnDisk = $mf.size
              $dl.betaKey = $mf.betaKey
              if ($mf.betaKey -ne $env:BRANCH -or -not $mf.buildid) {
                $dl.installed = $false
                $dl.reason = 'wrong-branch'
                $dl.detail = "the manifest says branch '$($mf.betaKey)', build '$($mf.buildid)'"
                throw "Steam installed the wrong thing for branch $($env:BRANCH): $($dl.detail)"
              }
              Write-Host "Installed build $($dl.buildid) of branch $($mf.betaKey) ($([math]::Round([double]$dl.sizeOnDisk / 1GB, 1)) GB on disk) in $($dl.seconds) s"
              if ($env:EXPECTED_BUILDID -and $dl.buildid -ne $env:EXPECTED_BUILDID) {
                Write-Host "::warning::Steam installed build $($dl.buildid), the watcher saw $($env:EXPECTED_BUILDID); the branch moved again. The check covers $($dl.buildid)."
              }
              "install_dir=$install" >> $env:GITHUB_OUTPUT

              # The build players run today, for the pattern proposals
              # (sr-aobscan --suggest --reference): it finds the function a
              # failing pattern lands on now, and lets one pattern serve both
              # builds. The login cache is gone once this step ends, so it is
              # fetched here; a failure costs only the both-builds proposals.
              if ($env:BRANCH -ne 'public') {
                try {
                  $refDir = Join-Path $vol.Root 'sr-ref'
                  New-Item -ItemType Directory -Force $refDir | Out-Null
                  $refCmd = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                              '+force_install_dir', $refDir, '+login', $user, '+app_update', $env:APP_ID, '-beta', 'public', '+quit')
                  $refManifest = Join-Path $refDir "steamapps\appmanifest_$($env:APP_ID).acf"
                  $refWatch = [Diagnostics.Stopwatch]::StartNew()
                  Write-Host '::group::steamcmd: the public build, for the pattern proposals'
                  & $steamcmd @refCmd 2>&1 | ForEach-Object {
                    $line = "$_" -replace '\[U:1:\d+\]', '[U:1:***]' -replace '7656119\d{10}', '***' -replace $userRx, '***'
                    if ($line -notmatch 'progress:') { Write-Host $line }
                  }
                  $refCode = $LASTEXITCODE
                  Write-Host '::endgroup::'
                  $refOk = ($refCode -eq 0) -and (Test-Path $refManifest) -and ((Get-Content $refManifest -Raw) -match '"StateFlags"\s+"4"')
                  $dl.reference = [ordered]@{ installed = $false; reason = ''; buildid = ''; betaKey = ''; seconds = [int]$refWatch.Elapsed.TotalSeconds }
                  $rm = if ($refOk) { Read-Manifest $refManifest } else { $null }
                  if ($rm) { $dl.reference.buildid = $rm.buildid; $dl.reference.betaKey = $rm.betaKey }
                  if (-not $refOk) {
                    $dl.reference.reason = 'download-failed'
                    Write-Host "::warning title=Pattern proposals::The public build did not download (steamcmd exit $refCode); proposals cover this build only."
                  } elseif ($rm.betaKey -ne 'public' -or -not $rm.buildid) {
                    # A reference that is not the build players run would make
                    # every both-builds claim, and every auto-apply, wrong.
                    $dl.reference.reason = 'wrong-branch'
                    Write-Host "::error title=Pattern proposals::The reference download is not the public build (its manifest says branch '$($rm.betaKey)', build '$($rm.buildid)'). It is dropped: proposals cover this build only, and nothing is auto-applied against it."
                  } elseif ($rm.buildid -eq $dl.buildid) {
                    $dl.reference.reason = 'same-build'
                    Write-Host "::notice title=Pattern proposals::public is the same build ($($dl.buildid)); proposals cover this build only."
                  } else {
                    $dl.reference.installed = $true
                    Write-Host "Installed the public build $($rm.buildid) (branch $($rm.betaKey)) in $($dl.reference.seconds) s"
                    "reference_dir=$refDir" >> $env:GITHUB_OUTPUT
                  }
                } catch {
                  Write-Host '::endgroup::'
                  $dl.reference = [ordered]@{ installed = $false; reason = 'error'; buildid = ''; betaKey = ''; seconds = 0 }
                  $why = "$($_.Exception.Message)" -replace $userRx, '***'
                  Write-Host "::warning title=Pattern proposals::The public build did not download ($why); proposals cover this build only."
                }
              }
            }
          } catch {
            $failed = $true
            if (-not $dl.reason) { $dl.reason = 'error' }
            if ($dl.reason -eq 'cache-unreadable') {
              Write-Host "::error title=Steam login::$($_.Exception.Message). Run steam-ci-login.ps1 (without -Renew) to save a fresh login."
            } else {
              Write-Host "::error::$($_.Exception.Message)"
            }
          } finally {
            $dl | ConvertTo-Json | Set-Content out\download.json -Encoding utf8
          }
          if ($failed) { exit 1 }

      - name: Remove the login cache from the runner
        id: cleanup
        if: always() && steps.gate.outputs.has_login == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\steamcmd -ErrorAction SilentlyContinue
          if (Test-Path C:\steamcmd) { Write-Host '::error::C:\steamcmd could not be removed'; exit 1 }
          'steamcmd and its login cache are removed from the runner.'

      - name: Download the scanner
        if: steps.dl.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sr-aobscan-client-${{ inputs.branch }}
          path: scanner

      - name: Check the client build
        id: scan
        if: steps.dl.outcome == 'success'
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
          SDK_OFFSETS: ${{ needs.build.outputs.sdk_offsets }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
          MAP_MODE: ${{ inputs.map_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $warnings = [Collections.Generic.List[string]]::new()
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $pv = [string]$exe.VersionInfo.ProductVersion
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "exe: $($exe.FullName.Substring($env:INSTALL_DIR.Length))"
          "SHA-256=$sha"

          # Proposals for failing patterns use the public build (when this is
          # another branch) and the PDB shipped next to each exe.
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          $refPv = if ($refExe) { [string]$refExe.VersionInfo.ProductVersion } else { '' }
          if ($refExe) { "Reference (public build): ProductVersion=$refPv" }
          foreach ($e in @(@($exe) + @($refExe) | Where-Object { $_ })) {
            $pdb = [IO.Path]::ChangeExtension($e.FullName, '.pdb')
            $which = if ($refExe -and $e.FullName -eq $refExe.FullName) { 'public build' } else { 'this build' }
            "PDB ($which): $(if (Test-Path $pdb) { '{0:N1} GB' -f ((Get-Item $pdb).Length / 1GB) } else { 'absent' })"
          }

          $scanner = 'scanner\sr-aobscan-client.exe'
          $scannerSha = (Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($scannerSha -ne $env:SCANNER_SHA256) { throw "sr-aobscan-client.exe hash $scannerSha is not the one build-scanner made ($($env:SCANNER_SHA256))" }
          & $scanner $exe.FullName --verbose @suggest *> out\scanner.txt
          & $scanner $exe.FullName --json @suggest > out\scanner.json
          $scanCode = $LASTEXITCODE
          Get-Content out\scanner.txt | Write-Host
          $scan = Get-Content out\scanner.json -Raw | ConvertFrom-Json

          # The loader's version gate. A required CL (kRequiredVersionSuffix)
          # must end the ProductVersion; a scanner built from a loader with a
          # version map reports that loader's own verdict. Every gate the
          # loader has must pass, and at least one must be there.
          $gates = [Collections.Generic.List[bool]]::new()
          $required = [Collections.Generic.List[string]]::new()
          if ($env:REQUIRED_CL) {
            $gates.Add([bool]($pv -and $pv.EndsWith($env:REQUIRED_CL)))
            $required.Add($env:REQUIRED_CL)
          }
          if ($scan.PSObject.Properties['exe'] -and $scan.exe.PSObject.Properties['supported']) {
            $gates.Add($scan.exe.supported -is [bool] -and $scan.exe.supported)
            $required.Add((@($scan.exe.supportedBuilds) | ForEach-Object { "CL-$_" }) -join ' or ')
          }
          $clOk = $gates.Count -gt 0 -and -not ($gates -contains $false)
          $requiredCl = if ($required.Count) { $required -join ' and ' } else { 'no gate found' }
          "ProductVersion=$pv required=$requiredCl match=$clOk"

          $notOk =@($scan.patterns | Where-Object { $_.result -ne 'OK' } |
            ForEach-Object {
              $o = [ordered]@{ name = $_.name; required = $_.required; result = $_.result }
              if ($_.PSObject.Properties['suggest']) { $o.suggest = $_.suggest }
              $o })
          foreach ($p in $notOk) { if (-not $p.required) { $warnings.Add("optional pattern $($p.name): $($p.result)") } }

          # The Game-SDK globals. GObjects and AppendString must equal the
          # SDK's Offsets::; the SDK's GNames and GWorld are not the engine
          # globals (see the SDK's Basic.hpp disclaimer), so those two are
          # shown for information only.
          $sdk = $env:SDK_OFFSETS | ConvertFrom-Json
          $names = [ordered]@{ GObjects = 'GObjects (GUObjectArray.ObjObjects)'; AppendString = 'FName::AppendString';
                               GNames = 'GNames (NamePoolData)'; GWorld = 'GWorld' }
          $globals = foreach ($k in $names.Keys) {
            $row = $scan.patterns | Where-Object { $_.name -eq $names[$k] } | Select-Object -First 1
            $rva = if ($row -and $row.result -eq 'OK' -and $row.PSObject.Properties['rva']) { [Convert]::ToInt64(($row.rva -replace '^0x', ''), 16) } else { $null }
            $sdkv = if ($sdk.$k) { [Convert]::ToInt64(($sdk.$k -replace '^0x', ''), 16) } else { $null }
            $byDesign = $k -in 'GNames', 'GWorld'
            $match = if ($null -ne $rva -and $null -ne $sdkv) { $rva -eq $sdkv } else { $null }
            if ($null -eq $rva) { $warnings.Add("SDK global $k did not resolve ($(if ($row) { $row.result } else { 'not in the registry' }))") }
            elseif (-not $byDesign -and $match -eq $false) { $warnings.Add(("SDK Offsets::{0} is 0x{1:X}, this build has 0x{2:X}: the Game SDK needs a fresh dump" -f $k, $sdkv, $rva)) }
            [ordered]@{ name = $k; result = $(if ($row) { $row.result } else { 'absent' });
                        rva = $(if ($null -ne $rva) { '0x{0:X}' -f $rva } else { '' });
                        sdk = $(if ($null -ne $sdkv) { '0x{0:X}' -f $sdkv } else { '' });
                        match = $match; informational = $byDesign }
          }

          # A build the loader does not run on yet is what map mode exists to
          # measure: with map mode on, a version gate that says no, on a build
          # that names its CL, is a new build and not a failure. Without map
          # mode the released loader cannot run it, and the check fails. No
          # gate found at all, or a ProductVersion without a CL, stays a
          # failure either way, and so does every other gate.
          $newBuild = ($env:MAP_MODE -eq 'true') -and ($gates.Count -gt 0) -and ($gates -contains $false) -and ($pv -match 'CL-(\d+)$')
          $fail = ((-not $clOk) -and (-not $newBuild)) -or ($scanCode -ne 0)
          [ordered]@{
            exe = [ordered]@{ productVersion = $pv; cl = $(if ($pv -match 'CL-(\d+)$') { $Matches[1] } else { '' }); requiredCl = $requiredCl; clOk = $clOk; newBuild = $newBuild; sha256 = $sha }
            reference = $(if ($refExe) { [ordered]@{ productVersion = $refPv; cl = $(if ($refPv -match 'CL-(\d+)$') { $Matches[1] } else { '' }) } } else { $null })
            scan = [ordered]@{ exitCode = $scanCode; summary = $scan.summary; notOk = $notOk
                     suggest = $(if ($scan.PSObject.Properties['suggest']) { $scan.suggest } else { $null }) }
            sdkGlobals = @($globals)
            warnings = @($warnings)
            fail = $fail
          } | ConvertTo-Json -Depth 12 | Set-Content out\checks.json -Encoding utf8
          foreach ($w in $warnings) { Write-Host "::warning::$w" }
          if ($newBuild) { Write-Host "::notice title=New build::ProductVersion '$pv' is not a build the loader runs on yet ($requiredCl); map mode measures it." }
          elseif (-not $clOk) { Write-Host "::error::ProductVersion '$pv' is not a build the loader runs on ($requiredCl)" }
          if ($scanCode -ne 0) { Write-Host "::error::sr-aobscan exit code $scanCode ($($scan.summary.requiredFailing) required patterns failing)" }
          if ($fail) { exit 1 }

      # Map mode: the function keys no scanned DLL asks for still need a row on this
      # build. The scanner re-resolves each of them on this exe with the pattern of
      # its newest earlier row, as the loader does at run time (sr-aobscan --carry,
      # against the header the candidate is cut from); map-mode's assemble turns
      # the report into rows. Data only: the header is read, no code from it runs.
      - name: Check out the base header
        if: steps.scan.outcome == 'success' && steps.cleanup.outcome == 'success' && inputs.map_mode == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ needs.build.outputs.loader_sha }}
          path: base-loader
          sparse-checkout: StarRupture-ModLoader-Core/hooks/game/version_map.generated.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Carry the version map's keys onto this build
        id: carry
        if: steps.scan.outcome == 'success' && steps.cleanup.outcome == 'success' && inputs.map_mode == true
        timeout-minutes: 15
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
          # A dispatched test run measures a CL the header already holds rows for (map-mode write --remeasure): the carry leaves them out the same way.
          TEST_AUTOPILOT: ${{ inputs.test_autopilot == true && inputs.publish != true && contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          if ([string]$exe.VersionInfo.ProductVersion -notmatch 'CL-(\d+)$') { throw "ProductVersion '$($exe.VersionInfo.ProductVersion)' names no CL" }
          $cl = $Matches[1]
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          $map = 'base-loader\StarRupture-ModLoader-Core\hooks\game\version_map.generated.h'
          $scanArgs = @($exe.FullName, '--carry', '--map', $map, '--cl', $cl)
          if ($env:TEST_AUTOPILOT -eq 'true') { $scanArgs += @('--ignore-cl', $cl) }
          New-Item -ItemType Directory -Force out | Out-Null
          $ErrorActionPreference = 'Continue'
          & $scanner @scanArgs > out\carry.json 2> out\carry.txt
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Get-Content out\carry.txt | Write-Host
          # The scanner exits 0 whenever it wrote a report, whatever the keys did: the report decides.
          $report = $null
          try { $report = Get-Content out\carry.json -Raw | ConvertFrom-Json } catch { }
          $has = { param($name) $report -is [pscustomobject] -and $report.PSObject.Properties[$name] }
          if (-not ((& $has 'kind') -and $report.kind -eq 'carry' -and (& $has 'cl') -and [string]$report.cl -eq $cl -and (& $has 'rows') -and (& $has 'summary'))) {
            Write-Host "::error title=Carry scan::sr-aobscan --carry wrote no carry report for CL-$cl (exit $code); the keys no plugin requested would get no row"
            exit 1
          }
          "carry: $($report.summary | ConvertTo-Json -Compress)"

      # Plugin code never runs while the login cache could still be on disk.
      - name: Download the plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-${{ inputs.branch }}-*
          path: plugins

      # A plugin that is not hosted in the plan (another author's, or a release
      # DLL) is never built or stored by the plugins job: it is fetched or
      # built here, after the login cache is gone, into the runner's disk only
      # (not an artifact).
      # The files land where the download above puts the others, so the
      # check below treats them alike.
      - name: Get the other authors' plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          PLUGIN_SDK_REPO: ${{ inputs.plugin_sdk_repo }}
          PLUGIN_SDK_REF: ${{ inputs.plugin_sdk_ref }}
          GAME_SDK_REPO: ${{ inputs.game_sdk_repo }}
          GAME_SDK_REF: ${{ inputs.game_sdk_ref }}
          LOADER_REPO: ${{ inputs.loader_repo }}
          LOADER_REF: ${{ inputs.loader_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The token only reads public repositories' commit ids; the build below never sees it.
          $token = $env:GH_TOKEN
          Remove-Item Env:GH_TOKEN
          function Invoke-Native([string]$what) {
            if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" }
          }
          # Source at an exact revision, bytes as committed.
          function Get-Source([string]$repo, [string]$rev, [string]$dir) {
            git -c init.defaultBranch=main init -q $dir; Invoke-Native "git init $dir"
            git -C $dir config core.autocrlf false
            git -C $dir fetch -q --depth 1 "https://github.com/$repo" $rev; Invoke-Native "fetching $repo $rev"
            git -C $dir checkout -q FETCH_HEAD; Invoke-Native "checking out $repo $rev"
            (git -C $dir rev-parse HEAD)
          }
          $msbuild = $null
          foreach ($p in @($env:PLAN | ConvertFrom-Json | Where-Object { -not $_.hosted })) {
            # One plugin's problem never stops the others; a plugin left without plugin.json is reported as not fetched or not built.
            try {
              $dir = "plugins\plugin-$($env:BRANCH)-$($p.name)"
              New-Item -ItemType Directory -Force $dir | Out-Null
              if ($p.source -eq 'release') {
                if (-not $p.asset) { throw "the latest release was not resolved: $($p.error)" }
                # The release's DLL asset, as players download it.
                Invoke-WebRequest -Uri $p.asset -OutFile "$dir\$($p.dll)" -TimeoutSec 120
                $hash = (Get-FileHash "$dir\$($p.dll)" -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($p.assetSha256 -and $hash -ne $p.assetSha256) { throw "$($p.dll) does not match the SHA-256 GitHub recorded for the asset" }
                [ordered]@{ name = $p.name; repo = $p.repo; ref = $p.ref; sha = $p.sha; dll = $p.dll; sha256 = $hash } |
                  ConvertTo-Json | Set-Content "$dir\plugin.json" -Encoding utf8
                continue
              }
              # Built the way the plugins job builds one, from the planned commit.
              $work = Join-Path $env:RUNNER_TEMP "third\$($p.name)"
              $sha = Get-Source $p.repo $p.sha "$work\src"
              if ($sha -ne $p.sha) { throw "checked out $sha, not the planned commit $($p.sha)" }
              $psdk = Get-Source $env:PLUGIN_SDK_REPO $env:PLUGIN_SDK_REF "$work\plugin-sdk"
              $gsdk = Get-Source $env:GAME_SDK_REPO $env:GAME_SDK_REF "$work\game-sdk"
              $loader = (Invoke-RestMethod -Uri "https://api.github.com/repos/$($env:LOADER_REPO)/commits/$($env:LOADER_REF)" -TimeoutSec 60 -Headers @{ Authorization = "Bearer $token" }).sha
              if ($loader -notmatch '^[0-9a-f]{40}$') { throw "no commit for $($env:LOADER_REPO)@$($env:LOADER_REF)" }
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$($env:LOADER_REPO)/$loader/StarRupture-ModLoader-Core/plugins/plugin_interface.h" `
                -OutFile "$work\plugin-sdk\include\plugin_interface.h" -TimeoutSec 60
              $sln = @(Get-ChildItem "$work\src" -File -Filter *.sln)
              if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
              if (-not $msbuild) { $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1 }
              $tag = if (Test-Path "$work\src\version") { (Get-Content "$work\src\version" -Raw).Trim() } else { 'dev' }
              & $msbuild $sln[0].FullName `
                /p:Configuration="Client Release" `
                /p:Platform=x64 `
                /p:PostBuildEventUseInBuild=false `
                /p:Rule3Check=false `
                /p:ModLoaderBuildTag="$tag" `
                /p:GameSDKRoot="$work\game-sdk" `
                /p:PluginSDKInclude="$work\plugin-sdk\include" `
                /m /p:CL_MP=true /nodeReuse:false /v:minimal | Out-Host
              Invoke-Native 'msbuild'
              $dll = @(Get-ChildItem "$work\src\build\Client Release\Plugins" -File -Filter *.dll)
              if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
              Copy-Item $dll[0].FullName $dir
              [ordered]@{ name = $p.name; repo = $p.repo; ref = $p.ref; sha = $sha; dll = $dll[0].Name; tag = $tag
                          pluginSdkRepo = $env:PLUGIN_SDK_REPO; pluginSdk = $psdk; gameSdkRepo = $env:GAME_SDK_REPO; gameSdk = $gsdk; loaderRepo = $env:LOADER_REPO; loaderInterface = $loader
                          sha256 = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } |
                ConvertTo-Json | Set-Content "$dir\plugin.json" -Encoding utf8
            } catch {
              Write-Host "::error title=Plugin $($p.name)::$($_.Exception.Message)"
              Remove-Item "plugins\plugin-$($env:BRANCH)-$($p.name)\plugin.json" -ErrorAction SilentlyContinue
            }
          }

      - name: Check the plugins' patterns
        id: plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        # A plugin that hangs must not hold up the loader's result.
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # Per plugin: PASS when the loader would let it load; GAME-CALL (partial
          # coverage, never a full pass) when every pattern resolved before the
          # first call into game code, which cannot run offline and was stopped; FAIL when any pattern it resolves
          # does not (the loader refuses a plugin on any recorded failure);
          # CRASH; REFUSED (interface version outside the loader's range); NONE
          # (no OnPluginLoadHooks); RULE3 (it declares PLUGIN_MAP_MIGRATED and still reads game
          # members directly: held alone, like REFUSED); BUILD-FAILED or FETCH-FAILED; ERROR. Only the
          # plugin fails; the loader's status does not change.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          $results = foreach ($p in ($env:PLAN | ConvertFrom-Json)) {
            $r = [ordered]@{ name = $p.name; source = $p.source; repo = $p.repo; ref = $p.ref; sha = ''; release = $p.release }
            # One plugin's problem never stops the others.
            try {
              $dir = "plugins\plugin-$($env:BRANCH)-$($p.name)"
              $meta = if (Test-Path "$dir\plugin.json") { Get-Content "$dir\plugin.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $meta) {
                $r.verdict = if ($p.source -eq 'release') { 'FETCH-FAILED' } else { 'BUILD-FAILED' }
                Write-Host "::error title=Plugin $($p.name)::$(if ($p.source -eq 'release') { 'its released DLL could not be fetched' } else { 'did not build' }), so its patterns were not checked"
                $r; continue
              }
              $r.ref = $meta.ref
              $r.sha = $meta.sha
              $dll = Join-Path $dir $meta.dll
              if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.sha256) { throw "$($meta.dll) is not the DLL the plugin job made" }
              $stem = "out\plugin-$($p.name)"
              $ErrorActionPreference = 'Continue'
              & $scanner $exe.FullName --plugin $dll --json @suggest > "$stem.json" 2> "$stem.txt"
              $r.exitCode = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              Get-Content "$stem.txt" | Write-Host
              $scan = if ($r.exitCode -ne 2 -and (Test-Path "$stem.json") -and (Get-Item "$stem.json").Length) { Get-Content "$stem.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $scan) { throw "sr-aobscan could not run it (exit $($r.exitCode)); see out/plugin-$($p.name).txt" }
              $r.plugin = $scan.plugin
              $r.verdict = $scan.verdict
              $r.summary = $scan.summary
              foreach ($k in 'note', 'crash', 'gameCalls') { if ($scan.PSObject.Properties[$k]) { $r[$k] = $scan.$k } }
              $r.patterns = @($scan.patterns | ForEach-Object {
                $o = [ordered]@{ name = $(if ($_.name) { $_.name } else { "(raw) $($_.pattern)" }); call = $_.call; kind = $_.kind
                                 required = $_.required; recorded = $_.recorded; result = $_.result }
                if ($_.PSObject.Properties['suggest']) { $o.suggest = $_.suggest }
                if ($_.PSObject.Properties['ownPattern']) { $o.ownPattern = $_.ownPattern }
                $o })
              # The refused requests (the scanner's "[Map] <plugin>: <key>: refused: <why>" lines),
              # unless the scanner lists them itself. decide names them instead of the probe note.
              $r.failures = if ($scan.PSObject.Properties['failures']) { @($scan.failures) } else {
                @(Get-Content "$stem.txt" | ForEach-Object {
                  if ($_ -match ('^\[Map\] ' + [regex]::Escape($p.name) + ': (.+?): (refused: .+)$')) { [ordered]@{ name = $Matches[1]; detail = $Matches[2]; required = $true } }
                })
              }
              foreach ($row in @($scan.patterns | Where-Object { $_.recorded -and $_.result -ne 'OK' })) {
                Write-Host "::error title=Plugin $($p.name)::$($row.name): $($row.result)$(if ($row.required) { '' } else { ' (declared optional; the loader still refuses the plugin)' })"
              }
              # Rule 3 (rule3.json, from the plugin's build job). Only a plugin that declares
              # PLUGIN_MAP_MIGRATED fails; the others are reported.
              if (Test-Path "$dir\rule3.json") {
                $r3 = Get-Content "$dir\rule3.json" -Raw | ConvertFrom-Json
                $n3 = @($r3.findings).Count
                $r.rule3 = [ordered]@{ status = $r3.status; findings = $n3; migrated = $r3.migrated }
                if ($r3.status -eq 'fail' -and $r.verdict -in 'PASS', 'NONE', 'GAME-CALL', 'FAIL') {
                  $first = @($r3.findings)[0]
                  $r.scanVerdict = $r.verdict
                  $r.verdict = 'RULE3'
                  $r.note = "$n3 direct reads of game members, first $($first.file)($($first.line))"
                  Write-Host "::error title=Plugin $($p.name)::$($r.note)"
                } elseif ($r3.status -eq 'findings') {
                  Write-Host "::warning title=Plugin $($p.name)::$n3 direct reads of game members (rule 3; reported until the plugin sets PLUGIN_MAP_MIGRATED)"
                }
              }
              # A request that resolved (the map may have carried it) whose own pattern is not unique here.
              foreach ($row in @($scan.patterns | Where-Object { $_.PSObject.Properties['ownPattern'] })) {
                Write-Host "::error title=Plugin $($p.name)::$($row.name): $($row.ownPattern), its own pattern matches $(if ($row.PSObject.Properties['matches']) { $row.matches } else { $row.candidates[0].matches }) times on this build"
              }
              switch ($r.verdict) {
                'CRASH'     { Write-Host "::error title=Plugin $($p.name)::OnPluginLoadHooks crashed ($($scan.crash))" }
                'REFUSED'   { Write-Host "::error title=Plugin $($p.name)::$($scan.note)" }
                'GAME-CALL' { Write-Host "::notice title=Plugin $($p.name)::$($scan.note) ($($scan.gameCalls.first))" }
              }
            } catch {
              $r.verdict = 'ERROR'
              $r.error = $_.Exception.Message
              Write-Host "::error title=Plugin $($p.name)::$($r.error)"
            }
            $r
          }
          $results = @($results)
          [ordered]@{
            status = $(if (@($results | Where-Object { $_.verdict -notin 'PASS', 'NONE', 'GAME-CALL' }).Count) { 'fail' } else { 'pass' })
            plugins = $results
          } | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          foreach ($r in $results) { "$($r.name): $($r.verdict)" }
          # The verdicts are in plugins.json; the last scanner's exit code is not the step's result.
          exit 0

      # Key sources (map mode): see the key-sources job. They are scanned here, on the downloaded
      # exe, after the login cache is gone, like the plugins; the result is out/keysrc.json and the scans
      # out/keysrc-<name>.json, which only the map-mode job's scans builder reads. Nothing below reads
      # them: not plugins.json, the rig's set, rule 3, decide or the staging.
      - name: Download the key sources
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && inputs.map_mode == true && needs.key-sources-plan.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: keysrc-${{ inputs.branch }}-*
          path: keysrc

      - name: Scan the key sources
        id: keysrc
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && inputs.map_mode == true && needs.key-sources-plan.outputs.any == 'true'
        # The map-mode job names a key source that failed in its summary and as an alert line; the client check itself is not changed by one.
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.key-sources-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # Per key source: sr-aobscan --plugin, for the keys it requests. Its verdict is not graded (a key-scan
          # build refuses at PluginInit by design); only a scan that did not run, or a plugin that crashed
          # before it had asked for everything, makes it fail.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          $rows = foreach ($p in ($env:PLAN | ConvertFrom-Json)) {
            $r = [ordered]@{ name = $p.name; repo = $p.repo; branch = $p.branch; sha = $p.sha; tag = $p.tag; component = $p.component; recipe = $p.recipe; status = 'failed'; keys = 0 }
            try {
              $dir = "keysrc\keysrc-$($env:BRANCH)-$($p.name)"
              if (-not (Test-Path "$dir\key-source.json")) { throw 'it did not build (no artifact)' }
              $meta = Get-Content "$dir\key-source.json" -Raw | ConvertFrom-Json
              if ($meta.sha -cne $p.sha) { throw "the artifact was built from $($meta.sha), not the planned $($p.sha)" }
              $dll = Join-Path $dir $meta.dll
              if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.sha256) { throw "$($meta.dll) is not the DLL the key-sources job made" }
              $stem = "out\keysrc-$($p.name)"
              $ErrorActionPreference = 'Continue'
              & $scanner $exe.FullName --plugin $dll --json @suggest > "$stem.json" 2> "$stem.txt"
              $code = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              Get-Content "$stem.txt" | Write-Host
              $scan = if ($code -ne 2 -and (Test-Path "$stem.json") -and (Get-Item "$stem.json").Length) { Get-Content "$stem.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $scan) { throw "sr-aobscan could not run it (exit $code); see out/keysrc-$($p.name).txt" }
              $r.verdict = $scan.verdict
              if ($scan.verdict -eq 'CRASH') { throw "OnPluginLoadHooks crashed ($(if ($scan.PSObject.Properties['crash']) { $scan.crash })); the keys it had not yet asked for are missing" }
              $r.keys = if ($scan.PSObject.Properties['patterns']) { @($scan.patterns | Where-Object { $_.PSObject.Properties['key'] -and $_.key }).Count } else { 0 }
              if (-not $r.keys) { Write-Host "::warning title=Key source $($p.tag)::its scan has no keyed request, so it adds no rows" }
              $r.status = 'ok'
              Write-Host "$($p.tag) @ $($p.sha): $($r.keys) keyed requests ($($scan.verdict))"
            } catch {
              $r.error = $_.Exception.Message
              Write-Host "::error title=Key source $($p.tag)::$($r.error)"
            }
            $r
          }
          [ordered]@{ sources = @($rows) } | ConvertTo-Json -Depth 6 | Set-Content out\keysrc.json -Encoding utf8
          # The step's result is in keysrc.json; the map-mode job reads it.
          exit 0

      # ---- Auto-apply, part 1: build and scan the proposed fixes -----------
      # The apply tool is this workflow's own code at the same commit.
      - name: Check out the apply tool
        id: tool
        if: always() && steps.plugins.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tool
          sparse-checkout: |
            ci/apply-proposals.mjs
            ci/layout-table.mjs
            ci/layout-diff.mjs
            ci/used-classes.mjs
            ci/native-keys.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # ---- The rig's plugin DLLs: read before the rig runs --------------------
      # The rig does not run the plugin builds scanned above: it runs the Latest released plugins
      # (MOD_OWNER's, AlienXAXS by default) and the reviewed release of each plugin of another
      # author (the Pin in ci/plugin-names.json). Which of them the loader refuses on a build has to
      # be declared to the rig before it runs, so the exact set is resolved here by the rig's own
      # script, fetched through the rig's own cache (asset id and digest in the key: the rig then
      # downloads nothing), and each DLL is read by the scanner (interface version, the build it was
      # made on, and the loader's note on this build). Nothing of it is a verdict on the plugin: the
      # facts go to decide's expect_refused, and the tags go to both rigs so they run these very
      # releases. A DLL whose facts cannot be read has no row, and then nothing is declared for it.
      - name: Check out the rig's set script
        id: rigtool
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-rig
          sparse-checkout: |
            ci/client-rig-set.ps1
            ci/plugin-names.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the rig's plugin set
        id: rigset
        if: always() && steps.rigtool.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_OWNER: ${{ vars.MOD_OWNER || 'AlienXAXS' }}
        run: ./ci-rig/ci/client-rig-set.ps1 -Mode Resolve -Branch $env:BRANCH -Owner $env:MOD_OWNER -PlanPath (Join-Path $env:RUNNER_TEMP 'rig-plan.json')

      - name: Restore the rig's release files
        id: rigcache
        if: always() && steps.rigset.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The rig's own path and key: the cache is shared with it.
          path: D:\rig-dl
          key: sr-client-rig-dl-${{ steps.rigset.outputs.key }}
          restore-keys: sr-client-rig-dl-

      - name: Download what the cache lacks
        id: rigfetch
        if: always() && steps.rigset.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          PLAN_PATH: ${{ runner.temp }}\rig-plan.json
        run: ./ci-rig/ci/client-rig-set.ps1 -Mode Fetch -PlanPath $env:PLAN_PATH -DownloadDir 'D:\rig-dl'

      - name: Save the rig's release files
        if: always() && steps.rigfetch.outcome == 'success' && steps.rigcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\rig-dl
          key: sr-client-rig-dl-${{ steps.rigset.outputs.key }}

      - name: Read the rig's plugin DLLs
        id: rigdlls
        if: always() && steps.rigfetch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # out/rig-plugins.json: { tags: "Name=tag ...", plugins: [{ name, tag, plugin, verdict, note? } or { name, tag, error }] }.
          # `plugin` is the scanner's block for the DLL, as in the plugin rows above; map mode reads the
          # facts and never the verdict. The scanner's own files stay out of out/ (map mode reads every
          # out/plugin-*.json as a scan of the build).
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $plan = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-plan.json') -Raw | ConvertFrom-Json
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          $work = Join-Path $env:RUNNER_TEMP 'rig-scan'
          New-Item -ItemType Directory -Force $work | Out-Null
          $tagRx = '^[A-Za-z0-9][A-Za-z0-9._+-]*$'
          $tags = [Collections.Generic.List[string]]::new()
          $rows = foreach ($e in @($plan.plugins | Where-Object { $_.asset })) {
            $r = [ordered]@{ name = $e.name; tag = $e.tag }
            try {
              if ($e.tag -cnotmatch $tagRx) { throw "its release tag '$($e.tag)' is not a plain tag" }
              $tags.Add("$($e.name)=$($e.tag)")
              # The rig's cache layout (client-rig-set.ps1 Get-AssetPath).
              $file = Join-Path 'D:\rig-dl' (Join-Path "$($e.repo)\$($e.tag)\$($e.asset.id)" ([IO.Path]::GetFileName($e.asset.name)))
              if (-not (Test-Path -LiteralPath $file)) { throw "$($e.asset.name) is not in the downloaded files" }
              if ($e.asset.digest -and (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant() -ne $e.asset.digest) { throw "$($e.asset.name) does not match the digest the release gives" }
              $stem = Join-Path $work $e.name
              $ErrorActionPreference = 'Continue'
              & $scanner $exe.FullName --plugin $file --json > "$stem.json" 2> "$stem.txt"
              $code = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              $scan = if ($code -ne 2 -and (Test-Path -LiteralPath "$stem.json") -and (Get-Item -LiteralPath "$stem.json").Length) { Get-Content -LiteralPath "$stem.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $scan -or -not $scan.PSObject.Properties['plugin'] -or -not $scan.plugin.PSObject.Properties['interfaceVersion']) { throw "sr-aobscan could not read its plugin facts (exit $code)" }
              $r.plugin = $scan.plugin
              $r.verdict = $scan.verdict
              if ($scan.PSObject.Properties['note']) { $r.note = $scan.note }
            } catch {
              $r.error = $_.Exception.Message
              Write-Host "::warning title=Rig plugin $($e.name)::$($r.error); nothing is declared for it, so a refusal of it fails the rig"
            }
            $r
          }
          [ordered]@{ branch = $env:BRANCH; tags = ($tags -join ' '); plugins = @($rows) } |
            ConvertTo-Json -Depth 8 | Set-Content out\rig-plugins.json -Encoding utf8
          foreach ($r in @($rows)) { "$($r.name) $($r.tag): $(if ($r.Contains('plugin')) { 'interface ' + $r.plugin.interfaceVersion } else { $r.error })" }

      # ---- Layouts from the PDBs: what each component reads, on both builds --
      - name: Read the used layouts from the PDBs
        id: layout
        if: always() && steps.tool.outcome == 'success'
        # A report only: a failure here costs only the layout report.
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # The keys each component reads: the loader's own layout table, each
          # built plugin's used Game-SDK classes (ci/layout-table.mjs gen over
          # its source) and its native members (ci/native-keys.txt). One
          # sr-aobscan --layout pass per build reads them all from that build's
          # PDB; pdb-diff then counts, per component, what moved between the
          # public build and this one. Keys and numbers only: no PDB names.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $lt = 'ci-tool\ci\layout-table.mjs'
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          function Find-Exe([string]$dir) {
            if ($dir) { Get-ChildItem -Path $dir -Recurse -File -Filter '*-Win64-Shipping.exe' | Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          }
          function Get-Cl($e) { if ([string]$e.VersionInfo.ProductVersion -match 'CL-(\d+)$') { $Matches[1] } else { '' } }
          function Invoke-Native([string]$what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }
          function Get-Source([string]$repo, [string]$rev, [string]$dir) {
            git -c init.defaultBranch=main init -q $dir; Invoke-Native "git init $dir"
            git -C $dir fetch -q --depth 1 "https://github.com/$repo" $rev; Invoke-Native "fetching $repo $rev"
            git -C $dir checkout -q FETCH_HEAD; Invoke-Native "checking out $repo $rev"
          }
          $exe = Find-Exe $env:INSTALL_DIR
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $refExe = Find-Exe $env:REFERENCE_DIR
          $cl = Get-Cl $exe
          $refCl = if ($refExe) { Get-Cl $refExe } else { '' }
          $work = Join-Path $env:RUNNER_TEMP 'layout'
          New-Item -ItemType Directory -Force $work | Out-Null

          $native = @{}
          foreach ($line in Get-Content 'ci-tool\ci\native-keys.txt') {
            if ($line -match '^\s*(#|$)') { continue }
            # `<plugin> <Class::Member> ...`, or `<plugin> <Class> [size] [optional]`: the struct's own size.
            if ($line -cnotmatch '^(\S+)\s+(\S+::\S+)(\s+\S.*)?$' -and $line -cnotmatch '^(\S+)\s+([A-Za-z_]\w*)(\s+size)?(\s+optional)?$') { throw "native-keys.txt: malformed line '$line'" }
            if (-not $native.ContainsKey($Matches[1])) { $native[$Matches[1]] = [Collections.Generic.List[string]]::new() }
            if (-not $native[$Matches[1]].Contains($Matches[2])) { $native[$Matches[1]].Add($Matches[2]) }
          }
          $components = [Collections.Generic.List[object]]::new()
          $metas = @($env:PLAN | ConvertFrom-Json | Where-Object { $_.source -eq 'build' } | ForEach-Object {
            $m = "plugins\plugin-$($env:BRANCH)-$($_.name)\plugin.json"
            if (Test-Path $m) { Get-Content $m -Raw | ConvertFrom-Json }
          })
          if (-not $metas.Count) { throw 'no built plugin: nothing names the Game-SDK and loader commits to read' }
          # Every plugin was built against the same loader and Game-SDK commits.
          $sdk = Join-Path $work 'game-sdk'
          if ($metas[0].gameSdkRepo -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Game-SDK$') { throw 'plugin.json does not name an allowed Game SDK repository' }
          Get-Source $metas[0].gameSdkRepo $metas[0].gameSdk $sdk
          $loaderTable = Join-Path $work 'loader-table.h'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$($metas[0].loaderRepo)/$($metas[0].loaderInterface)/StarRupture-ModLoader-Core/core/layout_table.generated.h" -OutFile $loaderTable -TimeoutSec 60
          node $lt keys $loaderTable --out "$work\keys-ModLoader.txt" --uses-out "$work\uses-ModLoader.txt"; Invoke-Native 'keys (loader)'
          if ($native.ContainsKey('ModLoader')) { Add-Content "$work\keys-ModLoader.txt" $native['ModLoader'] }
          $components.Add('ModLoader')
          foreach ($m in $metas) {
            Get-Source $m.repo $m.sha "$work\src-$($m.name)"
            node $lt gen "$sdk\Client\Assertions.inl" --cl $(if ($cl) { $cl } else { 1 }) --src "$work\src-$($m.name)" --sdk "$sdk\Client\SDK" --granularity 2 --out "$work\table-$($m.name).h" --uses-out "$work\uses-$($m.name).txt"; Invoke-Native "gen ($($m.name))"
            node $lt keys "$work\table-$($m.name).h" --out "$work\keys-$($m.name).txt"; Invoke-Native "keys ($($m.name))"
            if ($native.ContainsKey($m.name)) { Add-Content "$work\keys-$($m.name).txt" $native[$m.name] }
            $components.Add($m.name)
          }
          # A plugin of the plan that is not built here (MiniMap: its author's release DLL, and its
          # project needs the Unreal Engine headers, which a hosted runner does not have) has no source
          # to read keys from, but ci/native-keys.txt still names the fixed-offset members it reads.
          # Their rows belong in the map, so those lines join the key list as a component of their own.
          foreach ($p in @($env:PLAN | ConvertFrom-Json | Where-Object { $_.source -ne 'build' } | ForEach-Object { $_.name })) {
            if (-not $native.ContainsKey($p) -or $components.Contains($p)) { continue }
            Set-Content "$work\keys-$p.txt" $native[$p] -Encoding ascii
            Set-Content "$work\uses-$p.txt" '' -Encoding ascii
            $components.Add($p)
          }
          # Key sources (map mode, out/keysrc.json): the keys their sources request, read from the same Game SDK.
          # Each is a component of its own that is not in $components, so layout.json, its pdb-diff and the
          # gate that reads them never see it; only the key list and the uses file below do. The result is
          # recorded in keysrc.json (layout: ok), which the scans builder of the map-mode job requires of a source's scan.
          $keysrc = if (Test-Path out\keysrc.json) { Get-Content out\keysrc.json -Raw | ConvertFrom-Json } else { $null }
          $keyParts = [Collections.Generic.List[object]]::new()
          if ($keysrc) {
            foreach ($s in @($keysrc.sources | Where-Object { $_.status -eq 'ok' })) {
              try {
                if ($s.repo -cnotmatch '^msantoro12/StarRupture-Plugin-[A-Za-z0-9_-]+$' -or $s.sha -cnotmatch '^[0-9a-f]{40}$' -or $s.name -cnotmatch '^[A-Za-z0-9_-]+$') { throw 'keysrc.json names a repository or commit that is not allowed' }
                $stem = "ks-$($s.name)"
                Get-Source $s.repo $s.sha "$work\src-$stem"
                node $lt gen "$sdk\Client\Assertions.inl" --cl $(if ($cl) { $cl } else { 1 }) --src "$work\src-$stem" --sdk "$sdk\Client\SDK" --granularity 2 --out "$work\table-$stem.h" --uses-out "$work\uses-$stem.txt"; Invoke-Native "gen ($($s.tag))"
                node $lt keys "$work\table-$stem.h" --out "$work\keys-$stem.txt"; Invoke-Native "keys ($($s.tag))"
                if ($native.ContainsKey($s.name)) { Add-Content "$work\keys-$stem.txt" $native[$s.name] }
                $keyParts.Add([pscustomobject]@{ component = $s.component; stem = $stem })
                $s | Add-Member -NotePropertyName layout -NotePropertyValue 'ok' -Force
              } catch {
                $s | Add-Member -NotePropertyName layout -NotePropertyValue "failed: $($_.Exception.Message)" -Force
                Write-Host "::error title=Key source $($s.tag)::its keys could not be read: $($_.Exception.Message)"
              }
            }
            [ordered]@{ sources = @($keysrc.sources) } | ConvertTo-Json -Depth 6 | Set-Content out\keysrc.json -Encoding utf8
          }
          $files = @($components | ForEach-Object { "$work\keys-$_.txt" }) + @($keyParts | ForEach-Object { "$work\keys-$($_.stem).txt" })
          $all = $files | ForEach-Object { Get-Content $_ } | Where-Object { $_ } | Sort-Object -Unique -CaseSensitive
          Set-Content "$work\keys-all.txt" $all -Encoding ascii
          Copy-Item "$work\keys-all.txt" out\layout-keys.txt
          # Per component: its keys, requests, lazy lookups and size uses
          # (field-rows.mjs --uses), so the gate is per plugin.
          $uses = foreach ($c in $components) {
            Get-Content "$work\keys-$c.txt" | Where-Object { $_ } | ForEach-Object { "$c key $_" }
            Get-Content "$work\uses-$c.txt" | Where-Object { $_ } | ForEach-Object { "$c $_" }
          }
          $uses = @($uses) + @(foreach ($k in $keyParts) {
            Get-Content "$work\keys-$($k.stem).txt" | Where-Object { $_ } | ForEach-Object { "$($k.component) key $_" }
            Get-Content "$work\uses-$($k.stem).txt" | Where-Object { $_ } | ForEach-Object { "$($k.component) $_" }
          })
          Set-Content out\layout-uses.txt $uses -Encoding ascii

          $reports = @{}
          foreach ($b in @(@{ key = 'target'; exe = $exe }, @{ key = 'reference'; exe = $refExe }) | Where-Object { $_.exe }) {
            $out = "out\layout-$($b.key).json"
            $ErrorActionPreference = 'Continue'
            & $scanner $b.exe.FullName --layout "$work\keys-all.txt" --json > $out
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -gt 1) { throw "sr-aobscan --layout on the $($b.key) build failed (exit $code)" }
            $reports[$b.key] = $out
            "$($b.key) (CL-$(Get-Cl $b.exe)): $(((Get-Content $out -Raw | ConvertFrom-Json).summary | ConvertTo-Json -Compress))"
          }
          $result = [ordered]@{ cl = $cl; referenceCl = $refCl; components = [ordered]@{} }
          if ($reports.ContainsKey('reference')) {
            foreach ($c in $components) {
              node $lt pdb-diff $reports.reference $reports.target --keys "$work\keys-$c.txt" --json "$work\diff-$c.json" | Out-Host
              if ($LASTEXITCODE -notin 0, 3) { throw "pdb-diff ($c) failed (exit $LASTEXITCODE)" }
              $result.components[$c] = Get-Content "$work\diff-$c.json" -Raw | ConvertFrom-Json
              "${c}: $($result.components[$c].counts | ConvertTo-Json -Compress)"
            }
          } else { Write-Host '::notice title=Layouts::No public build to compare with: the keys were read from this build only.' }
          $result | ConvertTo-Json -Depth 8 | Set-Content out\layout.json -Encoding utf8

      # ---- Fixed offsets: what each plugin reads at a raw offset ---------------
      - name: Check the fixed offsets
        id: offsets
        if: always() && steps.plugins.outcome == 'success' && steps.tool.outcome == 'success'
        # A plugin whose offsets could not be checked fails (OFFSETS-UNCHECKED); it never passes by default.
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Per built plugin with anchored lines in ci/native-keys.txt: read its
          # source at the commit that was built, and compare every fixed offset
          # it reads with the PDB layout of this build and of the public one
          # (ci/apply-proposals.mjs offsets). Anything but ok fails the plugin
          # (verdict OFFSETS); a layout report that is missing fails it too
          # (OFFSETS-UNCHECKED). The fix step rewrites the ones it can.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          try {
            $tool = 'ci-tool\ci\apply-proposals.mjs'
            $native = 'ci-tool\ci\native-keys.txt'
            function Invoke-Native([string]$what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }
            $anchored = @(Get-Content $native | ForEach-Object { if ($_ -match '^(\S+)\s+\S+::\S+\s.*:') { $Matches[1] } } | Sort-Object -Unique)
            $pj = Get-Content out\plugins.json -Raw | ConvertFrom-Json
            $work = Join-Path $env:RUNNER_TEMP 'offsets'
            New-Item -ItemType Directory -Force $work | Out-Null
            foreach ($p in @($pj.plugins | Where-Object { $_.source -eq 'build' -and $_.sha -and $_.name -in $anchored })) {
              $json = "out\offsets-$($p.name).json"
              try {
                $src = Join-Path $work $p.name
                git -c init.defaultBranch=main init -q $src; Invoke-Native "git init $src"
                git -C $src fetch -q --depth 1 "https://github.com/$($p.repo)" $p.sha; Invoke-Native "fetching $($p.repo) $($p.sha)"
                git -C $src checkout -q FETCH_HEAD; Invoke-Native "checking out $($p.repo)"
                $a = @('offsets', '--native', $native, '--plugin', $p.name, '--source', $src, '--target-public', $(if ($env:BRANCH -eq 'public') { 'true' } else { 'false' }))
                if (Test-Path out\layout-target.json) { $a += @('--target', 'out\layout-target.json') }
                if (Test-Path out\layout-reference.json) { $a += @('--reference', 'out\layout-reference.json') }
                node $tool @a > $json
                Invoke-Native "offsets ($($p.name))"
              } catch {
                [ordered]@{ plugin = $p.name; status = 'unchecked'; reason = $_.Exception.Message; counts = @{}; results = @(); plan = @(); blocked = @() } |
                  ConvertTo-Json -Depth 6 | Set-Content $json -Encoding utf8
              }
              $o = Get-Content $json -Raw | ConvertFrom-Json
              $p | Add-Member -NotePropertyName offsets -NotePropertyValue ([ordered]@{
                status = $o.status
                reason = $(if ($o.PSObject.Properties['reason']) { $o.reason } else { '' })
                counts = $o.counts
                results = @($o.results | ForEach-Object { $_ | Select-Object key, state, file, line, source, target, reference, reason })
              }) -Force
              "$($p.name): offsets $($o.status) $($o.counts | ConvertTo-Json -Compress)"
              if ($o.status -in 'fail', 'unchecked') {
                $bad = @($o.results | Where-Object { $_.state -ne 'ok' } | ForEach-Object { "$($_.key.Split('::')[-1]) ($($_.state))" })
                $why = if ($o.status -eq 'unchecked') { $o.reason } else { "$($bad.Count) of $(@($o.results).Count) fixed offsets do not match this build: $($bad -join ', ')" }
                Write-Host "::error title=Plugin $($p.name)::$why"
                $p | Add-Member -NotePropertyName note -NotePropertyValue $(if ($p.PSObject.Properties['note'] -and $p.note) { "$($p.note); $why" } else { $why }) -Force
                if ($p.verdict -in 'PASS', 'NONE', 'GAME-CALL') {
                  $p | Add-Member -NotePropertyName patternVerdict -NotePropertyValue $p.verdict -Force
                  $p.verdict = $(if ($o.status -eq 'unchecked') { 'OFFSETS-UNCHECKED' } else { 'OFFSETS' })
                }
              }
            }
            $pj.status = $(if (@($pj.plugins | Where-Object { $_.verdict -notin 'PASS', 'NONE', 'GAME-CALL' }).Count) { 'fail' } else { 'pass' })
            $pj | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          } catch {
            # The step itself crashed: no plugin passes on offsets nobody checked.
            Write-Host "::error title=Fixed offsets::$($_.Exception.Message)"
            $why = "fixed offsets not checked: $($_.Exception.Message)"
            $anchored = @(Get-Content 'ci-tool\ci\native-keys.txt' | ForEach-Object { if ($_ -match '^(\S+)\s+\S+::\S+\s.*:') { $Matches[1] } } | Sort-Object -Unique)
            $pj = Get-Content out\plugins.json -Raw | ConvertFrom-Json
            foreach ($p in @($pj.plugins | Where-Object { $_.source -eq 'build' -and $_.name -in $anchored -and $_.verdict -in 'PASS', 'NONE', 'GAME-CALL' })) {
              $p | Add-Member -NotePropertyName patternVerdict -NotePropertyValue $p.verdict -Force
              $p | Add-Member -NotePropertyName note -NotePropertyValue $why -Force
              $p.verdict = 'OFFSETS-UNCHECKED'
            }
            $pj.status = 'fail'
            $pj | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          }
          exit 0

      - name: Build the proposed fixes
        id: fix
        if: always() && steps.tool.outcome == 'success'
        # A fix that fails to build or scan costs only the fix.
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
          APPLY_CONFIDENCE: ${{ inputs.apply_confidence || 'high' }}
        run: |
          # Per plugin with failing patterns: apply the proposals at or above
          # APPLY_CONFIDENCE to its source (ci/apply-proposals.mjs), rebuild it
          # from exactly the sources its scan was built from, and scan the
          # result on this build and on the public one. Writes
          # out/autofix-<name>.* (verdict, source patch, scans) and the
          # auto-apply job's work list: FIXED or PARTIAL fixes of the owner's
          # forks. A released plugin (another author's) gets the patch only;
          # the loader's own patterns stay proposals in the report.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:APPLY_CONFIDENCE -notin 'high', 'medium') { throw "apply_confidence '$($env:APPLY_CONFIDENCE)' is not high or medium" }
          $tool = 'ci-tool\ci\apply-proposals.mjs'
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          function Find-Exe([string]$dir) {
            if ($dir) { Get-ChildItem -Path $dir -Recurse -File -Filter '*-Win64-Shipping.exe' | Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          }
          function Get-Cl($e) { if ([string]$e.VersionInfo.ProductVersion -match 'CL-(\d+)$') { $Matches[1] } else { '' } }
          function Invoke-Native([string]$what) {
            if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" }
          }
          # Source at an exact commit, bytes as committed (no CRLF rewrite), so
          # the auto-apply job re-creates the same tree on Linux.
          function Get-Source([string]$repo, [string]$rev, [string]$dir) {
            git -c init.defaultBranch=main init -q $dir; Invoke-Native "git init $dir"
            git -C $dir config core.autocrlf false
            git -C $dir fetch -q --depth 1 "https://github.com/$repo" $rev; Invoke-Native "fetching $repo $rev"
            git -C $dir checkout -q FETCH_HEAD; Invoke-Native "checking out $repo $rev"
          }
          $exe = Find-Exe $env:INSTALL_DIR
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $refExe = Find-Exe $env:REFERENCE_DIR
          $cl = Get-Cl $exe
          $refCl = if ($refExe) { Get-Cl $refExe } else { '' }
          if ($cl -notmatch '^\d+$') { throw "no CL in this build's ProductVersion" }
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $work = Join-Path $env:RUNNER_TEMP 'autofix'
          $push = [Collections.Generic.List[object]]::new()
          # Collected with Add, so no stray output can land in the results.
          $results = [Collections.Generic.List[object]]::new()
          foreach ($p in ($env:PLAN | ConvertFrom-Json)) {
            $scan = "out\plugin-$($p.name).json"
            if (-not ((Test-Path $scan) -and (Get-Item $scan).Length)) { continue }
            $d = Join-Path $work $p.name
            New-Item -ItemType Directory -Force $d | Out-Null
            $r = [ordered]@{ name = $p.name; source = $p.source; repo = $p.repo; sha = ''; verdict = 'NO-FIX'; reasons = @()
                             applied = @(); skipped = @(); tree = ''; patch = '' }
            try {
              $isPublic = $(if ($env:BRANCH -eq 'public') { 'true' } else { 'false' })
              # The plugin's fixed-offset check (offsets step) rides in the plan.
              $offs = "out\offsets-$($p.name).json"
              $sel = @('select', '--scan', $scan, '--min-confidence', $env:APPLY_CONFIDENCE, '--target-public', $isPublic)
              if (Test-Path $offs) { $sel += @('--offsets', $offs) }
              node $tool @sel > "$d\plan.json"
              Invoke-Native 'select'
              $plan = Get-Content "$d\plan.json" -Raw | ConvertFrom-Json
              $planOffsets = @(if ($plan.PSObject.Properties['offsets']) { $plan.offsets })
              $blockedRows = @(if ($plan.PSObject.Properties['blockedOffsets']) { $plan.blockedOffsets | ForEach-Object { [pscustomobject]@{ name = $_.key; reason = "$($_.state): $($_.reason)" } } })
              # Nothing failing, nothing to do.
              if (-not @($plan.rows).Count -and -not @($plan.skipped).Count -and -not $planOffsets.Count -and -not $blockedRows.Count) { continue }
              $r.skipped = @(@($plan.skipped) + $blockedRows)
              if (-not @($plan.rows).Count -and -not $planOffsets.Count) { $r.reasons = @('no proposal was selected'); $results.Add($r); continue }
              $meta = Get-Content "plugins\plugin-$($env:BRANCH)-$($p.name)\plugin.json" -Raw | ConvertFrom-Json
              if ($p.source -eq 'release') { Get-Source $p.repo "refs/tags/$($meta.ref)" "$d\src" }
              else {
                # The commit plugin-plan resolved, which the scanned DLL was built from.
                if ([string]$meta.sha -ne $p.sha) { throw "the scanned DLL was built from $($meta.sha), not the planned commit $($p.sha)" }
                $r.sha = $p.sha
                Get-Source $p.repo $p.sha "$d\src"
              }
              node $tool apply --source "$d\src" --plan "$d\plan.json" > "$d\applied.json"
              Invoke-Native 'apply'
              $applied = Get-Content "$d\applied.json" -Raw | ConvertFrom-Json
              $offApplied = @($applied.offsets | Where-Object { $_.status -eq 'applied' } | ForEach-Object { [pscustomobject]@{ name = $_.key; kind = 'offset'; old = $_.old; new = $_.new } })
              $offSkipped = @($applied.offsets | Where-Object { $_.status -ne 'applied' } | ForEach-Object { [pscustomobject]@{ name = $_.key; reason = $_.reason } })
              $r.applied = @(@($applied.rows | Where-Object { $_.status -eq 'applied' }) + $offApplied)
              $r.skipped = @(@($plan.skipped) + @($applied.rows | Where-Object { $_.status -ne 'applied' }) + $offSkipped + $blockedRows)
              if (-not $r.applied.Count) { $r.reasons = @('no proposal could be applied to the source'); $results.Add($r); continue }
              # The tree is taken before the build, which only adds ignored files.
              git -C "$d\src" add -A; Invoke-Native 'git add'
              $r.tree = [string](git -C "$d\src" write-tree); Invoke-Native 'git write-tree'
              $r.patch = "autofix-$($p.name).patch"
              git -C "$d\src" diff --cached > "out\$($r.patch)"; Invoke-Native 'git diff'
              if ($p.source -eq 'release') { $r.verdict = 'PATCH'; $r.reasons = @("another author's released plugin: information only, nothing is pushed or built from it"); $results.Add($r); continue }

              # Rebuilt exactly as the plugins job built the scanned DLL.
              if ($meta.loaderRepo -notmatch '^(msantoro12|AlienXAXS)/StarRupture-ModLoader$' -or $meta.loaderInterface -notmatch '^[0-9a-f]{40}$') { throw 'plugin.json does not name the loader interface it was built against' }
              if ($meta.pluginSdkRepo -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Plugin-SDK$') { throw 'plugin.json does not name an allowed Plugin SDK repository' }
              Get-Source $meta.pluginSdkRepo $meta.pluginSdk "$d\plugin-sdk"
              if ($meta.gameSdkRepo -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Game-SDK$') { throw 'plugin.json does not name an allowed Game SDK repository' }
              Get-Source $meta.gameSdkRepo $meta.gameSdk "$d\game-sdk"
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$($meta.loaderRepo)/$($meta.loaderInterface)/StarRupture-ModLoader-Core/plugins/plugin_interface.h" `
                -OutFile "$d\plugin-sdk\include\plugin_interface.h" -TimeoutSec 60
              $sln = @(Get-ChildItem "$d\src" -File -Filter *.sln)
              if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
              & $msbuild $sln[0].FullName `
                /p:Configuration="Client Release" `
                /p:Platform=x64 `
                /p:PostBuildEventUseInBuild=false `
                /p:Rule3Check=false `
                /p:ModLoaderBuildTag="$($meta.tag)" `
                /p:GameSDKRoot="$d\game-sdk" `
                /p:PluginSDKInclude="$d\plugin-sdk\include" `
                /m /p:CL_MP=true /nodeReuse:false /v:minimal | Out-Host
              if ($LASTEXITCODE -ne 0) { $r.verdict = 'FAILED'; $r.reasons = @("the fixed source did not build (msbuild exit $LASTEXITCODE)"); $results.Add($r); continue }
              $dll = @(Get-ChildItem "$d\src\build\Client Release\Plugins" -File -Filter *.dll)
              if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }

              # Scanned on this build, and on the public one when there is one.
              $scans = @{}
              foreach ($b in @(@{ key = 'target'; exe = $exe }, @{ key = 'reference'; exe = $refExe }) | Where-Object { $_.exe }) {
                $stem = "out\autofix-$($p.name)-$($b.key)"
                $ErrorActionPreference = 'Continue'
                & $scanner $b.exe.FullName --plugin $dll[0].FullName --json > "$stem.json" 2> "$stem.txt"
                $code = $LASTEXITCODE
                $ErrorActionPreference = 'Stop'
                if ($code -eq 2 -or -not (Get-Item "$stem.json").Length) { throw "sr-aobscan could not run the fixed plugin on the $($b.key) build (exit $code)" }
                $scans[$b.key] = "$stem.json"
              }
              $vArgs = @('--applied', "$d\applied.json", '--target', $scans.target)
              # The patched source read against the same layouts: every rewritten offset must now be ok.
              if (Test-Path $offs) {
                $oa = @('offsets', '--native', 'ci-tool\ci\native-keys.txt', '--plugin', $p.name, '--source', "$d\src", '--target-public', $isPublic)
                if (Test-Path out\layout-target.json) { $oa += @('--target', 'out\layout-target.json') }
                if (Test-Path out\layout-reference.json) { $oa += @('--reference', 'out\layout-reference.json') }
                node $tool @oa > "$d\offsets-after.json"
                Invoke-Native 'offsets (fixed source)'
                $vArgs += @('--offsets-after', "$d\offsets-after.json")
              }
              if ($scans.ContainsKey('reference')) { $vArgs += @('--reference', $scans.reference) }
              $v = node $tool verdict @vArgs | Out-String | ConvertFrom-Json
              Invoke-Native 'verdict'
              $r.verdict = $v.verdict
              $r.reasons = @($v.reasons)
              $r.rows = @($v.rows)
              $r.offsets = @($v.offsets)
              # Only a verified fix of one of the nine, and it is pushed to the owner's fork of that plugin
              # (auto-apply), however the commit it is built on was read: AlienX's main or the fork's branch.
              if ($r.verdict -in 'FIXED', 'PARTIAL' -and $p.source -eq 'build' -and $p.repo -match '^(msantoro12|AlienXAXS)/StarRupture-Plugin-(BetterCheats|BetterDrone|WAILA|Codex|Compass|ProductionViewer|RuptureTimer|WaveOptimiser|CameraControls)$') {
                $push.Add([ordered]@{ name = $p.name; sha = $r.sha; tree = $r.tree; cl = $cl; referenceCl = $refCl; verdict = $r.verdict; plan = $plan })
              }
            } catch {
              $r.verdict = 'FAILED'
              $r.reasons = @($_.Exception.Message)
            }
            $results.Add($r)
          }
          foreach ($r in $results) {
            "$($r.name): $($r.verdict) ($(@($r.applied).Count) applied, $(@($r.skipped).Count) skipped)$(if (@($r.reasons).Count) { ': ' + (@($r.reasons) -join '; ') })"
            if ($r.verdict -eq 'FAILED') { Write-Host "::warning title=Auto-apply $($r.name)::$(@($r.reasons) -join '; ')" }
          }
          [ordered]@{ minConfidence = $env:APPLY_CONFIDENCE; cl = $cl; referenceCl = $refCl; plugins = $results } |
            ConvertTo-Json -Depth 12 | Set-Content out\autofix.json -Encoding utf8
          "autofix=$(ConvertTo-Json -InputObject @($push) -Depth 12 -Compress)" >> $env:GITHUB_OUTPUT

      - name: Write the result
        if: always() && steps.gate.outputs.has_login == 'true'
        shell: pwsh
        env:
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          $r = [ordered]@{ schema = 1; status = ''; branch = $env:BRANCH; expectedBuildid = $env:EXPECTED_BUILDID }
          $dl = if (Test-Path out\download.json) { Get-Content out\download.json -Raw | ConvertFrom-Json } else { $null }
          $ck = if (Test-Path out\checks.json) { Get-Content out\checks.json -Raw | ConvertFrom-Json } else { $null }
          $r.download = $dl
          $r.checks = $ck
          # Reported beside the loader's verdict, never folded into it: status
          # below covers the loader only. Anything that blocks on plugins reads
          # plugins.status.
          $r.plugins = if (Test-Path out\plugins.json) { Get-Content out\plugins.json -Raw | ConvertFrom-Json } else { $null }
          # The public build the proposals and fixes were checked against.
          $ref = if ($dl -and $dl.PSObject.Properties['reference']) { $dl.reference } else { $null }
          $ckRef = if ($ck -and $ck.PSObject.Properties['reference']) { $ck.reference } else { $null }
          $r.reference =
            if ($ref -and $ref.installed) { [ordered]@{ status = 'used'; buildid = $ref.buildid; cl = $(if ($ckRef) { $ckRef.cl } else { '' }); productVersion = $(if ($ckRef) { $ckRef.productVersion } else { '' }) } }
            elseif ($ref) { [ordered]@{ status = 'none'; reason = $ref.reason; buildid = $ref.buildid; betaKey = $ref.betaKey } }
            elseif ($env:BRANCH -eq 'public') { [ordered]@{ status = 'none'; reason = 'this is the public build' } }
            else { [ordered]@{ status = 'none'; reason = 'not downloaded' } }
          $r.autofix = if (Test-Path out\autofix.json) { Get-Content out\autofix.json -Raw | ConvertFrom-Json } else { $null }
          $r.status =
            if (-not $dl) { 'error' }
            elseif ($dl.login -ne 'ok') { 'login-failed' }
            elseif (-not $dl.installed) { 'download-failed' }
            elseif (-not $ck) { 'error' }
            elseif ($ck.fail) { 'fail' }
            elseif ($ck.exe.newBuild) { 'new-build' }
            elseif (@($ck.warnings).Count -gt 0) { 'pass-with-warnings' }
            else { 'pass' }
          $r | ConvertTo-Json -Depth 12 | Set-Content out\result.json -Encoding utf8
          "Client check: $($r.status)"
          Remove-Item out\download.json, out\checks.json, out\plugins.json, out\autofix.json -ErrorAction SilentlyContinue

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-check-${{ inputs.branch }}
          path: |
            out/result.json
            out/scanner.txt
            out/scanner.json
            out/carry.json
            out/plugin-*.json
            out/plugin-*.txt
            out/keysrc.json
            out/keysrc-*.json
            out/keysrc-*.txt
            out/autofix-*
            out/layout*.json
            out/layout-keys.txt
            out/layout-uses.txt
            out/offsets-*.json
            out/rig-plugins.json
          if-no-files-found: warn
          retention-days: 14

  # Keeps the layout this public check scanned, one asset per CL on the vmap-layouts release: the next public
  # update needs it as the reference layout for its field rows (ci/layout-store.mjs, ci/MAP-MODE.md), and Steam
  # stops serving the build once public moves. It runs only from this repository's main: the workflow has no pull
  # request trigger and the check job's environment takes deployments from main only, so no fork or other ref
  # reaches it. It reads the check's own artifact and writes with the job's token; no environment, no secret, and
  # no code from anywhere but main. A CL already stored is extended only for the same exe, never overwritten.
  layout-store:
    name: store the public layout
    needs: [check]
    if: ${{ !cancelled() && inputs.map_mode == true && inputs.branch == 'public' && needs.check.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: vmap-layouts
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Check out the store tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the scans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      - name: Store the layout
        run: |
          set -euo pipefail
          if [ ! -f res/layout-target.json ] || [ ! -f res/result.json ] || [ ! -f res/scanner.json ]; then
            echo "::warning title=Layout store::the check's artifact has no layout, result or scanner file; nothing is stored for this build"
            exit 0
          fi
          cl="$(node -p "String(JSON.parse(require('fs').readFileSync('res/result.json','utf8')).checks?.exe?.cl ?? '')")"
          [[ "$cl" =~ ^[0-9]+$ ]] || { echo "::warning title=Layout store::the check recorded no CL for the exe; nothing is stored"; exit 0; }
          gh release view vmap-layouts > /dev/null 2>&1 || gh release create vmap-layouts --latest=false --title "Reference layouts" --notes "The layout of each public build, one asset per CL, written by the client check. The field rows of the next update compare against it."
          mkdir -p stored
          gh release download vmap-layouts --pattern "layout-CL-$cl.json" --dir stored 2> /dev/null || true
          existing=()
          if [ -f "stored/layout-CL-$cl.json" ]; then existing=(--existing "stored/layout-CL-$cl.json"); fi
          node tool/ci/layout-store.mjs record --out "layout-CL-$cl.json" --result res/result.json --scanner res/scanner.json --layout res/layout-target.json \
            --run "$RUN_ID" --sha "$WORKFLOW_SHA" "${existing[@]}"
          gh release upload vmap-layouts "layout-CL-$cl.json" --clobber

  # ---- Map mode: the update as rows in the loader's version map -----------
  # The unattended path M chain, on the scans the check job uploaded and the
  # loader's header: map-mode assemble and write, field rows from the PDB
  # layouts, decide (ci/decide.mjs, every gate and rate limit), and on path M
  # export the feed, sign it with the TEST key (k1, VMAP_SIGN_KEY_TEST) and
  # verify it, stage a build not on public yet, and plan the promotion (ci/promote.mjs, a
  # dry run). The client check alone decides: no dedicated-server scan is read.
  # Reads only artifacts, the header and the vmap-feed release: no Steam login,
  # no plugin code, no game files. The release key signs only in the publish
  # job below (see its conditions: public, the autopilot on, every gate).
  # The candidate chain does not wait for the autopilot: a disabled autopilot
  # holds PUBLISHING only (decide --candidate; the decision stays HOLD with the
  # reason, so the publish job cannot run). Every other HOLD reason still stops
  # the chain before the export. The staged header is pushed to the loader
  # fork's auto/update-<CL> by the push-loader job, the only job with the fork
  # deploy key (setup: ci/MAP-MODE.md, step 26). The staged index is not kept
  # between runs (a plan only).
  # TODO: the scans of the previous release of each tracked component
  # (rank previous) are not run yet, so a changed fp adds its set only once a
  # release carrying it is the current one. With current scans only, map-mode
  # prunes nothing: the sets the previous release still reads are kept.
  map-mode:
    name: map mode
    needs: [build, plugins, check, key-sources-plan, key-sources]
    if: ${{ !cancelled() && inputs.map_mode == true && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # One chain at a time reads the vmap-feed history.
    concurrency:
      group: vmap-map-mode
      cancel-in-progress: false
    outputs:
      decision: ${{ steps.chain.outputs.decision }}
      # The one seq of this chain: the TEST-signed feed, the promote plan and (in the publish job) the release-signed feed and the history entry all carry it.
      seq: ${{ steps.chain.outputs.seq }}
      action: ${{ steps.chain.outputs.action }}
      publishable: ${{ steps.chain.outputs.publishable }}
      # 'false' only for a run that is explicitly not a test; the publish job needs exactly that.
      test: ${{ steps.chain.outputs.test }}
      # 'true' when the chain staged a build (stage-plan.json exists and the header is the candidate): the push-loader job's cue.
      staged: ${{ steps.chain.outputs.staged }}
      # The plugins the loader is expected to refuse on this branch's build, as the client rig's
      # expect_refused input takes them: log names separated by spaces, empty when none. Set
      # whenever decide ran, held or not.
      expect_refused: ${{ steps.chain.outputs.expect_refused }}
      # The same for the OTHER Steam branch's current build: what the loader's rule predicts refused
      # there (decide --other-cl). Empty when that build's CL is not in the candidate map, so every
      # refusal on that branch is unexpected.
      expect_refused_other: ${{ steps.chain.outputs.expect_refused_other }}
      # 'true' when that build's CL is not in the candidate map (decide --other-unmapped): the loader has no rows
      # for it, so the other branch's rig passes only on a clean decline (rig input expect_decline).
      expect_decline_other: ${{ steps.chain.outputs.expect_decline_other }}
      # The releases the rigs run, as the rig's tags input takes them (Name=tag, space separated; empty when the check could not
      # resolve them, and then the rigs resolve the Latest themselves and nothing is declared for them).
      rig_tags: ${{ steps.chain.outputs.rig_tags }}
      # The CL of the build the other Steam branch runs when the candidate map holds it (empty otherwise): the feed-path gate's second leg.
      other_cl: ${{ steps.chain.outputs.other_cl }}
      # 'true' for a first publish (see the input): the push and the publish job read this one answer.
      first_publish: ${{ steps.write.outputs.first_publish }}
    env:
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      OTHER_BUILDID: ${{ inputs.other_buildid }}
      PLUGINS: ${{ inputs.plugins }}
      LOADER_REF: ${{ inputs.loader_ref }}
      BUILD_RESULT: ${{ needs.build.result }}
      RUN_ID: ${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A dispatched test run only (never a call from sr-watch): see the input.
      TEST_AUTOPILOT: ${{ inputs.test_autopilot == true && inputs.publish != true && contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
      # The raw dispatch inputs: a test run (or a proof run) for the publish gate, however TEST_AUTOPILOT came out.
      TEST_INPUT: ${{ inputs.test_autopilot == true || inputs.proof_run == true }}
      # Every map-mode run that is not a test run (the unattended chain passes publish: true): a disabled
      # autopilot holds publishing only, so the candidate is still exported, TEST-signed, staged and pushed.
      # Publishing itself is the publish input and the autopilot, in the publish job.
      CANDIDATE: ${{ inputs.map_mode == true && inputs.test_autopilot != true }}
      # The owner's proof run (dispatch only): see the input.
      PROOF: ${{ inputs.proof_run == true }}
      # The first publish (dispatch only): every input it needs is part of the condition, so any other run is an ordinary one.
      FIRST_PUBLISH: ${{ inputs.first_publish == true && inputs.branch == 'public' && inputs.map_mode == true && inputs.publish == true && inputs.proof_run != true && inputs.test_autopilot != true && inputs.loader_repo == 'msantoro12/StarRupture-ModLoader' && startsWith(inputs.loader_ref, 'auto/update-') && contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
      LOADER_REPO: ${{ inputs.loader_repo }}
      # The proof of the stored reference (dispatch only): every input it needs is part of the condition, so any other run takes its base as usual.
      STORED_REFERENCE: ${{ inputs.stored_reference == true && inputs.branch != 'public' && inputs.branch != 'expiry-only' && inputs.map_mode == true && inputs.publish != true && inputs.test_autopilot == true && inputs.proof_run != true && contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') }}
    steps:
      # A first_publish dispatch that is not a first publish (a base outside the fork, a branch that is not an
      # auto/update-<CL>-<run>-<attempt> one, any other input) stops here: it is never run as an ordinary one.
      - name: Refuse a first publish that is not one
        if: ${{ inputs.first_publish == true }}
        run: |
          [ "$FIRST_PUBLISH" = true ] && [ "$LOADER_REPO" = msantoro12/StarRupture-ModLoader ] && [[ "$LOADER_REF" =~ ^auto/update-[0-9]+-[0-9]+-[0-9]+$ ]] \
            || { echo "::error::first_publish needs branch public, map_mode and publish on, proof_run and test_autopilot off, loader_repo msantoro12/StarRupture-ModLoader and loader_ref auto/update-<CL>-<run>-<attempt>"; exit 2; }

      - name: Refuse a stored reference that is not a test run
        if: ${{ inputs.stored_reference == true }}
        run: |
          [ "$STORED_REFERENCE" = true ] \
            || { echo "::error::stored_reference needs a dispatch with a branch other than public, map_mode and test_autopilot on, publish and proof_run off"; exit 2; }

      - name: Refuse a proof run that could publish
        if: ${{ inputs.proof_run == true }}
        env:
          PUBLISH: ${{ inputs.publish == true }}
          TEST_RUN: ${{ inputs.test_autopilot == true }}
        run: |
          [ "$BRANCH" = public ] && [ "$PUBLISH" = false ] && [ "$TEST_RUN" = false ] \
            || { echo "::error::proof_run needs branch public, publish off and test_autopilot off: a proof run never publishes"; exit 2; }

      - name: Check out the map tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: |
            ci
            state
            .github/sr-pipeline
          persist-credentials: false

      - name: Check out the loader's header
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ needs.build.outputs.loader_sha }}
          path: loader
          sparse-checkout: StarRupture-ModLoader-Core/hooks/game/version_map.generated.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the scans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      # A key source that did not build, scan or have its keys read leaves the keys only it requests without
      # rows on this build. That does not fail map mode: the update goes on without them, and the cause is
      # named here: in the run summary, as a warning, and as an alert line (alerts.json, which the alert job
      # puts in the pipeline-alert issue). Only a key source list that could not be resolved stops the run.
      - name: Settle the key sources
        env:
          KEY_PLAN: ${{ needs.key-sources-plan.result }}
          KEY_ANY: ${{ needs.key-sources-plan.outputs.any }}
          PLAN: ${{ needs.key-sources-plan.outputs.matrix }}
        run: |
          set -euo pipefail
          if [ "$KEY_PLAN" != success ]; then echo "::error title=Key sources::the key source list was refused or could not be resolved (key-sources-plan: $KEY_PLAN); map mode stops"; exit 2; fi
          if [ "$KEY_ANY" != true ]; then echo "::notice title=Key sources::none listed"; exit 0; fi
          node -e '
            // keysrc.json is written by the check job, one entry per key source; PLAN is the list the legs were built from.
            const fs = require("fs");
            const plan = JSON.parse(process.env.PLAN || "[]");
            const got = new Map();
            if (fs.existsSync("res/keysrc.json")) for (const s of JSON.parse(fs.readFileSync("res/keysrc.json", "utf8")).sources ?? []) got.set(s.name, s);
            const alerts = [];
            const md = ["", "### Key sources", ""];
            for (const p of plan) {
              const s = got.get(p.name);
              const why = !s ? "the check job recorded no result for it, so it was not scanned"
                : s.status !== "ok" ? (s.error || "it was not scanned")
                : s.layout === "ok" ? ""
                : s.layout ? "its keys were not read: " + s.layout : "its keys were not read (the layout step stopped before the key sources)";
              if (why) {
                const line = `key source ${p.tag} (${String(p.sha).slice(0, 12)}, checked the branch, not an installed DLL): ${why}; map mode went on without the keys only it requests`;
                alerts.push(line);
                md.push("- **FAILED** " + line);
                console.log(`::warning title=Key source ${p.tag}::${why}; map mode goes on without its keys`);
              } else {
                md.push(`- ${p.tag} ${String(p.sha).slice(0, 12)}: ${s.keys} keyed requests`);
                console.log(`${p.tag} ${p.sha}: ${s.keys} keyed requests`);
              }
            }
            fs.writeFileSync("alerts.json", JSON.stringify({ alerts }, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join("\n") + "\n");
          '

      - name: Write the update into the header
        id: write
        env:
          SCANNED_LOADER_SHA: ${{ needs.build.outputs.loader_sha }}
        run: |
          set -euo pipefail
          # No scanner result means the check did not measure the build: name
          # its cause instead of failing on the missing file.
          if [ ! -f res/scanner.json ]; then
            why="$(node -p "const r = JSON.parse(require('fs').readFileSync('res/result.json', 'utf8')); (r.status || 'unknown') + (r.reason ? ': ' + r.reason : '')" 2>/dev/null || echo 'no result.json')"
            echo "::error title=No scanner result::The client check did not measure the build ($why); nothing to map."
            exit 2
          fi
          # The header is read at the commit the scanner was built from, so the rows and the
          # patterns they were measured with come from one loader commit even if the branch moved.
          read_sha="$(git -C loader rev-parse HEAD)"
          [ -n "$SCANNED_LOADER_SHA" ] && [ "$read_sha" = "$SCANNED_LOADER_SHA" ] || { echo "::error::the header was read at $read_sha, not at the loader commit the scanner was built from ('$SCANNED_LOADER_SHA')"; exit 2; }
          # The build Steam installed names the build row; the watcher's id is
          # only the fallback.
          buildid="$(node -p "JSON.parse(require('fs').readFileSync('res/result.json','utf8')).download?.buildid || ''")"
          [ -n "$buildid" ] || buildid="$BUILDID"
          [ -n "$buildid" ] || { echo "::error::no build id: neither the download nor the buildid input names one"; exit 2; }
          # The build row's label is "steam_build <build id>": it names the
          # build and never the Steam branch it was found on.
          # The loader's registry scan, then each plugin scan. A plugin is
          # tracked when it is one of the built `plugins`; otherwise (MiniMap)
          # its failing rows go to the pattern path.
          node -e '
            const fs = require("fs");
            const scans = [{ owner: "ModLoader", tracked: true, tag: process.env.LOADER_REF, rank: "current", file: "res/scanner.json" }];
            // PLUGINS is "owner/repo@ref ..."; the repo names the built plugins.
            // A plugin reports the name in plugin-names.json (Waila for WAILA,
            // AxRuptureTimer for RuptureTimer), else its repo name.
            const table = JSON.parse(fs.readFileSync("tool/ci/plugin-names.json", "utf8"));
            const built = (process.env.PLUGINS || "").split(/\s+/).filter(Boolean).map((e) => e.split("@")[0].split("/").pop())
              .map((repo) => table.find((t) => t.Repo === repo)?.LogName ?? repo.replace(/^StarRupture-Plugin-/, ""));
            for (const f of fs.readdirSync("res").filter((n) => /^plugin-.*\.json$/.test(n)).sort()) {
              const name = JSON.parse(fs.readFileSync("res/" + f, "utf8")).plugin?.name;
              if (!name) continue;
              const tracked = built.includes(name);
              scans.push({ owner: name, tracked, tag: "current", rank: "current", file: "res/" + f });
            }
            // Key sources (res/keysrc.json, from the check job; the step above named the ones that failed, and those are left out here):
            // fork builds scanned for their keys only. After the released scans, so a key both ask for stays one
            // row and the row of the released plugin comes first in the order of ci/map-mode.mjs; the tag names where a row came from.
            const commits = [];
            if (fs.existsSync("res/keysrc.json")) {
              for (const k of JSON.parse(fs.readFileSync("res/keysrc.json", "utf8")).sources ?? []) {
                if (k.status !== "ok" || k.layout !== "ok" || !/^[A-Za-z0-9_-]+$/.test(k.name)) continue;
                const file = "res/keysrc-" + k.name + ".json";
                const owner = JSON.parse(fs.readFileSync(file, "utf8")).plugin?.name;
                if (!owner) continue;
                // The released scan of the same plugin joins the same component, which has one tracked flag.
                for (const x of scans) if (x.owner === owner) x.tracked = true;
                scans.push({ owner, tracked: true, tag: k.tag, rank: "current", keySource: true, commit: k.sha, file });
                commits.push({ name: k.name, tag: k.tag, sha: k.sha });
              }
            }
            // The alert lines of the field rows name the commit each fork branch was checked at.
            fs.writeFileSync("commits.json", JSON.stringify({ sources: commits }));
            fs.writeFileSync("scans.json", JSON.stringify({ source: "steam_build " + process.argv[1], scans }));
          ' "$buildid"
          header=loader/StarRupture-ModLoader-Core/hooks/game/version_map.generated.h
          # The keys no scanned DLL requested come from the check job's carry scan, taken
          # against this header before anything is written to it. Without the report the
          # run stops here: those keys would get no row.
          [ -f res/carry.json ] || { echo "::error::the check job wrote no carry.json; the keys no plugin requested would get no row"; exit 2; }
          cp res/carry.json carry.json
          if ! node tool/ci/map-mode.mjs assemble scans.json --out observations.json --carry carry.json --base "$header" 2> assemble.err; then
            cat assemble.err >&2
            echo "::error::map mode could not assemble the input: $(tr '\n' ' ' < assemble.err)"
            exit 2
          fi
          echo "loader_sha=$(git -C loader rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "loader_tree=$(git -C loader rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "first_publish=$FIRST_PUBLISH" >> "$GITHUB_OUTPUT"
          # G3 compares the new CL with the one the header was built for.
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse } from "./tool/ci/version-map.mjs";
            process.stdout.write("previous_cl=" + parse(readFileSync(process.argv[1], "utf8"), "the header").builtCL + "\n");
          ' "$header" >> "$GITHUB_OUTPUT"
          # Whether the header already maps this run's CL: its field rows then take the build as its own
          # reference (the chain step). A proof run re-runs a CL the header already maps, and no other.
          obs_cl="$(node -p "JSON.parse(require('fs').readFileSync('observations.json', 'utf8')).cl")"
          mapped="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse } from "./tool/ci/version-map.mjs";
            process.stdout.write(String(parse(readFileSync(process.argv[1], "utf8"), "the header").builds.some((b) => b.cl === Number(process.argv[2]))));
          ' "$header" "$obs_cl")"
          echo "mapped=$mapped" >> "$GITHUB_OUTPUT"
          if [ "$PROOF" = true ] && [ "$mapped" != true ]; then echo "::error::proof_run re-runs a CL the loader already maps, and the header has no build row for CL-$obs_cl"; exit 2; fi
          status=0
          # A test run measures a CL already in the table again; any other run refuses it.
          node tool/ci/map-mode.mjs write "$header" --input observations.json --report map-mode-report.json --remeasure "$TEST_AUTOPILOT" || status=$?
          cp "$header" version_map.generated.h
          if [ "$status" -ne 0 ]; then echo "::error::map mode refused the update (exit $status); see the log and map-mode-report.json"; exit "$status"; fi
          # The gate: every function key with a row on an earlier CL has one on this CL, present
          # or absent, or is named in the write report's absences. Exit 3 prints the one-line
          # cause (which keys, how many); the error annotation is what the alert shows.
          cl="$(node -p "JSON.parse(require('fs').readFileSync('observations.json', 'utf8')).cl")"
          complete=0
          cause="$(node tool/ci/map-mode.mjs complete "$header" --cl "$cl" --report map-mode-report.json)" || complete=$?
          echo "$cause"
          if [ "$complete" -eq 3 ]; then echo "::error::$cause"; elif [ "$complete" -ne 0 ]; then echo "::error::the completeness check failed (exit $complete); see the log"; fi
          exit "$complete"

      - name: Decide, export, sign, stage and plan the promotion
        id: chain
        env:
          PREVIOUS_CL: ${{ steps.write.outputs.previous_cl }}
          LOADER_SHA: ${{ steps.write.outputs.loader_sha }}
          LOADER_TREE: ${{ steps.write.outputs.loader_tree }}
          MAPPED: ${{ steps.write.outputs.mapped }}
          VMAP_SIGN_KEY_TEST: ${{ secrets.VMAP_SIGN_KEY_TEST }}
        run: |
          set -euo pipefail
          header=version_map.generated.h
          cl="$(node -p "JSON.parse(require('fs').readFileSync('res/result.json','utf8')).checks.exe.cl")"
          # Field rows: the native members on the new CL, the reflected ones
          # that moved, absent rows for what is gone. A refusal (exit 3) is not
          # fatal here: it writes the report and decide holds. Anything else
          # (exit 2: a missing or malformed input, no report) fails the job, so a
          # feed is never built without its member rows.
          # Where the reference layout comes from, in this order:
          #  - a stored-reference proof run: the layout stored for the header's builtCL, never the live public scan;
          #  - layout-reference.json, which the check writes only when it downloaded an older build to compare with
          #    (every branch but public, when that download worked);
          #  - a proof run's CL, or a first publish's when the header holds its build row: already mapped, so the
          #    build is its own reference;
          #  - on public: the layout stored for the header's builtCL (ci/layout-store.mjs), checked against the
          #    header's build row, the exe and the uploader. Steam no longer serves that build once public moves, so
          #    each public check stores the layout it scanned (the layout-store job).
          # No usable reference means no --base and a reason (--base-missing): field-rows refuses while any reflected
          # key is listed (it cannot find what moved), with that reason, and decide holds. Nothing is guessed.
          base=()
          missing=()
          from_store() {
            mkdir -p stored
            if ! gh api "repos/$GH_REPO/releases/tags/vmap-layouts" > stored/release.json 2> stored/release.err; then
              missing=(--base-missing "release vmap-layouts could not be read: $(tr '\n' ' ' < stored/release.err | cut -c1-160)")
              echo "field-rows: no stored reference layout: ${missing[1]}"
              return 0
            fi
            gh release download vmap-layouts --pattern "layout-CL-$PREVIOUS_CL.json" --dir stored 2> /dev/null || true
            exe_sha="$(node -p "JSON.parse(require('fs').readFileSync('res/result.json','utf8')).checks?.exe?.sha256 ?? ''")"
            local why
            if why="$(node tool/ci/layout-store.mjs reference "$header" --record "stored/layout-CL-$PREVIOUS_CL.json" --release stored/release.json --cl "$cl" --sha256 "$exe_sha" \
                --native-keys tool/ci/native-keys.txt --layout-keys res/layout-keys.txt --out res/layout-stored.json 2>&1)"; then
              base=(--base res/layout-stored.json)
              echo "field-rows: $why"
            else
              missing=(--base-missing "$why")
              echo "field-rows: no stored reference layout: $why"
            fi
          }
          if [ "$STORED_REFERENCE" = true ]; then from_store
          elif [ -f res/layout-reference.json ]; then base=(--base res/layout-reference.json)
          elif [ "$PROOF" = true ] || { [ "$FIRST_PUBLISH" = true ] && [ "$MAPPED" = true ]; }; then base=(--base res/layout-target.json); echo "field-rows: CL-$cl is already mapped by the header: the build is its own reference"
          elif [ "$BRANCH" = public ]; then from_store
          else echo "field-rows: no reference layout in the check's artifact (branch $BRANCH); running without --base"; fi
          fr=0
          node tool/ci/field-rows.mjs write "$header" --cl "$cl" --next res/layout-target.json "${base[@]}" "${missing[@]}" \
            --native-keys tool/ci/native-keys.txt --layout-keys res/layout-keys.txt --uses res/layout-uses.txt --sources commits.json --report field-rows.json || fr=$?
          echo "field-rows: exit $fr"
          if [ "$fr" -ne 0 ] && [ "$fr" -ne 3 ]; then echo "::error::field-rows failed (exit $fr): no member rows were written and no report exists; failing the job"; exit "$fr"; fi
          # The gate inputs, from what this run checked.
          node -e '
            const fs = require("fs");
            const read = (f) => JSON.parse(fs.readFileSync(f, "utf8").replace(/^﻿/, ""));
            const put = (f, v) => fs.writeFileSync(f, JSON.stringify(v, null, 2) + "\n");
            const [cl, previousCl] = process.argv.slice(1);
            const r = read("res/result.json");
            put("g1.json", { ok: process.env.BUILD_RESULT === "success" });
            put("g2.json", { ok: r.checks?.fail === false });
            // A proof run measures a CL the header already maps again: G3 passes it then. A first publish
            // builds on a header that already maps its CL (cl equals previousCl): decide lets G3 pass it only with --first-publish as well.
            put("g3.json", { ok: true, cl, previousCl, ...(process.env.PROOF === "true" ? { proof: true } : {}), ...(process.env.FIRST_PUBLISH === "true" ? { firstPublish: true } : {}) });
            // The plugin verdicts: decide holds on any plugin the loader would refuse.
            put("plugins.json", r.plugins ?? { error: "the client check wrote no plugin verdicts" });
            // G4: the client scan, with the SDK value of each global the check compared.
            const scan = read("res/scanner.json");
            const sdk = new Map((r.checks?.sdkGlobals ?? []).map((g) => [g.name.toLowerCase(), g.sdk]));
            for (const p of scan.patterns ?? []) {
              const v = sdk.get(String(p.name).replace(/ \(.*\)$/, "").replace(/^.*::/, "").toLowerCase());
              if (v) p.sdkRva = v;
            }
            put("g4.json", scan);
            // G5: every class of the layout keys that moved, changed or is gone.
            let g5;
            try {
              const l = read("res/layout.json");
              const classes = new Set();
              for (const c of Object.values(l.components ?? {})) for (const m of [...(c.moved ?? []), ...(c.changed ?? []), ...(c.missing ?? [])]) classes.add(m.key.split("::")[0]);
              const used = [...classes].sort();
              g5 = { changedUsedClasses: used.length, changedUsed: used.map((c) => ({ class: c })) };
            } catch (e) { g5 = { error: "no layout report: " + e.message }; }
            put("g5.json", g5);
          ' "$cl" "$PREVIOUS_CL"
          # Rate limits and seq: the history and the feed on the vmap-feed
          # release. No release yet is an empty history and seq 0; any other
          # failure to read it stops the chain.
          if gh api "repos/$GH_REPO/releases/tags/vmap-feed" > release.json 2> release.err; then
            # A release without the feed asset is "no feed": a partial upload leaves one. The history of such a
            # release is not read for a first publish: it names a release that never went out, and the
            # publish job writes the history again.
            has_feed="$(node -p "String((JSON.parse(require('fs').readFileSync('release.json','utf8')).assets ?? []).some((a) => a.name === 'version-map-client.v1.txt'))")"
            if [ "$has_feed" = true ]; then gh release download vmap-feed --pattern version-map-client.v1.txt --dir published; fi
            if [ "$has_feed" = true ] || [ "$FIRST_PUBLISH" != true ]; then gh release download vmap-feed --pattern vmap-history.json --dir published || true; fi
          elif grep -q 'HTTP 404' release.err; then
            echo "no vmap-feed release yet"
          else
            cat release.err; echo "::error::cannot read the vmap-feed release"; exit 2
          fi
          if [ -f published/vmap-history.json ]; then cp published/vmap-history.json history.json; else echo '{"releases":[],"attempts":{}}' > history.json; fi
          last_seq=0
          if [ -f published/version-map-client.v1.txt ]; then
            last_seq="$(node tool/ci/vmap-sign.mjs verify published/version-map-client.v1.txt | sed -n 's/^ok seq=\([0-9]*\) .*/\1/p')"
            [ -n "$last_seq" ] || { echo "::error::the published feed does not verify"; exit 2; }
          fi
          echo "last_seq=$last_seq" >> "$GITHUB_OUTPUT"
          # A first publish is the first: a feed on the release means it is not.
          if [ "$FIRST_PUBLISH" = true ] && [ -f published/version-map-client.v1.txt ]; then echo "::error::first_publish is refused: the vmap-feed release already carries a feed (seq $last_seq)"; exit 2; fi
          # The one seq of this chain, computed here and nowhere else: the TEST-signed feed, the promote
          # plan, the history entry and the release-signed feed of the publish job all carry this number.
          seq="$(node tool/ci/vmap-sign.mjs next-seq --last-seq "$last_seq")"
          echo "seq=$seq" >> "$GITHUB_OUTPUT"
          test_flag=()
          [ "$TEST_AUTOPILOT" = true ] && test_flag=(--test-autopilot)
          [ "$CANDIDATE" = true ] && test_flag=(--candidate)
          first_flag=()
          [ "$FIRST_PUBLISH" = true ] && first_flag=(--first-publish)
          # The other Steam branch's current build: the id the dispatch names (other_buildid; sr-watch passes its
          # poll's), else read live from Steam the way the watcher's poll reads it. Never the id recorded on main:
          # that is the build as of the last merged update PR, so after the other branch moved it names a build
          # that no longer runs there. An id that cannot be read stops the chain here, with the cause.
          other_branch=public; [ "$BRANCH" = public ] && other_branch=public_test_branch
          other_buildid="$OTHER_BUILDID"
          if [ -z "$other_buildid" ]; then
            other_buildid="$(node tool/.github/sr-pipeline/poll-steam.mjs --live-buildid "$other_branch")" \
              || { echo "::error title=Other branch build id::cannot read the live build id of the other Steam branch from Steam, so its rig cannot know what the loader must do there; pass other_buildid to name it"; exit 2; }
          fi
          case "$other_buildid" in ""|*[!0-9]*) echo "::error title=Other branch build id::the build id of the other Steam branch is not a number: '$other_buildid'"; exit 2 ;; esac
          other_cl="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse, clOfBuild } from "./tool/ci/version-map.mjs";
            const cl = clOfBuild(parse(readFileSync(process.argv[1], "utf8"), "the header"), process.argv[2]);
            if (cl !== null) process.stdout.write(String(cl));
          ' "$header" "$other_buildid")"
          echo "other_cl=$other_cl" >> "$GITHUB_OUTPUT"
          # A build the candidate map has no row for cannot be run by the loader: it declines, and the
          # other branch's rig passes only if the decline is clean (decide --other-unmapped).
          other_flag=()
          if [ -n "$other_cl" ]; then other_flag=(--other-cl "$other_cl"); echo "the other branch runs build $other_buildid = CL-$other_cl"
          else other_flag=(--other-unmapped "the other branch runs build $other_buildid"); echo "::notice title=Other branch not in the map::the other branch runs build $other_buildid, which has no row in the candidate map: its rig expects a clean decline"; fi
          # A first publish carries both builds: the other branch's live build must be in the header, with
          # rows, and must not be this run's own. Judged here, before anything is exported or signed.
          if [ "$FIRST_PUBLISH" = true ]; then
            [ -n "$other_cl" ] || { echo "::error::first_publish is refused: the base header has no build row for build $other_buildid, the build the other Steam branch runs now, so the feed would carry no rows for it"; exit 2; }
            [ "$other_cl" != "$cl" ] || { echo "::error::first_publish is refused: public and the other Steam branch run the same CL-$cl, so the feed would not carry two builds"; exit 2; }
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parse, holdsCl } from "./tool/ci/version-map.mjs";
              const h = holdsCl(parse(readFileSync(process.argv[1], "utf8"), "the header"), process.argv[2]);
              if (!h.build || h.rows === 0) { console.log("::error::first_publish is refused: the header holds no function rows for CL-" + process.argv[2] + ", the build the other Steam branch runs now (build row: " + h.build + ", function rows: " + h.rows + ")"); process.exit(2); }
            ' "$header" "$other_cl"
          fi
          # The DLLs the rigs will run (out/rig-plugins.json of the check): the refusals declared to a rig are
          # predicted from their own facts, not from the plugin builds this check judged. Without the file
          # nothing is declared and any refusal fails the rig.
          rig_flag=()
          rig_tags=""
          if [ -f res/rig-plugins.json ]; then
            rig_flag=(--rig-plugins res/rig-plugins.json)
            rig_tags="$(node -p "JSON.parse(require('fs').readFileSync('res/rig-plugins.json','utf8').replace(/^\uFEFF/, '')).tags ?? ''")"
            if [ -n "$rig_tags" ] && ! printf '%s' "$rig_tags" | grep -Eq '^[A-Za-z0-9_.-]+=[A-Za-z0-9][A-Za-z0-9._+-]*( [A-Za-z0-9_.-]+=[A-Za-z0-9][A-Za-z0-9._+-]*)*$'; then
              echo "::error::the rig's tags are not Name=tag pairs the rig takes: $rig_tags"; exit 2
            fi
          else
            echo "::notice title=Rig plugins unknown::the check could not read the DLLs the rigs run: no refusal is declared for them, and the rigs take the Latest releases"
          fi
          echo "rig_tags=$rig_tags" >> "$GITHUB_OUTPUT"
          d=0
          node tool/ci/decide.mjs --repo ModLoader --autopilot tool/state/autopilot.json \
            --g1 g1.json --g2 g2.json --g3 g3.json --g4 g4.json --g5 g5.json --plugins plugins.json --fields field-rows.json \
            --history history.json --out decision.json "${test_flag[@]}" "${first_flag[@]}" "${other_flag[@]}" "${rig_flag[@]}" || d=$?
          decision="$(node -p "JSON.parse(require('fs').readFileSync('decision.json','utf8')).decision")"
          would="$(node -p "JSON.parse(require('fs').readFileSync('decision.json','utf8')).wouldBe ?? ''")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "publishable=false" >> "$GITHUB_OUTPUT"
          # The plugins the loader refuses on this build (decide's expectRefused), in the rig's grammar.
          expect_refused="$(node -p "(JSON.parse(require('fs').readFileSync('decision.json','utf8')).expectRefused ?? []).join(' ')")"
          if [ -n "$expect_refused" ] && ! printf '%s' "$expect_refused" | grep -Eq '^[A-Za-z0-9_.-]+( [A-Za-z0-9_.-]+)*$'; then
            echo "::error::expectRefused is not a list of plugin names the rig takes: $expect_refused"; exit 2
          fi
          echo "expect_refused=$expect_refused" >> "$GITHUB_OUTPUT"
          [ -z "$expect_refused" ] || echo "::notice title=Loader refuses on CL::expected refusals on $BRANCH: $expect_refused"
          expect_refused_other="$(node -p "(JSON.parse(require('fs').readFileSync('decision.json','utf8')).expectRefusedOther ?? []).join(' ')")"
          if [ -n "$expect_refused_other" ] && ! printf '%s' "$expect_refused_other" | grep -Eq '^[A-Za-z0-9_.-]+( [A-Za-z0-9_.-]+)*$'; then
            echo "::error::expectRefusedOther is not a list of plugin names the rig takes: $expect_refused_other"; exit 2
          fi
          echo "expect_refused_other=$expect_refused_other" >> "$GITHUB_OUTPUT"
          echo "expect_decline_other=$(node -p "JSON.parse(require('fs').readFileSync('decision.json','utf8')).expectDeclineOther === true")" >> "$GITHUB_OUTPUT"
          [ -z "$expect_refused_other" ] || echo "::notice title=Loader refuses on CL::expected refusals on the other branch (CL-$other_cl): $expect_refused_other"
          # A test run by the dispatch input, the chain's own flag or the decision itself.
          # A candidate that is not M (the autopilot holds it) is never publishable either.
          is_test="$(node -p "const d = JSON.parse(require('fs').readFileSync('decision.json','utf8')); String(process.env.TEST_INPUT === 'true' || process.env.TEST_AUTOPILOT === 'true' || d.test === true || (d.candidate === true && d.decision !== 'M'))")"
          echo "test=$is_test" >> "$GITHUB_OUTPUT"
          # Each plugin: updated, updated and degraded (what turns off), or held.
          node -e '
            const d = JSON.parse(require("fs").readFileSync("decision.json", "utf8"));
            const md = [`### Map mode: ${d.decision}${d.test ? ` (test run; would be ${d.wouldBe})` : d.candidate && d.decision !== "M" ? ` (publish held; would be ${d.wouldBe})` : ""}`, "", "| Plugin | Status | Off on this CL | Why |", "|---|---|---|---|"];
            for (const p of d.plugins ?? []) {
              const off = p.degraded.map((x) => `${x.key}${x.severity === "high" ? " **(high)**" : ""}`).join(", ");
              const status = p.status === "updated" && p.degraded.length ? "updated, degraded" : p.status;
              md.push(`| ${p.name} | ${status} | ${off} | ${[...p.reasons, ...p.degraded.map((x) => x.why)].join("; ").replace(/[|]/g, "/")} |`);
            }
            md.push("", ...d.reasons.map((r) => `- HOLD: ${r}`), ...d.notes.map((n) => `- ${n}`));
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join("\n") + "\n");
          '
          promote_flag=()
          if [ "$TEST_AUTOPILOT" = true ] && [ "$decision" = HOLD ] && [ "$would" = M ]; then
            echo "decide: HOLD (autopilot disabled); test run: it would be M, so the chain runs on with nothing publishable"
          elif [ "$CANDIDATE" = true ] && [ "$decision" = HOLD ] && [ "$would" = M ]; then
            echo "decide: HOLD (autopilot disabled); publish is held, the candidate chain runs on: export, TEST-sign, stage; nothing is publishable"
            promote_flag=(--test-autopilot)
          elif [ "$decision" != M ]; then echo "decide: $decision (exit $d); nothing exported or signed"; exit 0; fi

          # Path M: the feed, every CL in the header, signed with the TEST key and verified. The export
          # refuses a feed over the size cap itself (FEED_MAX_BYTES in ci/version-map.mjs, below the
          # 1 MiB every loader accepts) and names its size.
          node tool/ci/version-map.mjs export-feed "$header" --out feed.txt
          node --input-type=module -e '
            import { appendFileSync, readFileSync, statSync } from "node:fs";
            import { parse } from "./tool/ci/version-map.mjs";
            const cls = parse(readFileSync(process.argv[1], "utf8"), "the header").builds.map((b) => "CL-" + b.cl);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "\n### Feed export\n\n- " + cls.join(", ") + " (every build in the header), " + statSync("feed.txt").size + " bytes\n");
          ' "$header"
          [ -n "$VMAP_SIGN_KEY_TEST" ] || { echo "::error::the VMAP_SIGN_KEY_TEST secret is not set"; exit 2; }
          node tool/ci/vmap-sign.mjs sign feed.txt --out feed.test-signed.txt --key-id k1 --key-env VMAP_SIGN_KEY_TEST --last-seq "$last_seq" --seq "$seq"
          node tool/ci/vmap-sign.mjs verify feed.test-signed.txt --allow-test-key --last-seq "$last_seq" --expect-seq "$seq"
          # A first publish carries both builds: the CL of this run and the CL of the build the other Steam branch
          # runs now (other_cl, proved above). Judged again on the signed feed itself, before it goes any further.
          if [ "$FIRST_PUBLISH" = true ]; then
            [ -n "$other_cl" ] && [ "$other_cl" != "$cl" ] || { echo "::error::first_publish is refused: no second build to carry"; exit 2; }
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parseFeed, holdsCl } from "./tool/ci/version-map.mjs";
              const NL = String.fromCharCode(10);
              const lines = readFileSync("feed.test-signed.txt", "utf8").split(NL);
              const feed = parseFeed([lines[0], ...lines.slice(2, -2), ""].join(NL), "the feed");
              for (const cl of process.argv.slice(1)) {
                const h = holdsCl(feed, cl);
                if (!h.build || h.rows === 0) { console.log("::error::the first publish feed carries no rows for CL-" + cl + " (build row: " + h.build + ", function rows: " + h.rows + ")"); process.exit(2); }
              }
              console.log("The feed carries rows for CL-" + process.argv.slice(1).join(" and CL-"));
            ' "$cl" "$other_cl"
          fi

          # Stage a build not on public yet; plan the promotion. For such a build the plan is
          # for the day public flips to this exact build; for public, it is the
          # real plan.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { parse } from "./tool/ci/version-map.mjs";
            const r = JSON.parse(readFileSync("res/result.json", "utf8").replace(/^﻿/, ""));
            const cl = Number(r.checks.exe.cl);
            const row = parse(readFileSync("version_map.generated.h", "utf8"), "the header").builds.find((b) => b.cl === cl);
            const hex = (n) => "0x" + n.toString(16).toUpperCase().padStart(8, "0");
            const buildid = String(r.download?.buildid || process.env.BUILDID);
            const scans = [{ exe: process.env.BRANCH, buildid, ok: true }];
            if (r.reference?.status === "used" && process.env.BRANCH !== "public") scans.push({ exe: "public", buildid: String(r.reference.buildid), ok: true });
            const build = { cl, branch: process.env.BRANCH, buildid, productVersion: r.checks.exe.productVersion, exeSha256: r.checks.exe.sha256,
              imageStamp: hex(row.stamp), size: row.size, run: Number(process.env.RUN_ID), scans,
              repo: { sha: process.env.LOADER_SHA, tree: process.env.LOADER_TREE, verdict: "FIXED" } };
            writeFileSync("build.json", JSON.stringify(build, null, 1));
            writeFileSync("public.json", JSON.stringify({ buildid: Number(buildid), exeSha256: build.exeSha256, cl }));
            // This run scanned this exe: the loader registry (checks) and every
            // plugin. That is the re-scan promote asks for; it fails when either did.
            // Per plugin: a held or degraded plugin does not fail the re-scan;
            // pluginsOk (decide) is false only for a verdict nothing can turn off.
            const d = JSON.parse(readFileSync("decision.json", "utf8"));
            writeFileSync("verify.json", JSON.stringify({ ok: r.checks?.fail === false && d.pluginsOk === true, exe: process.env.BRANCH, buildid }));
          '
          if [ -f tool/state/staged.json ]; then cp tool/state/staged.json staged.json; else echo '{}' > staged.json; fi
          # A build not on public yet is staged (branch and index entry). A build first seen on public gets the
          # same branch for its candidate loader and the rig, with no index entry (ci/staging.mjs).
          node tool/ci/staging.mjs stage --build build.json --index staged.json --out stage-plan.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("stage-plan.json","utf8")); if (p.index) fs.writeFileSync("staged.json", JSON.stringify(p.index, null, 1));'
          echo "staged=true" >> "$GITHUB_OUTPUT"
          [ "$TEST_AUTOPILOT" = true ] && promote_flag=(--test-autopilot)
          p=0
          node tool/ci/promote.mjs plan --index staged.json --public public.json --autopilot tool/state/autopilot.json \
            --history history.json --last-seq "$last_seq" --seq "$seq" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --verify verify.json --out promote-plan.json "${promote_flag[@]}" || p=$?
          IS_TEST="$is_test" node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            import { isPublishable } from "./tool/ci/promote.mjs";
            const p = JSON.parse(readFileSync("promote-plan.json", "utf8"));
            for (const l of p.lines ?? []) console.log("promote: " + l);
            // Publishable: a promotion, or the build of public on a new CL with
            // nothing staged (normal flow; decide M of this run is the map).
            // A test run is never publishable (ci/promote.mjs isPublishable).
            const ok = isPublishable(p, { testRun: process.env.IS_TEST === "false" ? false : true, branch: process.env.BRANCH });
            appendFileSync(process.env.GITHUB_OUTPUT, "action=" + (p.action ?? "") + "\npublishable=" + ok + "\n");
          '
          echo "promote: exit $p (a plan only; the publish job signs with the release key)"

      - name: Upload the header and the chain
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-mode-${{ inputs.branch }}
          path: |
            version_map.generated.h
            map-mode-report.json
            alerts.json
            carry.json
            observations.json
            field-rows.json
            g?.json
            history.json
            decision.json
            feed.txt
            feed.test-signed.txt
            build.json
            stage-plan.json
            staged.json
            promote-plan.json
            plugins.json
            verify.json
          if-no-files-found: warn
          retention-days: 14

  # ---- Publish: the feed signed with the release key ---------------------
  # Publishes with nobody at the keyboard, when and only when every one of these holds:
  #   - the run is for public (the feed it signs carries every build in the loader's map, the
  #     build the other Steam branch runs included; owner, 2026-11-08: every build we can reach);
  #   - the publish input is on (sr-watch passes it, a dispatch sets it; a dispatch without it is
  #     a dry run) - and it is never a test_autopilot run;
  #   - decide chose M, which it does only with state/autopilot.json enabled: with the autopilot
  #     disabled the decision is HOLD and this job is skipped ("publish skipped"); a first
  #     publish is the one exception (below);
  #   - the chain marked it publishable (ci/promote.mjs isPublishable) and is not a test run;
  #   - both client rigs (rig-branch, rig-other) ended with verdict PASS on the candidate
  #     loader: a failed, cancelled or skipped rig keeps the feed unsigned;
  #   - the feed gate (feed-gate) ended PASS, or SKIP with its reason (the feed adds or changes no
  #     row for the build of either Steam branch compared with the compiled map of the release the
  #     feed-path rig would run): the feed as players read it was tested in the real game, or has
  #     nothing to test.
  # Right before it signs, the job reads state/autopilot.json on main again: a chain that was
  # already running when the autopilot was turned off stops there.
  # A first publish (the first_publish dispatch input, for one publish) differs only in the
  # autopilot: decide took it as on for path M for that run, so the job does not read
  # state/autopilot.json (which is never changed) and checks instead that this repository's
  # vmap-feed release carries no feed. The chain's decision must carry the first-publish mark,
  # and no other chain may.
  # The promote step (ci/promote.mjs plan, in map-mode) only writes a plan; this is the one job
  # that acts on it. The only job that reads the release key (k2, VMAP_SIGN_KEY in the vmap-sign
  # environment, deployments from main only). It signs the chain's feed with the chain's one seq
  # (map-mode computed it once; it must still rise above the live feed's), uploads the feed and
  # the history to the vmap-feed release, then downloads what was published and verifies its
  # signature, seq and sha256.
  publish:
    name: publish the feed
    needs: [check, map-mode, rig-branch, rig-other, feed-gate]
    if: ${{ !cancelled() && inputs.test_autopilot != true && inputs.proof_run != true && inputs.publish == true && needs.map-mode.outputs.test == 'false' && inputs.branch == 'public' && needs.map-mode.outputs.decision == 'M' && needs.map-mode.outputs.publishable == 'true' && needs.rig-branch.result == 'success' && needs.rig-branch.outputs.verdict == 'PASS' && needs.rig-other.result == 'success' && needs.rig-other.outputs.verdict == 'PASS' && needs.feed-gate.result == 'success' && (needs.feed-gate.outputs.state == 'PASS' || needs.feed-gate.outputs.state == 'SKIP') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vmap-sign
    concurrency:
      group: vmap-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TEST_INPUT: ${{ inputs.test_autopilot == true || inputs.proof_run == true }}
      CHAIN_SEQ: ${{ needs.map-mode.outputs.seq }}
      FIRST_PUBLISH: ${{ needs.map-mode.outputs.first_publish }}
    steps:
      - name: Check out the sign tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the chain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: map-mode-${{ inputs.branch }}
          path: chain

      - name: Refuse a test run
        # Second lock behind the job condition: nothing a test run produced is
        # ever signed with the release key, whatever state/autopilot.json says.
        # The unattended chain's own M carries wouldBe M; a test run or
        # a held decision carries a mark of its own.
        run: |
          set -euo pipefail
          [ "$TEST_INPUT" = false ] || { echo "::error::a test run never publishes"; exit 2; }
          node -e '
            const read = (f) => JSON.parse(require("fs").readFileSync("chain/" + f, "utf8"));
            const d = read("decision.json"), p = read("promote-plan.json");
            const ownM = d.decision === "M" && d.wouldBe === "M";
            if (d.test !== undefined || (d.wouldBe !== undefined && !ownM) || p.test !== undefined) { console.error("::error::the chain is marked a test run; refusing to sign it"); process.exit(2); }
            // The first-publish mark and the first_publish input of this run must agree: a chain that skipped the
            // autopilot is signed only by the run that asked for it, and a first publish never goes the ordinary way.
            if ((d.firstPublish === true) !== (process.env.FIRST_PUBLISH === "true")) { console.error("::error::the chain and this run disagree on first_publish; refusing to sign it"); process.exit(2); }
          '

      - name: Check that no feed is published yet
        if: ${{ env.FIRST_PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/releases/tags/vmap-feed" > first-release.json 2> first-release.err; then
            has="$(node -p "String((JSON.parse(require('fs').readFileSync('first-release.json','utf8')).assets ?? []).some((a) => a.name === 'version-map-client.v1.txt'))")"
            [ "$has" = false ] || { echo "::error::first_publish is refused: the vmap-feed release already carries a feed; nothing was signed"; exit 2; }
          elif grep -q 'HTTP 404' first-release.err; then
            echo "no vmap-feed release yet"
          else
            cat first-release.err; echo "::error::cannot read the vmap-feed release"; exit 2
          fi
          echo "No feed is published yet: this is the first publish."

      - name: Check the seq and the feed before signing
        run: |
          set -euo pipefail
          # The chain's one seq: a number, and the plan (when it states one) says the same.
          case "$CHAIN_SEQ" in ''|0*|*[!0-9]*) echo "::error::the chain carries no usable seq ('$CHAIN_SEQ')"; exit 2 ;; esac
          node -e '
            const p = JSON.parse(require("fs").readFileSync("chain/promote-plan.json", "utf8"));
            if (p.seq !== null && p.seq !== undefined && String(p.seq) !== process.env.CHAIN_SEQ) { console.error("::error::the promote plan states seq " + p.seq + ", not the chain seq " + process.env.CHAIN_SEQ); process.exit(2); }
          '
          # The live seq, read again now: another publish may have landed since the chain ran.
          # No release yet is seq 0; a release that cannot be read, or a feed that does not verify, stops.
          # A release without the feed asset is no feed either (a partial upload leaves one): seq 0, and the
          # re-run signs again. A feed asset that does not verify stops the job; it is never replaced.
          last_seq=0
          if gh api "repos/$GH_REPO/releases/tags/vmap-feed" > live-release.json 2> live-release.err; then
            has_feed="$(node -p "String((JSON.parse(require('fs').readFileSync('live-release.json','utf8')).assets ?? []).some((a) => a.name === 'version-map-client.v1.txt'))")"
            if [ "$has_feed" = true ]; then
              gh release download vmap-feed --pattern version-map-client.v1.txt --dir live
              last_seq="$(node tool/ci/vmap-sign.mjs verify live/version-map-client.v1.txt | sed -n 's/^ok seq=\([0-9]*\) .*/\1/p')"
              [ -n "$last_seq" ] || { echo "::error::the published feed does not verify"; exit 2; }
            else
              echo "the vmap-feed release has no feed asset yet"
            fi
          elif grep -q 'HTTP 404' live-release.err; then
            echo "no vmap-feed release yet"
          else
            cat live-release.err; echo "::error::cannot read the vmap-feed release"; exit 2
          fi
          echo "$last_seq" > last-seq.txt
          if [ "$CHAIN_SEQ" -le "$last_seq" ]; then
            echo "::error::the chain's seq $CHAIN_SEQ no longer rises above the published seq $last_seq (another publish landed since); nothing was signed, the chain has to run again"; exit 2
          fi
          # The feed is cut again from the chain's header. It must be the feed the chain staged, byte for byte.
          node tool/ci/version-map.mjs export-feed chain/version_map.generated.h --out feed.again.txt
          cmp -s chain/feed.txt feed.again.txt || { echo "::error::the feed the chain staged differs from the export of the chain's header; nothing was signed, the chain has to run again"; exit 2; }

      # The switch as it is on main now, read right before the key is used. The chain read it when it
      # started, hours ago: turning the autopilot off must stop a chain that is already running.
      # Fails closed: a file that cannot be read, is malformed, is not enabled or does not allow path M stops the job.
      - name: Check the autopilot is still on
        if: ${{ env.FIRST_PUBLISH != 'true' }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/state/autopilot.json?ref=main" > autopilot.main.json             || { echo "::error::cannot read state/autopilot.json on main; nothing was signed"; exit 2; }
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { checkAutopilot } from "./tool/ci/decide.mjs";
            let value;
            try { value = JSON.parse(readFileSync("autopilot.main.json", "utf8")); } catch { console.error("::error::state/autopilot.json on main is not JSON; nothing was signed"); process.exit(2); }
            const ap = checkAutopilot({ ok: true, value });
            if (ap.error) { console.error("::error::" + ap.error + "; nothing was signed"); process.exit(2); }
            if (!ap.enabled) { console.error("::error::the autopilot was turned off on main while this chain ran; nothing was signed"); process.exit(2); }
            if (!ap.paths.includes("M")) { console.error("::error::path M is no longer enabled in the autopilot on main; nothing was signed"); process.exit(2); }
            console.log("The autopilot is on for path M on main.");
          '

      - name: Sign with the release key, verify, publish
        env:
          VMAP_SIGN_KEY: ${{ secrets.VMAP_SIGN_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VMAP_SIGN_KEY" ] || { echo "::error::the VMAP_SIGN_KEY secret is not set"; exit 2; }
          last_seq="$(cat last-seq.txt)"
          node tool/ci/vmap-sign.mjs sign chain/feed.txt --out version-map-client.v1.txt --key-id k2 --last-seq "$last_seq" --seq "$CHAIN_SEQ"
          node tool/ci/vmap-sign.mjs verify version-map-client.v1.txt --last-seq "$last_seq" --expect-seq "$CHAIN_SEQ"
          node -e '
            const fs = require("fs");
            const h = JSON.parse(fs.readFileSync("chain/history.json", "utf8"));
            const d = JSON.parse(fs.readFileSync("chain/decision.json", "utf8"));
            h.releases.push({ repo: "ModLoader", cl: d.cl, at: new Date().toISOString(), seq: Number(process.env.CHAIN_SEQ) });
            fs.writeFileSync("vmap-history.json", JSON.stringify(h, null, 1) + "\n");
          '
          gh release view vmap-feed > /dev/null 2>&1 || gh release create vmap-feed --title "Version map feed" --notes "The signed version map feed the loader fetches."
          # The history first: if only one upload lands, the history may name a release that is not out
          # (a re-run signs again: a release without the feed asset counts as no feed), never a feed that the
          # history does not know. The first publish uploads the feed without --clobber, so a feed that is
          # there is never replaced.
          gh release upload vmap-feed vmap-history.json --clobber
          if [ "$FIRST_PUBLISH" = true ]; then gh release upload vmap-feed version-map-client.v1.txt
          else gh release upload vmap-feed version-map-client.v1.txt --clobber; fi

      - name: Verify what was published
        run: |
          set -euo pipefail
          # Download the assets as the loader will, and check them against what was signed here.
          gh release download vmap-feed --pattern version-map-client.v1.txt --pattern vmap-history.json --dir published --clobber
          out="$(node tool/ci/vmap-sign.mjs verify published/version-map-client.v1.txt --expect-seq "$CHAIN_SEQ")"
          echo "$out"
          case "$out" in "ok seq=$CHAIN_SEQ key=k2") ;; *) echo "::error::the published feed is not seq $CHAIN_SEQ signed with the release key k2: $out"; exit 2 ;; esac
          for f in version-map-client.v1.txt vmap-history.json; do
            want="$(sha256sum "$f" | cut -d' ' -f1)"
            got="$(sha256sum "published/$f" | cut -d' ' -f1)"
            [ "$want" = "$got" ] || { echo "::error::the published $f has sha256 $got, not the $want that was signed and uploaded"; exit 2; }
            echo "$f sha256 $got"
          done
          echo "### Published the feed: seq $CHAIN_SEQ, release key k2, sha256 $(sha256sum published/version-map-client.v1.txt | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

  # ---- Push: the staged map rows to the loader fork -----------------------
  # The only job that reads the loader fork's deploy key (SR_DEPLOYKEY_MODLOADER,
  # environment fork-push), limited on the fork by a ruleset to auto/**. It runs
  # no plugin code and no action but actions/checkout: it takes the header the
  # map-mode job wrote and the loader commit that job read it from, adds one
  # commit that changes only that header, and pushes auto/update-<CL> (ci/staging.mjs
  # push: one repository, one branch pattern, never a tag, never a force). The
  # branch is the input of the next steps: the candidate-loader job and the client rig.
  # A missing key fails the job with its name; it never skips quietly. A test run
  # and a run whose chain held have nothing to push and skip. A build first seen on
  # public is pushed too.
  # The base is loader_repo at the commit the header was read from (AlienX's released line,
  # main, unless a dispatch names another), checked out with its full history; the branch
  # is pushed to the fork on top of it. Only a first publish takes a branch of the fork
  # (auto/update-<CL>-<run>-<attempt>) as its base, and then only as the first step checks.
  push-loader:
    name: push the map rows to the loader fork
    needs: [map-mode]
    if: ${{ !cancelled() && needs.map-mode.result == 'success' && needs.map-mode.outputs.staged == 'true' && inputs.test_autopilot != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fork-push
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
    env:
      # Where the rows were read from, and the only repository this job writes to.
      LOADER_REPO: ${{ inputs.loader_repo }}
      PUSH_REPO: msantoro12/StarRupture-ModLoader
      # A proof run and a first publish push auto/update-<CL>-<run>-<attempt> only, never the plain name.
      PROOF: ${{ inputs.proof_run == true || needs.map-mode.outputs.first_publish == 'true' }}
      # A first publish whose candidate header is its base's own has no commit to push: the base is the candidate.
      FIRST_PUBLISH: ${{ needs.map-mode.outputs.first_publish == 'true' }}
    steps:
      - name: Check the first-publish base
        if: ${{ needs.map-mode.outputs.first_publish == 'true' }}
        env:
          LOADER_REF: ${{ inputs.loader_ref }}
        run: |
          [ "$LOADER_REPO" = "$PUSH_REPO" ] && [[ "$LOADER_REF" =~ ^auto/update-[0-9]+-[0-9]+-[0-9]+$ ]] \
            || { echo "::error::first_publish builds on a branch auto/update-<CL>-<run>-<attempt> of $PUSH_REPO; nothing was pushed"; exit 2; }

      - name: Check the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.SR_DEPLOYKEY_MODLOADER }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error title=Loader deploy key missing::the secret SR_DEPLOYKEY_MODLOADER is not set in the environment fork-push of $GITHUB_REPOSITORY (or the caller does not pass it by name); the candidate map rows cannot be pushed to the loader fork. Setup: ci/MAP-MODE.md, step 26."
            exit 1
          fi

      - name: Check out the push tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the chain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: map-mode-${{ inputs.branch }}
          path: chain

      - name: Check the target
        id: base
        run: |
          set -euo pipefail
          # The repository and the branch name come from the chain; both are checked against the allowlist before a key is used.
          node tool/ci/staging.mjs target --repo "$PUSH_REPO" --plan chain/stage-plan.json
          sha="$(node -p "JSON.parse(require('fs').readFileSync('chain/build.json','utf8')).repo.sha")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::build.json names no loader commit'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the loader at the commit the rows were read from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ steps.base.outputs.sha }}
          path: loader
          # Whole history: the fork's refs need not hold this commit, and the push must not be shallow.
          fetch-depth: 0
          persist-credentials: false

      - name: Commit the header and push the branch
        id: push
        env:
          DEPLOY_KEY: ${{ secrets.SR_DEPLOYKEY_MODLOADER }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -f "$ssh_dir/key"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key")
          # GitHub's published host keys, not trust on first use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          out="$(node tool/ci/staging.mjs push --repo "$PUSH_REPO" --plan chain/stage-plan.json --build chain/build.json \
            --header chain/version_map.generated.h --checkout loader --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --proof "$PROOF" --first-publish "$FIRST_PUBLISH")"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "Loader fork: $(echo $out)" >> "$GITHUB_STEP_SUMMARY"

  # ---- Candidate loader: the pushed rows, built and tested ----------------
  # Builds the loader from exactly the commit push-loader pushed (the loader
  # with the candidate map rows) the way sr-build-all.yml does (Client Release,
  # the same build action, a build tag), runs the loader's VersionMapTests and
  # LayoutCheckTests on that commit, and uploads the build in the layout the
  # client rig takes as a candidate (dwmapi.dll and ModLoader/*.dll, no plugins).
  # A failing build or test fails the job, so nothing downstream gets a candidate.
  # No secrets and no environment: it runs loader code from the owner's fork,
  # which is what the push job just wrote. The build tag is the exact string the
  # loader prints as "[init] Build: <tag> (client)" in ModLoader.log (the verdict
  # script's loader_build_line check compares it with the rig's expect=Loader=...),
  # and the job checks it is compiled into the built DLL before it uploads.
  candidate-loader:
    name: candidate loader
    needs: [push-loader]
    if: ${{ !cancelled() && needs.push-loader.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.out.outputs.artifact }}
      version: ${{ steps.out.outputs.version }}
      expect: ${{ steps.out.outputs.expect }}
      sha: ${{ steps.out.outputs.sha }}
    env:
      LOADER_SHA: ${{ needs.push-loader.outputs.sha }}
      ARTIFACT: loader-candidate-${{ inputs.branch }}
    steps:
      - name: Name the build
        id: tag
        shell: pwsh
        run: |
          # The commit is push-loader's output; nothing else is built here.
          if ($env:LOADER_SHA -notmatch '^[0-9a-f]{40}$') { throw "push-loader named no loader commit ('$($env:LOADER_SHA)')" }
          # Unique per run and commit, and a plain token: the rig's expect value takes letters, digits and . _ + -
          "tag=cand-$($env:GITHUB_RUN_ID)-$($env:LOADER_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      - name: Check out the loader at the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msantoro12/StarRupture-ModLoader
          ref: ${{ needs.push-loader.outputs.sha }}
          # The Game SDK is the loader's own submodule: the build uses the commit the loader pins.
          submodules: recursive
          persist-credentials: false

      - name: Check it is that commit
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne $env:LOADER_SHA) { throw "checked out $head, push-loader pushed $($env:LOADER_SHA)" }
          "Loader msantoro12/StarRupture-ModLoader at $head"

      # After the loader checkout, so its clean step does not remove it.
      - name: Check out the build action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Build Client Release
        uses: ./ci-actions/.github/actions/build-loader
        with:
          configuration: Client Release
          build_tag: ${{ steps.tag.outputs.tag }}
          manifest_url: ${{ github.server_url }}/msantoro12/StarRupture-ModLoader/releases/latest/download/manifest-client.json

      # The loader's test projects are not part of the solution build; each is
      # built from its project file, as Tests/README.md says, and its exit code is its verdict.
      - name: VersionMapTests
        shell: pwsh
        run: |
          msbuild "Tests\VersionMapTests\VersionMapTests.vcxproj" /p:Configuration="Client Release" /p:Platform=x64 /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "VersionMapTests did not build (exit $LASTEXITCODE)" }
          & "build\tests\version_map_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "VersionMapTests failed (exit $LASTEXITCODE)" }

      - name: LayoutCheckTests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          msbuild "Tests\LayoutCheckTests\LayoutCheckTests.vcxproj" /p:Configuration="Client Release" /p:Platform=x64 /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "LayoutCheckTests did not build (exit $LASTEXITCODE)" }
          & "build\tests\layout_check_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "LayoutCheckTests failed (exit $LASTEXITCODE)" }

      - name: Check the build
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $dir = 'build\Client Release'
          foreach ($f in 'dwmapi.dll', 'ModLoader\StarRupture-ModLoader-Core.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "the build has no $f" }
          }
          # The loader prints its compiled-in build tag; it must be the one named above.
          $core = [IO.File]::ReadAllBytes((Join-Path $dir 'ModLoader\StarRupture-ModLoader-Core.dll'))
          if (-not [Text.Encoding]::Latin1.GetString($core).Contains($env:TAG, [StringComparison]::Ordinal)) {
            throw "the build tag $($env:TAG) is not compiled into StarRupture-ModLoader-Core.dll"
          }
          "Build tag $($env:TAG) is in the Core DLL."

      - name: Upload the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          # Same files as the loader-client artifact of sr-build-all.yml: dwmapi.dll and ModLoader/*.dll at the root, no plugins.
          path: |
            build/Client Release/dwmapi.dll
            build/Client Release/ModLoader/*.dll
          if-no-files-found: error
          retention-days: 7

      - name: Name the candidate
        id: out
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          "artifact=$($env:ARTIFACT)" >> $env:GITHUB_OUTPUT
          "version=$($env:TAG)" >> $env:GITHUB_OUTPUT
          "expect=Loader=$($env:TAG)" >> $env:GITHUB_OUTPUT
          "sha=$($env:LOADER_SHA)" >> $env:GITHUB_OUTPUT
          "Candidate loader $($env:TAG): artifact $($env:ARTIFACT) of run $($env:GITHUB_RUN_ID), loader commit $($env:LOADER_SHA)" >> $env:GITHUB_STEP_SUMMARY

  # ---- Client rig: the candidate loader in the real game, on both branches ----
  # A REQUIRED gate on the unattended path (owner: "we will do auto verify and
  # deploy with the github rig for version updates"). Two calls of the reusable
  # sr-client-rig.yml, each launching the real client under the real Steam client
  # with the candidate loader (candidate-loader's artifact, this run's id) laid over
  # the plugin releases the check read (the `tags` input: the Latest released plugins and
  # the reviewed release of MiniMap, resolved and read once in the check job):
  #   rig-branch  the Steam branch this check is for, with map-mode's expect_refused:
  #               the plugins the loader refuses on that build must be refused, and
  #               every other plugin must load.
  #   rig-other   the other Steam branch (public <-> public_test_branch) with the refusals
  #               the loader's own rule predicts for THAT branch's current build
  #               (map-mode's expect_refused_other: decide's loaderRefusal on the other
  #               branch's CL, the CL found through its build id in the candidate map),
  #               plus the plugins whose interface the candidate loader does not accept
  #               (the scanner's REFUSED), which it refuses on every build.
  #               Its current build must keep working with the same DLLs: a refusal the
  #               rule predicts there (a v70 plugin on a newer build) is declared, and any
  #               refusal it does not predict is a fail. Public is never excused by hand:
  #               when that CL cannot be named, nothing is declared and a refusal fails.
  # They run one after the other: the rig's concurrency group keeps only one pending run,
  # so a second queued call would cancel the first. rig-other waits for rig-branch whatever
  # its result (!cancelled() keeps it running after a failure), so a failing first rig does
  # not hide the second one's verdict. A rig fails its job on a FAIL verdict.
  # The call jobs set no environment (the rig's job runs in steam-client, which serves main
  # only, so the whole run must be on main). Each passes both Steam secrets by name and asks
  # for the rig's own permissions (contents: read, actions: read); sr-watch's client-check
  # job grants the same ceiling. Nesting: sr-watch -> sr-client-check -> sr-client-rig.
  rig-branch:
    name: client rig (${{ inputs.branch }})
    needs: [map-mode, candidate-loader]
    if: ${{ !cancelled() && needs.map-mode.result == 'success' && needs.candidate-loader.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sr-client-rig.yml
    with:
      branch: ${{ inputs.branch }}
      candidate_run_id: ${{ github.run_id }}
      candidate_artifact: ${{ needs.candidate-loader.outputs.artifact }}
      expect: ${{ needs.candidate-loader.outputs.expect }}
      tags: ${{ needs.map-mode.outputs.rig_tags }}
      expect_refused: ${{ needs.map-mode.outputs.expect_refused }}
    secrets:
      STEAM_CI_USERNAME: ${{ secrets.STEAM_CI_USERNAME }}
      STEAM_CI_LOGIN_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}

  rig-other:
    name: client rig (${{ inputs.branch == 'public' && 'public_test_branch' || 'public' }})
    needs: [map-mode, candidate-loader, rig-branch]
    if: ${{ !cancelled() && needs.map-mode.result == 'success' && needs.candidate-loader.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sr-client-rig.yml
    with:
      branch: ${{ inputs.branch == 'public' && 'public_test_branch' || 'public' }}
      candidate_run_id: ${{ github.run_id }}
      candidate_artifact: ${{ needs.candidate-loader.outputs.artifact }}
      expect: ${{ needs.candidate-loader.outputs.expect }}
      tags: ${{ needs.map-mode.outputs.rig_tags }}
      expect_refused: ${{ needs.map-mode.outputs.expect_refused_other }}
      # A build the candidate map has no row for: this rig passes only on a clean decline.
      expect_decline: ${{ needs.map-mode.outputs.expect_decline_other }}
    secrets:
      STEAM_CI_USERNAME: ${{ secrets.STEAM_CI_USERNAME }}
      STEAM_CI_LOGIN_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}

  # ---- Feed-path rig: the feed the loader reads, in the real game --------
  # The two rigs above run the candidate loader with its map rows compiled in. Players run
  # the released loader and get the new build's rows from the signed feed, so this gate runs
  # that path: a loader built from AlienX's Latest release tag, unchanged except for one
  # compiler define (VMAP_TRUST_TEST_KEY, so it trusts the TEST key k1 this run's feed is
  # signed with), on the public Steam branch with the same plugin set as the public candidate
  # rig, its feed cache seeded with this run's TEST-signed feed. It passes only
  # when the loader's log shows the feed verified and applied (seq), rows of the running
  # build's CL came from the feed, and every plugin loads under the same verdict rules and
  # expected refusals as the public candidate rig (ci/verdict.ps1, the "feed" record of set.json).
  # It skips, with its reason in the summary, only when the feed adds no row and changes no row
  # for the running CL compared with the compiled map of that tag (version-map.mjs feedDelta):
  # then the loader runs on the compiled rows with or without the feed. A row the tag does not
  # hold for that CL, or holds with other values, is a row the feed delivers, so the rig runs and
  # has to pass. It fails when the feed is missing or does not carry the CL. The publish job
  # needs this gate's PASS or its named skip.
  # Which route: the define comes from the CL environment variable of the build step (cl.exe
  # prepends it to every compile), so the loader source is unchanged; no patch, no source edit.
  # The cache is seeded, the fetch is not tried: the rig turns [AutoUpdate] off, no feed URL is
  # compiled in (this build passes no VmapFeedUrl), and the rig's firewall blocks every exe of
  # the install, so no request can leave and the outcome does not depend on the compiled-in URL.
  # The verdict still fails a run that logs a fetch. The build is a rig input only, in an
  # artifact that feed-loader-cleanup deletes as soon as the rig has ended (see there). It runs
  # after the two candidate rigs, in the same Steam concurrency group (the rig workflow's), and
  # for runs of the public branch only.
  # The feed carries every build in the header, so there are two legs on the same loader build:
  # one for the build the run checked (rig-feed) and one for the build the other Steam branch runs
  # (rig-feed-other, when the candidate map holds it). Each leg has its own plan: it runs only when
  # the feed adds or changes a row for that build compared with the compiled map of the release, and
  # skips with its reason otherwise. The gate passes when no leg fails.
  # A proof run (dispatch only, publish off) can name feed_loader_ref: a branch of
  # msantoro12/StarRupture-ModLoader built instead of the Latest release, for example one
  # without public's rows, so the feed is the only source of them. sr-watch cannot set it.
  feed-plan:
    name: feed-path rig plan
    needs: [map-mode, rig-branch, rig-other]
    if: ${{ !cancelled() && inputs.branch == 'public' && needs.map-mode.result == 'success' && needs.map-mode.outputs.staged == 'true' && inputs.test_autopilot != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      state: ${{ steps.plan.outputs.state }}
      reason: ${{ steps.plan.outputs.reason }}
      owner: ${{ steps.plan.outputs.owner }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      cl: ${{ steps.plan.outputs.cl }}
      seq: ${{ steps.plan.outputs.seq }}
      # The second leg: the build the other Steam branch runs (empty cl when the candidate map holds no row for it).
      other_state: ${{ steps.plan.outputs.other_state }}
      other_reason: ${{ steps.plan.outputs.other_reason }}
      other_cl: ${{ steps.plan.outputs.other_cl }}
    env:
      GH_TOKEN: ${{ github.token }}
      MOD_OWNER: ${{ vars.MOD_OWNER || 'AlienXAXS' }}
      SEQ: ${{ needs.map-mode.outputs.seq }}
      OTHER_CL: ${{ needs.map-mode.outputs.other_cl }}
      RIG_TAGS: ${{ needs.map-mode.outputs.rig_tags }}
      FEED_LOADER_REF: ${{ contains(github.workflow_ref, '/.github/workflows/sr-client-check.yml@') && inputs.feed_loader_ref || '' }}
      PUBLISH: ${{ inputs.publish == true }}
    steps:
      - name: Check out the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci
          persist-credentials: false

      # A missing artifact is a FAIL state of the plan, not a crash of the job: the gate names it.
      - name: Download the chain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: map-mode-${{ inputs.branch }}
          path: chain

      - name: Plan the feed-path rig
        id: plan
        run: |
          set -uo pipefail
          finish() { r="$(printf '%s' "$2" | tr '\r\n' '  ')"; echo "state=$1" >> "$GITHUB_OUTPUT"; echo "reason=$r" >> "$GITHUB_OUTPUT"; echo "$1: $r"; exit 0; }
          # Whether the signed feed holds a build row for a CL.
          feed_has_build() {
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parseFeed } from "./tool/ci/version-map.mjs";
              const NL = String.fromCharCode(10);
              const [file, cl] = process.argv.slice(1);
              const lines = readFileSync(file, "utf8").split(NL);
              const map = parseFeed([lines[0], ...lines.slice(2, -2), ""].join(NL), file);
              process.stdout.write(map.builds.some((b) => b.cl === Number(cl)) ? "yes" : "no");
            ' "$@"
          }
          # What the feed adds to, or changes in, the rows the compiled map holds for the CL:
          # "<added> <changed> <the first names>" (version-map.mjs feedDelta).
          feed_delta() {
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { feedDelta, parse, parseFeed } from "./tool/ci/version-map.mjs";
              const NL = String.fromCharCode(10);
              const [feedFile, headerFile, cl] = process.argv.slice(1);
              const lines = readFileSync(feedFile, "utf8").split(NL);
              const feed = parseFeed([lines[0], ...lines.slice(2, -2), ""].join(NL), feedFile);
              const d = feedDelta(feed, parse(readFileSync(headerFile, "utf8"), headerFile), Number(cl));
              const names = [...d.added.map((n) => "adds " + n), ...d.changed.map((n) => "changes " + n)];
              process.stdout.write(d.added.length + " " + d.changed.length + " " + names.slice(0, 5).join("; ") + (names.length > 5 ? "; and " + (names.length - 5) + " more" : ""));
            ' "$@"
          }
          case "$MOD_OWNER" in msantoro12|AlienXAXS) ;; *) finish FAIL "MOD_OWNER '$MOD_OWNER' is not an owner the pipeline reads" ;; esac
          if [ -n "$FEED_LOADER_REF" ]; then
            [ "$PUBLISH" = false ] || finish FAIL "feed_loader_ref is for a proof run and is refused with publish on"
            printf '%s' "$FEED_LOADER_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$' && ! printf '%s' "$FEED_LOADER_REF" | grep -Eq '\.\.|//|/$|\.lock$|\.$' \
              || finish FAIL "feed_loader_ref is not a plain branch name of msantoro12/StarRupture-ModLoader"
          fi
          [ -f chain/feed.test-signed.txt ] || finish FAIL "the map-mode artifact holds no TEST-signed feed (feed.test-signed.txt): this run produced no feed to seed"
          case "$SEQ" in ''|0*|*[!0-9]*) finish FAIL "the chain carries no usable seq ('$SEQ')" ;; esac
          out="$(node tool/ci/vmap-sign.mjs verify chain/feed.test-signed.txt --allow-test-key --expect-seq "$SEQ" 2>&1)" || finish FAIL "the TEST-signed feed does not verify: $out"
          [ "$out" = "ok seq=$SEQ key=k1 TEST-KEY" ] || finish FAIL "the feed is not signed with the TEST key k1 at seq $SEQ: $out"
          cl="$(node -p "String(JSON.parse(require('fs').readFileSync('chain/decision.json','utf8')).cl ?? '')" 2>/dev/null || true)"
          case "$cl" in ''|0*|*[!0-9]*) finish FAIL "decision.json names no CL for the running build ('$cl')" ;; esac
          in_feed="$(feed_has_build chain/feed.test-signed.txt "$cl" 2>&1)" || finish FAIL "the feed does not parse: $in_feed"
          [ "$in_feed" = yes ] || finish FAIL "the feed carries no build row for CL-$cl, the running build"
          # The loader the rig builds: the owner's branch of a proof run, else the Latest release of
          # the loader repository (or the tag the rig's tags name).
          owner="$MOD_OWNER"
          if [ -n "$FEED_LOADER_REF" ]; then
            owner=msantoro12
            sha="$(gh api "repos/$owner/StarRupture-ModLoader/git/ref/heads/$FEED_LOADER_REF" --jq .object.sha 2>/dev/null)" || finish FAIL "cannot resolve the branch $FEED_LOADER_REF of $owner/StarRupture-ModLoader"
            printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || finish FAIL "the branch $FEED_LOADER_REF does not resolve to a commit ('$sha')"
            tag="ref-${sha:0:12}"
            src="the branch $FEED_LOADER_REF ($tag)"
          else
            tag=""
            for pair in ${RIG_TAGS:-}; do case "$pair" in Loader=*) tag="${pair#Loader=}" ;; esac; done
            if [ -z "$tag" ]; then tag="$(gh api "repos/$owner/StarRupture-ModLoader/releases/latest" --jq .tag_name 2>/dev/null)" || finish FAIL "cannot read the Latest release of $owner/StarRupture-ModLoader"; fi
            printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._+-]{0,40}$' || finish FAIL "the loader release tag '$tag' is not a plain tag"
            sha="$(gh api "repos/$owner/StarRupture-ModLoader/commits/$tag" --jq .sha 2>/dev/null)" || finish FAIL "cannot resolve the loader tag $tag to a commit"
            printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' || finish FAIL "the loader tag $tag does not resolve to a commit ('$sha')"
            src="$tag"
          fi
          # The map that loader compiles in: its header at that commit.
          gh api -H "Accept: application/vnd.github.raw+json" "repos/$owner/StarRupture-ModLoader/contents/StarRupture-ModLoader-Core/hooks/game/version_map.generated.h?ref=$sha" > tag-header.h 2> tag-header.err \
            || finish FAIL "cannot read the compiled map of $src: $(head -c 200 tag-header.err)"
          # One leg for the build the run checked, one for the build the other Steam branch runs: each needs the
          # rig only when the feed adds or changes a row for that CL compared with the compiled map of the tag.
          leg() {
            local lcl="$1" lin lout ladded lrest lchanged lnames
            lin="$(feed_has_build chain/feed.test-signed.txt "$lcl" 2>&1)" || { LEG="FAIL|the feed does not parse: $lin"; return; }
            [ "$lin" = yes ] || { LEG="FAIL|the feed carries no build row for CL-$lcl"; return; }
            lout="$(feed_delta chain/feed.test-signed.txt tag-header.h "$lcl" 2>&1)" || { LEG="FAIL|the compiled map of $src cannot be compared with the feed: $lout"; return; }
            ladded="${lout%% *}"; lrest="${lout#* }"; lchanged="${lrest%% *}"; lnames="${lrest#* }"
            if [ "$ladded" = 0 ] && [ "$lchanged" = 0 ]; then
              LEG="SKIP|the feed adds no row and changes no row for CL-$lcl compared with the compiled map of $src, so the loader runs on the compiled rows with or without it"
            else
              LEG="RUN|the feed (seq $SEQ) adds $ladded and changes $lchanged rows for CL-$lcl compared with the compiled map of $src: $lnames"
            fi
          }
          leg "$cl"; rstate="${LEG%%|*}"; rreason="${LEG#*|}"
          ocl=""
          case "${OTHER_CL:-}" in
            "") ostate=SKIP; oreason="the candidate map holds no build row for the build the other branch runs, so the feed carries nothing for it (its candidate rig expects a clean decline)" ;;
            0*|*[!0-9]*) finish FAIL "the CL of the other branch's build is not a number ('$OTHER_CL')" ;;
            "$cl") ostate=SKIP; oreason="the other branch runs the same build as this one (CL-$cl), covered by the leg above" ;;
            *) ocl="$OTHER_CL"; leg "$ocl"; ostate="${LEG%%|*}"; oreason="${LEG#*|}" ;;
          esac
          oreason="$(printf '%s' "$oreason" | tr '\r\n' '  ')"
          { echo "owner=$owner"; echo "tag=$tag"; echo "sha=$sha"; echo "cl=$cl"; echo "seq=$SEQ"; echo "other_cl=$ocl"; echo "other_state=$ostate"; echo "other_reason=$oreason"; } >> "$GITHUB_OUTPUT"
          finish "$rstate" "$rreason"

  feed-loader:
    name: feed-path loader
    needs: [feed-plan]
    if: ${{ !cancelled() && (needs.feed-plan.outputs.state == 'RUN' || needs.feed-plan.outputs.other_state == 'RUN') }}
    runs-on: windows-latest
    timeout-minutes: 45
    # No secrets and no environment: this job builds loader code and ships it to the rig as an artifact,
    # which feed-loader-cleanup deletes once the rig has ended.
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.out.outputs.artifact }}
      expect: ${{ steps.out.outputs.expect }}
      version: ${{ steps.out.outputs.version }}
    env:
      TAG: ${{ needs.feed-plan.outputs.tag }}
      LOADER_SHA: ${{ needs.feed-plan.outputs.sha }}
      LOADER_OWNER: ${{ needs.feed-plan.outputs.owner }}
      # A plain token the rig's expect value takes; the loader prints it as "[init] Build: <tag> (client)".
      BUILD_TAG: feedrig-${{ github.run_id }}-${{ needs.feed-plan.outputs.tag }}
      ARTIFACT: loader-feed-${{ inputs.branch }}
      MSBUILD_LOG: msbuild-feed.log
    steps:
      - name: Check out the loader at the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.feed-plan.outputs.owner }}/StarRupture-ModLoader
          ref: ${{ needs.feed-plan.outputs.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Check it is that commit
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          if ($head -ne $env:LOADER_SHA) { throw "checked out $head, the plan named $($env:LOADER_SHA)" }
          "Loader $($env:LOADER_OWNER)/StarRupture-ModLoader $($env:TAG) at $head"

      # After the loader checkout, so its clean step does not remove it.
      - name: Check out the build action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      # The one difference from the release build: the define that makes the loader trust the TEST
      # key. cl.exe reads it from the CL environment variable, so nothing in the source changes.
      # /Bt+ makes every compile print its timing, which proves in the build log that cl.exe read
      # this variable (the define and the timing flag arrive together).
      - name: Build Client Release with VMAP_TRUST_TEST_KEY
        uses: ./ci-actions/.github/actions/build-loader
        env:
          CL: /DVMAP_TRUST_TEST_KEY /Bt+
        with:
          configuration: Client Release
          build_tag: ${{ env.BUILD_TAG }}
          manifest_url: ${{ github.server_url }}/${{ vars.MOD_OWNER || 'AlienXAXS' }}/StarRupture-ModLoader/releases/latest/download/manifest-client.json
          log_file: ${{ env.MSBUILD_LOG }}

      - name: Check the define reached the compiler
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:MSBUILD_LOG)) { throw 'the build wrote no MSBuild log, so the define cannot be checked' }
          $log = Get-Content -LiteralPath $env:MSBUILD_LOG
          # The file that reads the define was compiled, and cl.exe printed the timing the same variable asked for.
          $timed = @($log | Where-Object { $_ -match 'time\(.*c1xx\.dll\)=' })
          $feedUnit = @($log | Where-Object { $_ -match 'version_feed\.cpp' })
          if ($feedUnit.Count -eq 0) { throw 'the build log never names version_feed.cpp: the file that reads VMAP_TRUST_TEST_KEY was not compiled in this build' }
          if ($timed.Count -eq 0) { throw 'the build log has no /Bt+ timing line: cl.exe did not read the CL environment variable, so VMAP_TRUST_TEST_KEY was not defined' }
          "cl.exe read the CL environment variable: $($timed.Count) timed compile line(s), version_feed.cpp compiled."

      - name: Check the build
        shell: pwsh
        run: |
          $dir = 'build\Client Release'
          foreach ($f in 'dwmapi.dll', 'ModLoader\StarRupture-ModLoader-Core.dll') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "the build has no $f" }
          }
          $core = [IO.File]::ReadAllBytes((Join-Path $dir 'ModLoader\StarRupture-ModLoader-Core.dll'))
          if (-not [Text.Encoding]::Latin1.GetString($core).Contains($env:BUILD_TAG, [StringComparison]::Ordinal)) {
            throw "the build tag $($env:BUILD_TAG) is not compiled into StarRupture-ModLoader-Core.dll"
          }
          "Build tag $($env:BUILD_TAG) is in the Core DLL."

      - name: Upload the loader for the rig
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          # Same layout as the candidate loader: dwmapi.dll and ModLoader/*.dll, no plugins. A rig input only:
          # this build trusts the TEST key, so feed-loader-cleanup deletes the artifact once the rig has ended.
          path: |
            build/Client Release/dwmapi.dll
            build/Client Release/ModLoader/*.dll
          if-no-files-found: error
          retention-days: 1

      - name: Name the build
        id: out
        shell: pwsh
        run: |
          "artifact=$($env:ARTIFACT)" >> $env:GITHUB_OUTPUT
          "version=$($env:BUILD_TAG)" >> $env:GITHUB_OUTPUT
          "expect=Loader=$($env:BUILD_TAG)" >> $env:GITHUB_OUTPUT
          "Feed-path loader $($env:BUILD_TAG): $($env:TAG) at $($env:LOADER_SHA) plus VMAP_TRUST_TEST_KEY; artifact $($env:ARTIFACT) (a rig input, deleted when the rig ends, not a release)." >> $env:GITHUB_STEP_SUMMARY

  rig-feed:
    name: client rig (${{ inputs.branch }}, feed path)
    needs: [map-mode, feed-plan, feed-loader, rig-branch, rig-other]
    if: ${{ !cancelled() && inputs.branch == 'public' && needs.feed-plan.outputs.state == 'RUN' && needs.feed-loader.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sr-client-rig.yml
    with:
      branch: ${{ inputs.branch }}
      candidate_run_id: ${{ github.run_id }}
      candidate_artifact: ${{ needs.feed-loader.outputs.artifact }}
      expect: ${{ needs.feed-loader.outputs.expect }}
      tags: ${{ needs.map-mode.outputs.rig_tags }}
      expect_refused: ${{ needs.map-mode.outputs.expect_refused }}
      feed_artifact: map-mode-${{ inputs.branch }}
      feed_seq: ${{ needs.feed-plan.outputs.seq }}
      feed_cl: ${{ needs.feed-plan.outputs.cl }}
    secrets:
      STEAM_CI_USERNAME: ${{ secrets.STEAM_CI_USERNAME }}
      STEAM_CI_LOGIN_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}

  # The second leg: the same loader build, on the other Steam branch, when the feed delivers rows for the
  # build that branch runs. Its rig runs after the first one (the rig's concurrency group keeps one pending run).
  rig-feed-other:
    name: client rig (${{ inputs.branch == 'public' && 'public_test_branch' || 'public' }}, feed path)
    needs: [map-mode, feed-plan, feed-loader, rig-feed]
    if: ${{ !cancelled() && inputs.branch == 'public' && needs.feed-plan.outputs.other_state == 'RUN' && needs.feed-loader.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sr-client-rig.yml
    with:
      branch: ${{ inputs.branch == 'public' && 'public_test_branch' || 'public' }}
      candidate_run_id: ${{ github.run_id }}
      candidate_artifact: ${{ needs.feed-loader.outputs.artifact }}
      expect: ${{ needs.feed-loader.outputs.expect }}
      tags: ${{ needs.map-mode.outputs.rig_tags }}
      expect_refused: ${{ needs.map-mode.outputs.expect_refused_other }}
      feed_artifact: map-mode-${{ inputs.branch }}
      feed_seq: ${{ needs.feed-plan.outputs.seq }}
      feed_cl: ${{ needs.feed-plan.outputs.other_cl }}
    secrets:
      STEAM_CI_USERNAME: ${{ secrets.STEAM_CI_USERNAME }}
      STEAM_CI_LOGIN_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}

  # ---- The feed-path loader is deleted once the rig has ended -------------
  # The feed-path loader trusts the TEST key (k1), so it must not stay downloadable: an artifact
  # of a public repository can be downloaded by any signed-in GitHub user. It never reaches a
  # release or the auto-update feed, but it is deleted anyway, as soon as the rig is done with
  # it, on every outcome (the rig passed, failed, was skipped or the run was cancelled).
  # Building the loader inside the rig job instead, so that no artifact exists, was not done: the
  # rig job holds the live Steam login, and no build code (MSBuild, the loader's submodules) runs
  # there; the rig is also shared by every caller, so a build step in it would be theirs too.
  # The artifact lives from the upload in feed-loader to the end of the rig. This job is the only
  # one with actions: write; the caller's permission ceiling (sr-watch) allows it.
  feed-loader-cleanup:
    name: delete the feed-path loader
    needs: [feed-loader, rig-feed, rig-feed-other]
    if: ${{ always() && needs.feed-loader.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      ARTIFACT: loader-feed-${{ inputs.branch }}
    steps:
      - name: Delete the artifact and check it is gone
        run: |
          set -euo pipefail
          # No artifact is fine: the build may have failed before its upload.
          ids="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=$ARTIFACT" --jq '.artifacts[].id')"
          for id in $ids; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" > /dev/null
            echo "deleted artifact $ARTIFACT ($id)"
          done
          left="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?name=$ARTIFACT" --jq '.artifacts | length')"
          [ "$left" = 0 ] || { echo "::error::the feed-path loader artifact $ARTIFACT is still there ($left); it trusts the TEST key"; exit 1; }
          echo "The feed-path loader artifact is gone."

  # ---- Feed gate: PASS, a named SKIP, or FAIL ------------------------------
  # Runs for the same candidates as the rig gate, on public only. It judges both legs (the build the
  # run checked and the build the other Steam branch runs): FAIL when either fails, PASS when one
  # passed and none failed, SKIP when both skipped. SKIP is a green job and carries its reasons into
  # the run summary; the publish job accepts PASS and SKIP.
  feed-gate:
    name: feed gate
    needs: [map-mode, feed-plan, feed-loader, rig-feed, rig-feed-other]
    if: ${{ !cancelled() && inputs.branch == 'public' && needs.map-mode.result == 'success' && needs.map-mode.outputs.staged == 'true' && inputs.test_autopilot != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      state: ${{ steps.judge.outputs.state }}
      reason: ${{ steps.judge.outputs.reason }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PLAN_RESULT: ${{ needs.feed-plan.result }}
      PLAN_STATE: ${{ needs.feed-plan.outputs.state }}
      PLAN_REASON: ${{ needs.feed-plan.outputs.reason }}
      TAG: ${{ needs.feed-plan.outputs.tag }}
      CL: ${{ needs.feed-plan.outputs.cl }}
      SEQ: ${{ needs.feed-plan.outputs.seq }}
      LOADER_RESULT: ${{ needs.feed-loader.result }}
      RIG_RESULT: ${{ needs.rig-feed.result }}
      RIG_VERDICT: ${{ needs.rig-feed.outputs.verdict }}
      RIG_REASON: ${{ needs.rig-feed.outputs.reason }}
      RIG_ARTIFACT: ${{ needs.rig-feed.outputs.artifact }}
      OTHER_STATE: ${{ needs.feed-plan.outputs.other_state }}
      OTHER_REASON: ${{ needs.feed-plan.outputs.other_reason }}
      OTHER_CL: ${{ needs.feed-plan.outputs.other_cl }}
      OTHER_RIG_RESULT: ${{ needs.rig-feed-other.result }}
      OTHER_RIG_VERDICT: ${{ needs.rig-feed-other.outputs.verdict }}
      OTHER_RIG_REASON: ${{ needs.rig-feed-other.outputs.reason }}
      OTHER_RIG_ARTIFACT: ${{ needs.rig-feed-other.outputs.artifact }}
    steps:
      - name: Judge the feed path
        id: judge
        run: |
          set -euo pipefail
          node -e '
            const e = process.env, fs = require("fs");
            const clean = (s) => String(s ?? "").replace(/\s+/g, " ").trim();
            // One leg: the plan state for a build, then the loader build and the rig verdict when the plan said RUN.
            const judge = (planState, planReason, cl, result, verdict, rigReason) => {
              if (planState === "SKIP") return ["SKIP", clean(planReason)];
              if (planState === "FAIL") return ["FAIL", clean(planReason)];
              if (planState !== "RUN") return ["FAIL", "the plan reached no state"];
              if (e.LOADER_RESULT !== "success") return ["FAIL", "the loader built from " + e.TAG + " with VMAP_TRUST_TEST_KEY did not build or the define did not reach the compiler (job " + e.LOADER_RESULT + ")"];
              if (result === "success" && verdict === "PASS") return ["PASS", "the loader applied the seeded feed (seq " + e.SEQ + ") and CL-" + cl + " ran on its rows; every plugin passed"];
              return ["FAIL", clean(rigReason) || (result === "skipped" ? "the rig did not run" : "no verdict (rig job " + result + ")")];
            };
            // The second leg exists only when the plan reached it (its state is set); a plan that failed early has none.
            // The legs are named by their CL, never by a Steam branch.
            const mine = e.CL ? "CL-" + e.CL : "this build", other = e.OTHER_CL ? "CL-" + e.OTHER_CL : "the other build";
            const legs = e.PLAN_RESULT !== "success" ? [[mine, ["FAIL", "the plan job ended " + e.PLAN_RESULT]]]
              : [[mine, judge(e.PLAN_STATE, e.PLAN_REASON, e.CL, e.RIG_RESULT, e.RIG_VERDICT, e.RIG_REASON)],
                ...(e.OTHER_STATE ? [[other, judge(e.OTHER_STATE, e.OTHER_REASON, e.OTHER_CL, e.OTHER_RIG_RESULT, e.OTHER_RIG_VERDICT, e.OTHER_RIG_REASON)]] : [])];
            const state = legs.some(([, l]) => l[0] === "FAIL") ? "FAIL" : legs.some(([, l]) => l[0] === "PASS") ? "PASS" : "SKIP";
            const why = legs.map(([name, l]) => (legs.length > 1 ? name + ": " : "") + l[1]).join("; ");
            const logs = [e.RIG_ARTIFACT && "artifact `" + e.RIG_ARTIFACT + "`", e.OTHER_RIG_ARTIFACT && "artifact `" + e.OTHER_RIG_ARTIFACT + "`"].filter(Boolean);
            const logLine = logs.length ? " Logs: " + logs.join(", ") + " of " + e.RUN_URL + "." : "";
            const md = ["### Feed-path rig gate: " + state, "", why + "." + logLine + (state === "SKIP" ? " The skip is the gate working as designed; the feed was not tested in the game this run." : "")];
            fs.appendFileSync(e.GITHUB_STEP_SUMMARY, md.join("\n") + "\n");
            fs.appendFileSync(e.GITHUB_OUTPUT, "state=" + state + "\nreason=" + why + "\n");
            if (state === "FAIL") { console.log("::error title=Feed-path rig gate::" + why + "; the feed is not published."); process.exit(1); }
          '

  # ---- Rig gate: both verdicts in the run summary, and the chain's visible result ----
  # Runs for every candidate the chain staged (the same cue as push-loader) and writes
  # the decision, the candidate and both rigs' verdict, reason and logs artifact into the
  # run summary. It fails unless both rigs passed, so a rig that failed, was cancelled or
  # never ran for a staged candidate is a red job, never a skipped green. The publish job
  # reads the two rigs itself; this job is what a person reads. With the autopilot off the
  # rigs still run on the candidate and publish stays held.
  rig-gate:
    name: rig gate
    needs: [map-mode, candidate-loader, rig-branch, rig-other]
    if: ${{ always() && needs.map-mode.result == 'success' && needs.map-mode.outputs.staged == 'true' && inputs.test_autopilot != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DECISION: ${{ needs.map-mode.outputs.decision }}
      PUBLISHABLE: ${{ needs.map-mode.outputs.publishable }}
      CANDIDATE_RESULT: ${{ needs.candidate-loader.result }}
      CANDIDATE_VERSION: ${{ needs.candidate-loader.outputs.version }}
      CANDIDATE_SHA: ${{ needs.candidate-loader.outputs.sha }}
      BRANCH_NAME: this branch
      BRANCH_RESULT: ${{ needs.rig-branch.result }}
      BRANCH_VERDICT: ${{ needs.rig-branch.outputs.verdict }}
      BRANCH_REASON: ${{ needs.rig-branch.outputs.reason }}
      BRANCH_ARTIFACT: ${{ needs.rig-branch.outputs.artifact }}
      BRANCH_EXPECT_REFUSED: ${{ needs.map-mode.outputs.expect_refused }}
      OTHER_EXPECT_REFUSED: ${{ needs.map-mode.outputs.expect_refused_other }}
      OTHER_NAME: the other branch
      OTHER_RESULT: ${{ needs.rig-other.result }}
      OTHER_VERDICT: ${{ needs.rig-other.outputs.verdict }}
      OTHER_REASON: ${{ needs.rig-other.outputs.reason }}
      OTHER_ARTIFACT: ${{ needs.rig-other.outputs.artifact }}
    steps:
      - name: Judge both rigs
        run: |
          set -euo pipefail
          node -e '
            const e = process.env;
            const one = (p, name, rule) => {
              const result = e[p + "_RESULT"], verdict = e[p + "_VERDICT"];
              const pass = result === "success" && verdict === "PASS";
              const state = pass ? "PASS" : verdict === "FAIL" ? "FAIL" : result === "skipped" ? "did not run" : result === "cancelled" ? "cancelled" : "no verdict (" + result + ")";
              const why = (e[p + "_REASON"] || (pass ? "" : result === "skipped" ? "candidate loader job: " + e.CANDIDATE_RESULT : "see the rig job")).replace(/\s+/g, " ").trim();
              const logs = e[p + "_ARTIFACT"] ? "artifact `" + e[p + "_ARTIFACT"] + "` of " + e.RUN_URL : "no logs artifact, run " + e.RUN_URL;
              return { name, pass, line: "- **" + name + "**: " + state + (why ? " - " + why : "") + ". " + rule + " Logs: " + logs + "." };
            };
            const a = one("BRANCH", e.BRANCH_NAME, e.BRANCH_EXPECT_REFUSED ? "Must be refused here: " + e.BRANCH_EXPECT_REFUSED + "." : "No refusals expected.");
            const b = one("OTHER", e.OTHER_NAME, e.OTHER_EXPECT_REFUSED ? "Must be refused here (the loader rule for the build this branch runs): " + e.OTHER_EXPECT_REFUSED + ". Any other refusal is a fail." : "No refusals expected: its current build must keep working with the same DLLs.");
            const ok = a.pass && b.pass;
            const md = ["### Client rig gate: " + (ok ? "PASS" : "FAIL"), "",
              "Decision " + (e.DECISION || "none") + (e.PUBLISHABLE === "true" ? ", publishable" : ", not publishable") + ". Candidate loader " + (e.CANDIDATE_VERSION || "none") + (e.CANDIDATE_SHA ? " (loader commit " + e.CANDIDATE_SHA.slice(0, 7) + ")" : "") + ", job " + e.CANDIDATE_RESULT + ". The feed is published only when both rigs pass.", "", a.line, b.line];
            require("fs").appendFileSync(e.GITHUB_STEP_SUMMARY, md.join("\n") + "\n");
            if (!ok) {
              console.log("::error title=Client rig gate::" + [a, b].filter((x) => !x.pass).map((x) => x.name).join(" and ") + " did not pass; the feed is not published.");
              process.exit(1);
            }
          '

  # ---- Alert: a failed, stuck or held run reaches the owner through GitHub ----
  # One issue per branch, opened on the first problem and commented on for every
  # later one (the same mechanism as vmap-watchdog.yml). The issue carries the
  # label pipeline-alert and is assigned to the owner, and the body mentions him,
  # so GitHub notifies him; every line says its cause (the failing gate or job and
  # its first error line or verdict reason). Alert lines: a failed job; a client
  # check that did not run (status skipped or no-login, a missing Steam login);
  # a map-mode decision of HOLD for any reason but "nothing new" (the CL is not
  # newer than the one the header was built for) or "autopilot is disabled" alone;
  # staged map rows that were not pushed to the loader fork (push-loader), a
  # candidate loader that failed to build or pass its tests (candidate-loader),
  # and a client rig that did not end with success and PASS (rig-gate, rig-branch,
  # rig-other).
  # A HOLD whose only reason is "autopilot is disabled", with every gate and job
  # passing, is not an alert: the run is ready and only the publish is held, which
  # is one line on the PR (a comment carrying <!-- sr-ready-held:<branch> -->, kept up to
  # date), no issue. A run with no alert line labels the PR chain-passed-<branch>;
  # sr-watch.yml reads those labels to tell a game-update PR that stalled.
  # The cause of a failed job comes from artifacts and the run's own job list, which
  # exist when the job failed: the check job's result.json, the map-mode artifact
  # (reported missing when the job never uploaded it), the jobs API (failed step and
  # its first error line, from the job's annotations or else its log; ci/pipeline-alert.mjs)
  # and the rig jobs' verdict outputs.
  # The feed-path rig gate (feed-gate) is a line when it did not pass (FAIL, or a gate that ended
  # otherwise) and an information note when it skipped, with the skip's reason.
  alert:
    name: alert
    needs: [build, plugin-plan, check, map-mode, publish, push-loader, candidate-loader, rig-branch, rig-other, rig-gate, feed-plan, feed-loader, rig-feed, rig-feed-other, feed-loader-cleanup, feed-gate]
    if: ${{ always() && inputs.branch && inputs.branch != 'expiry-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10   # a job log not there yet is fetched again, up to a minute per job
    permissions:
      contents: read
      issues: write
      pull-requests: write   # the chain-passed label and the ready note on the update PR
      actions: read          # the failed steps and logs of this run's jobs
      checks: read           # their failure annotations (the first error line)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: msantoro12
      RUN_ID: ${{ github.run_id }}
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      PR: ${{ inputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILD_RESULT: ${{ needs.build.result }}
      PLAN_RESULT: ${{ needs.plugin-plan.result }}
      PLAN_REVIEW: ${{ needs.plugin-plan.outputs.review }}
      CHECK_RESULT: ${{ needs.check.result }}
      MAP_MODE_RESULT: ${{ needs.map-mode.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      # The cue that staged map rows should have been pushed, built and put through the rigs.
      STAGED_EXPECTED: ${{ needs.map-mode.result == 'success' && needs.map-mode.outputs.staged == 'true' && inputs.test_autopilot != true }}
      PUSH_RESULT: ${{ needs.push-loader.result }}
      CANDIDATE_RESULT: ${{ needs.candidate-loader.result }}
      RIG_GATE_RESULT: ${{ needs.rig-gate.result }}
      # The feed-path rig runs on public only, for the same candidates.
      FEED_EXPECTED: ${{ needs.map-mode.result == 'success' && needs.map-mode.outputs.staged == 'true' && inputs.test_autopilot != true && inputs.branch == 'public' }}
      FEED_GATE_RESULT: ${{ needs.feed-gate.result }}
      FEED_GATE_STATE: ${{ needs.feed-gate.outputs.state }}
      FEED_GATE_REASON: ${{ needs.feed-gate.outputs.reason }}
      BRANCH_RIG_NAME: this branch
      BRANCH_RIG_RESULT: ${{ needs.rig-branch.result }}
      BRANCH_RIG_VERDICT: ${{ needs.rig-branch.outputs.verdict }}
      BRANCH_RIG_REASON: ${{ needs.rig-branch.outputs.reason }}
      BRANCH_RIG_ARTIFACT: ${{ needs.rig-branch.outputs.artifact }}
      BRANCH_RIG_REVIEW: ${{ needs.rig-branch.outputs.review }}
      OTHER_RIG_NAME: the other branch
      OTHER_RIG_RESULT: ${{ needs.rig-other.result }}
      OTHER_RIG_VERDICT: ${{ needs.rig-other.outputs.verdict }}
      OTHER_RIG_REASON: ${{ needs.rig-other.outputs.reason }}
      OTHER_RIG_ARTIFACT: ${{ needs.rig-other.outputs.artifact }}
      OTHER_RIG_REVIEW: ${{ needs.rig-other.outputs.review }}
    steps:
      - name: Check out the alert script
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: ci
          persist-credentials: false

      - name: Download the map-mode chain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: map-mode-${{ inputs.branch }}
          path: chain

      - name: Download the check result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      # Best effort: each failed job's step name and first error line, for the cause.
      - name: Read why the jobs failed
        run: node ci/pipeline-alert.mjs causes --repo "$GH_REPO" --run "$RUN_ID" --out failed-jobs.jsonl || true

      - name: Work out what needs attention
        id: what
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const e = process.env;
            const lines = [];
            const info = [];
            const readJson = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return null; } };
            const clip = (s, n = 300) => { s = String(s ?? "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 3) + "..." : s; };
            // Failed jobs of this run, each with its failed step and first error line (ci/pipeline-alert.mjs causes).
            const failed = [];
            try { for (const l of fs.readFileSync("failed-jobs.jsonl", "utf8").split("\n")) if (l.trim()) { try { failed.push(JSON.parse(l)); } catch {} } } catch {}
            // A job of this workflow is listed as "<name>", or "<caller job> / <name>" when sr-watch calls it.
            const apiCause = (name) => {
              const mine = failed.filter((j) => j.name === name || j.name.endsWith(" / " + name));
              const j = mine.find((x) => x.name.includes("(" + e.BRANCH + ")")) ?? mine[0];
              if (!j) return "";
              const err = j.error ?? "";
              return (j.step ? "step \"" + j.step + "\"" : "") + (err ? (j.step ? ": " : "") + clip(err) : "");
            };
            const why = (name) => { const c = apiCause(name); return c ? ["  - cause: " + c] : []; };
            const r = readJson("res/result.json");
            const d = readJson("chain/decision.json");
            const chainThere = fs.existsSync("chain") && fs.readdirSync("chain").length > 0;

            for (const [label, name, result] of [["build-scanner", "build-scanner", e.BUILD_RESULT], ["plugin-plan", "plugin-plan", e.PLAN_RESULT], ["publish the feed", "publish the feed", e.PUBLISH_RESULT]]) {
              if (result === "failure") lines.push("- job **" + label + "** failed", ...why(name));
            }
            if (e.CHECK_RESULT === "failure") {
              lines.push("- job **check** failed");
              if (r?.reason) lines.push("  - cause: " + (r.status === "no-login" ? "no Steam login (status no-login): " : "") + clip(r.reason));
              else {
                const st = r?.status ? "check status " + r.status + (r.download?.reason ? " (" + r.download.reason + ")" : "") : "no check result artifact";
                const c = apiCause("check");
                lines.push("  - cause: " + st + (c ? "; " + c : ""));
              }
            } else if (r && (r.status === "skipped" || r.status === "no-login")) {
              lines.push("- client check **did not run** (status " + r.status + "): " + clip(r.reason ?? "no reason recorded"));
            }
            if (r?.status === "new-build") info.push("New build **CL-" + (r.checks?.exe?.cl ?? "?") + "** (" + (r.checks?.exe?.productVersion ?? "unknown ProductVersion") + "), measured by map mode: the loader does not run on it yet (" + (r.checks?.exe?.requiredCl ?? "unknown") + "); this is not a failure.");
            if (e.MAP_MODE_RESULT === "failure") {
              lines.push("- job **map mode** failed");
              if (!chainThere) lines.push("  - the map-mode artifact is missing: the job stopped before it uploaded one, so no gate or decision is available");
              lines.push(...why("map mode"));
            }
            if (!d && e.MAP_MODE_RESULT === "success") lines.push("- map mode finished without a decision" + (chainThere ? "" : " (and the map-mode artifact is missing)"));
            const AUTOPILOT = "autopilot is disabled (enabled is not true)";
            let readyHold = false;
            if (d && d.decision === "HOLD") {
              const reasons = d.reasons ?? [];
              const nothingNew = reasons.some((x) => /^G3: CL-[0-9]+ is not newer than CL-[0-9]+$/.test(x));
              const autopilotOnly = reasons.length === 1 && reasons[0] === AUTOPILOT;
              // Ready only when the chain went on to stage and run the rigs (the candidate chain); a dispatch with publish on stops at the HOLD.
              if (autopilotOnly) readyHold = d.candidate === true && d.test !== true;
              else if (!nothingNew) lines.push("- decide: **HOLD** on CL-" + (d.cl ?? "?"), ...reasons.map((x) => "  - " + x));
            }
            const expected = e.STAGED_EXPECTED === "true";
            if (expected && e.PUSH_RESULT !== "success") {
              lines.push("- the staged map rows were **not pushed** to the loader fork (push-loader " + (e.PUSH_RESULT === "failure" ? "failed" : "ended " + e.PUSH_RESULT) + ")");
              lines.push(...(e.PUSH_RESULT === "failure" ? why("push the map rows to the loader fork") : ["  - cause: a job before it did not finish"]));
            }
            if (expected && e.PUSH_RESULT === "success" && e.CANDIDATE_RESULT !== "success") {
              lines.push("- the **candidate loader** did not build and pass its tests (candidate-loader " + (e.CANDIDATE_RESULT === "failure" ? "failed" : "ended " + e.CANDIDATE_RESULT) + ")", ...why("candidate loader"));
            }
            const rigs = ["BRANCH", "OTHER"].map((p) => ({ name: e[p + "_RIG_NAME"], result: e[p + "_RIG_RESULT"], verdict: e[p + "_RIG_VERDICT"], reason: e[p + "_RIG_REASON"], artifact: e[p + "_RIG_ARTIFACT"] }));
            const badRigs = expected ? rigs.filter((x) => !(x.result === "success" && x.verdict === "PASS")) : [];
            if (e.RIG_GATE_RESULT === "failure" || badRigs.length) {
              lines.push("- **client rig gate** failed: the feed is published only when both rigs pass");
              for (const x of badRigs) {
                const state = x.verdict || (x.result === "skipped" ? "did not run" : x.result);
                const cause = x.reason ? clip(x.reason) : x.result === "skipped" ? "candidate loader job: " + e.CANDIDATE_RESULT : "no verdict; see the rig job";
                lines.push("  - rig " + x.name + ": " + state + " - " + cause + (x.artifact ? " (logs: artifact " + x.artifact + ")" : ""));
              }
            }

            if (e.FEED_EXPECTED === "true" && e.FEED_GATE_RESULT !== "success" && e.FEED_GATE_RESULT !== "skipped") lines.push("- **feed-path rig gate** did not pass: " + clip(e.FEED_GATE_REASON || "gate " + e.FEED_GATE_RESULT));
            else if (e.FEED_GATE_STATE === "SKIP") info.push("Feed-path rig gate **skipped**: " + clip(e.FEED_GATE_REASON));

            // A newer release of a plugin by another author than the reviewed one the plan and the rig used. Both kept
            // using the reviewed release, so nothing failed: the line is loud, but it neither blocks the
            // gate nor takes the chain-passed mark away.
            const review = [...new Set([e.PLAN_REVIEW, e.BRANCH_RIG_REVIEW, e.OTHER_RIG_REVIEW].flatMap((t) => String(t ?? "").split(/\s+/)).filter((t) => /^[A-Za-z0-9_.-]+=[A-Za-z0-9][A-Za-z0-9._+-]*$/.test(t)))]
              .map((t) => "- new " + t.split("=")[0] + " release " + t.split("=")[1] + " waiting for review: the rig still runs the reviewed release; review the new one, then update its Pin in `ci/plugin-names.json`");
            // Lines the map writers left in their reports (alerts): a stale fork branch, a fork build that compiles a changed
            // size. Loud like the review lines, and for the same reason they block nothing.
            for (const f of ["chain/map-mode-report.json", "chain/field-rows.json", "chain/alerts.json"]) {
              for (const x of [].concat(readJson(f)?.alerts ?? [])) if (typeof x === "string" && x) review.push("- " + clip(x, 400));
            }

            const out = (kv) => fs.appendFileSync(e.GITHUB_OUTPUT, Object.entries(kv).map(([k, v]) => k + "=" + v + "\n").join(""));
            const passed = lines.length === 0 && d !== null;
            if (passed && readyHold) fs.writeFileSync("ready.md", "<!-- sr-ready-held:" + e.BRANCH + " -->\n**Ready, publish held (autopilot off).** CL-" + (d.cl ?? "?") + " on `" + e.BRANCH + "`: every gate and job passed, [run](" + e.RUN_URL + ").\n");
            if (!lines.length && !review.length) {
              console.log("Nothing to alert on.");
              out({ alert: "false", passed: String(passed), ready: String(passed && readyHold) });
              process.exit(0);
            }
            const md = ["@" + e.OWNER + " branch `" + e.BRANCH + "`, build " + (e.BUILDID || "unknown") + ", [run](" + e.RUN_URL + ").", "", ...lines, ...review, ...(info.length ? ["", ...info] : []), "", "Details are in the run summary and the map-mode artifact. The watcher does not check a build again while its update PR is open; once the cause is fixed: `gh workflow run sr-watch.yml --ref main -f force=true`."];
            fs.writeFileSync("alert.md", md.join("\n") + "\n");
            out({ alert: "true", passed: String(passed), ready: String(passed && readyHold) });
          '

      - name: Open or update the issue
        if: steps.what.outputs.alert == 'true'
        run: |
          node ci/pipeline-alert.mjs raise --title "SR map mode: $BRANCH needs attention" --body-file alert.md --owner "$OWNER"

      # The PR carries what the chain concluded: chain-passed-<branch> only after a
      # run with no alert line (sr-watch reads it), and one line when the only thing
      # holding the publish is the autopilot switch.
      - name: Mark the pull request
        if: ${{ !cancelled() && steps.what.outcome == 'success' && inputs.pr != '' }}
        env:
          ALERT: ${{ steps.what.outputs.alert }}
          PASSED: ${{ steps.what.outputs.passed }}
          READY: ${{ steps.what.outputs.ready }}
        run: |
          set -euo pipefail
          label="chain-passed-$BRANCH"
          gh label create "$label" --color 0E8A16 --description "The client chain passed for $BRANCH on this update" --force
          if [ "$PASSED" = true ]; then
            gh pr edit "$PR" --add-label "$label"
          elif [ "$ALERT" = true ]; then
            gh pr edit "$PR" --remove-label "$label" || true
          fi
          if [ "$READY" = true ]; then
            export MARKER="<!-- sr-ready-held:$BRANCH -->"
            id="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains(env.MARKER)) | .id' | tail -n 1)"
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@ready.md
            else
              gh pr comment "$PR" --body-file ready.md
            fi
          fi

  # ---- Auto-apply, part 2: push the verified fixes to the owner's forks ----
  # The only job that can read the fork deploy keys (environment fork-push),
  # one key per fork, each limited by a ruleset on its fork to auto/**. It
  # runs no plugin code and no action but actions/checkout: it re-creates the
  # fix from the plugin's commit and the plan with the apply tool, and pushes
  # only when the result is the tree the check job built and scanned. Never
  # forces: a branch that already holds another tree gets a run-id suffix.
  auto-apply:
    name: auto-apply ${{ matrix.name }}
    needs: [plugin-plan, check]
    if: ${{ !cancelled() && startsWith(needs.check.outputs.autofix, '[{') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fork-push
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.autofix) }}
    steps:
      - name: Check the work item
        id: item
        env:
          NAME: ${{ matrix.name }}
          SHA: ${{ matrix.sha }}
          TREE: ${{ matrix.tree }}
          CL: ${{ matrix.cl }}
          REFERENCE_CL: ${{ matrix.referenceCl }}
          VERDICT: ${{ matrix.verdict }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
        run: |
          # The work list comes from the job that ran plugin code, so every
          # field that picks a repository, a key or a ref is checked here. The
          # commit must be the one plugin-plan resolved before plugin code ran
          # (on the plugin's repository the plan named, AlienX's main by default); the
          # branch is pushed to the owner's fork of that plugin.
          [[ "$NAME" =~ ^(BetterCheats|BetterDrone|WAILA|Codex|Compass|ProductionViewer|RuptureTimer|WaveOptimiser|CameraControls)$ ]] || { echo "::error::'$NAME' is not a fork this job pushes to"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TREE" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::bad commit or tree id'; exit 1; }
          [[ "$CL" =~ ^[0-9]+$ && "$REFERENCE_CL" =~ ^[0-9]*$ ]] || { echo '::error::bad CL'; exit 1; }
          [[ "$VERDICT" =~ ^(FIXED|PARTIAL)$ ]] || { echo '::error::bad verdict'; exit 1; }
          planned="$(jq -r --arg n "$NAME" '.[] | select(.name == $n and .source == "build" and (.repo == "AlienXAXS/StarRupture-Plugin-" + $n or .repo == "msantoro12/StarRupture-Plugin-" + $n)) | .repo + " " + .sha' <<< "$PLAN")"
          [ "${planned#* }" = "$SHA" ] || { echo "::error::$SHA is not the commit plugin-plan resolved for $NAME"; exit 1; }
          echo "repo=${planned% *}" >> "$GITHUB_OUTPUT"

      - name: Check out the apply tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci/apply-proposals.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.item.outputs.repo }}
          ref: ${{ matrix.sha }}
          path: plugin
          # Whole history: the fork's refs need not hold this commit, and the push must not be shallow.
          fetch-depth: 0
          persist-credentials: false

      - name: Re-create the fix
        env:
          PLAN: ${{ toJSON(matrix.plan) }}
          TREE: ${{ matrix.tree }}
          CL: ${{ matrix.cl }}
          REFERENCE_CL: ${{ matrix.referenceCl }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node tool/ci/apply-proposals.mjs apply --source plugin --plan "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/applied.json"
          git -C plugin add -A
          tree="$(git -C plugin write-tree)"
          if [ "$tree" != "$TREE" ]; then
            echo "::error::the re-created fix is tree $tree, the check job built and scanned $TREE; nothing is pushed"
            exit 1
          fi
          node tool/ci/apply-proposals.mjs message --applied "$RUNNER_TEMP/applied.json" --cl "$CL" ${REFERENCE_CL:+--reference-cl "$REFERENCE_CL"} > "$RUNNER_TEMP/message.txt"
          git -C plugin -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -F "$RUNNER_TEMP/message.txt"
          git -C plugin log -1 --format='%H %s'

      - name: Push the branch
        env:
          NAME: ${{ matrix.name }}
          CL: ${{ matrix.cl }}
          VERDICT: ${{ matrix.verdict }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # This fork's key only.
          DEPLOY_KEY: ${{ matrix.name == 'BetterCheats' && secrets.SR_DEPLOYKEY_BETTERCHEATS || matrix.name == 'BetterDrone' && secrets.SR_DEPLOYKEY_BETTERDRONE || matrix.name == 'WAILA' && secrets.SR_DEPLOYKEY_WAILA || matrix.name == 'Codex' && secrets.SR_DEPLOYKEY_CODEX || matrix.name == 'Compass' && secrets.SR_DEPLOYKEY_COMPASS || matrix.name == 'ProductionViewer' && secrets.SR_DEPLOYKEY_PRODUCTIONVIEWER || matrix.name == 'RuptureTimer' && secrets.SR_DEPLOYKEY_RUPTURETIMER || matrix.name == 'WaveOptimiser' && secrets.SR_DEPLOYKEY_WAVEOPTIMISER || matrix.name == 'CameraControls' && secrets.SR_DEPLOYKEY_CAMERACONTROLS || '' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::no deploy key for $NAME in environment fork-push"; exit 1; fi
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -f "$ssh_dir/key"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key")
          # GitHub's published host keys, not trust on first use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          url="git@github.com:msantoro12/StarRupture-Plugin-$NAME.git"
          branch="auto/update-$CL"
          head="$(git -C plugin rev-parse HEAD)"
          tree="$(git -C plugin rev-parse 'HEAD^{tree}')"
          existing="$(git ls-remote "$url" "refs/heads/$branch" | cut -f1)"
          if [ -n "$existing" ]; then
            git -C plugin fetch -q --depth 1 "$url" "refs/heads/$branch"
            if [ "$(git -C plugin rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
              echo "$branch already holds this fix at $existing; nothing to push."
              echo "$NAME ($VERDICT): \`$branch\` already holds this fix at $existing." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            branch="auto/update-$CL-$RUN_ID-$RUN_ATTEMPT"
          fi
          git -C plugin push -q "$url" "HEAD:refs/heads/$branch"
          echo "Pushed $branch at $head to msantoro12/StarRupture-Plugin-$NAME."
          echo "$NAME ($VERDICT): pushed \`$branch\` at $head." >> "$GITHUB_STEP_SUMMARY"

  # ---- Job B: comment on the update PR (no secrets, no environment) --------
  report:
    name: report
    needs: [build, check, auto-apply]
    if: always() && inputs.branch && inputs.branch != 'expiry-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write    # comment on the game-update PR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ inputs.branch }}
      EXPECTED_BUILDID: ${{ inputs.buildid }}
      BUILD_RESULT: ${{ needs.build.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      LOGIN_AT: ${{ vars.STEAM_CI_LOGIN_AT }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      - name: Summarise and comment
        shell: pwsh
        run: |
          $r = if (Test-Path res/result.json) { Get-Content res/result.json -Raw | ConvertFrom-Json } else { $null }
          $status = if ($r) { $r.status } elseif ($env:BUILD_RESULT -ne 'success') { 'scanner-build-failed' } else { "no-result ($($env:CHECK_RESULT))" }
          $build = if ($r -and $r.download -and $r.download.buildid) { $r.download.buildid } else { $env:EXPECTED_BUILDID }
          $md = [Collections.Generic.List[string]]::new()
          $md.Add("### Client build check: $($status.ToUpperInvariant()) ($($env:BRANCH), build $build)")
          $md.Add('')
          $md.Add("Run: $($env:RUN_URL)")
          $md.Add('')
          if ($status -eq 'no-login') {
            $md.Add("The client build was not checked: $($r.reason).")
          } elseif ($r) {
            if ($status -eq 'new-build') {
              $md.Add("**New build, measured by map mode.** The loader does not run on CL-$($r.checks.exe.cl) yet; that is the case map mode exists for, not a failure. Every other check below passed, and the map-mode job decides what the build needs.")
              $md.Add('')
            }
            $dl = $r.download; $ck = $r.checks
            $md.Add('| Check | Result |')
            $md.Add('|---|---|')
            $login = switch ($dl.step0) {
              'PASS'      { 'accepted (saved cache, no password)' }
              'FAIL'      {
                if ($env:LOGIN_AT -and $env:LOGIN_AT -ge [datetime]::UtcNow.AddDays(-1).ToString('yyyy-MM-dd')) {
                  "REJECTED right after the login was saved: Step 0 failed, the saved cache does not carry over to a fresh runner, and -Renew will not fix that ($($dl.detail))"
                } else { "REJECTED: login expired, run ``steam-ci-login.ps1 -Renew`` ($($dl.detail))" }
              }
              'UNDECIDED' { 'rate-limited by Steam; re-run later' }
              default     { "$($dl.reason) $($dl.detail)".Trim() }
            }
            $md.Add("| Steam login | $login |")
            if ($dl.login -eq 'ok') {
              $dlText = if ($dl.installed) { '{0} GB on disk in {1} min' -f [math]::Round([double]$dl.sizeOnDisk / 1GB, 1), [math]::Round($dl.seconds / 60, 1) } else { "FAILED ($($dl.reason): $($dl.detail))" }
              $md.Add("| Download | $dlText |")
            }
            if ($r.PSObject.Properties['reference'] -and $r.reference) {
              $rf = $r.reference
              $md.Add("| Reference (public) | $(if ($rf.status -eq 'used') { "build $($rf.buildid), CL-$($rf.cl)" } else { "none: $($rf.reason)$(if ($rf.PSObject.Properties['buildid'] -and $rf.buildid) { " (build $($rf.buildid), branch '$($rf.betaKey)')" })" }) |")
            }
            if ($ck) {
              $md.Add(('| ProductVersion | `{0}`, loader requires `{1}`: {2} |' -f $ck.exe.productVersion, $ck.exe.requiredCl, $(if ($ck.exe.clOk) { 'match' } elseif ($ck.exe.newBuild) { '**new build** (not supported yet; map mode measures it)' } else { '**MISMATCH**' })))
              $s = $ck.scan.summary
              $md.Add("| Pattern scan | $($s.total) patterns: $($s.ok) OK, $($s.missing) missing, $($s.ambiguous) ambiguous, $($s.other) other; **$($s.requiredFailing) required failing** |")
              foreach ($p in @($ck.scan.notOk)) { $md.Add("| - $($p.name) | $($p.result)$(if ($p.required) { ' (required)' }) |") }
              foreach ($g in @($ck.sdkGlobals)) {
                $cmp = if ($g.informational) { "SDK value $($g.sdk) is not the engine global (by design)" } elseif ($g.match) { 'equals the SDK' } elseif ($null -eq $g.match) { 'not compared' } else { "**SDK has $($g.sdk): SDK dump needed**" }
                $md.Add("| SDK global $($g.name) | $($g.result) $($g.rva); $cmp |")
              }
              $md.Add("| exe SHA-256 | ``$($ck.exe.sha256)`` |")
              if (@($ck.warnings).Count -gt 0) {
                $md.Add('')
                $md.Add('Warnings:')
                foreach ($w in @($ck.warnings)) { $md.Add("- $w") }
              }
            }
          } else {
            $md.Add("The check produced no result (scanner build: $($env:BUILD_RESULT), check: $($env:CHECK_RESULT)). See the run.")
          }

          # The plugins: one row each, then every pattern they resolved.
          if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) {
            $md.Add('')
            $partial = @($r.plugins.plugins | Where-Object { $_.verdict -eq 'GAME-CALL' } | ForEach-Object { $_.name })
            $md.Add("#### Plugins: $($r.plugins.status.ToUpperInvariant())$(if ($partial.Count) { ' (partial: ' + ($partial -join ', ') + ' not fully exercised)' })")
            $md.Add('')
            $md.Add('The loader refuses a plugin that fails here. A failing plugin does not change the loader verdict above. OFFSETS and OFFSETS-UNCHECKED: a fixed offset the plugin reads does not match this build, or could not be checked (below).')
            $md.Add('')
            $md.Add('| Plugin | Ref | Verdict | OK | MISSING | AMBIGUOUS | Other | Note |')
            $md.Add('|---|---|---|---|---|---|---|---|')
            foreach ($p in @($r.plugins.plugins)) {
              $s = if ($p.PSObject.Properties['summary']) { $p.summary } else { $null }
              # A latest-release plugin shows its tag; a built one its ref and commit.
              $ref = if ($p.source -eq 'release') { "``$($p.ref)`` (latest release)" } elseif ($p.release) { "``$($p.ref)`` (latest release, built from source$(if ($p.sha) { ', ' + $p.sha.Substring(0, 7) }))" } elseif ($p.sha) { "``$($p.ref)`` ($($p.sha.Substring(0, 7)))" } else { "``$($p.ref)``" }
              $note = foreach ($k in 'note', 'crash', 'error') { if ($p.PSObject.Properties[$k] -and $p.$k) { $p.$k } }
              $md.Add("| $($p.name) | $ref | **$($p.verdict)$(if ($p.verdict -eq 'GAME-CALL') { ' (partial)' })** | $(if ($s) { $s.ok }) | $(if ($s) { $s.missing }) | $(if ($s) { $s.ambiguous }) | $(if ($s) { $s.other + $s.reported }) | $((@($note) -join '; ') -replace '\|', '\|') |")
            }
            foreach ($p in @($r.plugins.plugins | Where-Object { $_.PSObject.Properties['patterns'] -and @($_.patterns).Count })) {
              $md.Add('')
              $md.Add("<details><summary>$($p.name): $(@($p.patterns).Count) patterns</summary>")
              $md.Add('')
              $md.Add('| Result | Pattern | Kind | Required |')
              $md.Add('|---|---|---|---|')
              foreach ($row in @($p.patterns)) {
                $req = if (-not $row.recorded) { 'raw scan' } elseif ($row.required) { 'yes' } else { 'no' }
                $shown = if ($row.PSObject.Properties['ownPattern']) { $row.ownPattern } else { $row.result }
                $md.Add("| $shown | ``$($row.name -replace '\|', '\|')`` | $($row.kind) | $req |")
              }
              $md.Add('')
              $md.Add('</details>')
            }
          }

          # The fixed offsets the plugins read, against this build's PDB.
          $withOffsets = @($(if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) { $r.plugins.plugins }) | Where-Object { $_.PSObject.Properties['offsets'] -and $_.offsets -and @($_.offsets.results).Count })
          if ($withOffsets.Count) {
            $md.Add('')
            $md.Add('**Fixed offsets** (members a plugin reads at a raw offset, compared with the PDB; any state but ok fails the plugin as OFFSETS):')
          }
          foreach ($p in $withOffsets) {
            $res = @($p.offsets.results)
            $bad = @($res | Where-Object { $_.state -ne 'ok' })
            $md.Add('')
            $md.Add("<details$(if ($bad.Count) { ' open' })><summary>$($p.name): $($res.Count) fixed offsets, $($bad.Count) failing</summary>")
            $md.Add('')
            $md.Add('| State | Member | Source reads | This build | Public build | Note |')
            $md.Add('|---|---|---|---|---|---|')
            foreach ($x in $res) {
              $s = if ($x.PSObject.Properties['source'] -and $null -ne $x.source) { '0x{0:X}' -f [int]$x.source } else { '-' }
              $t = if ($x.PSObject.Properties['target'] -and $x.target -and $x.target.PSObject.Properties['offset']) { '0x{0:X}' -f [int]$x.target.offset } else { '-' }
              $f = if ($x.PSObject.Properties['reference'] -and $x.reference -and $x.reference.PSObject.Properties['offset']) { '0x{0:X}' -f [int]$x.reference.offset } else { '-' }
              $why = if ($x.PSObject.Properties['reason'] -and $x.reason) { $x.reason -replace '\|', '\|' } else { '' }
              $md.Add("| $($x.state) | ``$($x.key)`` | $s | $t | $f | $why |")
            }
            $md.Add('')
            $md.Add('</details>')
          }

          # Proposed replacements for failing patterns (sr-aobscan --suggest).
          $failing = [Collections.Generic.List[object]]::new()
          if ($r -and $r.checks) { foreach ($row in @($r.checks.scan.notOk)) { $failing.Add([pscustomobject]@{ owner = 'loader'; row = $row }) } }
          foreach ($p in @($(if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) { $r.plugins.plugins }) | Where-Object { $_.PSObject.Properties['patterns'] })) {
            foreach ($row in @($p.patterns)) { $failing.Add([pscustomobject]@{ owner = $p.name; row = $row }) }
          }
          $failing = @($failing | Where-Object { $_.row.PSObject.Properties['suggest'] -and $_.row.suggest })
          if ($failing.Count) {
            $md.Add('')
            $md.Add('**Proposed patterns** (unverified in game; each resolves to the function shown with the loader''s own check):')
            $md.Add('')
            $md.Add('| Owner | Pattern | Result | Found by | RVA | Proposal | Unique on |')
            $md.Add('|---|---|---|---|---|---|---|')
            foreach ($f in $failing) {
              $s = $f.row.suggest
              $how = "$($s.located)$(if ($s.PSObject.Properties['confidence']) { " ($($s.confidence))" })"
              $rva = if ($s.PSObject.Properties['rva']) { $s.rva } else { '-' }
              $props = @($s.proposals)
              $note = if ($s.PSObject.Properties['note']) { $s.note -replace '\|', '\|' } else { '' }
              if (-not $props.Count) { $md.Add("| $($f.owner) | ``$($f.row.name)`` | $($f.row.result) | $how | $rva | none: $note | - |"); continue }
              foreach ($q in $props) {
                $ref = if ($q.PSObject.Properties['uniqueOnReference']) { [bool]$q.uniqueOnReference } else { $null }
                $on = if ($q.uniqueOnTarget -and $ref) { 'both builds' }
                      elseif ($q.uniqueOnTarget) { 'this build' + $(if ($null -eq $ref) { '' } elseif ($s.PSObject.Properties['referenceKeepsCurrent'] -and $s.referenceKeepsCurrent) { '; public keeps the current pattern' } else { ' only' }) }
                      elseif ($ref) { 'public build only' } else { 'neither' }
                $follow = if ($q.followRel32At -ge 0) { " (follow rel32 at +$($q.followRel32At))" } else { ' (direct)' }
                $md.Add("| $($f.owner) | ``$($f.row.name)`` | $($f.row.result) | $how | $rva | ``$($q.pattern)``$follow | $on |")
              }
            }
          }

          # The proposals applied, rebuilt and scanned again; the branch the
          # auto-apply job pushed is found by its tree.
          $af = if ($r -and $r.PSObject.Properties['autofix'] -and $r.autofix) { $r.autofix } else { $null }
          if ($af -and @($af.plugins).Count) {
            $md.Add('')
            $md.Add("#### Auto-apply (proposals at confidence $($af.minConfidence) and up)")
            $md.Add('')
            $md.Add("Each fix is rebuilt and scanned on this build (CL-$($af.cl))$(if ($af.referenceCl) { " and on the public build (CL-$($af.referenceCl))" }). FIXED: every failing pattern resolves uniquely to the function the suggester located. PARTIAL: the same for the applied ones, and the rest were skipped. Only FIXED and PARTIAL fixes of the owner's forks are pushed.")
            $md.Add('')
            $md.Add('| Plugin | Verdict | Applied | Skipped | Branch | Note |')
            $md.Add('|---|---|---|---|---|---|')
            foreach ($p in @($af.plugins)) {
              $where = '-'
              if ($p.verdict -eq 'PATCH') { $where = "information only: ``$($p.patch)`` in the run's artifact, not pushed" }
              elseif ($p.verdict -in 'FIXED', 'PARTIAL' -and $p.repo -match '^(msantoro12|AlienXAXS)/(StarRupture-Plugin-[A-Za-z0-9_-]+)$') {
                # The branch is on the owner's fork of the plugin, whichever repository the commit was read from.
                $fork = "msantoro12/$($Matches[2])"
                $where = 'not pushed (see the auto-apply job)'
                # The fallback name carries the attempt that pushed it, which may be an earlier one.
                foreach ($line in @(git ls-remote "https://github.com/$fork" "refs/heads/auto/update-$($af.cl)" "refs/heads/auto/update-$($af.cl)-$($env:RUN_ID)-*" 2>$null)) {
                  $sha, $b = "$line" -split "`t"
                  $b = "$b" -replace '^refs/heads/', ''
                  if ($sha -match '^[0-9a-f]{40}$' -and (gh api "repos/$fork/git/commits/$sha" --jq .tree.sha 2>$null) -eq $p.tree) { $where = "``$b`` ($($sha.Substring(0, 7)))"; break }
                }
              }
              $skip = @($p.skipped | ForEach-Object { "$($_.name): $($_.reason)" })
              $note = (@(@($p.reasons) + $skip) -join '; ') -replace '\|', '\|'
              $md.Add("| $($p.name) | **$($p.verdict)** | $(@($p.applied).Count) | $(@($p.skipped).Count) | $where | $note |")
            }
            $md.Add('')
            $md.Add('The loader''s own patterns are never auto-applied: its proposals are listed above.')
          }

          # Age of the saved login (set by steam-ci-login.ps1).
          $md.Add('')
          if ($env:LOGIN_AT -match '^\d{4}-\d{2}-\d{2}$') {
            $exp = ([datetime]::ParseExact($env:LOGIN_AT, 'yyyy-MM-dd', $null)).AddDays([int]$env:LOGIN_DAYS)
            $left = [int][math]::Floor(($exp - [datetime]::UtcNow.Date).TotalDays)
            $line = "Steam CI login saved $($env:LOGIN_AT); assumed to last about $($env:LOGIN_DAYS) days (until about $($exp.ToString('yyyy-MM-dd')), $left days left)."
            if ($left -lt [int]$env:WARN_DAYS) { $line = "**Warning:** $line Run ``steam-ci-login.ps1 -Renew`` before then." }
            $md.Add($line)
          } elseif ($status -ne 'no-login') {
            $md.Add('Steam CI login age unknown (repo variable `STEAM_CI_LOGIN_AT` is not set).')
          }
          if ($env:CHECK_RESULT -ne 'success') {
            $md.Add('')
            $md.Add('The watcher does not check a build again while its update PR is open. Once the cause is fixed: `gh workflow run sr-watch.yml --ref main -f force=true`.')
          }
          $md.Add('')
          $md.Add('Offline check of the downloaded build only: the game is never started. Plugin checks run each plugin''s load hook and stop any call it makes into game code. Game files stay on the runner.')

          $md -join "`n" | Set-Content report.md -Encoding utf8
          Get-Content report.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($env:PR -match '^[0-9]+$') {
            gh pr comment $env:PR --body-file report.md
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Could not comment on PR #$($env:PR); the result is in the run summary." }
          }
          exit 0

  # ---- Weekly: is the saved login about to expire? -------------------------
  expiry:
    name: login-expiry
    if: ${{ !inputs.branch || inputs.branch == 'expiry-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      LOGIN_AT: ${{ vars.STEAM_CI_LOGIN_AT }}
    steps:
      - name: Check the login age
        run: |
          if ! [[ "$LOGIN_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::notice::No Steam CI login recorded (repo variable STEAM_CI_LOGIN_AT unset); nothing to check."
            exit 0
          fi
          expires="$(date -u -d "$LOGIN_AT + $LOGIN_DAYS days" +%F)"
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u -d "$(date -u +%F)" +%s) ) / 86400 ))
          echo "Steam CI login saved $LOGIN_AT, assumed to expire about $expires: $left days left."
          if [ "$left" -lt "$WARN_DAYS" ]; then
            echo "::error title=Steam CI login::The saved Steam CI login expires in about $left days ($expires). Run steam-ci-login.ps1 -Renew."
            exit 1
          fi
