name: SR client check

# REPLAY BRANCH test/replay-update2: the client check exactly as on main,
# pointed at the pre-Update-2 loader (fork branch test/replay-update2) and
# run under its own environment, steam-client-replay, whose Steam login only
# this branch can read. Nothing on this branch can release.

# Offline check of a new StarRupture client build (Steam app 1631270): logs in
# to Steam with the saved CI login, downloads the build, and checks it without
# running it:
#   - the exe's ProductVersion ends with the CL the loader requires
#   - sr-aobscan runs every PreflightRegistry pattern (with the four Game-SDK
#     globals) against the exe and resolves their RVAs
#   - the resolved SDK globals are compared with the Game SDK's Offsets::
#   - each plugin's own OnPluginLoadHooks resolves its patterns against the
#     exe (sr-aobscan --plugin); plugins in `plugins` are built from source,
#     those in `plugin_manifests` are the released DLL players get
# The result is a JSON artifact and a comment on the game-update PR.
#
# Trust: the scanner and plugin code run in the job that held the Steam
# login, after the login cache is deleted from disk. Deleting it does not
# clear it from the runner's memory, so that code only ever comes from the
# owners the inputs allow (msantoro12 and AlienXAXS; for released DLLs also
# LetMeInside, MiniMap's author), the same trust as scanner_ref.
#
# Login: a separate Steam account that owns the game, never the owner's main
# account. Its steamcmd login cache (config.vdf) is the secret
# STEAM_CI_LOGIN_CACHE in the environment `steam-client` (deployment branch:
# main only), made by steam-ci-login.ps1 on the owner's PC. No password ever
# reaches CI. Without the secret the check is skipped and says so, green.
#
# Game files only live on the runner: never cached, never uploaded.
# No pull_request trigger: the login secret is never reachable from a PR.

on:
  workflow_call:
    inputs:
      branch:
        description: 'Client branch: public or public_test_branch'
        type: string
        required: true
      buildid:
        description: 'Build id the watcher saw (compared with what Steam installs)'
        type: string
        default: ''
      pr:
        description: 'Pull request number to post the result on'
        type: string
        default: ''
      loader_repo:
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      loader_ref:
        type: string
        default: 'test/replay-update2'
      scanner_ref:
        type: string
        default: 'ci/aobscan'
      plugins:
        type: string
        default: 'msantoro12/StarRupture-Plugin-BetterCheats@test/replay-update2 msantoro12/StarRupture-Plugin-BetterDrone@test/replay-update2 msantoro12/StarRupture-Plugin-WAILA@test/replay-update2 msantoro12/StarRupture-Plugin-Codex@test/replay-update2'
      plugin_manifests:
        type: string
        default: ''
      plugin_sdk_ref:
        type: string
        default: '4196e1fe3a83c120133daad824cbaff94780898b'
      game_sdk_ref:
        type: string
        default: '4ab6473c15a0c1975a7e89b867e321e28b2645e8'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Client branch (expiry-only: just check the saved login age)'
        type: choice
        options: [public, public_test_branch, expiry-only]
        default: public
      pr:
        description: 'Pull request number to post the result on (blank: no comment)'
        type: string
        default: ''
      loader_repo:
        description: 'Loader repository the patterns come from'
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      loader_ref:
        description: 'Loader branch the patterns come from'
        type: string
        default: 'test/replay-update2'
      scanner_ref:
        description: 'Branch of the loader repository holding tools/AobScan'
        type: string
        default: 'ci/aobscan'
      plugins:
        description: 'Plugins whose patterns are checked too: owner/repo@ref, space-separated'
        type: string
        default: 'msantoro12/StarRupture-Plugin-BetterCheats@test/replay-update2 msantoro12/StarRupture-Plugin-BetterDrone@test/replay-update2 msantoro12/StarRupture-Plugin-WAILA@test/replay-update2 msantoro12/StarRupture-Plugin-Codex@test/replay-update2'
      plugin_manifests:
        description: 'Released plugins, checked as players get them: the update-manifest URL from each one''s sidecar .json, space-separated'
        type: string
        default: ''
      plugin_sdk_ref:
        description: 'AlienXAXS/StarRupture-Plugin-SDK ref the plugins build against'
        type: string
        default: '4196e1fe3a83c120133daad824cbaff94780898b'
      game_sdk_ref:
        description: 'AlienXAXS/StarRupture-Game-SDK ref the plugins build against'
        type: string
        default: '4ab6473c15a0c1975a7e89b867e321e28b2645e8'
  schedule:
    # Weekly: warn ahead of the saved Steam login expiring.
    - cron: '17 6 * * 1'

permissions: {}

env:
  APP_ID: '1631270'
  # Steam does not publish the refresh-token lifetime; about 200 days is the
  # commonly observed value. Warn this many days ahead.
  LOGIN_DAYS: '200'
  WARN_DAYS: '30'

jobs:
  # ---- sr-aobscan, built from the loader's live patterns (no secrets) ------
  build:
    name: build-scanner
    if: inputs.branch && inputs.branch != 'expiry-only'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      required_cl: ${{ steps.read.outputs.required_cl }}
      sdk_offsets: ${{ steps.read.outputs.sdk_offsets }}
      scanner_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check the loader repository
        shell: pwsh
        env:
          LOADER_REPO: ${{ inputs.loader_repo }}
        run: |
          # The scanner built here runs in the job that holds the Steam login,
          # so it only ever comes from the owner's fork or the upstream repo.
          if ($env:LOADER_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-ModLoader$') {
            throw "loader_repo '$($env:LOADER_REPO)' is not allowed"
          }

      - name: Check out the loader (with its pinned Game SDK)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader
          submodules: recursive
          persist-credentials: false

      - name: Check out tools/AobScan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.scanner_ref }}
          path: scanner-src
          sparse-checkout: tools/AobScan
          persist-credentials: false

      - name: Read the required CL and the SDK offsets
        id: read
        shell: pwsh
        run: |
          # The scanner source comes from its own branch; the patterns, the
          # scan code and the SDK are the loader branch's, so the scan always
          # checks what that branch would ship.
          Copy-Item -Recurse -Force scanner-src\tools\AobScan loader\tools\

          $f = 'loader\StarRupture-ModLoader-Core\core\version_check.cpp'
          $m = Select-String -Path $f -Pattern 'kRequiredVersionSuffix\[\]\s*=\s*L"([^"]+)"'
          if (-not $m) { throw 'required CL not found in version_check.cpp' }
          $cl = $m.Matches[0].Groups[1].Value

          $basic = 'loader\StarRupture SDK\Client\SDK\Basic.hpp'
          $offsets = [ordered]@{}
          foreach ($k in 'GObjects', 'AppendString', 'GNames', 'GWorld') {
            $o = Select-String -Path $basic -Pattern "constexpr\s+int32\s+$k\s*=\s*(0x[0-9A-Fa-f]+)"
            $offsets[$k] = if ($o) { $o.Matches[0].Groups[1].Value } else { '' }
          }
          $json = $offsets | ConvertTo-Json -Compress
          "Required CL: $cl"
          "SDK Offsets: $json"
          "required_cl=$cl" >> $env:GITHUB_OUTPUT
          "sdk_offsets=$json" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build sr-aobscan (Client Release)
        shell: pwsh
        working-directory: loader
        run: |
          msbuild "tools\AobScan\AobScan.vcxproj" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hash the scanner
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash loader\build\tools\sr-aobscan-client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sr-aobscan-client.exe SHA-256 $h"
          "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Upload the scanner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-aobscan-client-${{ inputs.branch }}
          path: loader/build/tools/sr-aobscan-client.exe
          if-no-files-found: error
          retention-days: 1

  # ---- The plugins whose patterns are checked too -------------------------
  # Each plugin's own OnPluginLoadHooks is run by sr-aobscan --plugin against
  # the downloaded exe, so the patterns checked are the ones that DLL
  # registers. A plugin in `plugins` is built from source; one in
  # `plugin_manifests` is the released DLL its update manifest names, fetched
  # the way the loader's auto-updater fetches it. A plugin that fails fails
  # only itself: the loader's verdict stays what the loader's patterns say.
  plugin-plan:
    name: plugin-plan
    if: inputs.branch && inputs.branch != 'expiry-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Check the plugin list
        id: plan
        shell: pwsh
        env:
          PLUGINS: ${{ inputs.plugins }}
          MANIFESTS: ${{ inputs.plugin_manifests }}
        run: |
          # Plugin code runs in the job that downloaded the client (after the
          # login cache is removed), so it only comes from known owners.
          $list = [Collections.Generic.List[object]]::new()
          foreach ($p in ("$env:PLUGINS" -split '\s+' | Where-Object { $_ })) {
            if ($p -notmatch '^(msantoro12|AlienXAXS)/(StarRupture-Plugin-[A-Za-z0-9_-]+)@([A-Za-z0-9._/-]+)$') { throw "plugin '$p' is not owner/repo@ref from an allowed owner" }
            $list.Add([ordered]@{ name = ($Matches[2] -replace '^StarRupture-Plugin-', ''); source = 'build'; repo = "$($Matches[1])/$($Matches[2])"; ref = $Matches[3]; manifest = '' })
          }
          foreach ($u in ("$env:MANIFESTS" -split '\s+' | Where-Object { $_ })) {
            if ($u -notmatch '^https://github\.com/(msantoro12|AlienXAXS|LetMeInside)/(StarRupture-Plugin-[A-Za-z0-9_-]+)/releases/latest/download/[A-Za-z0-9._-]+\.json$') { throw "manifest '$u' is not a latest-release asset of an allowed owner's plugin repository" }
            $list.Add([ordered]@{ name = ($Matches[2] -replace '^StarRupture-Plugin-', ''); source = 'release'; repo = "$($Matches[1])/$($Matches[2])"; ref = 'latest release'; manifest = $u })
          }
          $twice = @($list | Group-Object { $_.name } | Where-Object Count -gt 1 | ForEach-Object Name)
          if ($twice.Count) { throw "listed more than once: $($twice -join ', ')" }
          $json = ConvertTo-Json -InputObject @($list) -Compress
          "matrix=$json" >> $env:GITHUB_OUTPUT
          "any=$(if ($list.Count) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          $json

  plugins:
    name: plugin ${{ matrix.name }}
    needs: plugin-plan
    if: needs.plugin-plan.outputs.any == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugin-plan.outputs.matrix) }}
    steps:
      - name: Fetch the released plugin
        if: matrix.source == 'release'
        shell: pwsh
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          $ErrorActionPreference = 'Stop'
          # What a player's loader installs: the plugin's sidecar .json points
          # at this manifest, and the manifest names the DLL.
          $m = Invoke-RestMethod -Uri $env:MANIFEST -TimeoutSec 60
          $url = [string]$m.download_url
          if ($url -notmatch ('^https://github\.com/' + [regex]::Escape($env:REPO) + '/releases/download/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+\.dll)$')) {
            throw "download_url '$url' is not a release asset of $($env:REPO)"
          }
          $tag = $Matches[1]; $file = $Matches[2]
          New-Item -ItemType Directory -Force out | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "out\$file" -TimeoutSec 120
          [ordered]@{ name = $env:NAME; repo = $env:REPO; ref = $tag; sha = ''; version = [string]$m.version; dll = $file
                      sha256 = (Get-FileHash "out\$file" -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content out\plugin.json -Encoding utf8
          Get-Content out\plugin.json

      - name: Check out the plugin
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: plugin
          persist-credentials: false

      - name: Check out the Plugin SDK
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlienXAXS/StarRupture-Plugin-SDK
          ref: ${{ inputs.plugin_sdk_ref }}
          path: plugin-sdk
          persist-credentials: false

      - name: Check out the Game SDK
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlienXAXS/StarRupture-Game-SDK
          ref: ${{ inputs.game_sdk_ref }}
          path: game-sdk
          persist-credentials: false

      - name: Check out the loader's plugin interface
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader-interface
          sparse-checkout: StarRupture-ModLoader-Core/plugins/plugin_interface.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Add MSBuild to PATH
        if: matrix.source == 'build'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build the plugin (Client Release)
        if: matrix.source == 'build'
        shell: pwsh
        working-directory: plugin
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Built against the interface of the loader being checked, as it is in game.
          Copy-Item ..\loader-interface\StarRupture-ModLoader-Core\plugins\plugin_interface.h ..\plugin-sdk\include\plugin_interface.h -Force
          $sln = @(Get-ChildItem -File -Filter *.sln)
          if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
          $tag = if (Test-Path version) { (Get-Content version -Raw).Trim() } else { 'dev' }
          msbuild $sln[0].Name `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="$tag" `
            /p:GameSDKRoot="$env:GITHUB_WORKSPACE\game-sdk" `
            /p:PluginSDKInclude="$env:GITHUB_WORKSPACE\plugin-sdk\include" `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem 'build\Client Release\Plugins' -File -Filter *.dll)
          if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item $dll[0].FullName ..\out\
          [ordered]@{ name = $env:NAME; repo = $env:REPO; ref = $env:REF; sha = (git rev-parse HEAD); dll = $dll[0].Name
                      sha256 = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content ..\out\plugin.json -Encoding utf8
          Get-Content ..\out\plugin.json

      - name: Upload the plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ inputs.branch }}-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # ---- Job A: Steam login, download, offline checks ------------------------
  # The only job that can read the login secret: environment steam-client,
  # contents: read, no checkout of any repository. The login cache is deleted
  # from the runner before the scanner runs.
  check:
    name: check
    needs: [build, plugin-plan, plugins]
    # A plugin that does not build fails only itself, not the client check.
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.branch && inputs.branch != 'expiry-only' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: steam-client-replay
    permissions:
      contents: read
    concurrency:
      group: sr-client-check-${{ inputs.branch }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ inputs.branch }}
      EXPECTED_BUILDID: ${{ inputs.buildid }}
    steps:
      - name: Is a Steam login configured?
        id: gate
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.STEAM_CI_LOGIN_CACHE != '' && secrets.STEAM_CI_USERNAME != '' }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if ($env:HAS_LOGIN -eq 'true') {
            "has_login=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "has_login=false" >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=Client check skipped::No Steam login for CI is configured (environment steam-client has no STEAM_CI_LOGIN_CACHE / STEAM_CI_USERNAME). Run steam-ci-login.ps1 once to set it up."
          [ordered]@{ schema = 1; status = 'skipped'; branch = $env:BRANCH; expectedBuildid = $env:EXPECTED_BUILDID;
                      reason = 'no Steam login configured for CI' } |
            ConvertTo-Json | Set-Content out\result.json -Encoding utf8

      - name: Download the client build
        id: dl
        if: steps.gate.outputs.has_login == 'true'
        timeout-minutes: 70
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $dl = [ordered]@{ login = 'not tried'; step0 = ''; installed = $false; reason = ''; detail = ''; installDir = '';
                            buildid = ''; attempts = 0; seconds = 0; sizeOnDisk = ''; cacheRewritten = $null }
          $failed = $false
          $root = 'C:\steamcmd'
          try {
            if ($env:BRANCH -notmatch '^[A-Za-z0-9_]+$') { throw "bad branch name '$env:BRANCH'" }
            $user = "$env:STEAM_USER".Trim()
            if ($user -notmatch '^[A-Za-z0-9_]{3,64}$') { throw 'STEAM_CI_USERNAME is not a valid Steam account name' }
            Write-Host "::add-mask::$user"
            # Cut from every steamcmd line, so it cannot reach result.json or the PR.
            $userRx = '(?i)' + [regex]::Escape($user)

            # Valve's steamcmd, checked to be Valve-signed before and after
            # its self-update.
            New-Item -ItemType Directory -Force $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
            Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath $root -Force
            $steamcmd = Join-Path $root 'steamcmd.exe'
            function Assert-ValveSigned {
              $sig = Get-AuthenticodeSignature $steamcmd
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -cnotmatch '^CN=Valve(?: Corp\.)?, (?:OU=[^,"]+, )?O=Valve(?: Corp\.)?, (?:L=Bellevue, )?S=Washington, C=US$') {
                throw "steamcmd.exe is not Valve-signed (status $($sig.Status))"
              }
            }
            Assert-ValveSigned
            Write-Host '::group::steamcmd self-update'
            & $steamcmd +quit | ForEach-Object { Write-Host $_ }
            Write-Host "self-update exit code: $LASTEXITCODE"
            Write-Host '::endgroup::'
            Assert-ValveSigned

            # Restore the saved login cache. GitHub masks the secret as
            # stored (base64); the decoded token values are masked here.
            try { $bytes = [Convert]::FromBase64String("$env:STEAM_CACHE".Trim()) }
            catch { $dl.reason = 'cache-unreadable'; throw 'STEAM_CI_LOGIN_CACHE is not base64' }
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            foreach ($m in [regex]::Matches($text, '"([^"]{16,})"')) { Write-Host "::add-mask::$($m.Groups[1].Value)" }
            if ($text -notmatch '"ConnectCache"') {
              $dl.reason = 'cache-unreadable'
              throw 'STEAM_CI_LOGIN_CACHE is not a steamcmd config.vdf with a ConnectCache entry'
            }
            $cfgDir = Join-Path $root 'config'
            New-Item -ItemType Directory -Force $cfgDir | Out-Null
            $cfg = Join-Path $cfgDir 'config.vdf'
            [IO.File]::WriteAllBytes($cfg, $bytes)
            $text = $null; $bytes = $null
            $hashBefore = (Get-FileHash $cfg).Hash

            $vol = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free } | Sort-Object Free -Descending | Select-Object -First 1
            $install = Join-Path $vol.Root 'sr-client'
            New-Item -ItemType Directory -Force $install | Out-Null
            $dl.installDir = $install
            Write-Host ("Installing to {0} ({1:N1} GB free)" -f $install, ($vol.Free / 1GB))

            $cmd = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                     '+force_install_dir', $install, '+login', $user, '+app_update', $env:APP_ID)
            if ($env:BRANCH -ne 'public') { $cmd += @('-beta', $env:BRANCH) }
            $cmd += '+quit'

            $manifest = Join-Path $install "steamapps\appmanifest_$($env:APP_ID).acf"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $installed = $false
            for ($i = 1; $i -le 3 -and -not $installed; $i++) {
              $dl.attempts = $i
              Write-Host "::group::steamcmd attempt $i of 3"
              $lines = [Collections.Generic.List[string]]::new()
              $lastBucket = -1
              & $steamcmd @cmd 2>&1 | ForEach-Object {
                # Account ids out of the log (the account name is masked).
                $line = "$_" -replace '\[U:1:\d+\]', '[U:1:***]' -replace '7656119\d{10}', '***' -replace $userRx, '***'
                $lines.Add($line)
                if ($line -match 'progress:\s+([\d.]+)') {
                  $bucket = [int]([double]$Matches[1] / 10)
                  if ($bucket -ne $lastBucket) { $lastBucket = $bucket; Write-Host ("[{0:N0}s] {1}" -f $sw.Elapsed.TotalSeconds, $line) }
                } else { Write-Host $line }
              }
              $code = $LASTEXITCODE
              Write-Host "steamcmd exit code: $code after $([int]$sw.Elapsed.TotalSeconds) s"
              Write-Host '::endgroup::'
              $all = $lines -join "`n"
              $loginOk = $all -match 'to Steam Public\.\.\.OK|Waiting for user info\.\.\.OK'
              $installed = ($code -eq 0) -and (Test-Path $manifest) -and ((Get-Content $manifest -Raw) -match '"StateFlags"\s+"4"')
              if ($loginOk -or $installed) { $dl.login = 'ok' }
              if ($installed) { $dl.installed = $true; $dl.reason = ''; $dl.detail = ''; break }
              $errLine = ($lines | Where-Object { $_ -match 'FAILED|ERROR|Invalid Password|Logon Denied|Guard|Rate Limit|No subscription|license' } | Select-Object -First 1)
              $dl.detail = "$errLine".Trim() -replace '\|', '/'
              if ($dl.login -ne 'ok') {
                # Login failures are never retried: a retry cannot fix the
                # token and repeated attempts get the account rate-limited.
                $dl.login = 'failed'
                $dl.reason = if ($all -match 'Rate Limit') { 'rate-limited' } else { 'login-rejected' }
                break
              }
              if ($all -match 'No subscription|missing license|No license') { $dl.reason = 'no-license'; break }
              $dl.reason = 'download-failed'
            }
            $sw.Stop()
            $dl.seconds = [int]$sw.Elapsed.TotalSeconds
            $dl.cacheRewritten = ((Get-FileHash $cfg).Hash -ne $hashBefore)

            switch ($dl.login) {
              'ok' { $dl.step0 = 'PASS'; Write-Host 'STEP0 PASS: the restored login cache was accepted on a fresh runner (no password, no Steam Guard code).' }
              default {
                if ($dl.reason -eq 'rate-limited') {
                  $dl.step0 = 'UNDECIDED'; Write-Host 'STEP0 UNDECIDED: Steam rate-limited the login before it could use the cache; re-run later.'
                } else {
                  $dl.step0 = 'FAIL'; Write-Host "STEP0 FAIL: the restored login cache was NOT accepted on a fresh runner ($($dl.detail))."
                }
              }
            }
            Write-Host ("Login cache after the login: {0}" -f $(if ($dl.cacheRewritten) { 'rewritten by steamcmd (the saved secret is unchanged)' } else { 'unchanged' }))

            if (-not $installed) {
              $failed = $true
              switch ($dl.reason) {
                'login-rejected' { Write-Host "::error title=Steam login::login expired, run steam-ci-login.ps1 -Renew (Steam rejected the saved CI login: $($dl.detail))" }
                'rate-limited'   { Write-Host "::error title=Steam login::Steam rate-limited the CI login. Not a token problem: re-run this check later." }
                'no-license'     { Write-Host "::error title=Steam license::The CI Steam account logged in but does not own StarRupture (app $($env:APP_ID))." }
                default          { Write-Host "::error title=Steam download::Logged in, but the download failed after $($dl.attempts) attempts ($($dl.detail))." }
              }
            } else {
              $acf = Get-Content $manifest -Raw
              if ($acf -match '"buildid"\s+"(\d+)"') { $dl.buildid = $Matches[1] }
              if ($acf -match '"SizeOnDisk"\s+"(\d+)"') { $dl.sizeOnDisk = $Matches[1] }
              Write-Host "Installed build $($dl.buildid) ($([math]::Round([double]$dl.sizeOnDisk / 1GB, 1)) GB on disk) in $($dl.seconds) s"
              if ($env:EXPECTED_BUILDID -and $dl.buildid -ne $env:EXPECTED_BUILDID) {
                Write-Host "::warning::Steam installed build $($dl.buildid), the watcher saw $($env:EXPECTED_BUILDID); the branch moved again. The check covers $($dl.buildid)."
              }
              "install_dir=$install" >> $env:GITHUB_OUTPUT

              # The build players run today, for the pattern proposals
              # (sr-aobscan --suggest --reference): it finds the function a
              # failing pattern lands on now, and lets one pattern serve both
              # builds. The login cache is gone once this step ends, so it is
              # fetched here; a failure costs only the both-builds proposals.
              if ($env:BRANCH -ne 'public') {
                $refDir = Join-Path $vol.Root 'sr-ref'
                New-Item -ItemType Directory -Force $refDir | Out-Null
                $refCmd = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                            '+force_install_dir', $refDir, '+login', $user, '+app_update', $env:APP_ID, '+quit')
                $refManifest = Join-Path $refDir "steamapps\appmanifest_$($env:APP_ID).acf"
                $refWatch = [Diagnostics.Stopwatch]::StartNew()
                Write-Host '::group::steamcmd: the public build, for the pattern proposals'
                & $steamcmd @refCmd 2>&1 | ForEach-Object {
                  $line = "$_" -replace '\[U:1:\d+\]', '[U:1:***]' -replace '7656119\d{10}', '***' -replace $userRx, '***'
                  if ($line -notmatch 'progress:') { Write-Host $line }
                }
                $refCode = $LASTEXITCODE
                Write-Host '::endgroup::'
                $refOk = ($refCode -eq 0) -and (Test-Path $refManifest) -and ((Get-Content $refManifest -Raw) -match '"StateFlags"\s+"4"')
                $dl.reference = [ordered]@{ installed = $refOk; buildid = ''; seconds = [int]$refWatch.Elapsed.TotalSeconds }
                if ($refOk) {
                  if ((Get-Content $refManifest -Raw) -match '"buildid"\s+"(\d+)"') { $dl.reference.buildid = $Matches[1] }
                  Write-Host "Installed the public build $($dl.reference.buildid) in $($dl.reference.seconds) s"
                  "reference_dir=$refDir" >> $env:GITHUB_OUTPUT
                } else {
                  Write-Host "::warning title=Pattern proposals::The public build did not download (steamcmd exit $refCode); proposals cover this build only."
                }
              }
            }
          } catch {
            $failed = $true
            if (-not $dl.reason) { $dl.reason = 'error' }
            if ($dl.reason -eq 'cache-unreadable') {
              Write-Host "::error title=Steam login::$($_.Exception.Message). Run steam-ci-login.ps1 (without -Renew) to save a fresh login."
            } else {
              Write-Host "::error::$($_.Exception.Message)"
            }
          } finally {
            $dl | ConvertTo-Json | Set-Content out\download.json -Encoding utf8
          }
          if ($failed) { exit 1 }

      - name: Remove the login cache from the runner
        id: cleanup
        if: always() && steps.gate.outputs.has_login == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\steamcmd -ErrorAction SilentlyContinue
          if (Test-Path C:\steamcmd) { Write-Host '::error::C:\steamcmd could not be removed'; exit 1 }
          'steamcmd and its login cache are removed from the runner.'

      - name: Download the scanner
        if: steps.dl.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sr-aobscan-client-${{ inputs.branch }}
          path: scanner

      - name: Check the client build
        id: scan
        if: steps.dl.outcome == 'success'
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
          SDK_OFFSETS: ${{ needs.build.outputs.sdk_offsets }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $warnings = [Collections.Generic.List[string]]::new()
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $pv = [string]$exe.VersionInfo.ProductVersion
          $clOk = [bool]($pv -and $env:REQUIRED_CL -and $pv.EndsWith($env:REQUIRED_CL))
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "exe: $($exe.FullName.Substring($env:INSTALL_DIR.Length))"
          "ProductVersion=$pv required=$($env:REQUIRED_CL) match=$clOk"
          "SHA-256=$sha"

          # Proposals for failing patterns use the public build (when this is
          # another branch) and the PDB shipped next to each exe.
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          foreach ($e in @(@($exe) + @($refExe) | Where-Object { $_ })) {
            $pdb = [IO.Path]::ChangeExtension($e.FullName, '.pdb')
            $which = if ($refExe -and $e.FullName -eq $refExe.FullName) { 'public build' } else { 'this build' }
            "PDB ($which): $(if (Test-Path $pdb) { '{0:N1} GB' -f ((Get-Item $pdb).Length / 1GB) } else { 'absent' })"
          }

          $scanner = 'scanner\sr-aobscan-client.exe'
          $scannerSha = (Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($scannerSha -ne $env:SCANNER_SHA256) { throw "sr-aobscan-client.exe hash $scannerSha is not the one build-scanner made ($($env:SCANNER_SHA256))" }
          & $scanner $exe.FullName --verbose @suggest *> out\scanner.txt
          & $scanner $exe.FullName --json @suggest > out\scanner.json
          $scanCode = $LASTEXITCODE
          Get-Content out\scanner.txt | Write-Host
          $scan = Get-Content out\scanner.json -Raw | ConvertFrom-Json
          $notOk = @($scan.patterns | Where-Object { $_.result -ne 'OK' } |
            ForEach-Object {
              $o = [ordered]@{ name = $_.name; required = $_.required; result = $_.result }
              if ($_.PSObject.Properties['suggest']) { $o.suggest = $_.suggest }
              $o })
          foreach ($p in $notOk) { if (-not $p.required) { $warnings.Add("optional pattern $($p.name): $($p.result)") } }

          # The Game-SDK globals. GObjects and AppendString must equal the
          # SDK's Offsets::; the SDK's GNames and GWorld are not the engine
          # globals (see the SDK's Basic.hpp disclaimer), so those two are
          # shown for information only.
          $sdk = $env:SDK_OFFSETS | ConvertFrom-Json
          $names = [ordered]@{ GObjects = 'GObjects (GUObjectArray.ObjObjects)'; AppendString = 'FName::AppendString';
                               GNames = 'GNames (NamePoolData)'; GWorld = 'GWorld' }
          $globals = foreach ($k in $names.Keys) {
            $row = $scan.patterns | Where-Object { $_.name -eq $names[$k] } | Select-Object -First 1
            $rva = if ($row -and $row.result -eq 'OK' -and $row.PSObject.Properties['rva']) { [Convert]::ToInt64(($row.rva -replace '^0x', ''), 16) } else { $null }
            $sdkv = if ($sdk.$k) { [Convert]::ToInt64(($sdk.$k -replace '^0x', ''), 16) } else { $null }
            $byDesign = $k -in 'GNames', 'GWorld'
            $match = if ($null -ne $rva -and $null -ne $sdkv) { $rva -eq $sdkv } else { $null }
            if ($null -eq $rva) { $warnings.Add("SDK global $k did not resolve ($(if ($row) { $row.result } else { 'not in the registry' }))") }
            elseif (-not $byDesign -and $match -eq $false) { $warnings.Add(("SDK Offsets::{0} is 0x{1:X}, this build has 0x{2:X}: the Game SDK needs a fresh dump" -f $k, $sdkv, $rva)) }
            [ordered]@{ name = $k; result = $(if ($row) { $row.result } else { 'absent' });
                        rva = $(if ($null -ne $rva) { '0x{0:X}' -f $rva } else { '' });
                        sdk = $(if ($null -ne $sdkv) { '0x{0:X}' -f $sdkv } else { '' });
                        match = $match; informational = $byDesign }
          }

          $fail = (-not $clOk) -or ($scanCode -ne 0)
          [ordered]@{
            exe = [ordered]@{ productVersion = $pv; requiredCl = $env:REQUIRED_CL; clOk = $clOk; sha256 = $sha }
            scan = [ordered]@{ exitCode = $scanCode; summary = $scan.summary; notOk = $notOk
                     suggest = $(if ($scan.PSObject.Properties['suggest']) { $scan.suggest } else { $null }) }
            sdkGlobals = @($globals)
            warnings = @($warnings)
            fail = $fail
          } | ConvertTo-Json -Depth 12 | Set-Content out\checks.json -Encoding utf8
          foreach ($w in $warnings) { Write-Host "::warning::$w" }
          if (-not $clOk) { Write-Host "::error::ProductVersion '$pv' does not end with the loader's required '$($env:REQUIRED_CL)'" }
          if ($scanCode -ne 0) { Write-Host "::error::sr-aobscan exit code $scanCode ($($scan.summary.requiredFailing) required patterns failing)" }
          if ($fail) { exit 1 }

      # Plugin code never runs while the login cache could still be on disk.
      - name: Download the plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-${{ inputs.branch }}-*
          path: plugins

      - name: Check the plugins' patterns
        id: plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        # A plugin that hangs must not hold up the loader's result.
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # Per plugin: PASS when the loader would let it load; GAME-CALL (partial
          # coverage, never a full pass) when every pattern resolved before the
          # first call into game code, which cannot run offline and was stopped; FAIL when any pattern it resolves
          # does not (the loader refuses a plugin on any recorded failure);
          # CRASH; REFUSED (interface version outside the loader's range); NONE
          # (no OnPluginLoadHooks); BUILD-FAILED or FETCH-FAILED; ERROR. Only the
          # plugin fails; the loader's status does not change.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          $results = foreach ($p in ($env:PLAN | ConvertFrom-Json)) {
            $r = [ordered]@{ name = $p.name; source = $p.source; repo = $p.repo; ref = $p.ref; sha = '' }
            # One plugin's problem never stops the others.
            try {
              $dir = "plugins\plugin-$($env:BRANCH)-$($p.name)"
              $meta = if (Test-Path "$dir\plugin.json") { Get-Content "$dir\plugin.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $meta) {
                $r.verdict = if ($p.source -eq 'release') { 'FETCH-FAILED' } else { 'BUILD-FAILED' }
                Write-Host "::error title=Plugin $($p.name)::$(if ($p.source -eq 'release') { 'its released DLL could not be fetched' } else { 'did not build' }), so its patterns were not checked"
                $r; continue
              }
              $r.ref = $meta.ref
              $r.sha = $meta.sha
              $dll = Join-Path $dir $meta.dll
              if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.sha256) { throw "$($meta.dll) is not the DLL the plugin job made" }
              $stem = "out\plugin-$($p.name)"
              $ErrorActionPreference = 'Continue'
              & $scanner $exe.FullName --plugin $dll --json @suggest > "$stem.json" 2> "$stem.txt"
              $r.exitCode = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              Get-Content "$stem.txt" | Write-Host
              $scan = if ($r.exitCode -ne 2 -and (Test-Path "$stem.json") -and (Get-Item "$stem.json").Length) { Get-Content "$stem.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $scan) { throw "sr-aobscan could not run it (exit $($r.exitCode)); see out/plugin-$($p.name).txt" }
              $r.plugin = $scan.plugin
              $r.verdict = $scan.verdict
              $r.summary = $scan.summary
              foreach ($k in 'note', 'crash', 'gameCalls') { if ($scan.PSObject.Properties[$k]) { $r[$k] = $scan.$k } }
              $r.patterns = @($scan.patterns | ForEach-Object {
                $o = [ordered]@{ name = $(if ($_.name) { $_.name } else { "(raw) $($_.pattern)" }); call = $_.call; kind = $_.kind
                                 required = $_.required; recorded = $_.recorded; result = $_.result }
                if ($_.PSObject.Properties['suggest']) { $o.suggest = $_.suggest }
                $o })
              foreach ($row in @($scan.patterns | Where-Object { $_.recorded -and $_.result -ne 'OK' })) {
                Write-Host "::error title=Plugin $($p.name)::$($row.name): $($row.result)$(if ($row.required) { '' } else { ' (declared optional; the loader still refuses the plugin)' })"
              }
              switch ($r.verdict) {
                'CRASH'     { Write-Host "::error title=Plugin $($p.name)::OnPluginLoadHooks crashed ($($scan.crash))" }
                'REFUSED'   { Write-Host "::error title=Plugin $($p.name)::$($scan.note)" }
                'GAME-CALL' { Write-Host "::notice title=Plugin $($p.name)::$($scan.note) ($($scan.gameCalls.first))" }
              }
            } catch {
              $r.verdict = 'ERROR'
              $r.error = $_.Exception.Message
              Write-Host "::error title=Plugin $($p.name)::$($r.error)"
            }
            $r
          }
          $results = @($results)
          [ordered]@{
            status = $(if (@($results | Where-Object { $_.verdict -notin 'PASS', 'NONE', 'GAME-CALL' }).Count) { 'fail' } else { 'pass' })
            plugins = $results
          } | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          foreach ($r in $results) { "$($r.name): $($r.verdict)" }

      - name: Write the result
        if: always() && steps.gate.outputs.has_login == 'true'
        shell: pwsh
        env:
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          $r = [ordered]@{ schema = 1; status = ''; branch = $env:BRANCH; expectedBuildid = $env:EXPECTED_BUILDID }
          $dl = if (Test-Path out\download.json) { Get-Content out\download.json -Raw | ConvertFrom-Json } else { $null }
          $ck = if (Test-Path out\checks.json) { Get-Content out\checks.json -Raw | ConvertFrom-Json } else { $null }
          $r.download = $dl
          $r.checks = $ck
          # Reported beside the loader's verdict, never folded into it: status
          # below covers the loader only. Anything that blocks on plugins reads
          # plugins.status.
          $r.plugins = if (Test-Path out\plugins.json) { Get-Content out\plugins.json -Raw | ConvertFrom-Json } else { $null }
          $r.status =
            if (-not $dl) { 'error' }
            elseif ($dl.login -ne 'ok') { 'login-failed' }
            elseif (-not $dl.installed) { 'download-failed' }
            elseif (-not $ck) { 'error' }
            elseif ($ck.fail) { 'fail' }
            elseif (@($ck.warnings).Count -gt 0) { 'pass-with-warnings' }
            else { 'pass' }
          $r | ConvertTo-Json -Depth 12 | Set-Content out\result.json -Encoding utf8
          "Client check: $($r.status)"
          Remove-Item out\download.json, out\checks.json, out\plugins.json -ErrorAction SilentlyContinue

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-check-${{ inputs.branch }}
          path: |
            out/result.json
            out/scanner.txt
            out/scanner.json
            out/plugin-*.json
            out/plugin-*.txt
          if-no-files-found: warn
          retention-days: 14

  # ---- Job B: comment on the update PR (no secrets, no environment) --------
  report:
    name: report
    needs: [build, check]
    if: always() && inputs.branch && inputs.branch != 'expiry-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write    # comment on the game-update PR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ inputs.branch }}
      EXPECTED_BUILDID: ${{ inputs.buildid }}
      BUILD_RESULT: ${{ needs.build.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      LOGIN_AT: ${{ vars.STEAM_CI_LOGIN_AT }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      - name: Summarise and comment
        shell: pwsh
        run: |
          $r = if (Test-Path res/result.json) { Get-Content res/result.json -Raw | ConvertFrom-Json } else { $null }
          $status = if ($r) { $r.status } elseif ($env:BUILD_RESULT -ne 'success') { 'scanner-build-failed' } else { "no-result ($($env:CHECK_RESULT))" }
          $build = if ($r -and $r.download -and $r.download.buildid) { $r.download.buildid } else { $env:EXPECTED_BUILDID }
          $md = [Collections.Generic.List[string]]::new()
          $md.Add("### Client build check: $($status.ToUpperInvariant()) ($($env:BRANCH), build $build)")
          $md.Add('')
          $md.Add("Run: $($env:RUN_URL)")
          $md.Add('')
          if ($status -eq 'skipped') {
            $md.Add('No Steam login is configured for CI (environment `steam-client` has no `STEAM_CI_LOGIN_CACHE`), so the new client build was not checked offline. The owner sets it up once with `steam-ci-login.ps1`.')
          } elseif ($r) {
            $dl = $r.download; $ck = $r.checks
            $md.Add('| Check | Result |')
            $md.Add('|---|---|')
            $login = switch ($dl.step0) {
              'PASS'      { 'accepted (saved cache, no password)' }
              'FAIL'      {
                if ($env:LOGIN_AT -and $env:LOGIN_AT -ge [datetime]::UtcNow.AddDays(-1).ToString('yyyy-MM-dd')) {
                  "REJECTED right after the login was saved: Step 0 failed, the saved cache does not carry over to a fresh runner, and -Renew will not fix that ($($dl.detail))"
                } else { "REJECTED: login expired, run ``steam-ci-login.ps1 -Renew`` ($($dl.detail))" }
              }
              'UNDECIDED' { 'rate-limited by Steam; re-run later' }
              default     { "$($dl.reason) $($dl.detail)".Trim() }
            }
            $md.Add("| Steam login | $login |")
            if ($dl.login -eq 'ok') {
              $dlText = if ($dl.installed) { '{0} GB on disk in {1} min' -f [math]::Round([double]$dl.sizeOnDisk / 1GB, 1), [math]::Round($dl.seconds / 60, 1) } else { "FAILED ($($dl.reason): $($dl.detail))" }
              $md.Add("| Download | $dlText |")
            }
            if ($ck) {
              $md.Add(('| ProductVersion | `{0}`, loader requires `{1}`: {2} |' -f $ck.exe.productVersion, $ck.exe.requiredCl, $(if ($ck.exe.clOk) { 'match' } else { '**MISMATCH**' })))
              $s = $ck.scan.summary
              $md.Add("| Pattern scan | $($s.total) patterns: $($s.ok) OK, $($s.missing) missing, $($s.ambiguous) ambiguous, $($s.other) other; **$($s.requiredFailing) required failing** |")
              foreach ($p in @($ck.scan.notOk)) { $md.Add("| - $($p.name) | $($p.result)$(if ($p.required) { ' (required)' }) |") }
              foreach ($g in @($ck.sdkGlobals)) {
                $cmp = if ($g.informational) { "SDK value $($g.sdk) is not the engine global (by design)" } elseif ($g.match) { 'equals the SDK' } elseif ($null -eq $g.match) { 'not compared' } else { "**SDK has $($g.sdk): SDK dump needed**" }
                $md.Add("| SDK global $($g.name) | $($g.result) $($g.rva); $cmp |")
              }
              $md.Add("| exe SHA-256 | ``$($ck.exe.sha256)`` |")
              if (@($ck.warnings).Count -gt 0) {
                $md.Add('')
                $md.Add('Warnings:')
                foreach ($w in @($ck.warnings)) { $md.Add("- $w") }
              }
            }
          } else {
            $md.Add("The check produced no result (scanner build: $($env:BUILD_RESULT), check: $($env:CHECK_RESULT)). See the run.")
          }

          # The plugins: one row each, then every pattern they resolved.
          if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) {
            $md.Add('')
            $partial = @($r.plugins.plugins | Where-Object { $_.verdict -eq 'GAME-CALL' } | ForEach-Object { $_.name })
            $md.Add("#### Plugins: $($r.plugins.status.ToUpperInvariant())$(if ($partial.Count) { ' (partial: ' + ($partial -join ', ') + ' not fully exercised)' })")
            $md.Add('')
            $md.Add('The loader refuses a plugin that fails here. A failing plugin does not change the loader verdict above.')
            $md.Add('')
            $md.Add('| Plugin | Ref | Verdict | OK | MISSING | AMBIGUOUS | Other | Note |')
            $md.Add('|---|---|---|---|---|---|---|---|')
            foreach ($p in @($r.plugins.plugins)) {
              $s = if ($p.PSObject.Properties['summary']) { $p.summary } else { $null }
              # A released plugin shows its tag; a built one its ref and commit.
              $ref = if ($p.source -eq 'release') { "``$($p.ref)`` (release)" } elseif ($p.sha) { "``$($p.ref)`` ($($p.sha.Substring(0, 7)))" } else { "``$($p.ref)``" }
              $note = foreach ($k in 'note', 'crash', 'error') { if ($p.PSObject.Properties[$k] -and $p.$k) { $p.$k } }
              $md.Add("| $($p.name) | $ref | **$($p.verdict)$(if ($p.verdict -eq 'GAME-CALL') { ' (partial)' })** | $(if ($s) { $s.ok }) | $(if ($s) { $s.missing }) | $(if ($s) { $s.ambiguous }) | $(if ($s) { $s.other + $s.reported }) | $((@($note) -join '; ') -replace '\|', '\|') |")
            }
            foreach ($p in @($r.plugins.plugins | Where-Object { $_.PSObject.Properties['patterns'] -and @($_.patterns).Count })) {
              $md.Add('')
              $md.Add("<details><summary>$($p.name): $(@($p.patterns).Count) patterns</summary>")
              $md.Add('')
              $md.Add('| Result | Pattern | Kind | Required |')
              $md.Add('|---|---|---|---|')
              foreach ($row in @($p.patterns)) {
                $req = if (-not $row.recorded) { 'raw scan' } elseif ($row.required) { 'yes' } else { 'no' }
                $md.Add("| $($row.result) | ``$($row.name -replace '\|', '\|')`` | $($row.kind) | $req |")
              }
              $md.Add('')
              $md.Add('</details>')
            }
          }

          # Proposed replacements for failing patterns (sr-aobscan --suggest).
          $failing = [Collections.Generic.List[object]]::new()
          if ($r -and $r.checks) { foreach ($row in @($r.checks.scan.notOk)) { $failing.Add([pscustomobject]@{ owner = 'loader'; row = $row }) } }
          foreach ($p in @($(if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) { $r.plugins.plugins }) | Where-Object { $_.PSObject.Properties['patterns'] })) {
            foreach ($row in @($p.patterns)) { $failing.Add([pscustomobject]@{ owner = $p.name; row = $row }) }
          }
          $failing = @($failing | Where-Object { $_.row.PSObject.Properties['suggest'] -and $_.row.suggest })
          if ($failing.Count) {
            $md.Add('')
            $md.Add('**Proposed patterns** (unverified in game; each resolves to the function shown with the loader''s own check):')
            $md.Add('')
            $md.Add('| Owner | Pattern | Result | Found by | RVA | Proposal | Unique on |')
            $md.Add('|---|---|---|---|---|---|---|')
            foreach ($f in $failing) {
              $s = $f.row.suggest
              $how = "$($s.located)$(if ($s.PSObject.Properties['confidence']) { " ($($s.confidence))" })"
              $rva = if ($s.PSObject.Properties['rva']) { $s.rva } else { '-' }
              $props = @($s.proposals)
              $note = if ($s.PSObject.Properties['note']) { $s.note -replace '\|', '\|' } else { '' }
              if (-not $props.Count) { $md.Add("| $($f.owner) | ``$($f.row.name)`` | $($f.row.result) | $how | $rva | none: $note | - |"); continue }
              foreach ($q in $props) {
                $ref = if ($q.PSObject.Properties['uniqueOnReference']) { [bool]$q.uniqueOnReference } else { $null }
                $on = if ($q.uniqueOnTarget -and $ref) { 'both builds' }
                      elseif ($q.uniqueOnTarget) { 'this build' + $(if ($null -eq $ref) { '' } elseif ($s.PSObject.Properties['referenceKeepsCurrent']) { '; public keeps the current pattern' } else { ' only' }) }
                      elseif ($ref) { 'public build only' } else { 'neither' }
                $follow = if ($q.PSObject.Properties['followRel32At']) { " (follow rel32 at +$($q.followRel32At))" } else { '' }
                $md.Add("| $($f.owner) | ``$($f.row.name)`` | $($f.row.result) | $how | $rva | ``$($q.pattern)``$follow | $on |")
              }
            }
          }

          # Age of the saved login (set by steam-ci-login.ps1).
          $md.Add('')
          if ($env:LOGIN_AT -match '^\d{4}-\d{2}-\d{2}$') {
            $exp = ([datetime]::ParseExact($env:LOGIN_AT, 'yyyy-MM-dd', $null)).AddDays([int]$env:LOGIN_DAYS)
            $left = [int][math]::Floor(($exp - [datetime]::UtcNow.Date).TotalDays)
            $line = "Steam CI login saved $($env:LOGIN_AT); assumed to last about $($env:LOGIN_DAYS) days (until about $($exp.ToString('yyyy-MM-dd')), $left days left)."
            if ($left -lt [int]$env:WARN_DAYS) { $line = "**Warning:** $line Run ``steam-ci-login.ps1 -Renew`` before then." }
            $md.Add($line)
          } elseif ($status -ne 'skipped') {
            $md.Add('Steam CI login age unknown (repo variable `STEAM_CI_LOGIN_AT` is not set).')
          }
          $md.Add('')
          $md.Add('Offline check of the downloaded build only: the game is never started. Plugin checks run each plugin''s load hook and stop any call it makes into game code. Game files stay on the runner.')

          $md -join "`n" | Set-Content report.md -Encoding utf8
          Get-Content report.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($env:PR -match '^[0-9]+$') {
            gh pr comment $env:PR --body-file report.md
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Could not comment on PR #$($env:PR); the result is in the run summary." }
          }
          exit 0

  # ---- Weekly: is the saved login about to expire? -------------------------
  expiry:
    name: login-expiry
    if: ${{ !inputs.branch || inputs.branch == 'expiry-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      LOGIN_AT: ${{ vars.STEAM_CI_LOGIN_AT }}
    steps:
      - name: Check the login age
        run: |
          if ! [[ "$LOGIN_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::notice::No Steam CI login recorded (repo variable STEAM_CI_LOGIN_AT unset); nothing to check."
            exit 0
          fi
          expires="$(date -u -d "$LOGIN_AT + $LOGIN_DAYS days" +%F)"
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u -d "$(date -u +%F)" +%s) ) / 86400 ))
          echo "Steam CI login saved $LOGIN_AT, assumed to expire about $expires: $left days left."
          if [ "$left" -lt "$WARN_DAYS" ]; then
            echo "::error title=Steam CI login::The saved Steam CI login expires in about $left days ($expires). Run steam-ci-login.ps1 -Renew."
            exit 1
          fi
