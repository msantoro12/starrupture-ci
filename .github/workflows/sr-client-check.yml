name: SR client check

# Offline check of a new StarRupture client build (Steam app 1631270): logs in
# to Steam with the saved CI login, downloads the build, and checks it without
# running it:
#   - the exe's ProductVersion ends with the CL the loader requires
#   - sr-aobscan runs every PreflightRegistry pattern (with the four Game-SDK
#     globals) against the exe and resolves their RVAs
#   - the resolved SDK globals are compared with the Game SDK's Offsets::
#   - each plugin's own OnPluginLoadHooks resolves its patterns against the
#     exe (sr-aobscan --plugin); plugins in `plugins` are built from source,
#     those in `plugin_manifests` are the released DLL players get
#   - auto-apply: a plugin's failing patterns are patched with the proposals
#     at or above apply_confidence (high unless a replay says otherwise), the
#     plugin is rebuilt and scanned again on this build and the public one,
#     and a verified fix of one of the owner's forks is pushed to that fork as
#     auto/update-<CL> (ci/apply-proposals.mjs)
# The result is a JSON artifact and a comment on the game-update PR.
#
# Trust: the scanner and plugin code run in the job that held the Steam
# login, after the login cache is deleted from disk. Deleting it does not
# clear it from the runner's memory, so that code only ever comes from the
# owners the inputs allow (msantoro12 and AlienXAXS; for released DLLs also
# LetMeInside, MiniMap's author), the same trust as scanner_ref. The fork
# deploy keys are only in the auto-apply job (environment fork-push), which
# runs no plugin code and no action but actions/checkout, and checks every
# field of its work list: the commit must be the one plugin-plan resolved
# from the inputs, before any plugin code ran. Each key can write only
# auto/** branches on its fork, and no tags.
#
# Login: a separate Steam account that owns the game, never the owner's main
# account. Its steamcmd login cache (config.vdf) is the secret
# STEAM_CI_LOGIN_CACHE in the environment `steam-client` (deployment branch:
# main only), made by steam-ci-login.ps1 on the owner's PC. No password ever
# reaches CI. Without the secret the check is skipped and says so, green.
#
# Game files only live on the runner: never cached, never uploaded.
# No pull_request trigger: the login secret is never reachable from a PR.

on:
  workflow_call:
    inputs:
      branch:
        description: 'Client branch: public or public_test_branch'
        type: string
        required: true
      buildid:
        description: 'Build id the watcher saw (compared with what Steam installs)'
        type: string
        default: ''
      pr:
        description: 'Pull request number to post the result on'
        type: string
        default: ''
      loader_repo:
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      loader_ref:
        type: string
        default: 'gss/loader-work'
      scanner_ref:
        type: string
        default: 'ci/aobscan'
      plugins:
        type: string
        default: 'msantoro12/StarRupture-Plugin-BetterCheats@gss/plugin-work msantoro12/StarRupture-Plugin-BetterDrone@gss/plugin-work msantoro12/StarRupture-Plugin-WAILA@gss/plugin-work msantoro12/StarRupture-Plugin-Codex@gss/plugin-work msantoro12/StarRupture-Plugin-Compass@gss/plugin-work msantoro12/StarRupture-Plugin-ProductionViewer@gss/plugin-work msantoro12/StarRupture-Plugin-RuptureTimer@gss/plugin-work msantoro12/StarRupture-Plugin-WaveOptimiser@gss/plugin-work msantoro12/StarRupture-Plugin-CameraControls@gss/plugin-work'
      plugin_manifests:
        type: string
        default: 'https://github.com/LetMeInside/StarRupture-Plugin-MiniMap/releases/latest/download/MiniMap-client-manifest.json'
      plugin_sdk_repo:
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-SDK'
      plugin_sdk_ref:
        type: string
        default: 'main'
      game_sdk_ref:
        type: string
        default: 'main'
      apply_confidence:
        description: 'Lowest proposal confidence that is auto-applied: high, or medium for a replay'
        type: string
        default: 'high'
      map_mode:
        description: 'Write the update into the loader version map (ci/map-mode.mjs) and upload the header'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      branch:
        description: 'Client branch (expiry-only: just check the saved login age)'
        type: choice
        options: [public, public_test_branch, expiry-only]
        default: public
      pr:
        description: 'Pull request number to post the result on (blank: no comment)'
        type: string
        default: ''
      loader_repo:
        description: 'Loader repository the patterns come from'
        type: string
        default: 'msantoro12/StarRupture-ModLoader'
      loader_ref:
        description: 'Loader branch the patterns come from'
        type: string
        default: 'gss/loader-work'
      scanner_ref:
        description: 'Branch of the loader repository holding tools/AobScan'
        type: string
        default: 'ci/aobscan'
      plugins:
        description: 'Plugins whose patterns are checked too: owner/repo@ref, space-separated'
        type: string
        default: 'msantoro12/StarRupture-Plugin-BetterCheats@gss/plugin-work msantoro12/StarRupture-Plugin-BetterDrone@gss/plugin-work msantoro12/StarRupture-Plugin-WAILA@gss/plugin-work msantoro12/StarRupture-Plugin-Codex@gss/plugin-work msantoro12/StarRupture-Plugin-Compass@gss/plugin-work msantoro12/StarRupture-Plugin-ProductionViewer@gss/plugin-work msantoro12/StarRupture-Plugin-RuptureTimer@gss/plugin-work msantoro12/StarRupture-Plugin-WaveOptimiser@gss/plugin-work msantoro12/StarRupture-Plugin-CameraControls@gss/plugin-work'
      plugin_manifests:
        description: 'Released plugins, checked as players get them: the update-manifest URL from each one''s sidecar .json, space-separated'
        type: string
        default: 'https://github.com/LetMeInside/StarRupture-Plugin-MiniMap/releases/latest/download/MiniMap-client-manifest.json'
      plugin_sdk_repo:
        description: 'Plugin SDK repository the plugins build against (msantoro12 or AlienXAXS)'
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-SDK'
      plugin_sdk_ref:
        description: 'Plugin SDK ref the plugins build against'
        type: string
        default: 'main'
      game_sdk_ref:
        description: 'AlienXAXS/StarRupture-Game-SDK ref the plugins build against'
        type: string
        default: 'main'
      apply_confidence:
        description: 'Lowest proposal confidence that is auto-applied (medium only for a replay)'
        type: choice
        options: [high, medium]
        default: high
      map_mode:
        description: 'Write the update into the loader version map (ci/map-mode.mjs) and upload the header'
        type: boolean
        default: false
  schedule:
    # Weekly: warn ahead of the saved Steam login expiring.
    - cron: '17 6 * * 1'

permissions: {}

env:
  APP_ID: '1631270'
  # Steam does not publish the refresh-token lifetime; about 200 days is the
  # commonly observed value. Warn this many days ahead.
  LOGIN_DAYS: '200'
  WARN_DAYS: '30'

jobs:
  # ---- sr-aobscan, built from the loader's live patterns (no secrets) ------
  build:
    name: build-scanner
    if: inputs.branch && inputs.branch != 'expiry-only'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      required_cl: ${{ steps.read.outputs.required_cl }}
      sdk_offsets: ${{ steps.read.outputs.sdk_offsets }}
      scanner_sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check the loader repository
        shell: pwsh
        env:
          LOADER_REPO: ${{ inputs.loader_repo }}
        run: |
          # The scanner built here runs in the job that holds the Steam login,
          # so it only ever comes from the owner's fork or the upstream repo.
          if ($env:LOADER_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-ModLoader$') {
            throw "loader_repo '$($env:LOADER_REPO)' is not allowed"
          }

      - name: Check out the loader (with its pinned Game SDK)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader
          submodules: recursive
          persist-credentials: false

      - name: Check out tools/AobScan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.scanner_ref }}
          path: scanner-src
          sparse-checkout: tools/AobScan
          persist-credentials: false

      - name: Read the required CL and the SDK offsets
        id: read
        shell: pwsh
        run: |
          # The scanner source comes from its own branch; the patterns, the
          # scan code and the SDK are the loader branch's, so the scan always
          # checks what that branch would ship.
          Copy-Item -Recurse -Force scanner-src\tools\AobScan loader\tools\

          # A loader with one required CL names it here. A loader that runs on
          # every build in its version map has no such line; the scanner then
          # reports that loader's own gate verdict (exe.supported).
          $f = 'loader\StarRupture-ModLoader-Core\core\version_check.cpp'
          $m = Select-String -Path $f -Pattern 'kRequiredVersionSuffix\[\]\s*=\s*L"([^"]+)"'
          $cl = if ($m) { $m.Matches[0].Groups[1].Value } else { '' }

          $basic = 'loader\StarRupture SDK\Client\SDK\Basic.hpp'
          $offsets = [ordered]@{}
          foreach ($k in 'GObjects', 'AppendString', 'GNames', 'GWorld') {
            $o = Select-String -Path $basic -Pattern "constexpr\s+int32\s+$k\s*=\s*(0x[0-9A-Fa-f]+)"
            $offsets[$k] = if ($o) { $o.Matches[0].Groups[1].Value } else { '' }
          }
          $json = $offsets | ConvertTo-Json -Compress
          "Required CL: $(if ($cl) { $cl } else { 'none (the loader''s version map decides)' })"
          "SDK Offsets: $json"
          "required_cl=$cl" >> $env:GITHUB_OUTPUT
          "sdk_offsets=$json" >> $env:GITHUB_OUTPUT

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build sr-aobscan (Client Release)
        shell: pwsh
        working-directory: loader
        run: |
          msbuild "tools\AobScan\AobScan.vcxproj" `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hash the scanner
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash loader\build\tools\sr-aobscan-client.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "sr-aobscan-client.exe SHA-256 $h"
          "sha256=$h" >> $env:GITHUB_OUTPUT

      - name: Upload the scanner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-aobscan-client-${{ inputs.branch }}
          path: loader/build/tools/sr-aobscan-client.exe
          if-no-files-found: error
          retention-days: 1

  # ---- The plugins whose patterns are checked too -------------------------
  # Each plugin's own OnPluginLoadHooks is run by sr-aobscan --plugin against
  # the downloaded exe, so the patterns checked are the ones that DLL
  # registers. A plugin in `plugins` is built from source; one in
  # `plugin_manifests` is the released DLL its update manifest names, fetched
  # the way the loader's auto-updater fetches it. A plugin that fails fails
  # only itself: the loader's verdict stays what the loader's patterns say.
  plugin-plan:
    name: plugin-plan
    if: inputs.branch && inputs.branch != 'expiry-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Check the plugin list
        id: plan
        shell: pwsh
        env:
          PLUGINS: ${{ inputs.plugins }}
          MANIFESTS: ${{ inputs.plugin_manifests }}
          PLUGIN_SDK_REPO: ${{ inputs.plugin_sdk_repo }}
        run: |
          # Plugin code runs in the job that downloaded the client (after the
          # login cache is removed), so it only comes from known owners. The
          # Plugin SDK is compiled into every plugin, so it does too.
          if ($env:PLUGIN_SDK_REPO -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Plugin-SDK$') { throw "plugin_sdk_repo '$($env:PLUGIN_SDK_REPO)' is not allowed" }
          $list = [Collections.Generic.List[object]]::new()
          foreach ($p in ("$env:PLUGINS" -split '\s+' | Where-Object { $_ })) {
            if ($p -notmatch '^(msantoro12|AlienXAXS)/(StarRupture-Plugin-[A-Za-z0-9_-]+)@([A-Za-z0-9._/-]+)$') { throw "plugin '$p' is not owner/repo@ref from an allowed owner" }
            $list.Add([ordered]@{ name = ($Matches[2] -replace '^StarRupture-Plugin-', ''); source = 'build'; repo = "$($Matches[1])/$($Matches[2])"; ref = $Matches[3]; sha = ''; manifest = '' })
          }
          foreach ($u in ("$env:MANIFESTS" -split '\s+' | Where-Object { $_ })) {
            if ($u -notmatch '^https://github\.com/(msantoro12|AlienXAXS|LetMeInside)/(StarRupture-Plugin-[A-Za-z0-9_-]+)/releases/latest/download/[A-Za-z0-9._-]+\.json$') { throw "manifest '$u' is not a latest-release asset of an allowed owner's plugin repository" }
            $list.Add([ordered]@{ name = ($Matches[2] -replace '^StarRupture-Plugin-', ''); source = 'release'; repo = "$($Matches[1])/$($Matches[2])"; ref = 'latest release'; sha = ''; manifest = $u })
          }
          # Each ref is resolved to its commit here, before any plugin code
          # runs: the plugins job builds exactly that commit, and auto-apply
          # pushes only on top of it.
          foreach ($e in @($list | Where-Object { $_.source -eq 'build' })) {
            if ($e.ref -match '^[0-9a-f]{40}$') { $e.sha = $e.ref; continue }
            $refs = @(git ls-remote "https://github.com/$($e.repo)" "refs/heads/$($e.ref)" "refs/tags/$($e.ref)" "refs/tags/$($e.ref)^{}")
            if ($LASTEXITCODE -ne 0) { throw "git ls-remote $($e.repo) failed (exit $LASTEXITCODE)" }
            $hit = foreach ($want in "refs/heads/$($e.ref)", "refs/tags/$($e.ref)^{}", "refs/tags/$($e.ref)") {
              $line = $refs | Where-Object { ($_ -split '\s+')[1] -eq $want } | Select-Object -First 1
              if ($line) { ($line -split '\s+')[0]; break }
            }
            if ("$hit" -notmatch '^[0-9a-f]{40}$') { throw "$($e.repo) has no branch or tag '$($e.ref)'" }
            $e.sha = "$hit"
          }
          $twice = @($list | Group-Object { $_.name } | Where-Object Count -gt 1 | ForEach-Object Name)
          if ($twice.Count) { throw "listed more than once: $($twice -join ', ')" }
          $json = ConvertTo-Json -InputObject @($list) -Compress
          "matrix=$json" >> $env:GITHUB_OUTPUT
          "any=$(if ($list.Count) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          $json

  plugins:
    name: plugin ${{ matrix.name }}
    needs: plugin-plan
    if: needs.plugin-plan.outputs.any == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plugin-plan.outputs.matrix) }}
    steps:
      - name: Fetch the released plugin
        if: matrix.source == 'release'
        shell: pwsh
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          MANIFEST: ${{ matrix.manifest }}
        run: |
          $ErrorActionPreference = 'Stop'
          # What a player's loader installs: the plugin's sidecar .json points
          # at this manifest, and the manifest names the DLL.
          $m = Invoke-RestMethod -Uri $env:MANIFEST -TimeoutSec 60
          $url = [string]$m.download_url
          if ($url -notmatch ('^https://github\.com/' + [regex]::Escape($env:REPO) + '/releases/download/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+\.dll)$')) {
            throw "download_url '$url' is not a release asset of $($env:REPO)"
          }
          $tag = $Matches[1]; $file = $Matches[2]
          New-Item -ItemType Directory -Force out | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "out\$file" -TimeoutSec 120
          [ordered]@{ name = $env:NAME; repo = $env:REPO; ref = $tag; sha = ''; version = [string]$m.version; dll = $file
                      sha256 = (Get-FileHash "out\$file" -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content out\plugin.json -Encoding utf8
          Get-Content out\plugin.json

      - name: Check out the plugin
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: plugin
          persist-credentials: false

      - name: Check out the Plugin SDK
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.plugin_sdk_repo }}
          ref: ${{ inputs.plugin_sdk_ref }}
          path: plugin-sdk
          persist-credentials: false

      - name: Check out the Game SDK
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AlienXAXS/StarRupture-Game-SDK
          ref: ${{ inputs.game_sdk_ref }}
          path: game-sdk
          persist-credentials: false

      - name: Check out the loader's plugin interface
        if: matrix.source == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader-interface
          sparse-checkout: StarRupture-ModLoader-Core/plugins/plugin_interface.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Add MSBuild to PATH
        if: matrix.source == 'build'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build the plugin (Client Release)
        if: matrix.source == 'build'
        shell: pwsh
        working-directory: plugin
        env:
          NAME: ${{ matrix.name }}
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
          LOADER_REPO: ${{ inputs.loader_repo }}
          PLUGIN_SDK_REPO: ${{ inputs.plugin_sdk_repo }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Built against the interface of the loader being checked, as it is in game.
          Copy-Item ..\loader-interface\StarRupture-ModLoader-Core\plugins\plugin_interface.h ..\plugin-sdk\include\plugin_interface.h -Force
          $sln = @(Get-ChildItem -File -Filter *.sln)
          if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
          $tag = if (Test-Path version) { (Get-Content version -Raw).Trim() } else { 'dev' }
          msbuild $sln[0].Name `
            /p:Configuration="Client Release" `
            /p:Platform=x64 `
            /p:PostBuildEventUseInBuild=false `
            /p:ModLoaderBuildTag="$tag" `
            /p:GameSDKRoot="$env:GITHUB_WORKSPACE\game-sdk" `
            /p:PluginSDKInclude="$env:GITHUB_WORKSPACE\plugin-sdk\include" `
            /m /p:CL_MP=true /nodeReuse:false /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @(Get-ChildItem 'build\Client Release\Plugins' -File -Filter *.dll)
          if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item $dll[0].FullName ..\out\
          # What it was built from, so the check job can rebuild it with a fix
          # applied from exactly the same sources.
          [ordered]@{ name = $env:NAME; repo = $env:REPO; ref = $env:REF; sha = (git rev-parse HEAD); dll = $dll[0].Name; tag = $tag
                      pluginSdkRepo = $env:PLUGIN_SDK_REPO; pluginSdk = (git -C ..\plugin-sdk rev-parse HEAD); gameSdk = (git -C ..\game-sdk rev-parse HEAD)
                      loaderRepo = $env:LOADER_REPO; loaderInterface = (git -C ..\loader-interface rev-parse HEAD)
                      sha256 = (Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() } |
            ConvertTo-Json | Set-Content ..\out\plugin.json -Encoding utf8
          Get-Content ..\out\plugin.json

      - name: Upload the plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ inputs.branch }}-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  # ---- Job A: Steam login, download, offline checks ------------------------
  # The only job that can read the login secret: environment steam-client,
  # contents: read. The login cache is deleted from the runner before the
  # scanner runs; the only checkout is this repository's apply tool, after it.
  check:
    name: check
    needs: [build, plugin-plan, plugins]
    # A plugin that does not build fails only itself, not the client check.
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.branch && inputs.branch != 'expiry-only' }}
    runs-on: windows-latest
    timeout-minutes: 120
    environment: steam-client
    permissions:
      contents: read
    concurrency:
      group: sr-client-check-${{ inputs.branch }}
      cancel-in-progress: false
    outputs:
      autofix: ${{ steps.fix.outputs.autofix }}
    env:
      BRANCH: ${{ inputs.branch }}
      EXPECTED_BUILDID: ${{ inputs.buildid }}
    steps:
      - name: Is a Steam login configured?
        id: gate
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.STEAM_CI_LOGIN_CACHE != '' && secrets.STEAM_CI_USERNAME != '' }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          if ($env:HAS_LOGIN -eq 'true') {
            "has_login=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "has_login=false" >> $env:GITHUB_OUTPUT
          Write-Host "::notice title=Client check skipped::No Steam login for CI is configured (environment steam-client has no STEAM_CI_LOGIN_CACHE / STEAM_CI_USERNAME). Run steam-ci-login.ps1 once to set it up."
          [ordered]@{ schema = 1; status = 'skipped'; branch = $env:BRANCH; expectedBuildid = $env:EXPECTED_BUILDID;
                      reason = 'no Steam login configured for CI' } |
            ConvertTo-Json | Set-Content out\result.json -Encoding utf8

      - name: Download the client build
        id: dl
        if: steps.gate.outputs.has_login == 'true'
        timeout-minutes: 70
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $dl = [ordered]@{ login = 'not tried'; step0 = ''; installed = $false; reason = ''; detail = ''; installDir = '';
                            buildid = ''; betaKey = ''; attempts = 0; seconds = 0; sizeOnDisk = ''; cacheRewritten = $null }
          $failed = $false
          $root = 'C:\steamcmd'
          try {
            if ($env:BRANCH -notmatch '^[A-Za-z0-9_]+$') { throw "bad branch name '$env:BRANCH'" }
            $user = "$env:STEAM_USER".Trim()
            if ($user -notmatch '^[A-Za-z0-9_]{3,64}$') { throw 'STEAM_CI_USERNAME is not a valid Steam account name' }
            Write-Host "::add-mask::$user"
            # Cut from every steamcmd line, so it cannot reach result.json or the PR.
            $userRx = '(?i)' + [regex]::Escape($user)

            # Valve's steamcmd, checked to be Valve-signed before and after
            # its self-update.
            New-Item -ItemType Directory -Force $root | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'steamcmd.zip'
            Invoke-WebRequest -Uri 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile $zip -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath $root -Force
            $steamcmd = Join-Path $root 'steamcmd.exe'
            function Assert-ValveSigned {
              $sig = Get-AuthenticodeSignature $steamcmd
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -cnotmatch '^CN=Valve(?: Corp\.)?, (?:OU=[^,"]+, )?O=Valve(?: Corp\.)?, (?:L=Bellevue, )?S=Washington, C=US$') {
                throw "steamcmd.exe is not Valve-signed (status $($sig.Status))"
              }
            }
            Assert-ValveSigned
            Write-Host '::group::steamcmd self-update'
            & $steamcmd +quit | ForEach-Object { Write-Host $_ }
            Write-Host "self-update exit code: $LASTEXITCODE"
            Write-Host '::endgroup::'
            Assert-ValveSigned

            # Restore the saved login cache. GitHub masks the secret as
            # stored (base64); the decoded token values are masked here.
            try { $bytes = [Convert]::FromBase64String("$env:STEAM_CACHE".Trim()) }
            catch { $dl.reason = 'cache-unreadable'; throw 'STEAM_CI_LOGIN_CACHE is not base64' }
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            foreach ($m in [regex]::Matches($text, '"[^"\r\n]*"[ \t]+"([^"\r\n]{16,})"')) { Write-Host "::add-mask::$($m.Groups[1].Value)" }
            if ($text -notmatch '"ConnectCache"') {
              $dl.reason = 'cache-unreadable'
              throw 'STEAM_CI_LOGIN_CACHE is not a steamcmd config.vdf with a ConnectCache entry'
            }
            $cfgDir = Join-Path $root 'config'
            New-Item -ItemType Directory -Force $cfgDir | Out-Null
            $cfg = Join-Path $cfgDir 'config.vdf'
            [IO.File]::WriteAllBytes($cfg, $bytes)
            $text = $null; $bytes = $null
            $hashBefore = (Get-FileHash $cfg).Hash

            $vol = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free } | Sort-Object Free -Descending | Select-Object -First 1
            $install = Join-Path $vol.Root 'sr-client'
            New-Item -ItemType Directory -Force $install | Out-Null
            $dl.installDir = $install
            Write-Host ("Installing to {0} ({1:N1} GB free)" -f $install, ($vol.Free / 1GB))

            # The branch is always named, public included: steamcmd otherwise
            # installs the branch it last used for the app.
            $cmd = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                     '+force_install_dir', $install, '+login', $user, '+app_update', $env:APP_ID, '-beta', $env:BRANCH, '+quit')
            # What an install really is, from its manifest: the branch Steam
            # mounted (MountedConfig BetaKey) and the build id.
            function Read-Manifest([string]$path) {
              $acf = Get-Content $path -Raw
              $mounted = if ($acf -match '"MountedConfig"\s*\{([^{}]*)\}') { $Matches[1] } else { '' }
              [ordered]@{
                betaKey = if ($mounted -match '"BetaKey"\s+"([^"]*)"') { $Matches[1] } else { '' }
                buildid = if ($acf -match '"buildid"\s+"(\d+)"') { $Matches[1] } else { '' }
                size    = if ($acf -match '"SizeOnDisk"\s+"(\d+)"') { $Matches[1] } else { '0' }
              }
            }

            $manifest = Join-Path $install "steamapps\appmanifest_$($env:APP_ID).acf"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $installed = $false
            for ($i = 1; $i -le 3 -and -not $installed; $i++) {
              $dl.attempts = $i
              Write-Host "::group::steamcmd attempt $i of 3"
              $lines = [Collections.Generic.List[string]]::new()
              $lastBucket = -1
              & $steamcmd @cmd 2>&1 | ForEach-Object {
                # Account ids out of the log (the account name is masked).
                $line = "$_" -replace '\[U:1:\d+\]', '[U:1:***]' -replace '7656119\d{10}', '***' -replace $userRx, '***'
                $lines.Add($line)
                if ($line -match 'progress:\s+([\d.]+)') {
                  $bucket = [int]([double]$Matches[1] / 10)
                  if ($bucket -ne $lastBucket) { $lastBucket = $bucket; Write-Host ("[{0:N0}s] {1}" -f $sw.Elapsed.TotalSeconds, $line) }
                } else { Write-Host $line }
              }
              $code = $LASTEXITCODE
              Write-Host "steamcmd exit code: $code after $([int]$sw.Elapsed.TotalSeconds) s"
              Write-Host '::endgroup::'
              $all = $lines -join "`n"
              $loginOk = $all -match 'to Steam Public\.\.\.OK|Waiting for user info\.\.\.OK'
              $installed = ($code -eq 0) -and (Test-Path $manifest) -and ((Get-Content $manifest -Raw) -match '"StateFlags"\s+"4"')
              if ($loginOk -or $installed) { $dl.login = 'ok' }
              if ($installed) { $dl.installed = $true; $dl.reason = ''; $dl.detail = ''; break }
              $errLine = ($lines | Where-Object { $_ -match 'FAILED|ERROR|Invalid Password|Logon Denied|Guard|Rate Limit|No subscription|license' } | Select-Object -First 1)
              $dl.detail = "$errLine".Trim() -replace '\|', '/'
              if ($dl.login -ne 'ok') {
                # Login failures are never retried: a retry cannot fix the
                # token and repeated attempts get the account rate-limited.
                $dl.login = 'failed'
                $dl.reason = if ($all -match 'Rate Limit') { 'rate-limited' } else { 'login-rejected' }
                break
              }
              if ($all -match 'No subscription|missing license|No license') { $dl.reason = 'no-license'; break }
              $dl.reason = 'download-failed'
            }
            $sw.Stop()
            $dl.seconds = [int]$sw.Elapsed.TotalSeconds
            $dl.cacheRewritten = ((Get-FileHash $cfg).Hash -ne $hashBefore)

            switch ($dl.login) {
              'ok' { $dl.step0 = 'PASS'; Write-Host 'STEP0 PASS: the restored login cache was accepted on a fresh runner (no password, no Steam Guard code).' }
              default {
                if ($dl.reason -eq 'rate-limited') {
                  $dl.step0 = 'UNDECIDED'; Write-Host 'STEP0 UNDECIDED: Steam rate-limited the login before it could use the cache; re-run later.'
                } else {
                  $dl.step0 = 'FAIL'; Write-Host "STEP0 FAIL: the restored login cache was NOT accepted on a fresh runner ($($dl.detail))."
                }
              }
            }
            Write-Host ("Login cache after the login: {0}" -f $(if ($dl.cacheRewritten) { 'rewritten by steamcmd (the saved secret is unchanged)' } else { 'unchanged' }))

            if (-not $installed) {
              $failed = $true
              switch ($dl.reason) {
                'login-rejected' { Write-Host "::error title=Steam login::login expired, run steam-ci-login.ps1 -Renew (Steam rejected the saved CI login: $($dl.detail))" }
                'rate-limited'   { Write-Host "::error title=Steam login::Steam rate-limited the CI login. Not a token problem: re-run this check later." }
                'no-license'     { Write-Host "::error title=Steam license::The CI Steam account logged in but does not own StarRupture (app $($env:APP_ID))." }
                default          { Write-Host "::error title=Steam download::Logged in, but the download failed after $($dl.attempts) attempts ($($dl.detail))." }
              }
            } else {
              $mf = Read-Manifest $manifest
              $dl.buildid = $mf.buildid
              $dl.sizeOnDisk = $mf.size
              $dl.betaKey = $mf.betaKey
              if ($mf.betaKey -ne $env:BRANCH -or -not $mf.buildid) {
                $dl.installed = $false
                $dl.reason = 'wrong-branch'
                $dl.detail = "the manifest says branch '$($mf.betaKey)', build '$($mf.buildid)'"
                throw "Steam installed the wrong thing for branch $($env:BRANCH): $($dl.detail)"
              }
              Write-Host "Installed build $($dl.buildid) of branch $($mf.betaKey) ($([math]::Round([double]$dl.sizeOnDisk / 1GB, 1)) GB on disk) in $($dl.seconds) s"
              if ($env:EXPECTED_BUILDID -and $dl.buildid -ne $env:EXPECTED_BUILDID) {
                Write-Host "::warning::Steam installed build $($dl.buildid), the watcher saw $($env:EXPECTED_BUILDID); the branch moved again. The check covers $($dl.buildid)."
              }
              "install_dir=$install" >> $env:GITHUB_OUTPUT

              # The build players run today, for the pattern proposals
              # (sr-aobscan --suggest --reference): it finds the function a
              # failing pattern lands on now, and lets one pattern serve both
              # builds. The login cache is gone once this step ends, so it is
              # fetched here; a failure costs only the both-builds proposals.
              if ($env:BRANCH -ne 'public') {
                try {
                  $refDir = Join-Path $vol.Root 'sr-ref'
                  New-Item -ItemType Directory -Force $refDir | Out-Null
                  $refCmd = @('+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                              '+force_install_dir', $refDir, '+login', $user, '+app_update', $env:APP_ID, '-beta', 'public', '+quit')
                  $refManifest = Join-Path $refDir "steamapps\appmanifest_$($env:APP_ID).acf"
                  $refWatch = [Diagnostics.Stopwatch]::StartNew()
                  Write-Host '::group::steamcmd: the public build, for the pattern proposals'
                  & $steamcmd @refCmd 2>&1 | ForEach-Object {
                    $line = "$_" -replace '\[U:1:\d+\]', '[U:1:***]' -replace '7656119\d{10}', '***' -replace $userRx, '***'
                    if ($line -notmatch 'progress:') { Write-Host $line }
                  }
                  $refCode = $LASTEXITCODE
                  Write-Host '::endgroup::'
                  $refOk = ($refCode -eq 0) -and (Test-Path $refManifest) -and ((Get-Content $refManifest -Raw) -match '"StateFlags"\s+"4"')
                  $dl.reference = [ordered]@{ installed = $false; reason = ''; buildid = ''; betaKey = ''; seconds = [int]$refWatch.Elapsed.TotalSeconds }
                  $rm = if ($refOk) { Read-Manifest $refManifest } else { $null }
                  if ($rm) { $dl.reference.buildid = $rm.buildid; $dl.reference.betaKey = $rm.betaKey }
                  if (-not $refOk) {
                    $dl.reference.reason = 'download-failed'
                    Write-Host "::warning title=Pattern proposals::The public build did not download (steamcmd exit $refCode); proposals cover this build only."
                  } elseif ($rm.betaKey -ne 'public' -or -not $rm.buildid) {
                    # A reference that is not the build players run would make
                    # every both-builds claim, and every auto-apply, wrong.
                    $dl.reference.reason = 'wrong-branch'
                    Write-Host "::error title=Pattern proposals::The reference download is not the public build (its manifest says branch '$($rm.betaKey)', build '$($rm.buildid)'). It is dropped: proposals cover this build only, and nothing is auto-applied against it."
                  } elseif ($rm.buildid -eq $dl.buildid) {
                    $dl.reference.reason = 'same-build'
                    Write-Host "::notice title=Pattern proposals::public is the same build ($($dl.buildid)); proposals cover this build only."
                  } else {
                    $dl.reference.installed = $true
                    Write-Host "Installed the public build $($rm.buildid) (branch $($rm.betaKey)) in $($dl.reference.seconds) s"
                    "reference_dir=$refDir" >> $env:GITHUB_OUTPUT
                  }
                } catch {
                  Write-Host '::endgroup::'
                  $dl.reference = [ordered]@{ installed = $false; reason = 'error'; buildid = ''; betaKey = ''; seconds = 0 }
                  $why = "$($_.Exception.Message)" -replace $userRx, '***'
                  Write-Host "::warning title=Pattern proposals::The public build did not download ($why); proposals cover this build only."
                }
              }
            }
          } catch {
            $failed = $true
            if (-not $dl.reason) { $dl.reason = 'error' }
            if ($dl.reason -eq 'cache-unreadable') {
              Write-Host "::error title=Steam login::$($_.Exception.Message). Run steam-ci-login.ps1 (without -Renew) to save a fresh login."
            } else {
              Write-Host "::error::$($_.Exception.Message)"
            }
          } finally {
            $dl | ConvertTo-Json | Set-Content out\download.json -Encoding utf8
          }
          if ($failed) { exit 1 }

      - name: Remove the login cache from the runner
        id: cleanup
        if: always() && steps.gate.outputs.has_login == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force C:\steamcmd -ErrorAction SilentlyContinue
          if (Test-Path C:\steamcmd) { Write-Host '::error::C:\steamcmd could not be removed'; exit 1 }
          'steamcmd and its login cache are removed from the runner.'

      - name: Download the scanner
        if: steps.dl.outcome == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sr-aobscan-client-${{ inputs.branch }}
          path: scanner

      - name: Check the client build
        id: scan
        if: steps.dl.outcome == 'success'
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
          SDK_OFFSETS: ${{ needs.build.outputs.sdk_offsets }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $warnings = [Collections.Generic.List[string]]::new()
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $pv = [string]$exe.VersionInfo.ProductVersion
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "exe: $($exe.FullName.Substring($env:INSTALL_DIR.Length))"
          "SHA-256=$sha"

          # Proposals for failing patterns use the public build (when this is
          # another branch) and the PDB shipped next to each exe.
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          $refPv = if ($refExe) { [string]$refExe.VersionInfo.ProductVersion } else { '' }
          if ($refExe) { "Reference (public build): ProductVersion=$refPv" }
          foreach ($e in @(@($exe) + @($refExe) | Where-Object { $_ })) {
            $pdb = [IO.Path]::ChangeExtension($e.FullName, '.pdb')
            $which = if ($refExe -and $e.FullName -eq $refExe.FullName) { 'public build' } else { 'this build' }
            "PDB ($which): $(if (Test-Path $pdb) { '{0:N1} GB' -f ((Get-Item $pdb).Length / 1GB) } else { 'absent' })"
          }

          $scanner = 'scanner\sr-aobscan-client.exe'
          $scannerSha = (Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($scannerSha -ne $env:SCANNER_SHA256) { throw "sr-aobscan-client.exe hash $scannerSha is not the one build-scanner made ($($env:SCANNER_SHA256))" }
          & $scanner $exe.FullName --verbose @suggest *> out\scanner.txt
          & $scanner $exe.FullName --json @suggest > out\scanner.json
          $scanCode = $LASTEXITCODE
          Get-Content out\scanner.txt | Write-Host
          $scan = Get-Content out\scanner.json -Raw | ConvertFrom-Json

          # The loader's version gate. A required CL (kRequiredVersionSuffix)
          # must end the ProductVersion; a scanner built from a loader with a
          # version map reports that loader's own verdict. Every gate the
          # loader has must pass, and at least one must be there.
          $gates = [Collections.Generic.List[bool]]::new()
          $required = [Collections.Generic.List[string]]::new()
          if ($env:REQUIRED_CL) {
            $gates.Add([bool]($pv -and $pv.EndsWith($env:REQUIRED_CL)))
            $required.Add($env:REQUIRED_CL)
          }
          if ($scan.PSObject.Properties['exe'] -and $scan.exe.PSObject.Properties['supported']) {
            $gates.Add($scan.exe.supported -is [bool] -and $scan.exe.supported)
            $required.Add((@($scan.exe.supportedBuilds) | ForEach-Object { "CL-$_" }) -join ' or ')
          }
          $clOk = $gates.Count -gt 0 -and -not ($gates -contains $false)
          $requiredCl = if ($required.Count) { $required -join ' and ' } else { 'no gate found' }
          "ProductVersion=$pv required=$requiredCl match=$clOk"

          $notOk =@($scan.patterns | Where-Object { $_.result -ne 'OK' } |
            ForEach-Object {
              $o = [ordered]@{ name = $_.name; required = $_.required; result = $_.result }
              if ($_.PSObject.Properties['suggest']) { $o.suggest = $_.suggest }
              $o })
          foreach ($p in $notOk) { if (-not $p.required) { $warnings.Add("optional pattern $($p.name): $($p.result)") } }

          # The Game-SDK globals. GObjects and AppendString must equal the
          # SDK's Offsets::; the SDK's GNames and GWorld are not the engine
          # globals (see the SDK's Basic.hpp disclaimer), so those two are
          # shown for information only.
          $sdk = $env:SDK_OFFSETS | ConvertFrom-Json
          $names = [ordered]@{ GObjects = 'GObjects (GUObjectArray.ObjObjects)'; AppendString = 'FName::AppendString';
                               GNames = 'GNames (NamePoolData)'; GWorld = 'GWorld' }
          $globals = foreach ($k in $names.Keys) {
            $row = $scan.patterns | Where-Object { $_.name -eq $names[$k] } | Select-Object -First 1
            $rva = if ($row -and $row.result -eq 'OK' -and $row.PSObject.Properties['rva']) { [Convert]::ToInt64(($row.rva -replace '^0x', ''), 16) } else { $null }
            $sdkv = if ($sdk.$k) { [Convert]::ToInt64(($sdk.$k -replace '^0x', ''), 16) } else { $null }
            $byDesign = $k -in 'GNames', 'GWorld'
            $match = if ($null -ne $rva -and $null -ne $sdkv) { $rva -eq $sdkv } else { $null }
            if ($null -eq $rva) { $warnings.Add("SDK global $k did not resolve ($(if ($row) { $row.result } else { 'not in the registry' }))") }
            elseif (-not $byDesign -and $match -eq $false) { $warnings.Add(("SDK Offsets::{0} is 0x{1:X}, this build has 0x{2:X}: the Game SDK needs a fresh dump" -f $k, $sdkv, $rva)) }
            [ordered]@{ name = $k; result = $(if ($row) { $row.result } else { 'absent' });
                        rva = $(if ($null -ne $rva) { '0x{0:X}' -f $rva } else { '' });
                        sdk = $(if ($null -ne $sdkv) { '0x{0:X}' -f $sdkv } else { '' });
                        match = $match; informational = $byDesign }
          }

          $fail = (-not $clOk) -or ($scanCode -ne 0)
          [ordered]@{
            exe = [ordered]@{ productVersion = $pv; cl = $(if ($pv -match 'CL-(\d+)$') { $Matches[1] } else { '' }); requiredCl = $requiredCl; clOk = $clOk; sha256 = $sha }
            reference = $(if ($refExe) { [ordered]@{ productVersion = $refPv; cl = $(if ($refPv -match 'CL-(\d+)$') { $Matches[1] } else { '' }) } } else { $null })
            scan = [ordered]@{ exitCode = $scanCode; summary = $scan.summary; notOk = $notOk
                     suggest = $(if ($scan.PSObject.Properties['suggest']) { $scan.suggest } else { $null }) }
            sdkGlobals = @($globals)
            warnings = @($warnings)
            fail = $fail
          } | ConvertTo-Json -Depth 12 | Set-Content out\checks.json -Encoding utf8
          foreach ($w in $warnings) { Write-Host "::warning::$w" }
          if (-not $clOk) { Write-Host "::error::ProductVersion '$pv' is not a build the loader runs on ($requiredCl)" }
          if ($scanCode -ne 0) { Write-Host "::error::sr-aobscan exit code $scanCode ($($scan.summary.requiredFailing) required patterns failing)" }
          if ($fail) { exit 1 }

      # Plugin code never runs while the login cache could still be on disk.
      - name: Download the plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-${{ inputs.branch }}-*
          path: plugins

      - name: Check the plugins' patterns
        id: plugins
        if: always() && steps.dl.outcome == 'success' && steps.cleanup.outcome == 'success' && needs.plugin-plan.outputs.any == 'true'
        # A plugin that hangs must not hold up the loader's result.
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # Per plugin: PASS when the loader would let it load; GAME-CALL (partial
          # coverage, never a full pass) when every pattern resolved before the
          # first call into game code, which cannot run offline and was stopped; FAIL when any pattern it resolves
          # does not (the loader refuses a plugin on any recorded failure);
          # CRASH; REFUSED (interface version outside the loader's range); NONE
          # (no OnPluginLoadHooks); BUILD-FAILED or FETCH-FAILED; ERROR. Only the
          # plugin fails; the loader's status does not change.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem -Path $env:INSTALL_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
            Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $suggest = @('--suggest')
          $refExe = if ($env:REFERENCE_DIR) {
            Get-ChildItem -Path $env:REFERENCE_DIR -Recurse -File -Filter '*-Win64-Shipping.exe' |
              Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          if ($refExe) { $suggest += @('--reference', $refExe.FullName) }
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          $results = foreach ($p in ($env:PLAN | ConvertFrom-Json)) {
            $r = [ordered]@{ name = $p.name; source = $p.source; repo = $p.repo; ref = $p.ref; sha = '' }
            # One plugin's problem never stops the others.
            try {
              $dir = "plugins\plugin-$($env:BRANCH)-$($p.name)"
              $meta = if (Test-Path "$dir\plugin.json") { Get-Content "$dir\plugin.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $meta) {
                $r.verdict = if ($p.source -eq 'release') { 'FETCH-FAILED' } else { 'BUILD-FAILED' }
                Write-Host "::error title=Plugin $($p.name)::$(if ($p.source -eq 'release') { 'its released DLL could not be fetched' } else { 'did not build' }), so its patterns were not checked"
                $r; continue
              }
              $r.ref = $meta.ref
              $r.sha = $meta.sha
              $dll = Join-Path $dir $meta.dll
              if ((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant() -ne $meta.sha256) { throw "$($meta.dll) is not the DLL the plugin job made" }
              $stem = "out\plugin-$($p.name)"
              $ErrorActionPreference = 'Continue'
              & $scanner $exe.FullName --plugin $dll --json @suggest > "$stem.json" 2> "$stem.txt"
              $r.exitCode = $LASTEXITCODE
              $ErrorActionPreference = 'Stop'
              Get-Content "$stem.txt" | Write-Host
              $scan = if ($r.exitCode -ne 2 -and (Test-Path "$stem.json") -and (Get-Item "$stem.json").Length) { Get-Content "$stem.json" -Raw | ConvertFrom-Json } else { $null }
              if (-not $scan) { throw "sr-aobscan could not run it (exit $($r.exitCode)); see out/plugin-$($p.name).txt" }
              $r.plugin = $scan.plugin
              $r.verdict = $scan.verdict
              $r.summary = $scan.summary
              foreach ($k in 'note', 'crash', 'gameCalls') { if ($scan.PSObject.Properties[$k]) { $r[$k] = $scan.$k } }
              $r.patterns = @($scan.patterns | ForEach-Object {
                $o = [ordered]@{ name = $(if ($_.name) { $_.name } else { "(raw) $($_.pattern)" }); call = $_.call; kind = $_.kind
                                 required = $_.required; recorded = $_.recorded; result = $_.result }
                if ($_.PSObject.Properties['suggest']) { $o.suggest = $_.suggest }
                $o })
              foreach ($row in @($scan.patterns | Where-Object { $_.recorded -and $_.result -ne 'OK' })) {
                Write-Host "::error title=Plugin $($p.name)::$($row.name): $($row.result)$(if ($row.required) { '' } else { ' (declared optional; the loader still refuses the plugin)' })"
              }
              switch ($r.verdict) {
                'CRASH'     { Write-Host "::error title=Plugin $($p.name)::OnPluginLoadHooks crashed ($($scan.crash))" }
                'REFUSED'   { Write-Host "::error title=Plugin $($p.name)::$($scan.note)" }
                'GAME-CALL' { Write-Host "::notice title=Plugin $($p.name)::$($scan.note) ($($scan.gameCalls.first))" }
              }
            } catch {
              $r.verdict = 'ERROR'
              $r.error = $_.Exception.Message
              Write-Host "::error title=Plugin $($p.name)::$($r.error)"
            }
            $r
          }
          $results = @($results)
          [ordered]@{
            status = $(if (@($results | Where-Object { $_.verdict -notin 'PASS', 'NONE', 'GAME-CALL' }).Count) { 'fail' } else { 'pass' })
            plugins = $results
          } | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          foreach ($r in $results) { "$($r.name): $($r.verdict)" }
          # The verdicts are in plugins.json; the last scanner's exit code is not the step's result.
          exit 0

      # ---- Auto-apply, part 1: build and scan the proposed fixes -----------
      # The apply tool is this workflow's own code at the same commit.
      - name: Check out the apply tool
        id: tool
        if: always() && steps.plugins.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-tool
          sparse-checkout: |
            ci/apply-proposals.mjs
            ci/layout-table.mjs
            ci/layout-diff.mjs
            ci/used-classes.mjs
            ci/native-keys.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # ---- Layouts from the PDBs: what each component reads, on both builds --
      - name: Read the used layouts from the PDBs
        id: layout
        if: always() && steps.tool.outcome == 'success'
        # A report only: a failure here costs only the layout report.
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
        run: |
          # The keys each component reads: the loader's own layout table, each
          # built plugin's used Game-SDK classes (ci/layout-table.mjs gen over
          # its source) and its native members (ci/native-keys.txt). One
          # sr-aobscan --layout pass per build reads them all from that build's
          # PDB; pdb-diff then counts, per component, what moved between the
          # public build and this one. Keys and numbers only: no PDB names.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $lt = 'ci-tool\ci\layout-table.mjs'
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          function Find-Exe([string]$dir) {
            if ($dir) { Get-ChildItem -Path $dir -Recurse -File -Filter '*-Win64-Shipping.exe' | Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          }
          function Get-Cl($e) { if ([string]$e.VersionInfo.ProductVersion -match 'CL-(\d+)$') { $Matches[1] } else { '' } }
          function Invoke-Native([string]$what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }
          function Get-Source([string]$repo, [string]$rev, [string]$dir) {
            git -c init.defaultBranch=main init -q $dir; Invoke-Native "git init $dir"
            git -C $dir fetch -q --depth 1 "https://github.com/$repo" $rev; Invoke-Native "fetching $repo $rev"
            git -C $dir checkout -q FETCH_HEAD; Invoke-Native "checking out $repo $rev"
          }
          $exe = Find-Exe $env:INSTALL_DIR
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $refExe = Find-Exe $env:REFERENCE_DIR
          $cl = Get-Cl $exe
          $refCl = if ($refExe) { Get-Cl $refExe } else { '' }
          $work = Join-Path $env:RUNNER_TEMP 'layout'
          New-Item -ItemType Directory -Force $work | Out-Null

          $native = @{}
          foreach ($line in Get-Content 'ci-tool\ci\native-keys.txt') {
            if ($line -match '^\s*(#|$)') { continue }
            if ($line -notmatch '^(\S+)\s+(\S+::\S+)(\s+\S.*)?$') { throw "native-keys.txt: malformed line '$line'" }
            if (-not $native.ContainsKey($Matches[1])) { $native[$Matches[1]] = [Collections.Generic.List[string]]::new() }
            if (-not $native[$Matches[1]].Contains($Matches[2])) { $native[$Matches[1]].Add($Matches[2]) }
          }
          $components = [Collections.Generic.List[object]]::new()
          $metas = @($env:PLAN | ConvertFrom-Json | Where-Object { $_.source -eq 'build' } | ForEach-Object {
            $m = "plugins\plugin-$($env:BRANCH)-$($_.name)\plugin.json"
            if (Test-Path $m) { Get-Content $m -Raw | ConvertFrom-Json }
          })
          if (-not $metas.Count) { throw 'no built plugin: nothing names the Game-SDK and loader commits to read' }
          # Every plugin was built against the same loader and Game-SDK commits.
          $sdk = Join-Path $work 'game-sdk'
          Get-Source 'AlienXAXS/StarRupture-Game-SDK' $metas[0].gameSdk $sdk
          $loaderTable = Join-Path $work 'loader-table.h'
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$($metas[0].loaderRepo)/$($metas[0].loaderInterface)/StarRupture-ModLoader-Core/core/layout_table.generated.h" -OutFile $loaderTable -TimeoutSec 60
          node $lt keys $loaderTable --out "$work\keys-ModLoader.txt"; Invoke-Native 'keys (loader)'
          $components.Add('ModLoader')
          foreach ($m in $metas) {
            Get-Source $m.repo $m.sha "$work\src-$($m.name)"
            node $lt gen "$sdk\Client\Assertions.inl" --cl $(if ($cl) { $cl } else { 1 }) --src "$work\src-$($m.name)" --sdk "$sdk\Client\SDK" --out "$work\table-$($m.name).h"; Invoke-Native "gen ($($m.name))"
            node $lt keys "$work\table-$($m.name).h" --out "$work\keys-$($m.name).txt"; Invoke-Native "keys ($($m.name))"
            if ($native.ContainsKey($m.name)) { Add-Content "$work\keys-$($m.name).txt" $native[$m.name] }
            $components.Add($m.name)
          }
          $all = $components | ForEach-Object { Get-Content "$work\keys-$_.txt" } | Where-Object { $_ } | Sort-Object -Unique -CaseSensitive
          Set-Content "$work\keys-all.txt" $all -Encoding ascii

          $reports = @{}
          foreach ($b in @(@{ key = 'target'; exe = $exe }, @{ key = 'reference'; exe = $refExe }) | Where-Object { $_.exe }) {
            $out = "out\layout-$($b.key).json"
            $ErrorActionPreference = 'Continue'
            & $scanner $b.exe.FullName --layout "$work\keys-all.txt" --json > $out
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -gt 1) { throw "sr-aobscan --layout on the $($b.key) build failed (exit $code)" }
            $reports[$b.key] = $out
            "$($b.key) (CL-$(Get-Cl $b.exe)): $(((Get-Content $out -Raw | ConvertFrom-Json).summary | ConvertTo-Json -Compress))"
          }
          $result = [ordered]@{ cl = $cl; referenceCl = $refCl; components = [ordered]@{} }
          if ($reports.ContainsKey('reference')) {
            foreach ($c in $components) {
              node $lt pdb-diff $reports.reference $reports.target --keys "$work\keys-$c.txt" --json "$work\diff-$c.json" | Out-Host
              if ($LASTEXITCODE -notin 0, 3) { throw "pdb-diff ($c) failed (exit $LASTEXITCODE)" }
              $result.components[$c] = Get-Content "$work\diff-$c.json" -Raw | ConvertFrom-Json
              "${c}: $($result.components[$c].counts | ConvertTo-Json -Compress)"
            }
          } else { Write-Host '::notice title=Layouts::No public build to compare with: the keys were read from this build only.' }
          $result | ConvertTo-Json -Depth 8 | Set-Content out\layout.json -Encoding utf8

      # ---- Fixed offsets: what each plugin reads at a raw offset ---------------
      - name: Check the fixed offsets
        id: offsets
        if: always() && steps.plugins.outcome == 'success' && steps.tool.outcome == 'success'
        # A plugin whose offsets could not be checked fails (OFFSETS-UNCHECKED); it never passes by default.
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Per built plugin with anchored lines in ci/native-keys.txt: read its
          # source at the commit that was built, and compare every fixed offset
          # it reads with the PDB layout of this build and of the public one
          # (ci/apply-proposals.mjs offsets). Anything but ok fails the plugin
          # (verdict OFFSETS); a layout report that is missing fails it too
          # (OFFSETS-UNCHECKED). The fix step rewrites the ones it can.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          try {
            $tool = 'ci-tool\ci\apply-proposals.mjs'
            $native = 'ci-tool\ci\native-keys.txt'
            function Invoke-Native([string]$what) { if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" } }
            $anchored = @(Get-Content $native | ForEach-Object { if ($_ -match '^(\S+)\s+\S+::\S+\s+\S') { $Matches[1] } } | Sort-Object -Unique)
            $pj = Get-Content out\plugins.json -Raw | ConvertFrom-Json
            $work = Join-Path $env:RUNNER_TEMP 'offsets'
            New-Item -ItemType Directory -Force $work | Out-Null
            foreach ($p in @($pj.plugins | Where-Object { $_.source -eq 'build' -and $_.sha -and $_.name -in $anchored })) {
              $json = "out\offsets-$($p.name).json"
              try {
                $src = Join-Path $work $p.name
                git -c init.defaultBranch=main init -q $src; Invoke-Native "git init $src"
                git -C $src fetch -q --depth 1 "https://github.com/$($p.repo)" $p.sha; Invoke-Native "fetching $($p.repo) $($p.sha)"
                git -C $src checkout -q FETCH_HEAD; Invoke-Native "checking out $($p.repo)"
                $a = @('offsets', '--native', $native, '--plugin', $p.name, '--source', $src, '--target-public', $(if ($env:BRANCH -eq 'public') { 'true' } else { 'false' }))
                if (Test-Path out\layout-target.json) { $a += @('--target', 'out\layout-target.json') }
                if (Test-Path out\layout-reference.json) { $a += @('--reference', 'out\layout-reference.json') }
                node $tool @a > $json
                Invoke-Native "offsets ($($p.name))"
              } catch {
                [ordered]@{ plugin = $p.name; status = 'unchecked'; reason = $_.Exception.Message; counts = @{}; results = @(); plan = @(); blocked = @() } |
                  ConvertTo-Json -Depth 6 | Set-Content $json -Encoding utf8
              }
              $o = Get-Content $json -Raw | ConvertFrom-Json
              $p | Add-Member -NotePropertyName offsets -NotePropertyValue ([ordered]@{
                status = $o.status
                reason = $(if ($o.PSObject.Properties['reason']) { $o.reason } else { '' })
                counts = $o.counts
                results = @($o.results | ForEach-Object { $_ | Select-Object key, state, file, line, source, target, reference, reason })
              }) -Force
              "$($p.name): offsets $($o.status) $($o.counts | ConvertTo-Json -Compress)"
              if ($o.status -in 'fail', 'unchecked') {
                $bad = @($o.results | Where-Object { $_.state -ne 'ok' } | ForEach-Object { "$($_.key.Split('::')[-1]) ($($_.state))" })
                $why = if ($o.status -eq 'unchecked') { $o.reason } else { "$($bad.Count) of $(@($o.results).Count) fixed offsets do not match this build: $($bad -join ', ')" }
                Write-Host "::error title=Plugin $($p.name)::$why"
                $p | Add-Member -NotePropertyName note -NotePropertyValue $(if ($p.PSObject.Properties['note'] -and $p.note) { "$($p.note); $why" } else { $why }) -Force
                if ($p.verdict -in 'PASS', 'NONE', 'GAME-CALL') {
                  $p | Add-Member -NotePropertyName patternVerdict -NotePropertyValue $p.verdict -Force
                  $p.verdict = $(if ($o.status -eq 'unchecked') { 'OFFSETS-UNCHECKED' } else { 'OFFSETS' })
                }
              }
            }
            $pj.status = $(if (@($pj.plugins | Where-Object { $_.verdict -notin 'PASS', 'NONE', 'GAME-CALL' }).Count) { 'fail' } else { 'pass' })
            $pj | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          } catch {
            # The step itself crashed: no plugin passes on offsets nobody checked.
            Write-Host "::error title=Fixed offsets::$($_.Exception.Message)"
            $why = "fixed offsets not checked: $($_.Exception.Message)"
            $anchored = @(Get-Content 'ci-tool\ci\native-keys.txt' | ForEach-Object { if ($_ -match '^(\S+)\s+\S+::\S+\s+\S') { $Matches[1] } } | Sort-Object -Unique)
            $pj = Get-Content out\plugins.json -Raw | ConvertFrom-Json
            foreach ($p in @($pj.plugins | Where-Object { $_.source -eq 'build' -and $_.name -in $anchored -and $_.verdict -in 'PASS', 'NONE', 'GAME-CALL' })) {
              $p | Add-Member -NotePropertyName patternVerdict -NotePropertyValue $p.verdict -Force
              $p | Add-Member -NotePropertyName note -NotePropertyValue $why -Force
              $p.verdict = 'OFFSETS-UNCHECKED'
            }
            $pj.status = 'fail'
            $pj | ConvertTo-Json -Depth 12 | Set-Content out\plugins.json -Encoding utf8
          }
          exit 0

      - name: Build the proposed fixes
        id: fix
        if: always() && steps.tool.outcome == 'success'
        # A fix that fails to build or scan costs only the fix.
        continue-on-error: true
        timeout-minutes: 45
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          REFERENCE_DIR: ${{ steps.dl.outputs.reference_dir }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
          SCANNER_SHA256: ${{ needs.build.outputs.scanner_sha256 }}
          APPLY_CONFIDENCE: ${{ inputs.apply_confidence || 'high' }}
        run: |
          # Per plugin with failing patterns: apply the proposals at or above
          # APPLY_CONFIDENCE to its source (ci/apply-proposals.mjs), rebuild it
          # from exactly the sources its scan was built from, and scan the
          # result on this build and on the public one. Writes
          # out/autofix-<name>.* (verdict, source patch, scans) and the
          # auto-apply job's work list: FIXED or PARTIAL fixes of the owner's
          # forks. A released plugin (another author's) gets the patch only;
          # the loader's own patterns stay proposals in the report.
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:APPLY_CONFIDENCE -notin 'high', 'medium') { throw "apply_confidence '$($env:APPLY_CONFIDENCE)' is not high or medium" }
          $tool = 'ci-tool\ci\apply-proposals.mjs'
          $scanner = 'scanner\sr-aobscan-client.exe'
          if ((Get-FileHash $scanner -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:SCANNER_SHA256) { throw 'sr-aobscan-client.exe is not the one build-scanner made' }
          function Find-Exe([string]$dir) {
            if ($dir) { Get-ChildItem -Path $dir -Recurse -File -Filter '*-Win64-Shipping.exe' | Where-Object { $_.FullName -notmatch '\\Engine\\' } | Select-Object -First 1 }
          }
          function Get-Cl($e) { if ([string]$e.VersionInfo.ProductVersion -match 'CL-(\d+)$') { $Matches[1] } else { '' } }
          function Invoke-Native([string]$what) {
            if ($LASTEXITCODE -ne 0) { throw "$what failed (exit $LASTEXITCODE)" }
          }
          # Source at an exact commit, bytes as committed (no CRLF rewrite), so
          # the auto-apply job re-creates the same tree on Linux.
          function Get-Source([string]$repo, [string]$rev, [string]$dir) {
            git -c init.defaultBranch=main init -q $dir; Invoke-Native "git init $dir"
            git -C $dir config core.autocrlf false
            git -C $dir fetch -q --depth 1 "https://github.com/$repo" $rev; Invoke-Native "fetching $repo $rev"
            git -C $dir checkout -q FETCH_HEAD; Invoke-Native "checking out $repo $rev"
          }
          $exe = Find-Exe $env:INSTALL_DIR
          if (-not $exe) { throw 'no *-Win64-Shipping.exe in the install' }
          $refExe = Find-Exe $env:REFERENCE_DIR
          $cl = Get-Cl $exe
          $refCl = if ($refExe) { Get-Cl $refExe } else { '' }
          if ($cl -notmatch '^\d+$') { throw "no CL in this build's ProductVersion" }
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $work = Join-Path $env:RUNNER_TEMP 'autofix'
          $push = [Collections.Generic.List[object]]::new()
          # Collected with Add, so no stray output can land in the results.
          $results = [Collections.Generic.List[object]]::new()
          foreach ($p in ($env:PLAN | ConvertFrom-Json)) {
            $scan = "out\plugin-$($p.name).json"
            if (-not ((Test-Path $scan) -and (Get-Item $scan).Length)) { continue }
            $d = Join-Path $work $p.name
            New-Item -ItemType Directory -Force $d | Out-Null
            $r = [ordered]@{ name = $p.name; source = $p.source; repo = $p.repo; sha = ''; verdict = 'NO-FIX'; reasons = @()
                             applied = @(); skipped = @(); tree = ''; patch = '' }
            try {
              $isPublic = $(if ($env:BRANCH -eq 'public') { 'true' } else { 'false' })
              # The plugin's fixed-offset check (offsets step) rides in the plan.
              $offs = "out\offsets-$($p.name).json"
              $sel = @('select', '--scan', $scan, '--min-confidence', $env:APPLY_CONFIDENCE, '--target-public', $isPublic)
              if (Test-Path $offs) { $sel += @('--offsets', $offs) }
              node $tool @sel > "$d\plan.json"
              Invoke-Native 'select'
              $plan = Get-Content "$d\plan.json" -Raw | ConvertFrom-Json
              $planOffsets = if ($plan.PSObject.Properties['offsets']) { @($plan.offsets) } else { @() }
              $blockedRows = if ($plan.PSObject.Properties['blockedOffsets']) { @($plan.blockedOffsets | ForEach-Object { [pscustomobject]@{ name = $_.key; reason = "$($_.state): $($_.reason)" } }) } else { @() }
              # Nothing failing, nothing to do.
              if (-not @($plan.rows).Count -and -not @($plan.skipped).Count -and -not $planOffsets.Count -and -not $blockedRows.Count) { continue }
              $r.skipped = @(@($plan.skipped) + $blockedRows)
              if (-not @($plan.rows).Count -and -not $planOffsets.Count) { $r.reasons = @('no proposal was selected'); $results.Add($r); continue }
              $meta = Get-Content "plugins\plugin-$($env:BRANCH)-$($p.name)\plugin.json" -Raw | ConvertFrom-Json
              if ($p.source -eq 'release') { Get-Source $p.repo "refs/tags/$($meta.ref)" "$d\src" }
              else {
                # The commit plugin-plan resolved, which the scanned DLL was built from.
                if ([string]$meta.sha -ne $p.sha) { throw "the scanned DLL was built from $($meta.sha), not the planned commit $($p.sha)" }
                $r.sha = $p.sha
                Get-Source $p.repo $p.sha "$d\src"
              }
              node $tool apply --source "$d\src" --plan "$d\plan.json" > "$d\applied.json"
              Invoke-Native 'apply'
              $applied = Get-Content "$d\applied.json" -Raw | ConvertFrom-Json
              $offApplied = @($applied.offsets | Where-Object { $_.status -eq 'applied' } | ForEach-Object { [pscustomobject]@{ name = $_.key; kind = 'offset'; old = $_.old; new = $_.new } })
              $offSkipped = @($applied.offsets | Where-Object { $_.status -ne 'applied' } | ForEach-Object { [pscustomobject]@{ name = $_.key; reason = $_.reason } })
              $r.applied = @(@($applied.rows | Where-Object { $_.status -eq 'applied' }) + $offApplied)
              $r.skipped = @(@($plan.skipped) + @($applied.rows | Where-Object { $_.status -ne 'applied' }) + $offSkipped + $blockedRows)
              if (-not $r.applied.Count) { $r.reasons = @('no proposal could be applied to the source'); $results.Add($r); continue }
              # The tree is taken before the build, which only adds ignored files.
              git -C "$d\src" add -A; Invoke-Native 'git add'
              $r.tree = [string](git -C "$d\src" write-tree); Invoke-Native 'git write-tree'
              $r.patch = "autofix-$($p.name).patch"
              git -C "$d\src" diff --cached > "out\$($r.patch)"; Invoke-Native 'git diff'
              if ($p.source -eq 'release') { $r.verdict = 'PATCH'; $r.reasons = @("another author's released plugin: the patch only"); $results.Add($r); continue }

              # Rebuilt exactly as the plugins job built the scanned DLL.
              if ($meta.loaderRepo -notmatch '^(msantoro12|AlienXAXS)/StarRupture-ModLoader$' -or $meta.loaderInterface -notmatch '^[0-9a-f]{40}$') { throw 'plugin.json does not name the loader interface it was built against' }
              if ($meta.pluginSdkRepo -notmatch '^(msantoro12|AlienXAXS)/StarRupture-Plugin-SDK$') { throw 'plugin.json does not name an allowed Plugin SDK repository' }
              Get-Source $meta.pluginSdkRepo $meta.pluginSdk "$d\plugin-sdk"
              Get-Source 'AlienXAXS/StarRupture-Game-SDK' $meta.gameSdk "$d\game-sdk"
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/$($meta.loaderRepo)/$($meta.loaderInterface)/StarRupture-ModLoader-Core/plugins/plugin_interface.h" `
                -OutFile "$d\plugin-sdk\include\plugin_interface.h" -TimeoutSec 60
              $sln = @(Get-ChildItem "$d\src" -File -Filter *.sln)
              if ($sln.Count -ne 1) { throw "expected one solution at the repository root, found $($sln.Count)" }
              & $msbuild $sln[0].FullName `
                /p:Configuration="Client Release" `
                /p:Platform=x64 `
                /p:PostBuildEventUseInBuild=false `
                /p:ModLoaderBuildTag="$($meta.tag)" `
                /p:GameSDKRoot="$d\game-sdk" `
                /p:PluginSDKInclude="$d\plugin-sdk\include" `
                /m /p:CL_MP=true /nodeReuse:false /v:minimal | Out-Host
              if ($LASTEXITCODE -ne 0) { $r.verdict = 'FAILED'; $r.reasons = @("the fixed source did not build (msbuild exit $LASTEXITCODE)"); $results.Add($r); continue }
              $dll = @(Get-ChildItem "$d\src\build\Client Release\Plugins" -File -Filter *.dll)
              if ($dll.Count -ne 1) { throw "expected one plugin DLL, found $($dll.Count)" }

              # Scanned on this build, and on the public one when there is one.
              $scans = @{}
              foreach ($b in @(@{ key = 'target'; exe = $exe }, @{ key = 'reference'; exe = $refExe }) | Where-Object { $_.exe }) {
                $stem = "out\autofix-$($p.name)-$($b.key)"
                $ErrorActionPreference = 'Continue'
                & $scanner $b.exe.FullName --plugin $dll[0].FullName --json > "$stem.json" 2> "$stem.txt"
                $code = $LASTEXITCODE
                $ErrorActionPreference = 'Stop'
                if ($code -eq 2 -or -not (Get-Item "$stem.json").Length) { throw "sr-aobscan could not run the fixed plugin on the $($b.key) build (exit $code)" }
                $scans[$b.key] = "$stem.json"
              }
              $vArgs = @('--applied', "$d\applied.json", '--target', $scans.target)
              # The patched source read against the same layouts: every rewritten offset must now be ok.
              if (Test-Path $offs) {
                $oa = @('offsets', '--native', 'ci-tool\ci\native-keys.txt', '--plugin', $p.name, '--source', "$d\src", '--target-public', $isPublic)
                if (Test-Path out\layout-target.json) { $oa += @('--target', 'out\layout-target.json') }
                if (Test-Path out\layout-reference.json) { $oa += @('--reference', 'out\layout-reference.json') }
                node $tool @oa > "$d\offsets-after.json"
                Invoke-Native 'offsets (fixed source)'
                $vArgs += @('--offsets-after', "$d\offsets-after.json")
              }
              if ($scans.ContainsKey('reference')) { $vArgs += @('--reference', $scans.reference) }
              $v = node $tool verdict @vArgs | Out-String | ConvertFrom-Json
              Invoke-Native 'verdict'
              $r.verdict = $v.verdict
              $r.reasons = @($v.reasons)
              $r.rows = @($v.rows)
              $r.offsets = @($v.offsets)
              # Only the owner's forks are pushed to, and only a verified fix.
              if ($r.verdict -in 'FIXED', 'PARTIAL' -and $p.source -eq 'build' -and $p.repo -match '^msantoro12/StarRupture-Plugin-(BetterCheats|BetterDrone|WAILA|Codex|Compass|ProductionViewer|RuptureTimer|WaveOptimiser|CameraControls)$') {
                $push.Add([ordered]@{ name = $p.name; sha = $r.sha; tree = $r.tree; cl = $cl; referenceCl = $refCl; verdict = $r.verdict; plan = $plan })
              }
            } catch {
              $r.verdict = 'FAILED'
              $r.reasons = @($_.Exception.Message)
            }
            $results.Add($r)
          }
          foreach ($r in $results) {
            "$($r.name): $($r.verdict) ($(@($r.applied).Count) applied, $(@($r.skipped).Count) skipped)$(if (@($r.reasons).Count) { ': ' + (@($r.reasons) -join '; ') })"
            if ($r.verdict -eq 'FAILED') { Write-Host "::warning title=Auto-apply $($r.name)::$(@($r.reasons) -join '; ')" }
          }
          [ordered]@{ minConfidence = $env:APPLY_CONFIDENCE; cl = $cl; referenceCl = $refCl; plugins = $results } |
            ConvertTo-Json -Depth 12 | Set-Content out\autofix.json -Encoding utf8
          "autofix=$(ConvertTo-Json -InputObject @($push) -Depth 12 -Compress)" >> $env:GITHUB_OUTPUT

      - name: Write the result
        if: always() && steps.gate.outputs.has_login == 'true'
        shell: pwsh
        env:
          REQUIRED_CL: ${{ needs.build.outputs.required_cl }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          $r = [ordered]@{ schema = 1; status = ''; branch = $env:BRANCH; expectedBuildid = $env:EXPECTED_BUILDID }
          $dl = if (Test-Path out\download.json) { Get-Content out\download.json -Raw | ConvertFrom-Json } else { $null }
          $ck = if (Test-Path out\checks.json) { Get-Content out\checks.json -Raw | ConvertFrom-Json } else { $null }
          $r.download = $dl
          $r.checks = $ck
          # Reported beside the loader's verdict, never folded into it: status
          # below covers the loader only. Anything that blocks on plugins reads
          # plugins.status.
          $r.plugins = if (Test-Path out\plugins.json) { Get-Content out\plugins.json -Raw | ConvertFrom-Json } else { $null }
          # The public build the proposals and fixes were checked against.
          $ref = if ($dl -and $dl.PSObject.Properties['reference']) { $dl.reference } else { $null }
          $ckRef = if ($ck -and $ck.PSObject.Properties['reference']) { $ck.reference } else { $null }
          $r.reference =
            if ($ref -and $ref.installed) { [ordered]@{ status = 'used'; buildid = $ref.buildid; cl = $(if ($ckRef) { $ckRef.cl } else { '' }); productVersion = $(if ($ckRef) { $ckRef.productVersion } else { '' }) } }
            elseif ($ref) { [ordered]@{ status = 'none'; reason = $ref.reason; buildid = $ref.buildid; betaKey = $ref.betaKey } }
            elseif ($env:BRANCH -eq 'public') { [ordered]@{ status = 'none'; reason = 'this is the public build' } }
            else { [ordered]@{ status = 'none'; reason = 'not downloaded' } }
          $r.autofix = if (Test-Path out\autofix.json) { Get-Content out\autofix.json -Raw | ConvertFrom-Json } else { $null }
          $r.status =
            if (-not $dl) { 'error' }
            elseif ($dl.login -ne 'ok') { 'login-failed' }
            elseif (-not $dl.installed) { 'download-failed' }
            elseif (-not $ck) { 'error' }
            elseif ($ck.fail) { 'fail' }
            elseif (@($ck.warnings).Count -gt 0) { 'pass-with-warnings' }
            else { 'pass' }
          $r | ConvertTo-Json -Depth 12 | Set-Content out\result.json -Encoding utf8
          "Client check: $($r.status)"
          Remove-Item out\download.json, out\checks.json, out\plugins.json, out\autofix.json -ErrorAction SilentlyContinue

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-check-${{ inputs.branch }}
          path: |
            out/result.json
            out/scanner.txt
            out/scanner.json
            out/plugin-*.json
            out/plugin-*.txt
            out/autofix-*
            out/layout*.json
            out/offsets-*.json
          if-no-files-found: warn
          retention-days: 14

  # ---- Map mode: the update as rows in the loader's version map -----------
  # Runs the assembler and the writer of ci/map-mode.mjs on the scans the check
  # job uploaded and on the loader's header, and uploads the rewritten header
  # and the report. Reads only artifacts and the header: no Steam login, no
  # plugin code, no game files.
  # TODO(step 26, needs the owner): pushing the header to the loader fork's
  # auto/update-<CL> needs the fork deploy key and the auto/** ruleset (checklist
  # in ci/MAP-MODE.md). Until then the header is an artifact only.
  # TODO: the scans of the previous release of each tracked component
  # (rank previous) are not run yet, so a changed fp adds its set only once a
  # release carrying it is the current one. With current scans only, map-mode
  # prunes nothing: the sets the previous release still reads are kept.
  map-mode:
    name: map mode
    needs: [check]
    if: ${{ !cancelled() && inputs.map_mode == true && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      PLUGINS: ${{ inputs.plugins }}
      LOADER_REF: ${{ inputs.loader_ref }}
    steps:
      - name: Check out the map tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci
          persist-credentials: false

      - name: Check out the loader's header
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.loader_repo }}
          ref: ${{ inputs.loader_ref }}
          path: loader
          sparse-checkout: StarRupture-ModLoader-Core/hooks/game/version_map.generated.h
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the scans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      - name: Write the update into the header
        run: |
          set -euo pipefail
          # The loader's registry scan, then each plugin scan. A plugin is
          # tracked when it is one of the built `plugins`; otherwise (MiniMap)
          # its failing rows go to the pattern path.
          scans="$(jq -n --arg tag "$LOADER_REF" '[{owner: "ModLoader", tracked: true, tag: $tag, rank: "current", file: "res/scanner.json"}]')"
          for f in res/plugin-*.json; do
            name="$(jq -r '.plugin.name // empty' "$f")"
            [ -n "$name" ] || continue
            tracked=false
            case " $PLUGINS " in *"StarRupture-Plugin-$name@"*) tracked=true;; esac
            scans="$(jq --arg n "$name" --argjson t "$tracked" --arg f "$f" '. + [{owner: $n, tracked: $t, tag: "current", rank: "current", file: $f}]' <<<"$scans")"
          done
          jq -n --arg src "$BRANCH $BUILDID" --argjson scans "$scans" '{source: $src, scans: $scans}' > scans.json
          node tool/ci/map-mode.mjs assemble scans.json --out observations.json
          header=loader/StarRupture-ModLoader-Core/hooks/game/version_map.generated.h
          status=0
          node tool/ci/map-mode.mjs write "$header" --input observations.json --report map-mode-report.json || status=$?
          cp "$header" version_map.generated.h
          if [ "$status" -ne 0 ]; then echo "::error::map mode refused the update (exit $status); see the log and map-mode-report.json"; fi
          exit "$status"

      - name: Upload the header
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-mode-${{ inputs.branch }}
          path: |
            version_map.generated.h
            map-mode-report.json
            observations.json
          if-no-files-found: warn
          retention-days: 14

  # ---- Auto-apply, part 2: push the verified fixes to the owner's forks ----
  # The only job that can read the fork deploy keys (environment fork-push),
  # one key per fork, each limited by a ruleset on its fork to auto/**. It
  # runs no plugin code and no action but actions/checkout: it re-creates the
  # fix from the plugin's commit and the plan with the apply tool, and pushes
  # only when the result is the tree the check job built and scanned. Never
  # forces: a branch that already holds another tree gets a run-id suffix.
  auto-apply:
    name: auto-apply ${{ matrix.name }}
    needs: [plugin-plan, check]
    if: ${{ !cancelled() && startsWith(needs.check.outputs.autofix, '[{') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fork-push
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.autofix) }}
    steps:
      - name: Check the work item
        env:
          NAME: ${{ matrix.name }}
          SHA: ${{ matrix.sha }}
          TREE: ${{ matrix.tree }}
          CL: ${{ matrix.cl }}
          REFERENCE_CL: ${{ matrix.referenceCl }}
          VERDICT: ${{ matrix.verdict }}
          PLAN: ${{ needs.plugin-plan.outputs.matrix }}
        run: |
          # The work list comes from the job that ran plugin code, so every
          # field that picks a repository, a key or a ref is checked here. The
          # commit must be the one plugin-plan resolved before plugin code ran;
          # any commit in the fork network can be fetched by id.
          [[ "$NAME" =~ ^(BetterCheats|BetterDrone|WAILA|Codex|Compass|ProductionViewer|RuptureTimer|WaveOptimiser|CameraControls)$ ]] || { echo "::error::'$NAME' is not a fork this job pushes to"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TREE" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::bad commit or tree id'; exit 1; }
          [[ "$CL" =~ ^[0-9]+$ && "$REFERENCE_CL" =~ ^[0-9]*$ ]] || { echo '::error::bad CL'; exit 1; }
          [[ "$VERDICT" =~ ^(FIXED|PARTIAL)$ ]] || { echo '::error::bad verdict'; exit 1; }
          planned="$(jq -r --arg n "$NAME" '.[] | select(.name == $n and .source == "build" and .repo == "msantoro12/StarRupture-Plugin-" + $n) | .sha' <<< "$PLAN")"
          [ "$planned" = "$SHA" ] || { echo "::error::$SHA is not the commit plugin-plan resolved for msantoro12/StarRupture-Plugin-$NAME"; exit 1; }

      - name: Check out the apply tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          sparse-checkout: ci/apply-proposals.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: msantoro12/StarRupture-Plugin-${{ matrix.name }}
          ref: ${{ matrix.sha }}
          path: plugin
          persist-credentials: false

      - name: Re-create the fix
        env:
          PLAN: ${{ toJSON(matrix.plan) }}
          TREE: ${{ matrix.tree }}
          CL: ${{ matrix.cl }}
          REFERENCE_CL: ${{ matrix.referenceCl }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node tool/ci/apply-proposals.mjs apply --source plugin --plan "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/applied.json"
          git -C plugin add -A
          tree="$(git -C plugin write-tree)"
          if [ "$tree" != "$TREE" ]; then
            echo "::error::the re-created fix is tree $tree, the check job built and scanned $TREE; nothing is pushed"
            exit 1
          fi
          node tool/ci/apply-proposals.mjs message --applied "$RUNNER_TEMP/applied.json" --cl "$CL" ${REFERENCE_CL:+--reference-cl "$REFERENCE_CL"} > "$RUNNER_TEMP/message.txt"
          git -C plugin -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -F "$RUNNER_TEMP/message.txt"
          git -C plugin log -1 --format='%H %s'

      - name: Push the branch
        env:
          NAME: ${{ matrix.name }}
          CL: ${{ matrix.cl }}
          VERDICT: ${{ matrix.verdict }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # This fork's key only.
          DEPLOY_KEY: ${{ matrix.name == 'BetterCheats' && secrets.SR_DEPLOYKEY_BETTERCHEATS || matrix.name == 'BetterDrone' && secrets.SR_DEPLOYKEY_BETTERDRONE || matrix.name == 'WAILA' && secrets.SR_DEPLOYKEY_WAILA || matrix.name == 'Codex' && secrets.SR_DEPLOYKEY_CODEX || matrix.name == 'Compass' && secrets.SR_DEPLOYKEY_COMPASS || matrix.name == 'ProductionViewer' && secrets.SR_DEPLOYKEY_PRODUCTIONVIEWER || matrix.name == 'RuptureTimer' && secrets.SR_DEPLOYKEY_RUPTURETIMER || matrix.name == 'WaveOptimiser' && secrets.SR_DEPLOYKEY_WAVEOPTIMISER || matrix.name == 'CameraControls' && secrets.SR_DEPLOYKEY_CAMERACONTROLS || '' }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::no deploy key for $NAME in environment fork-push"; exit 1; fi
          ssh_dir="$RUNNER_TEMP/ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -f "$ssh_dir/key"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key")
          # GitHub's published host keys, not trust on first use.
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          url="git@github.com:msantoro12/StarRupture-Plugin-$NAME.git"
          branch="auto/update-$CL"
          head="$(git -C plugin rev-parse HEAD)"
          tree="$(git -C plugin rev-parse 'HEAD^{tree}')"
          existing="$(git ls-remote "$url" "refs/heads/$branch" | cut -f1)"
          if [ -n "$existing" ]; then
            git -C plugin fetch -q --depth 1 "$url" "refs/heads/$branch"
            if [ "$(git -C plugin rev-parse 'FETCH_HEAD^{tree}')" = "$tree" ]; then
              echo "$branch already holds this fix at $existing; nothing to push."
              echo "$NAME ($VERDICT): \`$branch\` already holds this fix at $existing." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            branch="auto/update-$CL-$RUN_ID-$RUN_ATTEMPT"
          fi
          git -C plugin push -q "$url" "HEAD:refs/heads/$branch"
          echo "Pushed $branch at $head to msantoro12/StarRupture-Plugin-$NAME."
          echo "$NAME ($VERDICT): pushed \`$branch\` at $head." >> "$GITHUB_STEP_SUMMARY"

  # ---- Job B: comment on the update PR (no secrets, no environment) --------
  report:
    name: report
    needs: [build, check, auto-apply]
    if: always() && inputs.branch && inputs.branch != 'expiry-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write    # comment on the game-update PR
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      BRANCH: ${{ inputs.branch }}
      EXPECTED_BUILDID: ${{ inputs.buildid }}
      BUILD_RESULT: ${{ needs.build.result }}
      CHECK_RESULT: ${{ needs.check.result }}
      LOGIN_AT: ${{ vars.STEAM_CI_LOGIN_AT }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: client-check-${{ inputs.branch }}
          path: res

      - name: Summarise and comment
        shell: pwsh
        run: |
          $r = if (Test-Path res/result.json) { Get-Content res/result.json -Raw | ConvertFrom-Json } else { $null }
          $status = if ($r) { $r.status } elseif ($env:BUILD_RESULT -ne 'success') { 'scanner-build-failed' } else { "no-result ($($env:CHECK_RESULT))" }
          $build = if ($r -and $r.download -and $r.download.buildid) { $r.download.buildid } else { $env:EXPECTED_BUILDID }
          $md = [Collections.Generic.List[string]]::new()
          $md.Add("### Client build check: $($status.ToUpperInvariant()) ($($env:BRANCH), build $build)")
          $md.Add('')
          $md.Add("Run: $($env:RUN_URL)")
          $md.Add('')
          if ($status -eq 'skipped') {
            $md.Add('No Steam login is configured for CI (environment `steam-client` has no `STEAM_CI_LOGIN_CACHE`), so the new client build was not checked offline. The owner sets it up once with `steam-ci-login.ps1`.')
          } elseif ($r) {
            $dl = $r.download; $ck = $r.checks
            $md.Add('| Check | Result |')
            $md.Add('|---|---|')
            $login = switch ($dl.step0) {
              'PASS'      { 'accepted (saved cache, no password)' }
              'FAIL'      {
                if ($env:LOGIN_AT -and $env:LOGIN_AT -ge [datetime]::UtcNow.AddDays(-1).ToString('yyyy-MM-dd')) {
                  "REJECTED right after the login was saved: Step 0 failed, the saved cache does not carry over to a fresh runner, and -Renew will not fix that ($($dl.detail))"
                } else { "REJECTED: login expired, run ``steam-ci-login.ps1 -Renew`` ($($dl.detail))" }
              }
              'UNDECIDED' { 'rate-limited by Steam; re-run later' }
              default     { "$($dl.reason) $($dl.detail)".Trim() }
            }
            $md.Add("| Steam login | $login |")
            if ($dl.login -eq 'ok') {
              $dlText = if ($dl.installed) { '{0} GB on disk in {1} min' -f [math]::Round([double]$dl.sizeOnDisk / 1GB, 1), [math]::Round($dl.seconds / 60, 1) } else { "FAILED ($($dl.reason): $($dl.detail))" }
              $md.Add("| Download | $dlText |")
            }
            if ($r.PSObject.Properties['reference'] -and $r.reference) {
              $rf = $r.reference
              $md.Add("| Reference (public) | $(if ($rf.status -eq 'used') { "build $($rf.buildid), CL-$($rf.cl)" } else { "none: $($rf.reason)$(if ($rf.PSObject.Properties['buildid'] -and $rf.buildid) { " (build $($rf.buildid), branch '$($rf.betaKey)')" })" }) |")
            }
            if ($ck) {
              $md.Add(('| ProductVersion | `{0}`, loader requires `{1}`: {2} |' -f $ck.exe.productVersion, $ck.exe.requiredCl, $(if ($ck.exe.clOk) { 'match' } else { '**MISMATCH**' })))
              $s = $ck.scan.summary
              $md.Add("| Pattern scan | $($s.total) patterns: $($s.ok) OK, $($s.missing) missing, $($s.ambiguous) ambiguous, $($s.other) other; **$($s.requiredFailing) required failing** |")
              foreach ($p in @($ck.scan.notOk)) { $md.Add("| - $($p.name) | $($p.result)$(if ($p.required) { ' (required)' }) |") }
              foreach ($g in @($ck.sdkGlobals)) {
                $cmp = if ($g.informational) { "SDK value $($g.sdk) is not the engine global (by design)" } elseif ($g.match) { 'equals the SDK' } elseif ($null -eq $g.match) { 'not compared' } else { "**SDK has $($g.sdk): SDK dump needed**" }
                $md.Add("| SDK global $($g.name) | $($g.result) $($g.rva); $cmp |")
              }
              $md.Add("| exe SHA-256 | ``$($ck.exe.sha256)`` |")
              if (@($ck.warnings).Count -gt 0) {
                $md.Add('')
                $md.Add('Warnings:')
                foreach ($w in @($ck.warnings)) { $md.Add("- $w") }
              }
            }
          } else {
            $md.Add("The check produced no result (scanner build: $($env:BUILD_RESULT), check: $($env:CHECK_RESULT)). See the run.")
          }

          # The plugins: one row each, then every pattern they resolved.
          if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) {
            $md.Add('')
            $partial = @($r.plugins.plugins | Where-Object { $_.verdict -eq 'GAME-CALL' } | ForEach-Object { $_.name })
            $md.Add("#### Plugins: $($r.plugins.status.ToUpperInvariant())$(if ($partial.Count) { ' (partial: ' + ($partial -join ', ') + ' not fully exercised)' })")
            $md.Add('')
            $md.Add('The loader refuses a plugin that fails here. A failing plugin does not change the loader verdict above. OFFSETS and OFFSETS-UNCHECKED: a fixed offset the plugin reads does not match this build, or could not be checked (below).')
            $md.Add('')
            $md.Add('| Plugin | Ref | Verdict | OK | MISSING | AMBIGUOUS | Other | Note |')
            $md.Add('|---|---|---|---|---|---|---|---|')
            foreach ($p in @($r.plugins.plugins)) {
              $s = if ($p.PSObject.Properties['summary']) { $p.summary } else { $null }
              # A released plugin shows its tag; a built one its ref and commit.
              $ref = if ($p.source -eq 'release') { "``$($p.ref)`` (release)" } elseif ($p.sha) { "``$($p.ref)`` ($($p.sha.Substring(0, 7)))" } else { "``$($p.ref)``" }
              $note = foreach ($k in 'note', 'crash', 'error') { if ($p.PSObject.Properties[$k] -and $p.$k) { $p.$k } }
              $md.Add("| $($p.name) | $ref | **$($p.verdict)$(if ($p.verdict -eq 'GAME-CALL') { ' (partial)' })** | $(if ($s) { $s.ok }) | $(if ($s) { $s.missing }) | $(if ($s) { $s.ambiguous }) | $(if ($s) { $s.other + $s.reported }) | $((@($note) -join '; ') -replace '\|', '\|') |")
            }
            foreach ($p in @($r.plugins.plugins | Where-Object { $_.PSObject.Properties['patterns'] -and @($_.patterns).Count })) {
              $md.Add('')
              $md.Add("<details><summary>$($p.name): $(@($p.patterns).Count) patterns</summary>")
              $md.Add('')
              $md.Add('| Result | Pattern | Kind | Required |')
              $md.Add('|---|---|---|---|')
              foreach ($row in @($p.patterns)) {
                $req = if (-not $row.recorded) { 'raw scan' } elseif ($row.required) { 'yes' } else { 'no' }
                $md.Add("| $($row.result) | ``$($row.name -replace '\|', '\|')`` | $($row.kind) | $req |")
              }
              $md.Add('')
              $md.Add('</details>')
            }
          }

          # The fixed offsets the plugins read, against this build's PDB.
          $withOffsets = @($(if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) { $r.plugins.plugins }) | Where-Object { $_.PSObject.Properties['offsets'] -and $_.offsets -and @($_.offsets.results).Count })
          if ($withOffsets.Count) {
            $md.Add('')
            $md.Add('**Fixed offsets** (members a plugin reads at a raw offset, compared with the PDB; any state but ok fails the plugin as OFFSETS):')
          }
          foreach ($p in $withOffsets) {
            $res = @($p.offsets.results)
            $bad = @($res | Where-Object { $_.state -ne 'ok' })
            $md.Add('')
            $md.Add("<details$(if ($bad.Count) { ' open' })><summary>$($p.name): $($res.Count) fixed offsets, $($bad.Count) failing</summary>")
            $md.Add('')
            $md.Add('| State | Member | Source reads | This build | Public build | Note |')
            $md.Add('|---|---|---|---|---|---|')
            foreach ($x in $res) {
              $s = if ($x.PSObject.Properties['source'] -and $null -ne $x.source) { '0x{0:X}' -f [int]$x.source } else { '-' }
              $t = if ($x.PSObject.Properties['target'] -and $x.target -and $x.target.PSObject.Properties['offset']) { '0x{0:X}' -f [int]$x.target.offset } else { '-' }
              $f = if ($x.PSObject.Properties['reference'] -and $x.reference -and $x.reference.PSObject.Properties['offset']) { '0x{0:X}' -f [int]$x.reference.offset } else { '-' }
              $why = if ($x.PSObject.Properties['reason'] -and $x.reason) { $x.reason -replace '\|', '\|' } else { '' }
              $md.Add("| $($x.state) | ``$($x.key)`` | $s | $t | $f | $why |")
            }
            $md.Add('')
            $md.Add('</details>')
          }

          # Proposed replacements for failing patterns (sr-aobscan --suggest).
          $failing = [Collections.Generic.List[object]]::new()
          if ($r -and $r.checks) { foreach ($row in @($r.checks.scan.notOk)) { $failing.Add([pscustomobject]@{ owner = 'loader'; row = $row }) } }
          foreach ($p in @($(if ($r -and $r.PSObject.Properties['plugins'] -and $r.plugins) { $r.plugins.plugins }) | Where-Object { $_.PSObject.Properties['patterns'] })) {
            foreach ($row in @($p.patterns)) { $failing.Add([pscustomobject]@{ owner = $p.name; row = $row }) }
          }
          $failing = @($failing | Where-Object { $_.row.PSObject.Properties['suggest'] -and $_.row.suggest })
          if ($failing.Count) {
            $md.Add('')
            $md.Add('**Proposed patterns** (unverified in game; each resolves to the function shown with the loader''s own check):')
            $md.Add('')
            $md.Add('| Owner | Pattern | Result | Found by | RVA | Proposal | Unique on |')
            $md.Add('|---|---|---|---|---|---|---|')
            foreach ($f in $failing) {
              $s = $f.row.suggest
              $how = "$($s.located)$(if ($s.PSObject.Properties['confidence']) { " ($($s.confidence))" })"
              $rva = if ($s.PSObject.Properties['rva']) { $s.rva } else { '-' }
              $props = @($s.proposals)
              $note = if ($s.PSObject.Properties['note']) { $s.note -replace '\|', '\|' } else { '' }
              if (-not $props.Count) { $md.Add("| $($f.owner) | ``$($f.row.name)`` | $($f.row.result) | $how | $rva | none: $note | - |"); continue }
              foreach ($q in $props) {
                $ref = if ($q.PSObject.Properties['uniqueOnReference']) { [bool]$q.uniqueOnReference } else { $null }
                $on = if ($q.uniqueOnTarget -and $ref) { 'both builds' }
                      elseif ($q.uniqueOnTarget) { 'this build' + $(if ($null -eq $ref) { '' } elseif ($s.PSObject.Properties['referenceKeepsCurrent'] -and $s.referenceKeepsCurrent) { '; public keeps the current pattern' } else { ' only' }) }
                      elseif ($ref) { 'public build only' } else { 'neither' }
                $follow = if ($q.followRel32At -ge 0) { " (follow rel32 at +$($q.followRel32At))" } else { ' (direct)' }
                $md.Add("| $($f.owner) | ``$($f.row.name)`` | $($f.row.result) | $how | $rva | ``$($q.pattern)``$follow | $on |")
              }
            }
          }

          # The proposals applied, rebuilt and scanned again; the branch the
          # auto-apply job pushed is found by its tree.
          $af = if ($r -and $r.PSObject.Properties['autofix'] -and $r.autofix) { $r.autofix } else { $null }
          if ($af -and @($af.plugins).Count) {
            $md.Add('')
            $md.Add("#### Auto-apply (proposals at confidence $($af.minConfidence) and up)")
            $md.Add('')
            $md.Add("Each fix is rebuilt and scanned on this build (CL-$($af.cl))$(if ($af.referenceCl) { " and on the public build (CL-$($af.referenceCl))" }). FIXED: every failing pattern resolves uniquely to the function the suggester located. PARTIAL: the same for the applied ones, and the rest were skipped. Only FIXED and PARTIAL fixes of the owner's forks are pushed.")
            $md.Add('')
            $md.Add('| Plugin | Verdict | Applied | Skipped | Branch | Note |')
            $md.Add('|---|---|---|---|---|---|')
            foreach ($p in @($af.plugins)) {
              $where = '-'
              if ($p.verdict -eq 'PATCH') { $where = "patch only: ``$($p.patch)`` in the run's artifact" }
              elseif ($p.verdict -in 'FIXED', 'PARTIAL' -and $p.repo -match '^msantoro12/StarRupture-Plugin-[A-Za-z0-9_-]+$') {
                $where = 'not pushed (see the auto-apply job)'
                # The fallback name carries the attempt that pushed it, which may be an earlier one.
                foreach ($line in @(git ls-remote "https://github.com/$($p.repo)" "refs/heads/auto/update-$($af.cl)" "refs/heads/auto/update-$($af.cl)-$($env:RUN_ID)-*" 2>$null)) {
                  $sha, $b = "$line" -split "`t"
                  $b = "$b" -replace '^refs/heads/', ''
                  if ($sha -match '^[0-9a-f]{40}$' -and (gh api "repos/$($p.repo)/git/commits/$sha" --jq .tree.sha 2>$null) -eq $p.tree) { $where = "``$b`` ($($sha.Substring(0, 7)))"; break }
                }
              }
              $skip = @($p.skipped | ForEach-Object { "$($_.name): $($_.reason)" })
              $note = (@(@($p.reasons) + $skip) -join '; ') -replace '\|', '\|'
              $md.Add("| $($p.name) | **$($p.verdict)** | $(@($p.applied).Count) | $(@($p.skipped).Count) | $where | $note |")
            }
            $md.Add('')
            $md.Add('The loader''s own patterns are never auto-applied: its proposals are listed above.')
          }

          # Age of the saved login (set by steam-ci-login.ps1).
          $md.Add('')
          if ($env:LOGIN_AT -match '^\d{4}-\d{2}-\d{2}$') {
            $exp = ([datetime]::ParseExact($env:LOGIN_AT, 'yyyy-MM-dd', $null)).AddDays([int]$env:LOGIN_DAYS)
            $left = [int][math]::Floor(($exp - [datetime]::UtcNow.Date).TotalDays)
            $line = "Steam CI login saved $($env:LOGIN_AT); assumed to last about $($env:LOGIN_DAYS) days (until about $($exp.ToString('yyyy-MM-dd')), $left days left)."
            if ($left -lt [int]$env:WARN_DAYS) { $line = "**Warning:** $line Run ``steam-ci-login.ps1 -Renew`` before then." }
            $md.Add($line)
          } elseif ($status -ne 'skipped') {
            $md.Add('Steam CI login age unknown (repo variable `STEAM_CI_LOGIN_AT` is not set).')
          }
          $md.Add('')
          $md.Add('Offline check of the downloaded build only: the game is never started. Plugin checks run each plugin''s load hook and stop any call it makes into game code. Game files stay on the runner.')

          $md -join "`n" | Set-Content report.md -Encoding utf8
          Get-Content report.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($env:PR -match '^[0-9]+$') {
            gh pr comment $env:PR --body-file report.md
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Could not comment on PR #$($env:PR); the result is in the run summary." }
          }
          exit 0

  # ---- Weekly: is the saved login about to expire? -------------------------
  expiry:
    name: login-expiry
    if: ${{ !inputs.branch || inputs.branch == 'expiry-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      LOGIN_AT: ${{ vars.STEAM_CI_LOGIN_AT }}
    steps:
      - name: Check the login age
        run: |
          if ! [[ "$LOGIN_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::notice::No Steam CI login recorded (repo variable STEAM_CI_LOGIN_AT unset); nothing to check."
            exit 0
          fi
          expires="$(date -u -d "$LOGIN_AT + $LOGIN_DAYS days" +%F)"
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u -d "$(date -u +%F)" +%s) ) / 86400 ))
          echo "Steam CI login saved $LOGIN_AT, assumed to expire about $expires: $left days left."
          if [ "$left" -lt "$WARN_DAYS" ]; then
            echo "::error title=Steam CI login::The saved Steam CI login expires in about $left days ($expires). Run steam-ci-login.ps1 -Renew."
            exit 1
          fi
