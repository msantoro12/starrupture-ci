name: SR keepalive

# GitHub switches scheduled workflows off after 60 days without repository
# activity. Re-enabling a workflow resets that timer, so this monthly job
# enables the scheduled SR workflows (and itself) through the API. It pushes
# nothing.

on:
  schedule:
    - cron: '41 5 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  enable:
    name: enable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-enable the scheduled workflows
        run: |
          for wf in sr-watch.yml sr-build-all.yml sr-client-check.yml vmap-watchdog.yml sr-keepalive.yml; do
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done
