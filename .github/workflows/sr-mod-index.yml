name: SR mod index

# Builds, signs and publishes the signed mod index (mod-index.v1.txt, the loader's mod-index/index.json carried byte
# for byte inside the signed envelope; grammar in ci/mod-index.mjs). The first job reads index.json of the loader
# repository (AlienXAXS/StarRupture-ModLoader) at `loader_ref` (default main) through the contents API, checks it with
# the loader's own builder (.github/vmap/build-mod-index.mjs, read from the same ref) and ends green without a publish
# when the index is missing at the ref or its body equals the one the target release holds. The loader's code runs in
# its own job (loader-check), which holds no secret, no environment and a read-only token, and hands the signing job
# index.json only; the signing job builds the signer's input itself with ci/mod-index.mjs. It then signs the index under the mod
# index's own seq and publishes it with ci/plugin-catalog-publish.sh (4th argument mod-index), which verifies it with
# `vmap-sign.mjs verify --kind mod-index` before anything is uploaded and requires a seq above the one on the target.
#
# The target is the vmap-feed-rehearsal prerelease ALWAYS, unless the `live` input is set. Both targets are signed
# with the release key (k2, secret VMAP_SIGN_KEY, environment vmap-sign). `live` is a dispatch input of this workflow
# only (a workflow_call caller cannot set it), needs main and is the owner's switch: nothing in this repository
# turns it on. A run without it reads the live vmap-feed release before and after and fails if it changed; a live run
# fails if any asset but mod-index.v1.txt changed. No pull_request, push or schedule trigger; the only caller is the
# mod index leg of sr-watch.yml, which never sets `live`.

on:
  workflow_call:
    inputs:
      loader_ref:
        description: 'Ref of the loader repository that index.json and build-mod-index.mjs are read from'
        type: string
        required: false
        default: main
    secrets:
      VMAP_SIGN_KEY:
        description: 'Release signing key (k2, environment vmap-sign); pass it by name'
        required: false
  workflow_dispatch:
    inputs:
      loader_ref:
        description: 'Ref of the loader repository that index.json and build-mod-index.mjs are read from (a branch, tag or commit)'
        type: string
        required: false
        default: main
      live:
        description: 'Publish to the LIVE vmap-feed release (the owner sets it; main only). Off: the mod index goes to the vmap-feed-rehearsal prerelease and the live release is checked unchanged'
        type: boolean
        default: false

permissions: {}

jobs:
  # The loader repository's code runs here and nowhere else: no secret, no environment, a read-only token, and the job
  # ends with that code so nothing it does can reach a later step. Only index.json crosses to the signing job.
  loader-check:
    name: loader-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      state: ${{ steps.read.outputs.state }}
      ref: ${{ steps.ref.outputs.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      LOADER_REPO: AlienXAXS/StarRupture-ModLoader
      LOADER_REF: ${{ inputs.loader_ref }}
    steps:
      - name: Check the loader ref
        id: ref
        run: |
          set -euo pipefail
          case "$LOADER_REF" in
            ''|-*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::loader_ref is a branch, tag or commit name of the loader repository"; exit 2 ;;
          esac
          echo "ref=$LOADER_REF" >> "$GITHUB_OUTPUT"

      # The loader's index.json at the ref, byte for byte. A 404 (no mod-index/index.json there yet, or no such ref)
      # ends the run green: there is nothing to sign.
      - name: Read the loader's mod index
        id: read
        run: |
          set -euo pipefail
          if gh api -H "Accept: application/vnd.github.raw+json" "repos/$LOADER_REPO/contents/mod-index/index.json?ref=$LOADER_REF" > index.json 2> index.err; then
            echo "state=present" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' index.err; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            echo "No mod-index/index.json at $LOADER_REPO@$LOADER_REF: nothing to publish."
            echo "### Mod index: no mod-index/index.json at $LOADER_REPO@$LOADER_REF, so nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            cat index.err >&2; exit 2
          fi

      - name: Fetch the loader's builder
        if: ${{ steps.read.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          mkdir loader-build
          if gh api -H "Accept: application/vnd.github.raw+json" "repos/$LOADER_REPO/contents/.github/vmap/build-mod-index.mjs?ref=$LOADER_REF" > loader-build/build-mod-index.mjs 2> build.err; then
            echo "The loader's builder is at $LOADER_REPO@$LOADER_REF."
          elif grep -q 'HTTP 404' build.err; then
            rm -rf loader-build
            echo "::notice::$LOADER_REPO@$LOADER_REF has no .github/vmap/build-mod-index.mjs; the signing job checks the index with ci/mod-index.mjs only"
          else
            cat build.err >&2; exit 2
          fi

      - name: Hand index.json to the signing job
        if: ${{ steps.read.outputs.state == 'present' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-index-input
          path: index.json
          retention-days: 1
          if-no-files-found: error

      # Last step: the loader's own builder checks the index (exit 3 refuses it). Its output is not used, only its verdict.
      - name: Check the mod index with the loader's builder
        if: ${{ steps.read.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          [ -f loader-build/build-mod-index.mjs ] || { echo "No loader builder to run."; exit 0; }
          set +e
          env -i PATH="$PATH" node loader-build/build-mod-index.mjs index.json --out loader-build/checked.txt
          rc=$?
          set -e
          [ "$rc" = 0 ] || { echo "::error::the loader's builder refuses the mod index (exit $rc)"; exit 2; }
          echo "The loader's builder accepted the mod index."

  mod-index-publish:
    name: mod-index-publish
    needs: [loader-check]
    if: ${{ needs.loader-check.outputs.state == 'present' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vmap-sign
    concurrency:
      group: vmap-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LIVE: ${{ contains(github.workflow_ref, '/.github/workflows/sr-mod-index.yml@') && github.event_name == 'workflow_dispatch' && inputs.live == true }}
      LOADER_REF: ${{ needs.loader-check.outputs.ref }}
      STAGING_RELEASE: vmap-feed-rehearsal
    steps:
      - name: Check out the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false

      - name: Refuse a live publish that is not allowed
        if: ${{ env.LIVE == 'true' }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::a live publish runs from main only (this run is on $GITHUB_REF)"; exit 2; }
          [[ "$LOADER_REF" = main || "$LOADER_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::a live publish reads the loader's main or a full commit, not $LOADER_REF"; exit 2; }
          echo "This run publishes to the LIVE vmap-feed release."

      - name: Choose the live release
        if: ${{ env.LIVE == 'true' }}
        run: |
          echo "TARGET=vmap-feed" >> "$GITHUB_ENV"
          echo "KIND=live" >> "$GITHUB_ENV"

      - name: Choose the staging prerelease
        if: ${{ env.LIVE != 'true' }}
        run: |
          echo "TARGET=$STAGING_RELEASE" >> "$GITHUB_ENV"
          echo "KIND=staging" >> "$GITHUB_ENV"

      # Read only: what the live release holds now, read again after the publish.
      - name: Read the live release
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/vmap-feed" --jq '[.assets[] | [.name, .id, .updated_at, .size]]' > live-assets.before.json 2> snapshot.err \
            || { if grep -q 'HTTP 404' snapshot.err; then echo '[]' > live-assets.before.json; else cat snapshot.err >&2; exit 2; fi; }
          echo "The live release holds $(node -p "JSON.parse(require('fs').readFileSync('live-assets.before.json','utf8')).length") assets."

      # index.json as the first job read it, and the signer's input built from it here with our own builder (it refuses
      # a CR, a missing final LF, invalid JSON or more than 256 KB). The loader's code never ran in this job.
      - name: Take the loader's mod index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mod-index-input

      - name: Build the signer's input
        run: |
          set -euo pipefail
          node tool/ci/mod-index.mjs build index.json --out mod-index.unsigned.txt
          echo "STATE=built" >> "$GITHUB_ENV"

      # The mod index's own seq: the one on the target release (0 when it holds none). The routine verifies the file
      # the target holds (`vmap-sign.mjs verify --kind mod-index`) and stops when it does not verify; only then is its
      # body compared with index.json. An index that is the one published ends the run green, with no signing.
      - name: Compare with the published mod index
        if: ${{ env.STATE == 'built' }}
        run: |
          set -euo pipefail
          rm -rf current
          bash tool/ci/plugin-catalog-publish.sh last-seq "$TARGET" "$KIND" mod-index > last-seq.txt
          echo "The mod index on $TARGET has seq $(cat last-seq.txt)."
          if [ ! -f current/mod-index.v1.txt ]; then
            echo "STATE=go" >> "$GITHUB_ENV"
            echo "$TARGET holds no mod index yet."
            exit 0
          fi
          set +e
          node tool/ci/mod-index.mjs same current/mod-index.v1.txt index.json
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "STATE=unchanged" >> "$GITHUB_ENV"
              echo "The mod index on $TARGET already carries this index.json: nothing to publish."
              echo "### Mod index: unchanged on $TARGET (seq $(cat last-seq.txt)), so nothing was signed or published." >> "$GITHUB_STEP_SUMMARY"
              ;;
            1) echo "STATE=go" >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac

      - name: Sign with the release key and verify
        if: ${{ env.STATE == 'go' }}
        env:
          VMAP_SIGN_KEY: ${{ secrets.VMAP_SIGN_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VMAP_SIGN_KEY" ] || { echo "::error::the VMAP_SIGN_KEY secret is not set"; exit 2; }
          last_seq="$(cat last-seq.txt)"
          seq="$(node tool/ci/vmap-sign.mjs next-seq --last-seq "$last_seq")"
          node tool/ci/vmap-sign.mjs sign mod-index.unsigned.txt --kind mod-index --out mod-index.v1.txt --key-id k2 --last-seq "$last_seq" --seq "$seq"
          node tool/ci/vmap-sign.mjs verify mod-index.v1.txt --kind mod-index --last-seq "$last_seq" --expect-seq "$seq"

      # The one write of a run: the mod index, to the target the Choose steps named, through the shared routine.
      - name: Publish the mod index
        if: ${{ env.STATE == 'go' }}
        run: |
          set -euo pipefail
          bash tool/ci/plugin-catalog-publish.sh publish "$TARGET" "$KIND" mod-index

      # Read the live release again: a staging run leaves it as it was; a live run changed the mod index and nothing else.
      - name: Check the live release did not move
        if: ${{ env.STATE == 'go' }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/vmap-feed" --jq '[.assets[] | [.name, .id, .updated_at, .size]]' > live-assets.after.json 2> after.err \
            || { if grep -q 'HTTP 404' after.err; then echo '[]' > live-assets.after.json; else cat after.err >&2; exit 2; fi; }
          others='map(select(.[0] != "mod-index.v1.txt"))'
          if [ "$KIND" = live ]; then
            jq -c "$others" live-assets.before.json > a.json
            jq -c "$others" live-assets.after.json > b.json
          else
            jq -c . live-assets.before.json > a.json
            jq -c . live-assets.after.json > b.json
          fi
          cmp -s a.json b.json || { echo "::error::the live release changed beyond the mod index"; diff a.json b.json || true; exit 2; }
          echo "The live release changed only as the mod index publish allows."
