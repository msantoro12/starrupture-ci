name: SR data extract

# For one Steam build of StarRupture: launch the game once with Dumper-7 only (no mod loader,
# no plugin) to produce that build's .usmap, run the planner's CUE4Parse extractor
# (GoodStuffSoftware/star-rupture-planner, tools/game-extract) on the paks with it, and
# upload the usmap and the raw extract as one artifact. It commits nothing anywhere: a later
# job in another repository pulls the artifact.
#
# INTERFACE
#   Call it from another workflow in this repository with `uses:`, from main only (the job
#   runs in environment steam-client, which serves main). Or dispatch it by hand.
#   inputs
#     branch         Steam branch to install (letters, digits, underscore)
#     buildid        the Steam build id that branch must be on; the job fails if Steam
#                    installs another one, so the usmap and the extract are for the build asked for
#     extractor_ref  commit sha (40 hex) of GoodStuffSoftware/star-rupture-planner whose
#                    tools/game-extract is built and run (dispatch and PR runs: empty means
#                    ffc6eebd98b589bc53942de29ef3e76bebda9521)
#     build_only     (dispatch only) default true: build Dumper-7 and the extractor and check
#                    the scripts; no secret, no environment, no download, no launch.
#                    A pull request that touches this workflow or ci/data runs it too.
#                    (GitHub can dispatch a workflow only once it is on main, so the PR is
#                    how a branch proves the build.)
#   secrets (pass both by name; an unpassed environment secret reads as empty)
#     STEAM_CI_USERNAME, STEAM_CI_LOGIN_CACHE
#   outputs
#     artifact_name  sr-data-<buildid>, or empty if nothing was uploaded
#     status         ok | usmap-failed | extract-failed. usmap-failed: the game was launched
#                    but no usable .usmap came out. extract-failed: the usmap exists but the
#                    extractor or its changelist/data guard failed, or the leak gate, the
#                    cleanup or the upload failed. Empty: the job failed before the launch
#                    (login, install, build id mismatch); the job result is failure. The job
#                    fails unless the status is ok; the outputs are still set.
#   artifact sr-data-<buildid>, kept 30 days
#     pipeline.json   buildid, branch, extractor_ref, Dumper-7 commit, status
#     usmap/<name>.usmap
#     extract/        the extractor's output: manifest.json, the raw JSON, localization/, icons/*.png
#   Nothing else goes in: no log, no game file, nothing from the Steam login (the leak gate checks).
#   Artifacts of a public repository can be downloaded by any signed-in GitHub user.
#
# FLOW
#   build job (no environment, no secret): Dumper-7 is built from a pinned upstream commit and
#   the extractor from extractor_ref, both with MSBuild / dotnet on the runner; the binaries
#   travel to the next job as a run artifact. Candidate code is compiled where no login exists.
#   extract job (environment steam-client): download the game with steamcmd and launch it
#   with the Steam client, both through ci/client-rig-launch.ps1; dump; remove Steam and the
#   login from the runner (always, even on failure); only then run the extractor, with no
#   secret in reach; leak-gate and upload.
#
# DUMPER-7 PIN. Upstream is Encryqed/Dumper-7. Pinned: v7.1.0 = 4dafbe5487e144d7fdc85b5dae1e641995d734ec
# (2026-10-16, the newest release; main has later, unreleased commits). Why: the prebuilt
# Dumper-7.dll in AlienXAXS's Plugin SDK repo (committed 2026-10-05, the one that made the
# CL127004 usmap) has no embedded commit, but it has the SleepTimeout and DumpKey settings
# and not ShouldAutoUnload, which upstream added on 2026-10-16. So it was built from a main
# commit between v7.0.1 (2026-07-26) and v7.1.0, and v7.1.0 contains all of it. v7.1.0 is the
# first release with the settings an unattended dump needs (ini path, SleepTimeout, auto
# unload) and its upstream CI builds it with the same MSBuild command used here.
# INJECTION. ci/data/dump-usmap.ps1: a small LoadLibraryW injector compiled in the job, no
# third-party injector binary; it injects the one DLL built here and refuses an install that
# holds a loader proxy (dwmapi.dll, ModLoader).
#
# The Steam login is live while the game, with Dumper-7 in it, runs: the launch blocks outbound
# network for every program of the install (firewall rule per exe, as the client rig does).
# Run only trusted refs: extractor_ref is built before the login exists and run after it is gone.
#
# One Steam client session per account: the launching job shares the concurrency group of
# sr-client-rig.yml, so it never signs in while a rig run does. GitHub keeps one waiting run per
# group (a third replaces the second); nothing cancels a run that is going.

on:
  # Build-only: compiles Dumper-7 and the extractor, checks the scripts. No environment, no secret.
  pull_request:
    paths:
      - .github/workflows/sr-data-extract.yml
      - ci/data/**
      - ci/client-rig-launch.ps1
  workflow_dispatch:
    inputs:
      branch:
        description: 'Steam branch to install (not needed for build_only)'
        type: string
        default: ''
      buildid:
        description: 'Steam build id that branch must be on (not needed for build_only)'
        type: string
        default: ''
      extractor_ref:
        description: 'Commit sha of GoodStuffSoftware/star-rupture-planner to build the extractor from (empty: the reference build)'
        type: string
        default: ''
      build_only:
        description: 'Only build Dumper-7 and the extractor and check the scripts (no login, no download, no launch)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      branch:
        description: 'Steam branch to install'
        type: string
        required: true
      buildid:
        description: 'Steam build id that branch must be on'
        type: string
        required: true
      extractor_ref:
        description: 'Commit sha (40 hex) of GoodStuffSoftware/star-rupture-planner to build the extractor from'
        type: string
        required: true
    outputs:
      artifact_name:
        description: 'sr-data-<buildid>, or empty if nothing was uploaded'
        value: ${{ jobs.extract.outputs.artifact_name }}
      status:
        description: 'ok, usmap-failed or extract-failed; empty if the job failed before the launch'
        value: ${{ jobs.extract.outputs.status }}
    # Environment secrets of steam-client. Unpassed, they read as empty with no error;
    # required, a caller that leaves them out fails at the call.
    secrets:
      STEAM_CI_USERNAME:
        description: 'Steam CI account name (environment steam-client); pass it by name'
        required: true
      STEAM_CI_LOGIN_CACHE:
        description: 'Saved steamcmd login cache (environment steam-client); pass it by name'
        required: true

permissions:
  contents: read

jobs:
  # No environment, no secret: everything built from a source runs here, before any login exists.
  # This is the only job a pull_request run starts, and a fork can open one: nothing in this job
  # (or anywhere above the extract job) reads the secrets context, and no step is given a token
  # beyond the read-only one. The called-workflow secrets belong to the extract job alone.
  build:
    name: Build Dumper-7 and the extractor
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      DUMPER7_COMMIT: 4dafbe5487e144d7fdc85b5dae1e641995d734ec # Encryqed/Dumper-7 v7.1.0
      EXTRACTOR_REF: ${{ inputs.extractor_ref || 'ffc6eebd98b589bc53942de29ef3e76bebda9521' }}
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      BUILD_ONLY: ${{ inputs.build_only || github.event_name == 'pull_request' }}
      TOOLS_ARTIFACT: sr-data-tools-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the inputs
        shell: pwsh
        run: |
          if ($env:EXTRACTOR_REF -notmatch '^[0-9a-f]{40}$') { throw 'extractor_ref must be a full commit sha (40 hex characters)' }
          if ($env:BUILD_ONLY -ne 'true') {
            if ($env:BRANCH -notmatch '^[A-Za-z0-9_]{1,64}$') { throw 'branch must be letters, digits and underscore' }
            if ($env:BUILDID -notmatch '^[0-9]{1,12}$') { throw 'buildid must be digits' }
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Dumper-7 at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Encryqed/Dumper-7
          ref: ${{ env.DUMPER7_COMMIT }}
          path: dumper-src
          persist-credentials: false

      - name: Check out the extractor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GoodStuffSoftware/star-rupture-planner
          ref: ${{ env.EXTRACTOR_REF }}
          path: planner-src
          sparse-checkout: tools
          persist-credentials: false

      - name: Check the pins and the scripts
        shell: pwsh
        run: |
          $d = (git -C dumper-src rev-parse HEAD).Trim()
          $p = (git -C planner-src rev-parse HEAD).Trim()
          if ($d -ne $env:DUMPER7_COMMIT) { throw "Dumper-7 is at $d, not the pin" }
          if ($p -ne $env:EXTRACTOR_REF) { throw "the extractor source is at $p, not extractor_ref" }
          "Dumper-7 $d, extractor source $p"
          # Parse every script of the data pipeline and of the launch it extends.
          foreach ($f in @(Get-ChildItem ci/data -Filter *.ps1) + (Get-Item ci/client-rig-launch.ps1)) {
            $errs = $null; $tok = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tok, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" }; throw "$($f.Name) does not parse" }
          }
          # PSScriptAnalyzer ships on the image; errors fail, warnings are shown.
          $found = @(Invoke-ScriptAnalyzer -Path ci/data -Recurse)
          $found | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
          if (@($found | Where-Object Severity -eq 'Error').Count) { throw 'PSScriptAnalyzer reported errors' }
          ./ci/client-rig-launch.ps1 -Check
          ./ci/data/dump-usmap.ps1 -Check

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build Dumper-7
        timeout-minutes: 15
        shell: pwsh
        run: |
          msbuild dumper-src\Dumper\Dumper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WarningLevel=0 /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild exited with $LASTEXITCODE" }
          $dll = 'dumper-src\Dumper\x64\Release\Dumper-7.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'Dumper-7.dll was not built' }
          # Must be a 64-bit DLL: the game is.
          $b = [IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A -or [BitConverter]::ToUInt16($b, $pe + 4) -ne 0x8664) { throw 'Dumper-7.dll is not an x64 PE file' }
          New-Item -ItemType Directory -Force stage-tools\dumper | Out-Null
          Copy-Item -LiteralPath $dll -Destination stage-tools\dumper\Dumper-7.dll
          "Dumper-7.dll sha256 $((Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLower()), $($b.Length) bytes"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build the extractor
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet publish planner-src/tools/game-extract/GameExtract.csproj -c Release -r win-x64 --self-contained true -o stage-tools/extractor
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish exited with $LASTEXITCODE" }
          if (-not (Test-Path stage-tools/extractor/GameExtract.exe)) { throw 'GameExtract.exe was not built' }
          [ordered]@{ dumper7_commit = $env:DUMPER7_COMMIT; extractor_ref = $env:EXTRACTOR_REF } | ConvertTo-Json | Set-Content stage-tools/tools.json -Encoding utf8
          "Built GameExtract.exe from $env:EXTRACTOR_REF"

      - name: Hand the binaries to the extract job
        if: env.BUILD_ONLY != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.TOOLS_ARTIFACT }}
          path: stage-tools
          retention-days: 1
          if-no-files-found: error

  extract:
    name: Dump the usmap and extract
    needs: build
    # Never on a pull request, on top of the steam-client environment admitting main only.
    if: github.event_name != 'pull_request' && !inputs.build_only
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    environment: steam-client
    permissions:
      contents: read
    # The same group as sr-client-rig.yml: one Steam client session per account at a time.
    concurrency:
      group: sr-client-rig
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.final.outputs.artifact_name }}
      status: ${{ steps.final.outputs.status }}
    env:
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      EXTRACTOR_REF: ${{ inputs.extractor_ref || 'ffc6eebd98b589bc53942de29ef3e76bebda9521' }}
      TOOLS_ARTIFACT: sr-data-tools-${{ github.run_id }}-${{ github.run_attempt }}
      DUMPER7_COMMIT: 4dafbe5487e144d7fdc85b5dae1e641995d734ec
    steps:
      # Without the login there is nothing to do: fail with that reason, never skip green.
      - name: Check the Steam login secrets are set
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.STEAM_CI_LOGIN_CACHE != '' && secrets.STEAM_CI_USERNAME != '' }}
        run: |
          if ($env:HAS_LOGIN -ne 'true') {
            $m = 'The Steam login secrets reached the called workflow empty: the calling job must pass STEAM_CI_USERNAME and STEAM_CI_LOGIN_CACHE by name under secrets:, and environment steam-client must hold them.'
            Write-Host "::error title=Steam login::$m"
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-reason.txt') -Value $m -Encoding utf8
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.TOOLS_ARTIFACT }}
          path: tools

      # Before any login, so a script bug costs a minute, not a run.
      - name: Check the script helpers
        shell: pwsh
        run: |
          ./ci/client-rig-launch.ps1 -Check
          ./ci/data/dump-usmap.ps1 -Check

      - name: Install the game client
        id: dl
        timeout-minutes: 40
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: ./ci/client-rig-launch.ps1 -Phase Install -Branch $env:BRANCH

      - name: Check the install
        id: prep
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: ./ci/data/prepare-install.ps1 -InstallDir $env:INSTALL_DIR -Branch $env:BRANCH -BuildId $env:BUILDID

      # The game, Dumper-7 injected into it and nothing else. The launch script judges nothing:
      # whether a usmap came out is read below.
      - name: Launch the game and dump
        id: launch
        timeout-minutes: 45
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          DUMPER_DLL: ${{ github.workspace }}\tools\dumper\Dumper-7.dll
        run: ./ci/client-rig-launch.ps1 -Phase Launch -Branch $env:BRANCH -InstallDir $env:INSTALL_DIR -OutDir out -PayloadScript ./ci/data/dump-usmap.ps1 -AttemptCapSec 900

      # Right after the launch, ahead of everything else. Runs on a failed or cancelled run too.
      - name: Remove Steam and the login from the runner
        id: cleanup
        if: always()
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: |
          if (-not (Test-Path ./ci/data/steam-cleanup.ps1)) { 'The sources were not checked out, so nothing was installed.'; exit 0 }
          ./ci/data/steam-cleanup.ps1 -InstallDir $env:INSTALL_DIR
          exit $LASTEXITCODE

      - name: Find the usmap
        id: usmap
        if: always() && steps.launch.outcome != 'skipped'
        shell: pwsh
        run: |
          $f = @(Get-ChildItem out/usmap -Filter *.usmap -File -ErrorAction SilentlyContinue)
          if ($f.Count -eq 1) {
            "ok=true" >> $env:GITHUB_OUTPUT
            "file=$($f[0].FullName)" >> $env:GITHUB_OUTPUT
            "usmap: $($f[0].Name), $($f[0].Length) bytes"
          } else {
            "ok=false" >> $env:GITHUB_OUTPUT
            Write-Host "::error title=usmap::no usable .usmap came out of the dump ($($f.Count) found)"
          }

      # After the cleanup: no Steam client, no login on the runner, and no secret in this step.
      - name: Run the extractor
        id: extract
        if: always() && steps.usmap.outputs.ok == 'true' && steps.cleanup.outcome == 'success'
        shell: pwsh
        env:
          PAKS: ${{ steps.prep.outputs.paks }}
          USMAP: ${{ steps.usmap.outputs.file }}
        run: |
          ./tools/extractor/GameExtract.exe --paks $env:PAKS --usmap $env:USMAP --out extract-out --build $env:BUILDID
          exit $LASTEXITCODE

      - name: Assemble the artifact
        id: stage
        if: always() && steps.usmap.outputs.ok == 'true'
        shell: pwsh
        env:
          EXTRACT: ${{ steps.extract.outcome }}
          USMAP: ${{ steps.usmap.outputs.file }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          $status = if ($env:EXTRACT -eq 'success' -and $env:CLEANUP -eq 'success') { 'ok' } else { 'extract-failed' }
          New-Item -ItemType Directory -Force stage/usmap | Out-Null
          Copy-Item -LiteralPath $env:USMAP -Destination stage/usmap/
          if (Test-Path extract-out) { Copy-Item -LiteralPath extract-out -Destination stage/extract -Recurse }
          [ordered]@{ buildid = $env:BUILDID; branch = $env:BRANCH; extractor_ref = $env:EXTRACTOR_REF; dumper7_commit = $env:DUMPER7_COMMIT; status = $status } |
            ConvertTo-Json | Set-Content stage/pipeline.json -Encoding utf8
          "status=$status" >> $env:GITHUB_OUTPUT

      # The only step after the launch that holds the login, and it only reads files.
      - name: Leak gate
        id: leak
        if: always() && steps.stage.outcome == 'success'
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: ./ci/data/leak-gate.ps1 -Path stage

      - name: Upload the usmap and the extract
        id: upload
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-data-${{ env.BUILDID }}
          path: stage
          retention-days: 30
          if-no-files-found: error

      - name: Outputs and result
        id: final
        if: always()
        shell: pwsh
        env:
          LAUNCHED: ${{ steps.launch.outcome != 'skipped' }}
          STAGE_STATUS: ${{ steps.stage.outputs.status }}
          USMAP_OK: ${{ steps.usmap.outputs.ok }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          # Empty before the launch; usmap-failed without a usmap; a status that says ok needs the upload.
          $status = ''
          if ($env:LAUNCHED -eq 'true') {
            $status = if ($env:USMAP_OK -ne 'true') { 'usmap-failed' } elseif ($env:UPLOAD -ne 'success') { 'extract-failed' } else { $env:STAGE_STATUS }
          }
          $artifact = if ($env:UPLOAD -eq 'success') { "sr-data-$env:BUILDID" } else { '' }
          "status=$status" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifact" >> $env:GITHUB_OUTPUT
          $why = Join-Path $env:RUNNER_TEMP 'rig-reason.txt'
          $reason = if (Test-Path -LiteralPath $why) { (Get-Content -LiteralPath $why -Raw).Trim() } else { '' }
          "### Data extract: $(if ($status) { $status } else { 'stopped before the launch' })`n`nbuild $env:BUILDID, artifact: $(if ($artifact) { $artifact } else { 'none' })`n`n$reason" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'ok') { Write-Host "::error title=Data extract::status '$status'. $reason"; exit 1 }
