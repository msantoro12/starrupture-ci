name: SR data extract

# A dispatched run that downloads and extracts is titled "SR data extract <branch> <buildid>", so
# ci/planner-extract.mjs can tell the runs of one build apart. A build-only run, a pull request run
# and a call keep the plain title.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only == false && format('SR data extract {0} {1}', inputs.branch, inputs.buildid) || 'SR data extract' }}

# For one Steam build of StarRupture: launch the game once with Dumper-7 only (no mod loader,
# no plugin) to produce that build's .usmap, run the planner's CUE4Parse extractor
# (GoodStuffSoftware/star-rupture-planner, tools/game-extract) on the paks with it, and
# upload the usmap and the raw extract as one artifact. It commits nothing anywhere: a later
# job in another repository pulls the artifact.
#
# INTERFACE
#   Call it from another workflow in this repository with `uses:`, from main only (the job
#   runs in environment steam-client, which serves main). Or dispatch it by hand.
#   inputs
#     branch         Steam branch to install (letters, digits, underscore, hyphen; the launch
#                    script itself accepts letters, digits and underscore)
#     buildid        the Steam build id that branch must be on; the job fails if Steam
#                    installs another one, so the usmap and the extract are for the build asked for
#     extractor_ref  commit sha (40 hex) of GoodStuffSoftware/star-rupture-planner whose
#                    tools/game-extract is built and run. Required, no default. A run that
#                    uses the Steam login refuses a sha that is not reachable from planner
#                    main (see TRUST below).
#     build_only     (dispatch only) default true: build Dumper-7 and the extractor and check
#                    the scripts; no secret, no environment, no download, no launch.
#                    A pull request that touches this workflow or ci/data runs it too, with
#                    the compile-check sha below (GitHub can dispatch a workflow only once it
#                    is on main, so the PR is how a branch proves the build).
#   secrets (pass both by name; an unpassed environment secret reads as empty)
#     STEAM_CI_USERNAME, STEAM_CI_LOGIN_CACHE
#   outputs
#     artifact_name  sr-data-<branch>-<buildid>, or empty if nothing was uploaded. The branch
#                    is in the name because a build promoted from another branch to public
#                    keeps its build id: a consumer dedupes on branch + buildid.
#     status         ok | login-failed | usmap-failed | cleanup-failed | extract-failed.
#                    login-failed: Steam did not accept the saved CI login (rejected,
#                    rate-limited, Guard code asked, client never signed in): the login needs
#                    renewing, Dumper-7 is not at fault. usmap-failed: the game process ran
#                    (or a usmap exists) but no usable .usmap came out. extract-failed: the
#                    usmap exists but the extractor ran and failed (its changelist/data guard
#                    included), or the leak gate or the upload failed. cleanup-failed: the
#                    Steam login could not be removed from the runner, so the extractor never
#                    ran (the usmap is still uploaded). The reason text is never empty. Empty: the job failed
#                    before the game started for another reason (install, build id mismatch,
#                    Steam client start); the job result is failure. The job fails unless the
#                    status is ok; the outputs are still set.
#   artifact sr-data-<branch>-<buildid>, kept 30 days
#     pipeline.json   buildid, branch, run id and attempt, workflow ref and sha (of the run's
#                     top-level workflow), extractor_ref, Dumper-7 commit, status
#                     (the extractor's own manifest.json is its output and is not touched)
#     usmap/<name>.usmap
#     extract/        the extractor's output: manifest.json, the raw JSON, localization/, icons/*.png
#   Nothing else goes in: no log, no game file, nothing from the Steam login (the leak gate checks).
#   Artifacts of a public repository can be downloaded by any signed-in GitHub user.
#
# FLOW
#   build job (no environment, no secret): checks extractor_ref (TRUST below), then Dumper-7 is
#   built from a pinned upstream commit and the extractor from extractor_ref, both with
#   MSBuild / dotnet on the runner; the binaries travel to the next job as a run artifact
#   named by the run id alone, so a re-run of only the failed extract job finds it again.
#   The job passes the artifact name, the extractor sha and the Dumper-7 sha on as outputs.
#   extract job (environment steam-client): download the game with steamcmd and launch it
#   with the Steam client, both through ci/client-rig-launch.ps1; dump; remove Steam and the
#   login material from the runner (-Phase Login: stops every Steam process first, retries each
#   removal for about 60 s, then fatal and verified, always, even on failure; a failure names
#   the item and the process holding it); only then run the extractor; leak-gate and upload;
#   last, remove the Steam install folder, its logs folder included (-Phase Folder: retries for
#   about 60 s, warns and names the locking process, never fails the job; it runs after the
#   extractor because the game files may sit under that folder).
#   The cleanup and the leak gate are ci/steam-cleanup.ps1 and ci/leak-gate.ps1, the same
#   scripts sr-client-rig.yml runs (it runs the cleanup as one piece).
#
# TRUST. The extract job's secrets are delivered to the runner process at job start and stay
# in its memory for the whole job; deleting the login files does not take them out of reach.
# Any program the job runs after that, GameExtract.exe included, is therefore trusted code.
# It is trusted because the build job proves that extractor_ref is an ancestor of (or equal to)
# planner main, with the GitHub compare API (repos/GoodStuffSoftware/star-rupture-planner/
# compare/<sha>...main, status ahead or identical; anything else, and any API error, fails),
# so only code that someone with write access pushed to planner main runs here. A commit that
# exists only on a branch or in a fork is refused. That is as strong as the planner's main
# branch protection: today main is unprotected (no ruleset, no required review), so the check
# keeps out forks and unmerged branches, not a bad push to main. A build-only run (a pull
# request, a dispatch) skips the check: it holds no secret, so compiling any sha there is safe.
#
# WHY NOT A SEPARATE, SECRET-FREE EXTRACTOR JOB. Considered and not adopted: it would have to
# carry the game's pakchunk0-Windows.ucas (45.5 GB), .utoc (15 MB) and .pak (277 MB) and
# global.utoc/.ucas (4 MB) through a run artifact. This is a public repository, so that artifact
# would be a download of the game's files for any signed-in GitHub user while it lives (the
# shortest retention is 1 day; the tools artifact here keeps 3 days so a re-run of only the
# failed extract job can still find it). GitHub documents no per-artifact size limit, but a 45.5 GB
# upload and download has not been tried here, and it would add two transfers of that size
# to a job of 25 to 40 minutes. The reachability check bounds the risk at its source instead.
#
# DUMPER-7 PIN. Upstream is Encryqed/Dumper-7. Pinned: v7.1.0 = 4dafbe5487e144d7fdc85b5dae1e641995d734ec
# (2026-10-16, the newest release; main has later, unreleased commits). Why: the prebuilt
# Dumper-7.dll in AlienXAXS's Plugin SDK repo (committed 2026-10-05, the one that made the
# CL127004 usmap) has no embedded commit, but it has the SleepTimeout and DumpKey settings
# and not ShouldAutoUnload, which upstream added on 2026-10-16. So it was built from a main
# commit between v7.0.1 (2026-07-26) and v7.1.0, and v7.1.0 contains all of it. v7.1.0 is the
# first release with the settings an unattended dump needs (ini path, SleepTimeout, auto
# unload) and its upstream CI builds it with the same MSBuild command used here.
# INJECTION. ci/data/dump-usmap.ps1: a small LoadLibraryW injector compiled in the job, no
# third-party injector binary; it injects the one DLL built here and refuses an install that
# holds a loader proxy (dwmapi.dll, ModLoader).
#
# The Steam login is live while the game, with Dumper-7 in it, runs: the launch blocks outbound
# network for every program of the install (firewall rule per exe, as the client rig does).
#
# COMPILE-CHECK SHA. A pull request cannot pass an input, so its build-only run compiles the
# extractor at the sha in the build job's EXTRACTOR_REF fallback (planner feat/game-extract; planner main does not hold
# tools/game-extract yet). It is used for no other event, and a run that holds the login never
# takes it. Replace it with a planner main sha once the extractor is merged.
#
# One Steam client session per account: the launching job shares the concurrency group of
# sr-client-rig.yml, so it never signs in while a rig run does. GitHub keeps one waiting run per
# group (a third replaces the second); nothing cancels a run that is going, except the watcher's
# poll, which cancels the queued or going extract runs when a build change starts the client check.

on:
  # Build-only: compiles Dumper-7 and the extractor, checks the scripts. No environment, no secret.
  pull_request:
    paths:
      - .github/workflows/sr-data-extract.yml
      - ci/data/**
      - ci/steam-cleanup.ps1
      - ci/leak-gate.ps1
      - ci/client-rig-launch.ps1
  workflow_dispatch:
    inputs:
      branch:
        description: 'Steam branch to install (not needed for build_only)'
        type: string
        default: ''
      buildid:
        description: 'Steam build id that branch must be on (not needed for build_only)'
        type: string
        default: ''
      extractor_ref:
        description: 'Commit sha (40 hex) of GoodStuffSoftware/star-rupture-planner to build the extractor from'
        type: string
        required: true
      build_only:
        description: 'Only build Dumper-7 and the extractor and check the scripts (no login, no download, no launch)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      branch:
        description: 'Steam branch to install'
        type: string
        required: true
      buildid:
        description: 'Steam build id that branch must be on'
        type: string
        required: true
      extractor_ref:
        description: 'Commit sha (40 hex) of GoodStuffSoftware/star-rupture-planner to build the extractor from'
        type: string
        required: true
    outputs:
      artifact_name:
        description: 'sr-data-<branch>-<buildid>, or empty if nothing was uploaded'
        value: ${{ jobs.extract.outputs.artifact_name }}
      status:
        description: 'ok, login-failed, usmap-failed, cleanup-failed or extract-failed; empty if the job failed before the game started'
        value: ${{ jobs.extract.outputs.status }}
    # Environment secrets of steam-client. Unpassed, they read as empty with no error;
    # required, a caller that leaves them out fails at the call.
    secrets:
      STEAM_CI_USERNAME:
        description: 'Steam CI account name (environment steam-client); pass it by name'
        required: true
      STEAM_CI_LOGIN_CACHE:
        description: 'Saved steamcmd login cache (environment steam-client); pass it by name'
        required: true

permissions:
  contents: read

jobs:
  # No environment, no secret: everything built from a source runs here, before any login exists.
  # This is the only job a pull_request run starts, and a fork can open one: nothing in this job
  # (or anywhere above the extract job) reads the secrets context, and no step is given a token
  # beyond the read-only one. The called-workflow secrets belong to the extract job alone.
  build:
    name: Build Dumper-7 and the extractor
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      tools_artifact: ${{ steps.pins.outputs.tools_artifact }}
      extractor_ref: ${{ steps.pins.outputs.extractor_ref }}
      dumper7_commit: ${{ steps.pins.outputs.dumper7_commit }}
    env:
      DUMPER7_COMMIT: 4dafbe5487e144d7fdc85b5dae1e641995d734ec # Encryqed/Dumper-7 v7.1.0
      # Only a pull request (build-only) falls back to the compile-check sha; nothing else has a default.
      EXTRACTOR_REF: ${{ inputs.extractor_ref || (github.event_name == 'pull_request' && 'ffc6eebd98b589bc53942de29ef3e76bebda9521' || '') }}
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      BUILD_ONLY: ${{ inputs.build_only || github.event_name == 'pull_request' }}
      # The run id is the top-level run's, so a caller that starts this workflow once per branch
      # needs the branch and build in the name; no attempt number, so a re-run of only the
      # failed extract job still finds it.
      TOOLS_ARTIFACT: sr-data-tools-${{ github.run_id }}-${{ inputs.branch }}-${{ inputs.buildid }}
    steps:
      - name: Check the inputs
        id: pins
        shell: pwsh
        run: |
          if ($env:EXTRACTOR_REF -notmatch '^[0-9a-f]{40}$') { throw 'extractor_ref is required and must be a full commit sha (40 hex characters)' }
          if ($env:BUILD_ONLY -ne 'true') {
            if ($env:BRANCH -notmatch '^[A-Za-z0-9_-]{1,64}$') { throw 'branch must be letters, digits, underscore and hyphen' }
            if ($env:BUILDID -notmatch '^[0-9]{1,12}$') { throw 'buildid must be digits' }
          }
          # The extract job reads these three from here, so no value is written twice.
          "tools_artifact=$env:TOOLS_ARTIFACT" >> $env:GITHUB_OUTPUT
          "extractor_ref=$env:EXTRACTOR_REF" >> $env:GITHUB_OUTPUT
          "dumper7_commit=$env:DUMPER7_COMMIT" >> $env:GITHUB_OUTPUT

      # The extractor runs in the job that holds the Steam login, so it must be code that is on
      # planner main (see TRUST in the header for how far that trust goes). compare/<sha>...main reports main relative to the sha:
      # "identical" (the sha is main) or "ahead" (main has moved on past it) mean the sha is in
      # main's history. "behind" (the sha is past main, e.g. an unmerged branch), "diverged" (a
      # fork or branch commit) and a 404 (unknown sha) all stop the run, and so does any API error.
      - name: Check the extractor is on planner main
        if: env.BUILD_ONLY != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "repos/GoodStuffSoftware/star-rupture-planner/compare/$($env:EXTRACTOR_REF)...main"
          $status = (gh api $uri --jq .status | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $status) { throw "could not check extractor_ref against planner main (gh api exit $LASTEXITCODE); not running it" }
          "extractor_ref $env:EXTRACTOR_REF vs planner main: $status"
          if ($status -notin 'identical', 'ahead') { throw "extractor_ref $env:EXTRACTOR_REF is not reachable from planner main (compare status '$status'); only merged code runs next to the Steam login" }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Dumper-7 at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Encryqed/Dumper-7
          ref: ${{ env.DUMPER7_COMMIT }}
          path: dumper-src
          persist-credentials: false

      - name: Check out the extractor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GoodStuffSoftware/star-rupture-planner
          ref: ${{ env.EXTRACTOR_REF }}
          path: planner-src
          sparse-checkout: tools
          persist-credentials: false

      - name: Check the pins and the scripts
        shell: pwsh
        run: |
          $d = (git -C dumper-src rev-parse HEAD).Trim()
          $p = (git -C planner-src rev-parse HEAD).Trim()
          if ($d -ne $env:DUMPER7_COMMIT) { throw "Dumper-7 is at $d, not the pin" }
          if ($p -ne $env:EXTRACTOR_REF) { throw "the extractor source is at $p, not extractor_ref" }
          "Dumper-7 $d, extractor source $p"
          # Parse every script of the data pipeline and of the launch it extends.
          foreach ($f in @(Get-ChildItem ci/data -Filter *.ps1) + @(Get-Item ci/client-rig-launch.ps1, ci/steam-cleanup.ps1, ci/leak-gate.ps1)) {
            $errs = $null; $tok = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tok, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" }; throw "$($f.Name) does not parse" }
          }
          # PSScriptAnalyzer ships on the image; errors fail, warnings are shown.
          $found = @(Invoke-ScriptAnalyzer -Path ci/data -Recurse) + @(Invoke-ScriptAnalyzer -Path ci/steam-cleanup.ps1) + @(Invoke-ScriptAnalyzer -Path ci/leak-gate.ps1)
          $found | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
          if (@($found | Where-Object Severity -eq 'Error').Count) { throw 'PSScriptAnalyzer reported errors' }
          ./ci/client-rig-launch.ps1 -Check
          ./ci/data/dump-usmap.ps1 -Check

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build Dumper-7
        timeout-minutes: 15
        shell: pwsh
        run: |
          msbuild dumper-src\Dumper\Dumper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WarningLevel=0 /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild exited with $LASTEXITCODE" }
          $dll = 'dumper-src\Dumper\x64\Release\Dumper-7.dll'
          if (-not (Test-Path -LiteralPath $dll)) { throw 'Dumper-7.dll was not built' }
          # Must be a 64-bit DLL: the game is.
          $b = [IO.File]::ReadAllBytes($dll)
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A -or [BitConverter]::ToUInt16($b, $pe + 4) -ne 0x8664) { throw 'Dumper-7.dll is not an x64 PE file' }
          New-Item -ItemType Directory -Force stage-tools\dumper | Out-Null
          Copy-Item -LiteralPath $dll -Destination stage-tools\dumper\Dumper-7.dll
          "Dumper-7.dll sha256 $((Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLower()), $($b.Length) bytes"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build the extractor
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet publish planner-src/tools/game-extract/GameExtract.csproj -c Release -r win-x64 --self-contained true -o stage-tools/extractor
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish exited with $LASTEXITCODE" }
          if (-not (Test-Path stage-tools/extractor/GameExtract.exe)) { throw 'GameExtract.exe was not built' }
          [ordered]@{ dumper7_commit = $env:DUMPER7_COMMIT; extractor_ref = $env:EXTRACTOR_REF } | ConvertTo-Json | Set-Content stage-tools/tools.json -Encoding utf8
          "Built GameExtract.exe from $env:EXTRACTOR_REF"

      - name: Hand the binaries to the extract job
        if: env.BUILD_ONLY != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.TOOLS_ARTIFACT }}
          path: stage-tools
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  extract:
    name: Dump the usmap and extract
    needs: build
    # Never on a pull request, on top of the steam-client environment admitting main only.
    if: github.event_name != 'pull_request' && !inputs.build_only
    # The rig's image: the Steam behaviour is the proven one; this job compiles nothing.
    runs-on: windows-latest
    timeout-minutes: 120
    environment: steam-client
    permissions:
      contents: read
    # The same group as sr-client-rig.yml: one Steam client session per account at a time.
    concurrency:
      group: sr-client-rig
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.final.outputs.artifact_name }}
      status: ${{ steps.final.outputs.status }}
    env:
      BRANCH: ${{ inputs.branch }}
      BUILDID: ${{ inputs.buildid }}
      # From the build job, which a re-run of only this job does not run again.
      EXTRACTOR_REF: ${{ needs.build.outputs.extractor_ref }}
      TOOLS_ARTIFACT: ${{ needs.build.outputs.tools_artifact }}
      DUMPER7_COMMIT: ${{ needs.build.outputs.dumper7_commit }}
    steps:
      # Without the login there is nothing to do: fail with that reason, never skip green.
      - name: Check the Steam login secrets are set
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.STEAM_CI_LOGIN_CACHE != '' && secrets.STEAM_CI_USERNAME != '' }}
        run: |
          if ($env:HAS_LOGIN -ne 'true') {
            $m = 'The Steam login secrets reached the called workflow empty: the calling job must pass STEAM_CI_USERNAME and STEAM_CI_LOGIN_CACHE by name under secrets:, and environment steam-client must hold them.'
            Write-Host "::error title=Steam login::$m"
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-reason.txt') -Value $m -Encoding utf8
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.TOOLS_ARTIFACT }}
          path: tools

      # The binaries are the ones the build job built for this call (the artifact name carries
      # the run id, branch and build; this also catches a mix-up of two builds).
      - name: Check the built tools
        shell: pwsh
        run: |
          $t = Get-Content -LiteralPath tools/tools.json -Raw | ConvertFrom-Json
          if ($t.extractor_ref -ne $env:EXTRACTOR_REF -or $t.dumper7_commit -ne $env:DUMPER7_COMMIT) { throw 'the downloaded tools were not built from this call''s extractor_ref and Dumper-7 pin' }
          foreach ($f in 'tools/dumper/Dumper-7.dll', 'tools/extractor/GameExtract.exe') { if (-not (Test-Path -LiteralPath $f)) { throw "$f is missing from the downloaded tools" } }

      # Before any login, so a script bug costs a minute, not a run.
      - name: Check the script helpers
        shell: pwsh
        run: |
          ./ci/client-rig-launch.ps1 -Check
          ./ci/data/dump-usmap.ps1 -Check

      - name: Install the game client
        id: dl
        timeout-minutes: 40
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: ./ci/client-rig-launch.ps1 -Phase Install -Branch $env:BRANCH

      - name: Check the install
        id: prep
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: ./ci/data/prepare-install.ps1 -InstallDir $env:INSTALL_DIR -Branch $env:BRANCH -BuildId $env:BUILDID

      # The game, Dumper-7 injected into it and nothing else. The launch script judges nothing:
      # whether a usmap came out is read below.
      - name: Launch the game and dump
        id: launch
        timeout-minutes: 45
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          DUMPER_DLL: ${{ github.workspace }}\tools\dumper\Dumper-7.dll
        run: ./ci/client-rig-launch.ps1 -Phase Launch -Branch $env:BRANCH -InstallDir $env:INSTALL_DIR -OutDir out -PayloadScript ./ci/data/dump-usmap.ps1 -AttemptCapSec 900

      # Right after the launch, ahead of everything else. Runs on a failed or cancelled run too.
      # Only the login goes here (fatal, verified); the Steam folder goes after the upload.
      - name: Remove Steam and the login from the runner
        id: cleanup
        if: always()
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: |
          if (-not (Test-Path ./ci/steam-cleanup.ps1)) { 'The sources were not checked out, so nothing was installed.'; exit 0 }
          ./ci/steam-cleanup.ps1 -InstallDir $env:INSTALL_DIR -Phase Login
          exit $LASTEXITCODE

      - name: Find the usmap
        id: usmap
        if: always() && steps.launch.outcome != 'skipped'
        shell: pwsh
        run: |
          $f = @(Get-ChildItem out/usmap -Filter *.usmap -File -ErrorAction SilentlyContinue)
          if ($f.Count -eq 1) {
            "ok=true" >> $env:GITHUB_OUTPUT
            "file=$($f[0].FullName)" >> $env:GITHUB_OUTPUT
            "usmap: $($f[0].Name), $($f[0].Length) bytes"
          } else {
            "ok=false" >> $env:GITHUB_OUTPUT
            Write-Host "::error title=usmap::no usable .usmap came out of the dump ($($f.Count) found)"
          }

      # After the cleanup: no Steam client and no login file on the runner, and no secret in this
      # step's environment. The secrets are still in the runner's memory (see TRUST): the
      # extractor is main-reachable code, checked by the build job.
      - name: Run the extractor
        id: extract
        if: always() && steps.usmap.outputs.ok == 'true' && steps.cleanup.outcome == 'success'
        shell: pwsh
        env:
          PAKS: ${{ steps.prep.outputs.paks }}
          USMAP: ${{ steps.usmap.outputs.file }}
        run: |
          ./tools/extractor/GameExtract.exe --paks $env:PAKS --usmap $env:USMAP --out extract-out --build $env:BUILDID
          exit $LASTEXITCODE

      - name: Assemble the artifact
        id: stage
        if: always() && steps.usmap.outputs.ok == 'true'
        shell: pwsh
        env:
          EXTRACT: ${{ steps.extract.outcome }}
          USMAP: ${{ steps.usmap.outputs.file }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          # cleanup-failed: the login could not be removed, so the extractor never ran.
          $status = if ($env:CLEANUP -ne 'success') { 'cleanup-failed' } elseif ($env:EXTRACT -eq 'success') { 'ok' } else { 'extract-failed' }
          if ($status -eq 'extract-failed') {
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-extract-reason.txt') -Value "The extractor ran and failed (step outcome '$env:EXTRACT'); see its step log." -Encoding utf8
          }
          New-Item -ItemType Directory -Force stage/usmap | Out-Null
          Copy-Item -LiteralPath $env:USMAP -Destination stage/usmap/
          if (Test-Path extract-out) { Copy-Item -LiteralPath extract-out -Destination stage/extract -Recurse }
          [ordered]@{ buildid = $env:BUILDID; branch = $env:BRANCH; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; workflow_ref = $env:GITHUB_WORKFLOW_REF; workflow_sha = $env:GITHUB_WORKFLOW_SHA; extractor_ref = $env:EXTRACTOR_REF; dumper7_commit = $env:DUMPER7_COMMIT; status = $status } |
            ConvertTo-Json | Set-Content stage/pipeline.json -Encoding utf8
          "status=$status" >> $env:GITHUB_OUTPUT

      # The only step after the launch that is given the login, and it only reads files.
      - name: Leak gate
        id: leak
        if: always() && steps.stage.outcome == 'success'
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: ./ci/leak-gate.ps1 -Path stage -Strict

      - name: Upload the usmap and the extract
        id: upload
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sr-data-${{ env.BRANCH }}-${{ env.BUILDID }}
          path: stage
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # The Steam install folder, last: the game files the extractor reads can sit under it, and
      # the login is already gone, so a folder that stays locked is a warning, never a failure.
      - name: Remove the Steam folder
        id: folder
        if: always()
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: |
          if (-not (Test-Path ./ci/steam-cleanup.ps1)) { 'The sources were not checked out, so nothing was installed.'; exit 0 }
          ./ci/steam-cleanup.ps1 -InstallDir $env:INSTALL_DIR -Phase Folder
          exit 0

      - name: Outputs and result
        id: final
        if: always()
        shell: pwsh
        env:
          STAGE_STATUS: ${{ steps.stage.outputs.status }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          USMAP_OK: ${{ steps.usmap.outputs.ok }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          # One status, and the reason of the stage that set it:
          #   login-failed    the launch could not sign in (rig-login-failed.txt; reason: rig-reason.txt)
          #   cleanup-failed  the login could not be removed after the launch (rig-cleanup-reason.txt)
          #   usmap-failed    the game ran but no usmap came out (rig-reason.txt, if the launch gave one)
          #   extract-failed  the extractor (rig-extract-reason.txt), the leak gate or the upload failed
          # Empty until the game started (boot.json saw the process, or a usmap came out); a status
          # that says ok needs the upload.
          $loginFailed = Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-login-failed.txt')
          $started = $env:USMAP_OK -eq 'true'
          if (Test-Path -LiteralPath out/boot.json) {
            try { if ((Get-Content -LiteralPath out/boot.json -Raw | ConvertFrom-Json).process_found) { $started = $true } } catch { Write-Host 'out/boot.json could not be read' }
          }
          $status = ''
          if ($loginFailed) {
            $status = 'login-failed'
          } elseif ($env:CLEANUP -eq 'failure') {
            $status = 'cleanup-failed'
          } elseif ($started) {
            $status = if ($env:USMAP_OK -ne 'true') { 'usmap-failed' } elseif ($env:UPLOAD -ne 'success') { 'extract-failed' } else { $env:STAGE_STATUS }
          }
          $artifact = if ($env:UPLOAD -eq 'success') { "sr-data-$env:BRANCH-$env:BUILDID" } else { '' }
          "status=$status" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifact" >> $env:GITHUB_OUTPUT
          function Read-Reason([string]$name) {
            $f = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $f) { (Get-Content -LiteralPath $f -Raw).Trim() } else { '' }
          }
          $cleanupReason = Read-Reason 'rig-cleanup-reason.txt'
          $reason = switch ($status) {
            'cleanup-failed' { if ($cleanupReason) { "$cleanupReason The extractor did not run." } else { '' } }
            'extract-failed' { if ($env:STAGE_STATUS -eq 'extract-failed') { Read-Reason 'rig-extract-reason.txt' } else { '' } }
            default { Read-Reason 'rig-reason.txt' }
          }
          # The reason is never empty for a status that is not ok.
          if ($status -ne 'ok' -and -not $reason) {
            $reason = switch ($status) {
              'login-failed' { 'Steam did not accept the saved CI login.' }
              'cleanup-failed' { 'The Steam login could not be removed from the runner, so the extractor did not run.' }
              'usmap-failed' { 'The game ran but no usable .usmap came out.' }
              'extract-failed' { 'The extractor, the leak gate or the upload failed; see the failed step.' }
              default { 'The job stopped before the game started; see the failed step.' }
            }
          }
          # A sign-in failure and a leftover login are two facts: say the second one too.
          if ($status -eq 'login-failed' -and $env:CLEANUP -eq 'failure') {
            $reason = "$reason The login also could not be removed from the runner: $(if ($cleanupReason) { $cleanupReason } else { 'see the cleanup step.' })".Trim()
          }
          "### Data extract: $(if ($status) { $status } else { 'stopped before the game started' })`n`nbuild $env:BUILDID, artifact: $(if ($artifact) { $artifact } else { 'none' })`n`n$reason" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($status -ne 'ok') { Write-Host "::error title=Data extract::status '$status'. $reason"; exit 1 }
