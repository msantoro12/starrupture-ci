name: SR plugin catalog

# Builds, signs and publishes the plugin catalog (plugin-catalog.v1.txt, grammar in ci/plugin-catalog.mjs): the
# one job reads a JSON file of this repository (`catalog_json`, the shape `ci/plugin-catalog.mjs build` takes),
# builds the unsigned catalog from it, signs it under the catalog's own seq and publishes it with
# ci/plugin-catalog-publish.sh, which verifies it with `vmap-sign.mjs verify --kind catalog` before anything is
# uploaded and requires a seq above the one on the target release.
#
# The target is the vmap-feed-rehearsal prerelease ALWAYS, unless the `live` input is set. Both targets are signed
# with the release key (k2, secret VMAP_SIGN_KEY, environment vmap-sign), as the server map's staging path is.
# `live` is a dispatch input of this workflow only (a workflow_call caller cannot set it), needs main and is the
# owner's switch: nothing in this repository turns it on. A run without it reads
# the live vmap-feed release before and after and fails if it changed; a live run fails if any asset but
# plugin-catalog.v1.txt changed. No pull_request, push or schedule trigger; nothing calls this workflow yet.

on:
  workflow_call:
    inputs:
      catalog_json:
        description: 'Path in this repository of the JSON file the catalog is built from'
        type: string
        required: true
    secrets:
      VMAP_SIGN_KEY:
        description: 'Release signing key (k2, environment vmap-sign); pass it by name'
        required: false
  workflow_dispatch:
    inputs:
      catalog_json:
        description: 'Path in this repository of the JSON file the catalog is built from (e.g. ci/fixtures/plugin-catalog/catalog-in.json)'
        type: string
        required: true
      live:
        description: 'Publish to the LIVE vmap-feed release (the owner sets it; main only). Off: the catalog goes to the vmap-feed-rehearsal prerelease and the live release is checked unchanged'
        type: boolean
        default: false

permissions: {}

jobs:
  catalog-publish:
    name: catalog-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vmap-sign
    concurrency:
      group: vmap-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LIVE: ${{ contains(github.workflow_ref, '/.github/workflows/sr-plugin-catalog.yml@') && github.event_name == 'workflow_dispatch' && inputs.live == true }}
      CATALOG_JSON: ${{ inputs.catalog_json }}
      STAGING_RELEASE: vmap-feed-rehearsal
    steps:
      - name: Check out the tools and the catalog input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tool
          persist-credentials: false

      - name: Refuse a live publish that is not allowed
        if: ${{ env.LIVE == 'true' }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::a live publish runs from main only (this run is on $GITHUB_REF)"; exit 2; }
          echo "This run publishes to the LIVE vmap-feed release."

      - name: Choose the live release
        if: ${{ env.LIVE == 'true' }}
        run: |
          echo "TARGET=vmap-feed" >> "$GITHUB_ENV"
          echo "KIND=live" >> "$GITHUB_ENV"

      - name: Choose the staging prerelease
        if: ${{ env.LIVE != 'true' }}
        run: |
          echo "TARGET=$STAGING_RELEASE" >> "$GITHUB_ENV"
          echo "KIND=staging" >> "$GITHUB_ENV"

      # Read only: what the live release holds now, read again after the publish.
      - name: Read the live release
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/vmap-feed" --jq '[.assets[] | [.name, .id, .updated_at, .size]]' > live-assets.before.json 2> snapshot.err \
            || { if grep -q 'HTTP 404' snapshot.err; then echo '[]' > live-assets.before.json; else cat snapshot.err >&2; exit 2; fi; }
          echo "The live release holds $(node -p "JSON.parse(require('fs').readFileSync('live-assets.before.json','utf8')).length") assets."

      - name: Build the unsigned catalog
        run: |
          set -euo pipefail
          case "$CATALOG_JSON" in ''|/*|*..*|*\\*) echo "::error::catalog_json is a path inside this repository"; exit 2 ;; esac
          [ -f "tool/$CATALOG_JSON" ] || { echo "::error::$CATALOG_JSON is not a file of this repository"; exit 2; }
          node tool/ci/plugin-catalog.mjs build "tool/$CATALOG_JSON" --out catalog.unsigned.txt

      # The catalog's own seq: the one on the target release (0 when it holds none), not the version map's.
      - name: Read the seq on the target release
        run: |
          set -euo pipefail
          bash tool/ci/plugin-catalog-publish.sh last-seq "$TARGET" "$KIND" > last-seq.txt
          echo "The catalog on $TARGET has seq $(cat last-seq.txt)."

      - name: Sign with the release key and verify
        env:
          VMAP_SIGN_KEY: ${{ secrets.VMAP_SIGN_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VMAP_SIGN_KEY" ] || { echo "::error::the VMAP_SIGN_KEY secret is not set"; exit 2; }
          last_seq="$(cat last-seq.txt)"
          seq="$(node tool/ci/vmap-sign.mjs next-seq --last-seq "$last_seq")"
          node tool/ci/vmap-sign.mjs sign catalog.unsigned.txt --kind catalog --out plugin-catalog.v1.txt --key-id k2 --last-seq "$last_seq" --seq "$seq"
          node tool/ci/vmap-sign.mjs verify plugin-catalog.v1.txt --kind catalog --last-seq "$last_seq" --expect-seq "$seq"

      # The one write of a run: the catalog, to the target the Choose steps named, through the shared routine.
      - name: Publish the catalog
        run: |
          set -euo pipefail
          bash tool/ci/plugin-catalog-publish.sh publish "$TARGET" "$KIND"

      # Read the live release again: a staging run leaves it as it was; a live run changed the catalog and nothing else.
      - name: Check the live release did not move
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/vmap-feed" --jq '[.assets[] | [.name, .id, .updated_at, .size]]' > live-assets.after.json 2> after.err \
            || { if grep -q 'HTTP 404' after.err; then echo '[]' > live-assets.after.json; else cat after.err >&2; exit 2; fi; }
          others='map(select(.[0] != "plugin-catalog.v1.txt"))'
          if [ "$KIND" = live ]; then
            jq -c "$others" live-assets.before.json > a.json
            jq -c "$others" live-assets.after.json > b.json
          else
            jq -c . live-assets.before.json > a.json
            jq -c . live-assets.after.json > b.json
          fi
          cmp -s a.json b.json || { echo "::error::the live release changed beyond the catalog"; diff a.json b.json || true; exit 2; }
          echo "The live release changed only as the catalog publish allows."
