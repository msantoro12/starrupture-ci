name: SR client rig

# Launches the real StarRupture client on a GitHub-hosted Windows runner, under the real
# Steam client signed in as the CI account, with a given loader and plugin set, and judges
# the loader's log with ci/verdict.ps1 -Client: do the mods load.
#
# Dispatch it by hand, or call it from another workflow in this repository with `uses:`.
# The job runs in environment `steam-client`, which serves branch main only, so a caller
# must be on main, and it must pass STEAM_CI_USERNAME and STEAM_CI_LOGIN_CACHE by name: a
# called job sees an environment secret only when its caller passes it. There is no schedule and no pull_request trigger. Details and a caller
# example: .github/sr-pipeline/README.md ("Client test rig").
# The Steam login is live while candidate code runs: run only candidates built from our own
# branches (msantoro12 and AlienXAXS repos), never a fork PR or anything built from issue text.
#
# One game session per account: runs queue, and GitHub keeps one waiting run per group (a
# third run replaces the second). Nothing cancels a run that is going.
# A feed run (feed_artifact, a call only: the feed is an artifact of the calling run, which a
# dispatch has none of) seeds the loader's feed cache with a TEST-signed feed taken from
# that artifact, and ci/verdict.ps1 then also judges that the loader applied
# it. It needs a candidate loader that trusts the TEST key (the caller builds it), and the
# feed must be signed with the TEST key: a release-signed feed is refused here, so nothing the
# release key signed ever reaches this job.
# A live feed run (live_feed, a dispatch) seeds the feed players get instead: the published
# version-map-client.v1.txt of the vmap-feed release, read with the job token (public, no secret),
# checked with the release PUBLIC key k2 and nothing else (the test key is not accepted), and
# copied to the loader's feed cache. Released loaders trust k2 only, so this works with the
# default released loader as well as with a candidate. The rig records the seq and sha256 of the
# file it seeded. It never signs, holds no signing key and publishes nothing.
# Game files, dumps and Steam config files never leave the runner. Nothing
# taken from the logs reaches the console, the job summary or an upload before the leak
# gate has passed: the verdict writes its text to files in out/, and the last step
# publishes them. Only the scrubbed text logs and the verdict files are uploaded.
# When attempt 1 ends on Steam's "Application load error" dialog and the game is launched
# again, out/attempt1/ also holds what the launch kept of that attempt (the loader's logs,
# the Steam client and game log lines of its time window, the dialog's text), scrubbed. It is
# evidence only: the verdict does not read it. The leak gate reads it like everything under out/.
# When the loader wrote its declared-features dump (ModLoader\Logs\declared-features.v1.txt), out/ also
# holds declared-features-<game CL>.v1.txt, uploaded with the logs; the verdict does not read it, and a
# loader that writes none is no failure (boot.json says null). The plugin catalog leg of
# sr-client-check.yml reads it.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Steam branch to install: public or public_test_branch'
        type: string
        default: public
      tags:
        description: 'Release tags to take instead of each repo''s Latest, as Name=tag (space separated). Names: Loader, BetterCheats, BetterDrone, CameraControls, Codex, Compass, MiniMap, PersistentIdFix, ProductionViewer, RuptureTimer, WAILA, WaveOptimiser. MiniMap and PersistentIdFix (another author) accept only their reviewed tag, the Pin in ci/plugin-names.json'
        type: string
        default: ''
      candidate_run_id:
        description: 'Optional: id of a run in this repository whose artifact is laid over the release set'
        type: string
        default: ''
      candidate_artifact:
        description: 'Name of that run''s artifact (dwmapi.dll, ModLoader/..., ModLoader/Plugins/*.dll)'
        type: string
        default: ''
      expect:
        description: 'Versions the log must show instead of the release tag, as Name=version. Required for every DLL the candidate replaces; an unknown Name is an extra plugin to expect'
        type: string
        default: ''
      expect_refused:
        description: 'Plugins that must be refused on this build (they pass only if refused)'
        type: string
        default: ''
      expect_decline:
        description: 'true: the loader''s map has no row for this build, so the rig passes if the loader declines cleanly (the version-mismatch line, no plugin loaded, no crash, the game still running) or, from loader v1.26.0, boots on the newest known build''s checked values (no crash, nothing the loader refuses left loaded)'
        type: string
        default: ''
      known_cls:
        description: 'With expect_decline: the CLs of the candidate map''s build rows (space separated). If the loader accepts the build as one of them (its exe is a known one under a new Steam build id), the rig expects a normal boot'
        type: string
        default: ''
      remove_plugins:
        description: 'Plugins taken out of the install but still expected, so they must show as missing'
        type: string
        default: ''
      live_feed:
        description: 'true: seed the loader''s feed cache with the live signed version object map feed (the vmap-feed release, checked with the release key k2), as players get it. Works with a released loader or a candidate. false: no feed, as before'
        type: boolean
        default: false
  workflow_call:
    inputs:
      branch:
        description: 'Steam branch to install: public or public_test_branch'
        type: string
        default: public
      tags:
        description: 'Release tags to take instead of each repo''s Latest, as Name=tag (space separated)'
        type: string
        default: ''
      candidate_run_id:
        description: 'Optional: id of a run in this repository whose artifact is laid over the release set'
        type: string
        default: ''
      candidate_artifact:
        description: 'Name of that run''s artifact'
        type: string
        default: ''
      expect:
        description: 'Versions the log must show instead of the release tag, as Name=version'
        type: string
        default: ''
      expect_refused:
        description: 'Plugins that must be refused on this build'
        type: string
        default: ''
      expect_decline:
        description: 'true: the loader''s map has no row for this build, so the rig passes if the loader declines cleanly (the version-mismatch line, no plugin loaded, no crash, the game still running) or, from loader v1.26.0, boots on the newest known build''s checked values (no crash, nothing the loader refuses left loaded)'
        type: string
        default: ''
      known_cls:
        description: 'With expect_decline: the CLs of the candidate map''s build rows (space separated); a build the loader accepts as one of them is expected to boot'
        type: string
        default: ''
      remove_plugins:
        description: 'Plugins taken out of the install but still expected'
        type: string
        default: ''
      feed_artifact:
        description: 'Name of an artifact of the calling run holding feed.test-signed.txt, seeded into the loader''s feed cache'
        type: string
        default: ''
      feed_seq:
        description: 'The seq the feed carries'
        type: string
        default: ''
      feed_cl:
        description: 'The CL of the running build, which the feed must carry'
        type: string
        default: ''
    outputs:
      verdict:
        description: PASS or FAIL
        value: ${{ jobs.rig.outputs.verdict }}
      reason:
        description: One sentence naming the first failures, or why the rig stopped
        value: ${{ jobs.rig.outputs.reason }}
      artifact:
        description: Name of the artifact holding the scrubbed logs (empty if none was uploaded)
        value: ${{ jobs.rig.outputs.artifact }}
      review:
        description: 'Plugins of other authors with a newer release than the reviewed one the rig runs, as Name=tag separated by spaces (empty if none)'
        value: ${{ jobs.rig.outputs.review }}
    # Environment secrets of steam-client. Unpassed, they read as empty with no error;
    # required, a caller that leaves them out fails at the call.
    secrets:
      STEAM_CI_USERNAME:
        description: 'Steam CI account name (environment steam-client); pass it by name'
        required: true
      STEAM_CI_LOGIN_CACHE:
        description: 'Saved steamcmd login cache (environment steam-client); pass it by name'
        required: true

permissions: {}

jobs:
  rig:
    name: Client rig
    runs-on: windows-latest
    timeout-minutes: 100
    environment: steam-client
    permissions:
      contents: read
      actions: read
    concurrency:
      group: sr-client-rig
      cancel-in-progress: false
    outputs:
      verdict: ${{ steps.final.outputs.verdict }}
      reason: ${{ steps.final.outputs.reason }}
      artifact: ${{ steps.final.outputs.artifact }}
      review: ${{ steps.res.outputs.review }}
    env:
      BRANCH: ${{ inputs.branch }}
      TAGS: ${{ inputs.tags }}
      EXPECT: ${{ inputs.expect }}
      EXPECT_REFUSED: ${{ inputs.expect_refused }}
      EXPECT_DECLINE: ${{ inputs.expect_decline }}
      KNOWN_CLS: ${{ inputs.known_cls }}
      REMOVE_PLUGINS: ${{ inputs.remove_plugins }}
      FEED_ARTIFACT: ${{ inputs.feed_artifact }}
      FEED_SEQ: ${{ inputs.feed_seq }}
      FEED_CL: ${{ inputs.feed_cl }}
      LIVE_FEED: ${{ inputs.live_feed }}
      MOD_OWNER: ${{ vars.MOD_OWNER || 'AlienXAXS' }}
      DOWNLOAD_DIR: D:\rig-dl
      # One name per rig run. A caller's run id is the top-level run's, so the several rigs of one run (the
      # client check runs two per call, sr-watch up to two calls) need the branch and the candidate
      # artifact in the name: artifact names are unique within a run.
      ARTIFACT_NAME: sr-client-rig-${{ inputs.branch }}-${{ inputs.candidate_artifact || 'release' }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # Without the login there is nothing to test: fail with that reason, never skip green.
      - name: Check the Steam login secrets are set
        id: gate
        shell: pwsh
        env:
          HAS_LOGIN: ${{ secrets.STEAM_CI_LOGIN_CACHE != '' && secrets.STEAM_CI_USERNAME != '' }}
          CALLED: ${{ !contains(github.workflow_ref, '/.github/workflows/sr-client-rig.yml@') }}
        run: |
          if ($env:HAS_LOGIN -ne 'true') {
            $m = if ($env:CALLED -eq 'true') {
              'The Steam login secrets reached the called rig empty: the calling job must pass STEAM_CI_USERNAME and STEAM_CI_LOGIN_CACHE by name under secrets:, and environment steam-client must hold them.'
            } else {
              'The Steam login is not configured: environment steam-client has no STEAM_CI_USERNAME or STEAM_CI_LOGIN_CACHE. Run steam-ci-login.ps1 once to set it up.'
            }
            Write-Host "::error title=Steam login::$m"
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-reason.txt') -Value $m -Encoding utf8
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before any login, so a script bug costs a minute, not a run.
      - name: Check the script helpers
        shell: pwsh
        run: ./ci/client-rig-launch.ps1 -Check

      # A candidate is code that runs beside the live login: only a run of this repository
      # whose head is in this repository (no fork) may supply it.
      - name: Check the candidate run
        if: inputs.candidate_run_id != '' || inputs.candidate_artifact != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT: ${{ inputs.candidate_artifact }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Stop-Rig([string]$m) {
            Write-Host "::error::$m"
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-reason.txt') -Value $m -Encoding utf8
            exit 1
          }
          if (-not $env:RUN_ID -or -not $env:ARTIFACT) { Stop-Rig 'candidate_run_id and candidate_artifact go together' }
          if ($env:RUN_ID -notmatch '^\d{1,15}$') { Stop-Rig 'candidate_run_id is not a run id' }
          if ($env:ARTIFACT -notmatch '^[A-Za-z0-9._-]{1,100}$') { Stop-Rig 'candidate_artifact is not a plain artifact name' }
          $run = gh api "repos/$env:REPO/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $run) { Stop-Rig "run $env:RUN_ID is not a run of $env:REPO" }
          $head = $run.head_repository
          if (-not $head -or $head.full_name -ne $env:REPO -or $head.fork) { Stop-Rig "run $env:RUN_ID did not run code from $env:REPO itself (head repository: $(if ($head) { $head.full_name } else { 'none' })); a fork's build is refused" }
          $arts = @((gh api "repos/$env:REPO/actions/runs/$env:RUN_ID/artifacts" --paginate | ConvertFrom-Json).artifacts | Where-Object { $_.name -ceq $env:ARTIFACT -and -not $_.expired })
          if ($arts.Count -ne 1) { Stop-Rig "run $env:RUN_ID has no live artifact named $env:ARTIFACT" }
          "Candidate: run $env:RUN_ID (head $($run.head_sha.Substring(0, 8)) on $($run.head_branch)), artifact $env:ARTIFACT"

      - name: Download the candidate artifact
        if: inputs.candidate_run_id != '' || inputs.candidate_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.candidate_artifact }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      # The feed is seeded into the candidate loader's cache and trusted by that build alone, so it
      # needs the candidate, and it is checked here, before the install: signed with the TEST key
      # (never the release key), carrying the seq it is declared with and a build row for the CL.
      - name: Check the feed inputs
        if: inputs.feed_artifact != '' || inputs.feed_seq != '' || inputs.feed_cl != ''
        shell: pwsh
        run: |
          function Stop-Rig([string]$m) {
            Write-Host "::error::$m"
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'rig-reason.txt') -Value $m -Encoding utf8
            exit 1
          }
          if (-not $env:FEED_ARTIFACT -or -not $env:FEED_SEQ -or -not $env:FEED_CL) { Stop-Rig 'feed_artifact, feed_seq and feed_cl go together' }
          if ($env:FEED_ARTIFACT -notmatch '^[A-Za-z0-9._-]{1,100}$') { Stop-Rig 'feed_artifact is not a plain artifact name' }
          if ($env:FEED_SEQ -cnotmatch '^[1-9][0-9]{0,14}$') { Stop-Rig 'feed_seq is not a number' }
          if ($env:FEED_CL -cnotmatch '^[1-9][0-9]{0,8}$') { Stop-Rig 'feed_cl is not a number' }
          if (-not (Test-Path candidate)) { Stop-Rig 'a seeded feed needs the candidate loader that trusts it: candidate_run_id and candidate_artifact are missing' }

      - name: Download the feed
        if: inputs.feed_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.feed_artifact }}
          path: feed

      - name: Check the feed
        if: inputs.feed_artifact != ''
        shell: bash
        run: |
          set -euo pipefail
          reason() { echo "::error::$1"; printf '%s\n' "$1" > "$RUNNER_TEMP/rig-reason.txt"; exit 1; }
          [ -f feed/feed.test-signed.txt ] || reason "the artifact $FEED_ARTIFACT has no feed.test-signed.txt"
          out="$(node ci/vmap-sign.mjs verify feed/feed.test-signed.txt --allow-test-key --expect-seq "$FEED_SEQ" 2>&1)" || reason "the feed does not verify: $out"
          # The TEST key only: a feed signed with the release key is not what this rig is for.
          case "$out" in "ok seq=$FEED_SEQ key=k1 TEST-KEY") ;; *) reason "the feed is not signed with the TEST key k1 at seq $FEED_SEQ: $out" ;; esac
          echo "$out"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseFeed } from "./ci/version-map.mjs";
            const NL = String.fromCharCode(10);
            // A signed feed is: format line, seq line, the rows, sig line. The rows with the format line are the unsigned feed.
            const lines = readFileSync(process.argv[1], "utf8").split(NL);
            const map = parseFeed([lines[0], ...lines.slice(2, -2), ""].join(NL), "feed.test-signed.txt");
            const cl = Number(process.argv[2]);
            if (!map.builds.some((b) => b.cl === cl)) { console.error("the feed has no build row for CL-" + cl); process.exit(1); }
            console.log("The feed carries a build row for CL-" + cl);
          ' feed/feed.test-signed.txt "$FEED_CL" || reason "the feed does not carry a build row for CL-$FEED_CL"

      # The live feed, as players get it: the file on the public vmap-feed release, read with the job
      # token. It must verify with the release public key k2 and no other key (the verifier is run
      # without its test-key flag), and it fails closed: any failure stops the rig before the install.
      # The seq and the sha256 come from the verified file and go on to the install and the summary.
      - name: Download and check the live feed
        id: live
        if: inputs.live_feed == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reason() { echo "::error::$1"; printf '%s\n' "$1" > "$RUNNER_TEMP/rig-reason.txt"; exit 1; }
          [ -z "$FEED_ARTIFACT$FEED_SEQ$FEED_CL" ] || reason 'live_feed does not go with feed_artifact, feed_seq or feed_cl'
          mkdir live-feed
          gh release download vmap-feed --repo "$REPO" --pattern version-map-client.v1.txt --dir live-feed || reason 'the live feed could not be downloaded from the vmap-feed release'
          [ -f live-feed/version-map-client.v1.txt ] || reason 'the vmap-feed release has no version-map-client.v1.txt'
          out="$(node ci/vmap-sign.mjs verify live-feed/version-map-client.v1.txt 2>&1)" || reason "the live feed does not verify: $out"
          # The release key k2 only: the verifier refuses the test key unless told otherwise, and says so here too.
          [[ "$out" =~ ^ok\ seq=([1-9][0-9]{0,14})\ key=k2$ ]] || reason "the live feed is not signed with the release key k2: $out"
          seq="${BASH_REMATCH[1]}"
          sha="$(sha256sum live-feed/version-map-client.v1.txt | cut -d' ' -f1)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || reason 'the live feed has no sha256'
          echo "Live feed verified with the release key k2: seq $seq, sha256 $sha"
          echo "seq=$seq" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      # Validates every input and the candidate, resolves the releases, and fails here, not
      # after a 16 GB install, on a bad one.
      - name: Resolve the set
        id: res
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_FEED_SEQ: ${{ steps.live.outputs.seq }}
        run: |
          $cand = if (Test-Path candidate) { 'candidate' } else { '' }
          $feed = @{}
          if ($env:FEED_ARTIFACT) { $feed = @{ FeedFile = 'feed/feed.test-signed.txt'; FeedSeq = $env:FEED_SEQ; FeedCl = $env:FEED_CL } }
          elseif ($env:LIVE_FEED_SEQ) { $feed = @{ FeedFile = 'live-feed/version-map-client.v1.txt'; FeedSeq = $env:LIVE_FEED_SEQ; FeedLive = $true } }
          ./ci/client-rig-set.ps1 -Mode Resolve -Branch $env:BRANCH -Tags $env:TAGS -Expect $env:EXPECT `
            -ExpectRefused $env:EXPECT_REFUSED -ExpectDecline $env:EXPECT_DECLINE -KnownCls $env:KNOWN_CLS -RemovePlugins $env:REMOVE_PLUGINS -Owner $env:MOD_OWNER -CandidateDir $cand @feed

      # Repeat runs download nothing: the owner reads the public download counts.
      - name: Restore the release files
        id: dlcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOWNLOAD_DIR }}
          key: sr-client-rig-dl-${{ steps.res.outputs.key }}
          restore-keys: sr-client-rig-dl-

      - name: Download what the cache lacks
        shell: pwsh
        run: ./ci/client-rig-set.ps1 -Mode Fetch -DownloadDir $env:DOWNLOAD_DIR

      - name: Save the release files
        if: steps.dlcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DOWNLOAD_DIR }}
          key: sr-client-rig-dl-${{ steps.res.outputs.key }}

      - name: Install the game client
        id: dl
        timeout-minutes: 40
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: ./ci/client-rig-launch.ps1 -Phase Install -Branch $env:BRANCH

      - name: Install the loader and plugins
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
          LIVE_FEED_SEQ: ${{ steps.live.outputs.seq }}
        run: |
          $cand = if (Test-Path candidate) { 'candidate' } else { '' }
          $feed = @{}
          if ($env:FEED_ARTIFACT) { $feed = @{ FeedFile = 'feed/feed.test-signed.txt'; FeedSeq = $env:FEED_SEQ; FeedCl = $env:FEED_CL } }
          elseif ($env:LIVE_FEED_SEQ) { $feed = @{ FeedFile = 'live-feed/version-map-client.v1.txt'; FeedSeq = $env:LIVE_FEED_SEQ; FeedLive = $true } }
          ./ci/client-rig-set.ps1 -Mode Install -DownloadDir $env:DOWNLOAD_DIR -InstallDir $env:INSTALL_DIR -OutDir out -CandidateDir $cand @feed

      - name: Launch the game client
        id: launch
        timeout-minutes: 45
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: ./ci/client-rig-launch.ps1 -Phase Launch -Branch $env:BRANCH -InstallDir $env:INSTALL_DIR -OutDir out

      # Right after the launch, ahead of the verdict, so a later failure cannot leave the
      # login on the runner. Runs on a failed or cancelled run too.
      - name: Remove Steam and the login from the runner
        id: cleanup
        if: always()
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.dl.outputs.install_dir }}
        run: |
          if (-not (Test-Path ./ci/steam-cleanup.ps1)) { 'The sources were not checked out, so nothing was installed.'; exit 0 }
          ./ci/steam-cleanup.ps1 -InstallDir $env:INSTALL_DIR
          exit $LASTEXITCODE

      # Fails the step on a FAIL verdict; the job is failed by the last step, after the
      # leak gate and the upload have run. It prints check names only and writes its text
      # (evidence, summary table) to files: the last step publishes them.
      - name: Judge the launch
        id: verdict
        if: always() && steps.launch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./ci/verdict.ps1 -OutDir out -Client

      - name: Leak gate
        id: leak
        if: always() && steps.gate.outcome == 'success'
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_CI_USERNAME }}
          STEAM_CACHE: ${{ secrets.STEAM_CI_LOGIN_CACHE }}
        run: |
          if (-not (Test-Path ./ci/leak-gate.ps1)) { 'The sources were not checked out, so nothing was run.'; exit 0 }
          ./ci/leak-gate.ps1 -Path out -AllowMissing
          exit $LASTEXITCODE

      - name: Upload the scrubbed logs
        id: upload
        if: always() && steps.leak.outcome == 'success' && hashFiles('out/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            out/modloader.log
            out/proxy.log
            out/autoupdate.log
            out/verdict.json
            out/verdict.txt
            out/dll-hashes.json
            out/set.json
            out/boot.json
            out/compat-report-*.json
            out/declared-features-*.v1.txt
            out/attempt1/*
          retention-days: 3
          if-no-files-found: warn

      # The job's outputs, then the job's own result: a FAIL verdict, a leak or a runner that
      # could not be cleaned all fail it, and the outputs say so.
      - name: Outputs and result
        id: final
        if: always()
        shell: pwsh
        env:
          LEAK: ${{ steps.leak.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          $verdict = 'FAIL'; $reason = ''; $publish = $false
          $vj = 'out/verdict.json'
          $why = Join-Path $env:RUNNER_TEMP 'rig-reason.txt'
          $hold = Join-Path $env:RUNNER_TEMP 'rig-hold.txt'
          # The verdict's reason and tables quote the logs: they go out only after the leak gate passed.
          if (Test-Path -LiteralPath $hold) {
            $reason = (Get-Content -LiteralPath $hold -Raw).Trim()
            if (Test-Path -LiteralPath $vj) { $reason += " The verdict itself was $((Get-Content -LiteralPath $vj -Raw | ConvertFrom-Json).verdict)." }
          }
          elseif ($env:LEAK -eq 'failure') { $reason = 'The leak gate found account data in the output; nothing was uploaded.' }
          elseif ($env:CLEANUP -eq 'failure') {
            $reason = 'The runner could not be cleaned of Steam and the login.'
            $cr = Join-Path $env:RUNNER_TEMP 'rig-cleanup-reason.txt'
            if (Test-Path -LiteralPath $cr) { $reason = (Get-Content -LiteralPath $cr -Raw).Trim() }
          }
          elseif ((Test-Path -LiteralPath $vj) -and $env:LEAK -eq 'success') {
            $j = Get-Content -LiteralPath $vj -Raw | ConvertFrom-Json
            $verdict = $j.verdict; $reason = $j.reason; $publish = $true
          }
          elseif (Test-Path -LiteralPath $vj) { $reason = 'The leak gate did not pass, so nothing from the logs was published.' }
          elseif (Test-Path -LiteralPath $why) { $reason = (Get-Content -LiteralPath $why -Raw).Trim() }
          else { $reason = 'The rig stopped before the verdict ran; see the failed step.' }
          $reason = ($reason -replace '\s+', ' ').Trim()
          if ($reason.Length -gt 600) { $reason = $reason.Substring(0, 597) + '...' }
          $artifact = if ($env:UPLOAD -eq 'success') { $env:ARTIFACT_NAME } else { '' }
          "verdict=$verdict" >> $env:GITHUB_OUTPUT
          "reason=$reason" >> $env:GITHUB_OUTPUT
          "artifact=$artifact" >> $env:GITHUB_OUTPUT
          "### Client rig: $verdict`n`n$reason" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($publish) {
            foreach ($f in 'out/verdict.txt', 'out/summary.md') { if (-not (Test-Path -LiteralPath $f)) { Write-Host "::warning::$f was not written" } }
            if (Test-Path -LiteralPath 'out/verdict.txt') { Write-Host '::group::Verdict checks'; Get-Content -LiteralPath 'out/verdict.txt'; Write-Host '::endgroup::' }
            if (Test-Path -LiteralPath 'out/summary.md') { Get-Content -LiteralPath 'out/summary.md' -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          }
          if ($verdict -ne 'PASS') { Write-Host "::error title=Client rig::$reason"; exit 1 }
