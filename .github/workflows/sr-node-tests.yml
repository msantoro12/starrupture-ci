name: SR node tests

# Fixture tests for ci/decide.mjs, ci/apply-proposals.mjs and ci/version-map.mjs.
# The live case clones AlienX's loader main read-only to prove the generated patch applies.

on:
  pull_request:
    paths: ['ci/**', 'state/autopilot.json', '.github/workflows/sr-node-tests.yml']
  push:
    branches: [main]
    paths: ['ci/**', 'state/autopilot.json', '.github/workflows/sr-node-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SR_LIVE: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - name: Run the tests
        run: node --test ci/decide.test.mjs ci/apply-proposals.test.mjs ci/version-map.test.mjs ci/map-mode.test.mjs ci/field-rows.test.mjs ci/tail-check.test.mjs ci/poll-steam.test.mjs ci/staging.test.mjs ci/promote.test.mjs ci/vmap-sign.test.mjs ci/vmap-watchdog.test.mjs ci/client-check-workflow.test.mjs
