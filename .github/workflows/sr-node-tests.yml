name: SR node tests

# Fixture tests for ci/decide.mjs, ci/apply-proposals.mjs and ci/version-map.mjs,
# and for the verdict script (ci/verdict.ps1) the engine test and the client rig share.
# The live case clones AlienX's loader main read-only to prove the generated patch applies.

on:
  pull_request:
    paths: ['ci/**', 'state/autopilot.json', '.github/workflows/**', '.github/actions/**']
  push:
    branches: [main]
    paths: ['ci/**', 'state/autopilot.json', '.github/workflows/**', '.github/actions/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SR_LIVE: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - name: Run the tests
        run: node --test ci/decide.test.mjs ci/apply-proposals.test.mjs ci/version-map.test.mjs ci/map-mode.test.mjs ci/field-rows.test.mjs ci/layout-store.test.mjs ci/tail-check.test.mjs ci/poll-steam.test.mjs ci/staging.test.mjs ci/promote.test.mjs ci/vmap-sign.test.mjs ci/vmap-watchdog.test.mjs ci/client-check-workflow.test.mjs ci/client-rig-workflow.test.mjs ci/data-extract-workflow.test.mjs ci/called-login.test.mjs ci/build-all-workflow.test.mjs ci/pipeline-alert.test.mjs ci/workflow-shells.test.mjs ci/published-base.test.mjs ci/planner-extract.test.mjs ci/workflow-status-functions.test.mjs
      - name: Test the verdict script
        shell: pwsh
        run: ./ci/test-verdict.ps1
